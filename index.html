<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b13">
<title>SoundFlow — Music</title>

<style>
:root {
  color-scheme: dark;
  --bg: #090b13;
  --panel: #121625;
  --muted: #9ba3b8;
  --line: #252c40;
  --accent: #a78bfa;
  --pink: #fb7185;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: radial-gradient(ellipse at 20% 0%, #252047 0, transparent 42%), var(--bg);
  color: #f7f7fb;
  font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
  min-height: 100vh;
}

.wrap {
  max-width: 1050px;
  margin: auto;
  padding: 22px 18px 140px;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: -1px;
}

.brand span { color: var(--accent); }

.tag {
  color: var(--muted);
  font-size: 12px;
}

.search {
  display: flex;
  gap: 9px;
  margin: 25px 0 12px;
}

.search input {
  min-width: 0;
  flex: 1;
  background: #171c2c;
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 15px;
  color: white;
  font-size: 16px;
  outline: none;
}

.search input:focus { border-color: var(--accent); }

button {
  border: 0;
  border-radius: 14px;
  padding: 0 19px;
  background: linear-gradient(135deg, #a78bfa, #ec4899);
  color: white;
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
  min-height: 48px;
}

.hint {
  color: var(--muted);
  font-size: 12px;
  margin: 0 0 22px;
}

.section {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 24px 0 13px;
}

.section h2 {
  font-size: 18px;
  margin: 0;
}

.status {
  font-size: 12px;
  color: var(--muted);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 15px;
}

.card {
  background: linear-gradient(160deg, #171d30, #101421);
  border: 1px solid var(--line);
  border-radius: 17px;
  padding: 10px;
  cursor: pointer;
  min-width: 0;
  transition: .18s;
}

.card:active { transform: scale(.98); }

.thumb {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  border-radius: 12px;
  background: #242a3b;
}

.title {
  font-size: 13px;
  font-weight: 750;
  line-height: 1.35;
  margin: 10px 2px 5px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.artist {
  font-size: 11px;
  color: var(--muted);
  margin: 0 2px 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.empty {
  border: 1px dashed #39415a;
  padding: 28px 15px;
  border-radius: 16px;
  color: var(--muted);
  text-align: center;
  grid-column: 1/-1;
}

/* Apple Music Style Full Custom Audio Player */
.player {
  display: none;
  background: rgba(18, 23, 37, 0.85);
  backdrop-filter: blur(25px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 28px;
  padding: 24px;
  margin: 20px 0;
  box-shadow: 0 20px 50px rgba(0,0,0,0.7);
  animation: fadeIn 0.25s ease;
}

.player.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.player-top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.player-top-bar span {
  font-size: 12px;
  color: var(--accent);
  font-weight: 700;
  letter-spacing: 1px;
}

.minimize-btn {
  background: #202638;
  color: var(--muted);
  border-radius: 10px;
  padding: 6px 14px;
  font-size: 12px;
  min-height: 34px;
}

.big-artwork-wrap {
  width: 240px;
  height: 240px;
  margin: 0 auto 20px;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 15px 35px rgba(0,0,0,0.6);
}

.big-artwork-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.song-info-center {
  text-align: center;
  margin-bottom: 20px;
}

.song-info-center h3 {
  font-size: 18px;
  margin: 0 0 6px;
  font-weight: 700;
  line-height: 1.4;
}

.song-info-center p {
  font-size: 13px;
  color: var(--muted);
  margin: 0;
}

/* Audio Controls (Apple Music Style UI) */
.controls-wrap {
  max-width: 400px;
  margin: 0 auto;
}

.progress-bar-container {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
}

.time-text {
  font-size: 11px;
  color: var(--muted);
  width: 40px;
  text-align: center;
}

.seek-slider {
  flex: 1;
  -webkit-appearance: none;
  height: 4px;
  border-radius: 2px;
  background: var(--line);
  outline: none;
  cursor: pointer;
}

.seek-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
}

.btn-group {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 25px;
}

.play-main-btn {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: #ffffff;
  color: #000;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  min-height: auto;
  box-shadow: 0 4px 15px rgba(255,255,255,0.2);
}

/* Real YouTube Iframe API container (Hidden cleanly) */
#ytPlayerContainer {
  position: absolute;
  top: -9999px;
  left: -9999px;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

/* Bottom Mini Bar */
.mini-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #111522f2;
  backdrop-filter: blur(18px);
  border-top: 1px solid var(--line);
  padding: 10px 18px;
  display: none;
  align-items: center;
  justify-content: space-between;
  z-index: 10;
}

.mini-bar.active { display: flex; }

.mini-left {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  min-width: 0;
  flex: 1;
}

.mini-left img {
  width: 45px;
  height: 45px;
  border-radius: 8px;
  object-fit: cover;
}

.mini-text { min-width: 0; }

.mini-text div {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mini-text small {
  font-size: 11px;
  color: var(--muted);
}

.load {
  display: block;
  margin: 22px auto 0;
  background: #252b40;
  border: 1px solid var(--line);
}

.note {
  font-size: 11px;
  color: #778097;
  line-height: 1.5;
  margin-top: 24px;
}

@media(max-width:480px) {
  .wrap { padding: 17px 13px 130px; }
  .grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 11px; }
  .brand { font-size: 22px; }
  .big-artwork-wrap { width: 190px; height: 190px; }
}
</style>
</head>

<body>

<main class="wrap">

<header class="top">
  <div>
    <div class="brand">SOUND<span>FLOW</span></div>
    <div class="tag">Discover • Search • Listen</div>
  </div>
  <div class="tag">Audio Mode</div>
</header>

<form class="search" id="searchForm">
  <input
    id="query"
    type="search"
    placeholder="গানের নাম বা শিল্পীর নাম লিখো…"
    autocomplete="off"
  >
  <button type="submit">Search</button>
</form>

<p class="hint">যেমন: Arijit Singh, Atif Aslam, বাংলা গান…</p>

<!-- Apple Music Pure Audio Player UI -->
<section class="player" id="player">
  <div class="player-top-bar">
    <span>AUDIO PLAYER</span>
    <button class="minimize-btn" id="minimizePlayer" type="button">⬇ নিচের দিকে রাখো</button>
  </div>

  <div class="big-artwork-wrap">
    <img id="playingThumb" alt="Artwork">
  </div>

  <div class="song-info-center">
    <h3 id="playingTitle">Song Title</h3>
    <p id="playingArtist">Artist Name</p>
  </div>

  <div class="controls-wrap">
    <div class="progress-bar-container">
      <span class="time-text" id="currentTime">0:00</span>
      <input type="range" class="seek-slider" id="seekSlider" value="0" max="100">
      <span class="time-text" id="durationTime">0:00</span>
    </div>

    <div class="btn-group">
      <button class="play-main-btn" id="mainPlayBtn" type="button">▶</button>
    </div>
  </div>
</section>

<!-- Invisible YouTube Player API Element -->
<div id="ytPlayerContainer">
  <div id="ytPlayer"></div>
</div>

<div class="section">
  <h2 id="heading">Trending All Songs</h2>
  <span class="status" id="status" aria-live="polite">Ready</span>
</div>

<div class="grid" id="results">
  <div class="empty">
    গান লোড হচ্ছে...
  </div>
</div>

<button class="load" id="loadMore" type="button" hidden>
  আরও গান দেখাও
</button>

<p class="note">
  হোমপেজে ঢুকলেই স্বয়ংক্রিয়ভাবে জনপ্রিয় গানগুলো দেখাবে। যেকোনো গানে ক্লিক করলে অডিও প্লেয়ারে সরাসরি বাজবে।
</p>

</main>

<!-- Bottom Mini Bar -->
<div class="mini-bar" id="miniBar">
  <div class="mini-left" id="expandPlayer">
    <img id="miniThumb" alt="">
    <div class="mini-text">
      <div id="miniTitle"></div>
      <small id="miniArtist"></small>
    </div>
  </div>
  <button type="button" id="miniPlayBtn" style="padding: 0 14px; min-height: 36px; background: #fff; color: #000; font-size: 13px; font-weight: bold; border-radius: 8px;">▶</button>
  <button type="button" id="closePlayer" style="padding: 0 10px; min-height: 36px; background: transparent; color: var(--muted); font-size: 14px;">✕</button>
</div>

<!-- Load YouTube Iframe API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>

const instances = [
  'https://invidious.privacyredirect.com',
  'https://inv.nadeko.net',
  'https://invidious.nerdvpn.de',
  'https://yt.chocolatemoo53.com',
  'https://invidious.tiekoetter.com'
];

const form = document.getElementById('searchForm');
const input = document.getElementById('query');
const results = document.getElementById('results');
const statusEl = document.getElementById('status');
const heading = document.getElementById('heading');
const more = document.getElementById('loadMore');

const mainPlayBtn = document.getElementById('mainPlayBtn');
const miniPlayBtn = document.getElementById('miniPlayBtn');
const seekSlider = document.getElementById('seekSlider');
const currentTimeEl = document.getElementById('currentTime');
const durationTimeEl = document.getElementById('durationTime');

let ytPlayer = null;
let currentQuery = 'Top Bangla and Hindi hits';
let page = 1;
let busy = false;
let updateTimer = null;
let isPlaying = false;

// Initialize YouTube API Player
function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('ytPlayer', {
    height: '100',
    width: '100',
    playerVars: {
      'autoplay': 1,
      'controls': 0,
      'disablekb': 1
    },
    events: {
      'onStateChange': onPlayerStateChange
    }
  });
}

function onPlayerStateChange(event) {
  if (event.data === YT.PlayerState.PLAYING) {
    isPlaying = true;
    mainPlayBtn.textContent = '❚❚';
    miniPlayBtn.textContent = '❚❚';
    startTimer();
  } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
    isPlaying = false;
    mainPlayBtn.textContent = '▶';
    miniPlayBtn.textContent = '▶';
    stopTimer();
  }
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function startTimer() {
  stopTimer();
  updateTimer = setInterval(() => {
    if (ytPlayer && ytPlayer.getCurrentTime) {
      const current = ytPlayer.getCurrentTime() || 0;
      const duration = ytPlayer.getDuration() || 0;
      currentTimeEl.textContent = formatTime(current);
      durationTimeEl.textContent = formatTime(duration);
      if (duration > 0) {
        seekSlider.value = (current / duration) * 100;
      }
    }
  }, 1000);
}

function stopTimer() {
  if (updateTimer) clearInterval(updateTimer);
}

seekSlider.addEventListener('input', () => {
  if (ytPlayer && ytPlayer.getDuration) {
    const seekToSec = (seekSlider.value / 100) * ytPlayer.getDuration();
    ytPlayer.seekTo(seekToSec, true);
  }
});

function togglePlay() {
  if (!ytPlayer) return;
  if (isPlaying) {
    ytPlayer.pauseVideo();
  } else {
    ytPlayer.playVideo();
  }
}

mainPlayBtn.addEventListener('click', togglePlay);
miniPlayBtn.addEventListener('click', togglePlay);

function bestThumb(video) {
  const thumbnails = video.videoThumbnails || [];
  return (
    thumbnails.find(x => x.quality === 'medium') ||
    thumbnails.find(x => x.quality === 'high') ||
    thumbnails[0] ||
    {}
  ).url || `https://i.ytimg.com/vi/${video.videoId}/hqdefault.jpg`;
}

function makeCard(video) {
  const card = document.createElement('article');
  card.className = 'card';
  card.tabIndex = 0;

  const img = document.createElement('img');
  img.className = 'thumb';
  img.loading = 'lazy';
  img.src = bestThumb(video);

  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = video.title || 'Untitled';

  const artist = document.createElement('div');
  artist.className = 'artist';
  artist.textContent = video.author || 'YouTube';

  card.append(img, title, artist);

  const play = () => openPlayer(video, img.src);
  card.addEventListener('click', play);

  return card;
}

function openPlayer(video, thumbnail) {
  document.getElementById('playingThumb').src = thumbnail;
  document.getElementById('playingTitle').textContent = video.title || '';
  document.getElementById('playingArtist').textContent = video.author || '';

  document.getElementById('miniThumb').src = thumbnail;
  document.getElementById('miniTitle').textContent = video.title || '';
  document.getElementById('miniArtist').textContent = video.author || '';

  if (ytPlayer && ytPlayer.loadVideoById) {
    ytPlayer.loadVideoById(video.videoId);
  }

  document.getElementById('player').classList.add('active');
  document.getElementById('miniBar').classList.remove('active');

  document.getElementById('player').scrollIntoView({
    behavior: 'smooth',
    block: 'start'
  });
}

document.getElementById('minimizePlayer').addEventListener('click', () => {
  document.getElementById('player').classList.remove('active');
  document.getElementById('miniBar').classList.add('active');
});

document.getElementById('expandPlayer').addEventListener('click', () => {
  document.getElementById('player').classList.add('active');
  document.getElementById('miniBar').classList.remove('active');
});

document.getElementById('closePlayer').addEventListener('click', () => {
  if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
  document.getElementById('player').classList.remove('active');
  document.getElementById('miniBar').classList.remove('active');
});

async function search(query, pageNumber = 1, append = false) {
  if (busy) return;
  busy = true;
  statusEl.textContent = 'গান লোড হচ্ছে…';
  more.hidden = true;

  if (!append) results.innerHTML = '<div class="empty">গান খোঁজা হচ্ছে…</div>';

  let data = null;
  for (const base of instances) {
    try {
      const response = await fetch(`${base}/api/v1/search?q=${encodeURIComponent(query)}&type=video&page=${pageNumber}`);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const json = await response.json();
      if (Array.isArray(json)) {
        data = json;
        break;
      }
    } catch (e) {}
  }

  if (!data) {
    if (!append) results.innerHTML = '<div class="empty">সার্ভার সংযোগে ব্যর্থ। পরে চেষ্টা করুন।</div>';
    statusEl.textContent = 'Server Error';
    busy = false;
    return;
  }

  const videos = data.filter(v => v.type === 'video' && v.videoId);
  if (!append) results.innerHTML = '';

  videos.forEach(v => results.appendChild(makeCard(v)));

  page = pageNumber;
  currentQuery = query;
  heading.textContent = append || pageNumber > 1 ? 'Search results' : 'Trending All Songs';
  statusEl.textContent = videos.length + 'টি গান';
  more.hidden = videos.length === 0;
  busy = false;
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const q = input.value.trim();
  if (q) search(q, 1, false);
});

more.addEventListener('click', () => {
  if (currentQuery) search(currentQuery, page + 1, true);
});

window.addEventListener('DOMContentLoaded', () => {
  search(currentQuery, 1, false);
});

</script>

</body>
</html>
