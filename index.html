<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#000000" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>SoundFlow — Music</title>

<style>

/* THEME */

:root {
  color-scheme:light dark;

  --bg:#f2f2f7;
  --surface:#ffffff;
  --surface-2:#e5e5ea;
  --text:#000000;
  --muted:#6c6c70;
  --line:rgba(0,0,0,.08);
  --accent:#007aff;

  --glass-bg:rgba(255,255,255,.46);
  --glass-bg-strong:rgba(255,255,255,.74);
  --glass-border:rgba(255,255,255,.8);
  --glass-hl:rgba(255,255,255,.95);
  --glass-shadow:rgba(30,40,80,.20);

  --card-shadow:0 1px 2px rgba(0,0,0,.05);
  --player-tint:#2a2a2c;
}

@media (prefers-color-scheme:dark) {
  :root {
    --bg:#000000;
    --surface:#1c1c1e;
    --surface-2:#2c2c2e;
    --text:#ffffff;
    --muted:#98989f;
    --line:rgba(255,255,255,.12);
    --accent:#0a84ff;

    --glass-bg:rgba(50,50,58,.40);
    --glass-bg-strong:rgba(44,44,52,.72);
    --glass-border:rgba(255,255,255,.17);
    --glass-hl:rgba(255,255,255,.32);
    --glass-shadow:rgba(0,0,0,.55);

    --card-shadow:none;
  }
}

* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html {
  background:var(--bg);
  min-height:100%;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,
  "SF Pro Display","Segoe UI",sans-serif;
  min-height:100vh;
}

html.full-player-open {
  overscroll-behavior:none;
}

body.full-player-open > .header,
body.full-player-open > main.page {
  display:none !important;
}

button {
  font-family:inherit;
  border:0;
  cursor:pointer;
  color:inherit;
}

[hidden] {
  display:none!important;
}

/* HEADER */

.header {
  max-width:1050px;
  margin:auto;
  padding:20px 16px 5px;
}

.brand {
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
}

.brand span {
  color:var(--accent);
}

/* PAGES */

.page {
  display:none;
}

.page.active {
  display:block;
}

.wrap {
  max-width:1050px;
  margin:auto;
  padding:15px 16px 180px;
}

.section {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:18px 0 15px;
}

.section-left {
  display:flex;
  align-items:center;
  gap:4px;
  min-width:0;
}

.section h2 {
  font-size:19px;
  margin:0;
  font-weight:750;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.status {
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
}

.back-btn {
  width:36px;
  height:36px;
  margin-left:-8px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:transparent;
  color:var(--accent);
  flex-shrink:0;
}

.back-btn svg {
  width:24px;
  height:24px;
}

.back-btn:active {
  background:color-mix(in srgb,var(--accent) 15%,transparent);
}

/* SEARCH */

.search {
  display:flex;
  gap:9px;
  margin:10px 0 18px;
}

.search input {
  flex:1;
  min-width:0;
  padding:14px;
  background:var(--surface);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:14px;
  font-size:16px;
  outline:none;
}

.search input::placeholder {
  color:var(--muted);
}

.search input:focus {
  border-color:var(--accent);
}

.search button {
  padding:0 19px;
  border-radius:14px;
  background:var(--accent);
  color:#fff;
  font-weight:700;
}

/* SONG GRID */

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
  gap:14px;
}

.card {
  background:var(--surface);
  border:1px solid var(--line);
  box-shadow:var(--card-shadow);
  border-radius:16px;
  padding:10px;
  cursor:pointer;
  min-width:0;
  transition:transform .2s;
}

.card:active {
  transform:scale(.97);
}

.thumb {
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:12px;
  background:var(--surface-2);
}

.title {
  font-size:13px;
  font-weight:650;
  line-height:1.4;
  margin:10px 2px 5px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.artist {
  font-size:11px;
  color:var(--muted);
  margin:0 2px 4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.empty {
  grid-column:1/-1;
  text-align:center;
  padding:35px 15px;
  border:1px dashed var(--line);
  border-radius:16px;
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}

.load {
  display:block;
  margin:22px auto;
  padding:13px 22px;
  border-radius:14px;
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--text);
  font-weight:650;
}

.load:active {
  transform:scale(.96);
}

.load:disabled {
  opacity:.5;
}

/* LIBRARY FOLDER */

.folder-cover {
  position:relative;
  width:100%;
  aspect-ratio:1;
  display:grid;
  place-items:center;
  border-radius:12px;
  overflow:hidden;

  background:linear-gradient(
    145deg,
    color-mix(in srgb,var(--accent) 26%,var(--surface-2)),
    var(--surface-2)
  );
}

.folder-cover[data-layout="quad"] {
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:2px;
}

.folder-cover img {
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

.folder-cover[data-layout="single"] img {
  position:absolute;
  inset:0;
}

.folder-empty-icon {
  width:38%;
  height:38%;
  color:var(--accent);
}

.folder-badge {
  position:absolute;
  left:8px;
  bottom:8px;
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--glass-bg-strong);
  color:var(--accent);

  backdrop-filter:blur(14px) saturate(180%);
  -webkit-backdrop-filter:blur(14px) saturate(180%);

  box-shadow:
    0 2px 8px rgba(0,0,0,.25),
    inset 0 1px 0 var(--glass-hl);
}

.folder-badge svg {
  width:16px;
  height:16px;
}

/* HOME SENTINEL */

#homeSentinel {
  width:100%;
  height:2px;
  pointer-events:none;
}

/* BOTTOM NAV */

.bottom-nav {
  position:fixed;
  z-index:9000;
  left:0;
  right:0;
  margin:0 auto;
  width:min(calc(100% - 32px),520px);
  bottom:calc(env(safe-area-inset-bottom) + 10px);
  height:66px;
  padding:6px;

  display:flex;
  align-items:center;
  gap:4px;

  border-radius:34px;
  background:var(--glass-bg);
  border:1px solid var(--glass-border);

  backdrop-filter:blur(26px) saturate(210%) brightness(1.04);
  -webkit-backdrop-filter:blur(26px) saturate(210%) brightness(1.04);

  box-shadow:
    0 14px 34px var(--glass-shadow),
    inset 0 1px 0 var(--glass-hl),
    inset 0 -1px 0 rgba(255,255,255,.07),
    inset 0 0 22px rgba(255,255,255,.06);
}

.bottom-nav::before {
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;

  background:linear-gradient(
    180deg,
    rgba(255,255,255,.26) 0%,
    rgba(255,255,255,.06) 42%,
    rgba(255,255,255,0) 60%
  );
}

.nav-btn {
  position:relative;
  flex:1;
  height:54px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;

  border-radius:28px;
  background:transparent;
  color:var(--muted);

  transition:
    color .25s,
    background .25s,
    box-shadow .25s,
    transform .2s;
}

.nav-btn svg {
  width:23px;
  height:23px;
}

.nav-btn span {
  font-size:10px;
  font-weight:650;
}

.nav-btn.active {
  color:var(--accent);
  background:color-mix(in srgb,var(--accent) 15%,transparent);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.4),
    inset 0 0 0 1px color-mix(in srgb,var(--accent) 22%,transparent);
}

.nav-btn:active {
  transform:scale(.93);
}

body.full-player-open .bottom-nav {
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

/* ============================================================
   FULL PLAYER — REFINED LAYOUT
   ============================================================ */

.player {
  position:fixed;
  inset:0;
  z-index:9999;

  display:flex;
  flex-direction:column;
  color:#fff;

  padding:
    calc(env(safe-area-inset-top) + 12px)
    24px
    calc(env(safe-area-inset-bottom) + 18px);

  overflow:hidden;
  overscroll-behavior:none;

  background-color:var(--player-tint,#2a2a2c) !important;
  isolation:isolate;

  visibility:hidden;
  opacity:0;
  pointer-events:none;

  transform:none;
  -webkit-transform:none;

  transition:
    opacity .38s cubic-bezier(.22,1,.36,1),
    visibility .38s,
    background-color .4s ease;
}

.player.active {
  position:absolute;
  inset:auto;
  top:0;
  left:0;
  right:0;

  height:calc(100vh + var(--player-lift,0px));

  padding-top:calc(
    env(safe-area-inset-top) + var(--player-lift,0px) + 12px
  );

  visibility:visible;
  opacity:1;
  pointer-events:auto;
}

/* BACKGROUND BLUR */

.player-bg {
  position:absolute;
  top:-250px;
  left:-150px;
  right:-150px;
  bottom:-250px;
  z-index:0;

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  filter:blur(55px);
  -webkit-filter:blur(55px);

  transform:translateZ(0) scale(1.3);
  -webkit-transform:translateZ(0) scale(1.3);

  opacity:1;
  pointer-events:none;

  will-change:background-image,transform;
  transition:background-image .3s ease;
}

/* PLAYER SHADE */

.player-shade {
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  z-index:1;

  background:linear-gradient(
    180deg,
    rgba(0,0,0,.04) 0%,
    rgba(0,0,0,.12) 20%,
    rgba(0,0,0,.30) 48%,
    rgba(0,0,0,.58) 75%,
    rgba(0,0,0,.78) 100%
  );

  pointer-events:none;
}

/* TOP BAR */

.player-top-bar {
  position:relative;
  z-index:2;

  display:flex;
  align-items:center;
  justify-content:center;

  min-height:30px;
  flex-shrink:0;
}

.grabber {
  width:100%;
  height:30px;

  display:grid;
  place-items:center;
  background:transparent;
}

.grabber span {
  display:block;
  width:46px;
  height:5px;
  border-radius:3px;
  background:rgba(255,255,255,.55);
}

/* PLAYER CONTENT */

.player-content-center {
  position:relative;
  z-index:2;

  width:100%;
  max-width:390px;
  margin:0 auto;

  display:flex;
  flex-direction:column;

  gap:clamp(8px,1.5vh,16px);

  flex:1;
  min-height:0;

  padding-bottom:0;
}

/* ARTWORK AREA */

.artwork-zone {
  flex:.82;
  min-height:0;

  display:flex;
  align-items:center;
  justify-content:center;

  container-type:size;

  transform:translateY(-8px);
}

/* ALBUM ART */

.big-artwork-wrap {
  width:min(100%,39vh);
  width:min(100cqw,100cqh);

  aspect-ratio:1/1;
  flex-shrink:0;
  overflow:hidden;

  border-radius:14px;
  background:#222;

  box-shadow:0 20px 55px rgba(0,0,0,.5);

  transform:scale(1);

  transition:
    transform .5s cubic-bezier(.22,1,.36,1),
    box-shadow .5s cubic-bezier(.22,1,.36,1);
}

.big-artwork-wrap.paused {
  transform:scale(.84);
  box-shadow:0 10px 28px rgba(0,0,0,.35);
}

.big-artwork-wrap img {
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* SONG INFO AREA */

.player-info-group {
  flex-shrink:0;
  transform:translateY(-5px);
}

/* SONG TITLE + ARTIST */

.song-meta-box {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;

  margin-bottom:14px;
  flex-shrink:0;
}

.song-info-text {
  flex:1;
  min-width:0;
}

.song-info-text h3 {
  margin:0 0 5px;
  font-size:22px;
  font-weight:750;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.song-info-text p {
  margin:0;
  font-size:17px;
  color:rgba(255,255,255,.62);

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.like-btn {
  width:44px;
  height:44px;

  display:grid;
  place-items:center;

  background:transparent;
  color:rgba(255,255,255,.8);
  flex-shrink:0;
}

.like-btn svg {
  width:27px;
  height:27px;
}

.like-btn.liked {
  color:#ff2d55;
}

.like-btn.liked svg {
  fill:currentColor;
}

/* PROGRESS BAR */

.progress-container {
  width:100%;
  margin-bottom:0;
  flex-shrink:0;
}

.seek-slider {
  width:100%;
  height:30px;
  margin:-12px 0 -13px;

  display:block;
  appearance:none;
  -webkit-appearance:none;

  border-radius:0;
  outline:none;

  background-color:transparent;

  background-image:linear-gradient(
    to right,
    #fff 0%,
    #fff 0%,
    rgba(255,255,255,.3) 0%,
    rgba(255,255,255,.3) 100%
  );

  background-size:100% 5px;
  background-position:center;
  background-repeat:no-repeat;
}

.seek-slider::-webkit-slider-thumb {
  appearance:none;
  -webkit-appearance:none;

  width:13px;
  height:13px;

  border-radius:50%;
  background:#fff;

  box-shadow:0 1px 7px rgba(0,0,0,.4);
}

.seek-slider::-moz-range-thumb {
  width:13px;
  height:13px;
  border:none;
  border-radius:50%;
  background:#fff;
}

.time-row {
  display:flex;
  justify-content:space-between;
  margin-top:10px;

  font-size:11px;
  color:rgba(255,255,255,.7);
  font-variant-numeric:tabular-nums;
}

/* PLAYBACK CONTROLS */

.controls-row {
  display:flex;
  justify-content:center;
  align-items:center;

  gap:clamp(35px,12vw,55px);
  flex-shrink:0;

  transform:translateY(-8px);
}

.ctrl-btn {
  width:64px;
  height:64px;

  display:grid;
  place-items:center;

  background:transparent;
  color:white;

  transition:transform .15s;
}

.ctrl-btn svg {
  width:46px;
  height:46px;
}

.ctrl-btn svg,
.play-pause-circle svg {
  stroke:currentColor;
  stroke-width:1.4;
  stroke-linejoin:round;
}

.ctrl-btn:active {
  transform:scale(.85);
}

.play-pause-circle {
  width:84px;
  height:84px;

  display:grid;
  place-items:center;

  background:transparent;
  color:#fff;

  transition:transform .15s;
}

.play-pause-circle:active {
  transform:scale(.88);
}

.play-pause-circle svg {
  width:66px;
  height:66px;
}

/* MINI PLAYER */

.mini-player {
  position:fixed;
  z-index:9500;

  left:0;
  right:0;
  margin:0 auto;
  width:min(calc(100% - 32px),520px);

  bottom:calc(env(safe-area-inset-bottom) + 86px);

  min-height:68px;
  padding:9px 11px;

  display:flex;
  align-items:center;
  gap:11px;

  color:var(--text);
  background:var(--glass-bg-strong);

  border:1px solid var(--glass-border);
  border-radius:22px;

  backdrop-filter:blur(26px) saturate(200%);
  -webkit-backdrop-filter:blur(26px) saturate(200%);

  box-shadow:
    0 10px 28px var(--glass-shadow),
    inset 0 1px 0 var(--glass-hl);

  opacity:0;
  visibility:hidden;
  pointer-events:none;

  transform:translateY(35px) scale(.97);

  transition:
    opacity .35s cubic-bezier(.22,1,.36,1),
    transform .48s cubic-bezier(.22,1,.36,1),
    visibility .35s;
}

.mini-player.visible {
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:translateY(0) scale(1);
}

.mini-thumb {
  width:47px;
  height:47px;
  border-radius:10px;
  object-fit:cover;
  flex-shrink:0;
}

.mini-info {
  flex:1;
  min-width:0;
  cursor:pointer;
}

.mini-title {
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.mini-artist {
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.mini-control {
  width:38px;
  height:42px;
  display:grid;
  place-items:center;
  background:transparent;
  color:var(--text);
  flex-shrink:0;
}

.mini-control svg {
  width:24px;
  height:24px;
}

/* YOUTUBE */

#ytPlayerContainer {
  position:fixed;
  left:-1000px;
  top:0;
  width:200px;
  height:200px;
  opacity:.01;
  pointer-events:none;
}

/* RESPONSIVE */

@media(max-width:480px) {

  .wrap {
    padding:12px 13px 180px;
  }

  .header {
    padding:17px 13px 5px;
  }

  .grid {
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:11px;
  }

  .brand {
    font-size:23px;
  }

  .player {
    padding-left:22px;
    padding-right:22px;
  }

  .player-content-center {
    max-width:370px;
  }

}

/* SHORT SCREEN */

@media(max-height:720px) {

  .player-content-center {
    gap:8px;
  }

  .artwork-zone {
    flex:.75;
    transform:translateY(-5px);
  }

  .song-meta-box {
    margin-bottom:10px;
  }

  .player-info-group {
    transform:translateY(-3px);
  }

  .controls-row {
    transform:translateY(-5px);
  }

  .ctrl-btn {
    width:56px;
    height:56px;
  }

  .ctrl-btn svg {
    width:40px;
    height:40px;
  }

  .play-pause-circle {
    width:72px;
    height:72px;
  }

  .play-pause-circle svg {
    width:56px;
    height:56px;
  }

}

/* VERY SHORT SCREEN */

@media(max-height:600px) {

  .player-content-center {
    gap:6px;
  }

  .artwork-zone {
    flex:.65;
    transform:translateY(-3px);
  }

  .song-meta-box {
    margin-bottom:7px;
  }

  .player-info-group {
    transform:translateY(-2px);
  }

  .controls-row {
    transform:translateY(-3px);
  }

  .song-info-text h3 {
    font-size:19px;
  }

  .song-info-text p {
    font-size:15px;
  }

}

</style>
</head>

<body>

<header class="header">
  <div class="brand">SOUND<span>FLOW</span></div>
</header>

<!-- HOME -->

<main class="page active" id="homePage">
  <div class="wrap">

    <div class="section">
      <h2>Home</h2>
      <span class="status" id="homeStatus">Discover music</span>
    </div>

    <div class="grid" id="homeResults"></div>
    <div id="homeSentinel" aria-hidden="true"></div>

  </div>
</main>

<!-- SEARCH -->

<main class="page" id="searchPage">
  <div class="wrap">

    <form class="search" id="searchForm">
      <input
        id="query"
        type="search"
        placeholder="গানের নাম বা শিল্পীর নাম লিখো…"
        autocomplete="off"
      >
      <button type="submit">Search</button>
    </form>

    <div class="section">
      <h2>Search Results</h2>
      <span class="status" id="searchStatus">Search songs</span>
    </div>

    <div class="grid" id="searchResults">
      <div class="empty">তোমার পছন্দের গান খুঁজে নাও।</div>
    </div>

    <button class="load" id="searchMore" hidden>
      আরও গান দেখাও
    </button>

  </div>
</main>

<!-- LIBRARY -->

<script>

/* ELEMENTS */

const $ = id => document.getElementById(id);

const playerScreen = $('player');
const miniPlayer = $('miniPlayer');
const seekSlider = $('seekSlider');

/* STATE */

let ytPlayer = null;
let apiReady = false;

let playerMode = 'closed';

let playQueue = [];
let currentIndex = -1;

let isPlaying = false;

let updateTimer = null;
let pendingVideoId = null;

let activeTab = 'home';

let libraryView = 'folders';

/* THEME COLOR */

const schemeQuery = window.matchMedia
  ? window.matchMedia('(prefers-color-scheme: dark)')
  : null;

function baseThemeColor() {
  return (schemeQuery && !schemeQuery.matches) ? '#f2f2f7' : '#000000';
}

/* PLAYER TINT */

const FALLBACK_TINT = '#2a2a2c';
const tintCache = {};
let currentTint = FALLBACK_TINT;

function syncTint() {

  document.documentElement.style.setProperty(
    '--player-tint',
    currentTint
  );

  const meta = $('themeColor');

  if (meta) {
    meta.setAttribute(
      'content',
      playerMode === 'full' ? currentTint : baseThemeColor()
    );
  }

}

if (schemeQuery) {

  if (schemeQuery.addEventListener) {
    schemeQuery.addEventListener('change',syncTint);
  } else if (schemeQuery.addListener) {
    schemeQuery.addListener(syncTint);
  }

}

function loadTint(video) {

  const id = video.videoId;

  if (!id) return;

  if (tintCache[id]) {
    currentTint = tintCache[id];
    syncTint();
    return;
  }

  currentTint = FALLBACK_TINT;
  syncTint();

  const img = new Image();

  img.crossOrigin = 'anonymous';

  img.onload = () => {

    try {

      const canvas = document.createElement('canvas');

      canvas.width = 16;
      canvas.height = 16;

      const ctx = canvas.getContext('2d',{
        willReadFrequently:true
      });

      const sx = img.naturalWidth * 0.3;
      const sw = img.naturalWidth * 0.4;
      const sh = img.naturalHeight * 0.5;

      ctx.drawImage(img,sx,0,sw,sh,0,0,16,16);

      const data = ctx.getImageData(0,0,16,16).data;

      let r = 0, g = 0, b = 0, n = 0;

      for (let i = 0; i < data.length; i += 4) {
        r += data[i];
        g += data[i + 1];
        b += data[i + 2];
        n++;
      }

      if (!n) return;

      const color =
        `rgb(${Math.round(r / n)},${Math.round(g / n)},${Math.round(b / n)})`;

      tintCache[id] = color;

      const playing = playQueue[currentIndex];

      if (playing && playing.videoId === id) {
        currentTint = color;
        syncTint();
      }

    } catch(e) {}

  };

  img.src = `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;

}

/* SCROLL LOCK */

let savedScrollY = 0;

/* HOME STORAGE */

const HOME_SEEN_KEY = 'soundflow_home_seen_v1';
const HOME_CACHE_KEY = 'soundflow_home_cache_v2';

let homeSeenIds = new Set();

try {
  const saved = JSON.parse(
    localStorage.getItem(HOME_SEEN_KEY) || '[]'
  );

  if (Array.isArray(saved)) {
    homeSeenIds = new Set(saved);
  }
} catch(e) {}

function saveHomeSeen() {
  try {
    localStorage.setItem(
      HOME_SEEN_KEY,
      JSON.stringify(Array.from(homeSeenIds).slice(-5000))
    );
  } catch(e) {}
}

function markHomeSeen(videoId) {
  if (!videoId) return;
  homeSeenIds.add(videoId);
}

function saveHomeCache() {
  try {
    localStorage.setItem(HOME_CACHE_KEY,JSON.stringify({
      videos:pageData.home.videos.slice(-200),
      page:pageData.home.page,
      savedAt:Date.now()
    }));
  } catch(e) {}
}

/* PAGE DATA */

const pageData = {

  home:{
    videos:[],
    page:0,
    query:'Top Bangla Hindi songs',
    busy:false,
    controller:null
  },

  search:{
    videos:[],
    page:1,
    query:'',
    busy:false,
    controller:null
  }

};

/* RESTORE HOME CACHE */

function restoreHomeCache() {

  try {

    const cache = JSON.parse(
      localStorage.getItem(HOME_CACHE_KEY) || 'null'
    );

    if (!cache || !Array.isArray(cache.videos)) return false;

    if (
      cache.savedAt &&
      Date.now() - cache.savedAt > 7 * 24 * 60 * 60 * 1000
    ) {
      return false;
    }

    const valid = cache.videos.filter(v =>
      v && v.videoId
    );

    if (!valid.length) return false;

    pageData.home.videos = valid;
    pageData.home.page = Number(cache.page) || 0;

    /* CACHE SONGS ALSO COUNT AS SEEN */

    valid.forEach(video => {
      markHomeSeen(video.videoId);
    });

    saveHomeSeen();

    const grid = $('homeResults');

    grid.innerHTML = '';

    valid.forEach((video,index) => {
      grid.appendChild(
        makeCard(video,index,pageData.home.videos)
      );
    });

    $('homeStatus').textContent =
      valid.length + ' Songs';

    return true;

  } catch(e) {
    return false;
  }

}

/* HOME AUTO LOAD */

const HOME_BATCH_SIZE = 20;
const HOME_MAX_PAGE_ATTEMPTS = 12;

let homeHasMore = true;
let homeAutoLoading = false;
let homeObserver = null;

/* HOME REFRESH QUERIES */

const HOME_REFRESH_QUERIES = [

  'Latest Bangla new songs 2026',
  'New Hindi Bollywood songs 2026',
  'Latest Bengali music releases',
  'New Indian songs 2026',
  'Latest Bangla movie songs',
  'Latest Hindi romantic songs 2026',
  'New Bengali song releases 2026',
  'Latest Bollywood music videos',
  'New Bangla popular songs',
  'Latest Indian music videos'

];

let lastHomeRefreshQuery = '';

function getHomeRefreshQuery() {

  const options = HOME_REFRESH_QUERIES.filter(
    query => query !== lastHomeRefreshQuery
  );

  const available = options.length
    ? options
    : HOME_REFRESH_QUERIES;

  const query = available[
    Math.floor(Math.random() * available.length)
  ];

  lastHomeRefreshQuery = query;

  return query;

}

/* HOME OBSERVER */

function setupHomeObserver() {

  if (!('IntersectionObserver' in window)) return;

  const sentinel = $('homeSentinel');

  if (!sentinel || homeObserver) return;

  homeObserver = new IntersectionObserver(entries => {

    for (const entry of entries) {

      if (!entry.isIntersecting) continue;
      if (activeTab !== 'home') continue;
      if (playerMode === 'full') continue;
      if (homeAutoLoading) continue;
      if (!homeHasMore) continue;
      if (pageData.home.busy) continue;
      if (!pageData.home.videos.length) continue;

      loadNextHomeBatch();

    }

  },{
    root:null,
    rootMargin:'700px 0px',
    threshold:0
  });

  homeObserver.observe(sentinel);

}

function refreshHomeObserver() {

  if (!homeObserver) {
    setupHomeObserver();
    return;
  }

  const sentinel = $('homeSentinel');

  if (!sentinel) return;

  homeObserver.unobserve(sentinel);

  requestAnimationFrame(() => {

    if (
      homeObserver &&
      homeHasMore &&
      activeTab === 'home'
    ) {
      homeObserver.observe(sentinel);
    }

  });

}

/* LOAD NEXT HOME BATCH */

async function loadNextHomeBatch() {

  if (homeAutoLoading || !homeHasMore) return;

  const state = pageData.home;

  if (state.busy) return;

  homeAutoLoading = true;

  try {

    await loadSongs(
      'home',
      state.query,
      state.page + 1,
      true
    );

  } finally {

    homeAutoLoading = false;

    if (homeHasMore && activeTab === 'home') {
      refreshHomeObserver();
    }

  }

}

/* SERVERS */

const instances = [
  'https://invidious.privacyredirect.com',
  'https://inv.nadeko.net',
  'https://invidious.nerdvpn.de',
  'https://yt.chocolatemoo53.com',
  'https://invidious.tiekoetter.com'
];

/* PAGE NAVIGATION */

function setActiveTab(tab) {

  if (!['home','search','library'].includes(tab)) return;
  if (activeTab === tab) return;

  activeTab = tab;

  $('homePage').classList.toggle('active',tab === 'home');
  $('searchPage').classList.toggle('active',tab === 'search');
  $('libraryPage').classList.toggle('active',tab === 'library');

  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.toggle('active',btn.dataset.tab === tab);
  });

  if (tab === 'library') {
    libraryView = 'folders';
    renderLibrary();
  }

}

/* NAV BUTTONS */

document.querySelectorAll('.nav-btn').forEach(btn => {

  btn.addEventListener('click',() => {

    const tab = btn.dataset.tab;

    if (
      tab === 'library' &&
      activeTab === 'library' &&
      libraryView !== 'folders'
    ) {
      setLibraryView('folders');
      return;
    }

    /* EVERY HOME TAP REFRESHES THE FEED */

    if (tab === 'home') {

      if (activeTab !== 'home') {
        setActiveTab('home');
      }

      refreshHomeFeed();

      return;

    }

    setActiveTab(tab);

  });

});

/* YOUTUBE API */

window.onYouTubeIframeAPIReady = function() {

  ytPlayer = new YT.Player('ytPlayer', {

    height:'200',
    width:'200',

    playerVars:{
      autoplay:0,
      controls:0,
      disablekb:1,
      playsinline:1,
      rel:0
    },

    events:{

      onReady:() => {

        apiReady = true;

        if (pendingVideoId) {
          const id = pendingVideoId;
          pendingVideoId = null;
          ytPlayer.loadVideoById(id);
        }

      },

      onStateChange:onPlayerStateChange,

      onError:event => {

        console.log('YouTube Error:',event.data);

        isPlaying = false;
        updateIcons();
        stopTimer();

      }

    }

  });

};

/* PLAYER STATE */

function onPlayerStateChange(event) {

  if (event.data === YT.PlayerState.PLAYING) {

    isPlaying = true;
    updateIcons();
    setArtworkState(true);
    startTimer();

  }

  else if (event.data === YT.PlayerState.PAUSED) {

    isPlaying = false;
    updateIcons();
    setArtworkState(false);
    stopTimer();

  }

  else if (event.data === YT.PlayerState.ENDED) {

    isPlaying = false;
    updateIcons();
    stopTimer();

    nextSong();

  }

}

/* ICONS */

const playSVG = '<path d="M7 4v16l13-8z"/>';
const pauseSVG = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';

function updateIcons() {

  $('mainPlayIcon').innerHTML =
    isPlaying ? pauseSVG : playSVG;

  $('miniPlayIcon').innerHTML =
    isPlaying ? pauseSVG : playSVG;

}

/* ARTWORK STATE */

function setArtworkState(playing) {
  $('artworkWrap').classList.toggle('paused',!playing);
}

/* TIME */

function formatTime(sec) {

  if (!Number.isFinite(sec) || sec < 0) return '0:00';

  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);

  return m + ':' + String(s).padStart(2,'0');

}

/* PROGRESS */

function setProgressColor(percent) {

  const value = Math.max(0,Math.min(100,percent));

  seekSlider.style.backgroundImage = `
    linear-gradient(
      to right,
      #fff 0%,
      #fff ${value}%,
      rgba(255,255,255,.3) ${value}%,
      rgba(255,255,255,.3) 100%
    )
  `;

}

function updateProgress() {

  if (!ytPlayer || !apiReady) return;

  try {

    const current = ytPlayer.getCurrentTime() || 0;
    const duration = ytPlayer.getDuration() || 0;

    $('currentTime').textContent = formatTime(current);
    $('durationTime').textContent = formatTime(duration);

    if (duration > 0) {

      const percent = Math.min(100,(current / duration) * 100);

      if (!seekSlider.matches(':active')) {
        seekSlider.value = percent;
        setProgressColor(percent);
      }

    }

  } catch(e) {}

}

function startTimer() {
  stopTimer();
  updateProgress();
  updateTimer = setInterval(updateProgress,400);
}

function stopTimer() {
  if (updateTimer) {
    clearInterval(updateTimer);
    updateTimer = null;
  }
}

/* SEEK */

seekSlider.addEventListener('input',() => {

  const percent = Number(seekSlider.value);

  setProgressColor(percent);

  if (ytPlayer && apiReady) {

    const duration = ytPlayer.getDuration() || 0;

    $('currentTime').textContent =
      formatTime(duration * percent / 100);

  }

});

seekSlider.addEventListener('change',() => {

  if (!ytPlayer || !apiReady) return;

  const duration = ytPlayer.getDuration() || 0;

  if (duration > 0) {
    ytPlayer.seekTo(duration * Number(seekSlider.value) / 100,true);
  }

  updateProgress();

});

function resetProgress() {

  seekSlider.value = 0;
  setProgressColor(0);

  $('currentTime').textContent = '0:00';
  $('durationTime').textContent = '0:00';

}

/* PLAY PAUSE */

function togglePlay() {

  if (!ytPlayer || !apiReady) return;

  if (isPlaying) {
    ytPlayer.pauseVideo();
  } else {
    ytPlayer.playVideo();
  }

}

$('mainPlayBtn').addEventListener('click',e => {
  e.preventDefault();
  e.stopPropagation();
  togglePlay();
});

$('miniPlayBtn').addEventListener('click',e => {
  e.preventDefault();
  e.stopPropagation();
  togglePlay();
});

/* THUMBNAIL */

function bestThumb(video) {

  const thumbnails = video.videoThumbnails || [];

  return (
    thumbnails.find(x => x.quality === 'maxres') ||
    thumbnails.find(x => x.quality === 'high') ||
    thumbnails.find(x => x.quality === 'medium') ||
    thumbnails[0] ||
    {}
  ).url || `https://i.ytimg.com/vi/${video.videoId}/hqdefault.jpg`;

}

/* FAVOURITES */

function getLikes() {

  try {
    return JSON.parse(localStorage.getItem('soundflow_likes') || '[]');
  } catch(e) {
    return [];
  }

}

function getLikedSongs() {

  try {
    return JSON.parse(localStorage.getItem('soundflow_liked_songs') || '[]');
  } catch(e) {
    return [];
  }

}

function saveLikedSongs(songs) {

  try {

    localStorage.setItem(
      'soundflow_liked_songs',
      JSON.stringify(songs)
    );

    localStorage.setItem(
      'soundflow_likes',
      JSON.stringify(songs.map(v => v.videoId))
    );

  } catch(e) {}

}

/* SONG INFO */

function setSongInfo(video) {

  const thumbnail = bestThumb(video);

  $('playingThumb').src = thumbnail;

  $('playingTitle').textContent =
    video.title || 'Unknown Song';

  $('playingArtist').textContent =
    video.author || 'YouTube';

  $('miniThumb').src = thumbnail;

  $('miniTitle').textContent =
    video.title || 'Unknown Song';

  $('miniArtist').textContent =
    video.author || 'YouTube';

  $('playerBg').style.backgroundImage =
    `url("${thumbnail}")`;

  $('likeBtn').classList.toggle(
    'liked',
    getLikes().includes(video.videoId)
  );

  loadTint(video);

}

/* SCROLL LOCK */

function getTopLift() {

  const probe = document.createElement('div');

  probe.style.cssText =
    'position:absolute;visibility:hidden;pointer-events:none;' +
    'padding-top:env(safe-area-inset-top);';

  document.body.appendChild(probe);

  const safeTop = probe.offsetHeight;

  probe.remove();

  return safeTop > 0 ? 0 : 70;

}

function lockPageScroll() {

  if (document.body.classList.contains('full-player-open')) return;

  savedScrollY = window.scrollY || window.pageYOffset || 0;

  document.documentElement.style.setProperty(
    '--player-lift',
    getTopLift() + 'px'
  );

  document.documentElement.classList.add('full-player-open');
  document.body.classList.add('full-player-open');

}

function applyPlayerScroll() {

  const lift = parseFloat(
    getComputedStyle(document.documentElement)
      .getPropertyValue('--player-lift')
  ) || 0;

  window.scrollTo(0,lift);

  requestAnimationFrame(() => {
    if (playerMode === 'full') window.scrollTo(0,lift);
  });

}

function unlockPageScroll() {

  if (!document.body.classList.contains('full-player-open')) return;

  document.documentElement.classList.remove('full-player-open');
  document.body.classList.remove('full-player-open');

  document.documentElement.style.setProperty('--player-lift','0px');

  window.scrollTo(0,savedScrollY);

}

/* PLAYER MODES */

function showFullPlayer() {

  playerMode = 'full';

  lockPageScroll();
  syncTint();

  miniPlayer.classList.remove('visible');
  playerScreen.classList.add('active');

  applyPlayerScroll();

}

function minimizePlayer() {

  if (playerMode !== 'full') return;

  playerMode = 'mini';

  unlockPageScroll();
  syncTint();

  playerScreen.classList.remove('active');
  miniPlayer.classList.add('visible');

}

function expandPlayer() {

  if (playerMode !== 'mini') return;

  playerMode = 'full';

  lockPageScroll();
  syncTint();

  miniPlayer.classList.remove('visible');
  playerScreen.classList.add('active');

  applyPlayerScroll();

}

function closePlayer() {

  playerMode = 'closed';

  unlockPageScroll();
  syncTint();

  playerScreen.classList.remove('active');
  miniPlayer.classList.remove('visible');

  stopTimer();

  if (ytPlayer && apiReady) {
    ytPlayer.stopVideo();
  }

  pendingVideoId = null;
  isPlaying = false;

  currentIndex = -1;
  playQueue = [];

  updateIcons();
  setArtworkState(true);
  resetProgress();

}

/* PLAY SONG */

function playSongAt(index,list) {

  if (list) {
    playQueue = list.slice();
  }

  if (index < 0 || index >= playQueue.length) return;

  const video = playQueue[index];

  if (!video || !video.videoId) return;

  currentIndex = index;

  if (playerMode === 'closed') {
    showFullPlayer();
  }

  setSongInfo(video);
  resetProgress();

  if (apiReady && ytPlayer) {

    ytPlayer.loadVideoById({
      videoId:video.videoId,
      startSeconds:0
    });

  } else {

    pendingVideoId = video.videoId;

  }

}

/* NEXT / PREVIOUS */

function nextSong() {

  if (!playQueue.length || currentIndex < 0) return;

  let next = currentIndex + 1;

  if (next >= playQueue.length) next = 0;

  playSongAt(next);

}

function previousSong() {

  if (!playQueue.length || currentIndex < 0) return;

  let previous = currentIndex - 1;

  if (previous < 0) previous = playQueue.length - 1;

  playSongAt(previous);

}

$('nextBtn').addEventListener('click',e => {

  nextSong();
});

$('prevBtn').addEventListener('click',e => {

  e.stopPropagation();
  previousSong();
});

/* PLAYER TOUCH HANDLING */

let touchStartX = 0;
let touchStartY = 0;
let touchStarted = false;

playerScreen.addEventListener('touchstart',e => {

  touchStarted = false;

  if (playerMode !== 'full') return;
  if (e.target.closest('button:not(.grabber),input')) return;

  const touch = e.touches[0];

  touchStartX = touch.clientX;
  touchStartY = touch.clientY;

  touchStarted = true;

},{passive:true});

playerScreen.addEventListener('touchmove',e => {

  if (playerMode !== 'full') return;
  if (e.target.closest('button:not(.grabber),input')) return;

  if (e.cancelable) e.preventDefault();

},{passive:false});

playerScreen.addEventListener('touchend',e => {

  if (!touchStarted) return;

  touchStarted = false;

  if (playerMode !== 'full') return;

  const touch = e.changedTouches[0];

  const deltaY = touch.clientY - touchStartY;
  const deltaX = Math.abs(touch.clientX - touchStartX);

  if (deltaY > 90 && deltaY > deltaX * 1.5) {
    minimizePlayer();
  }

},{passive:true});

playerScreen.addEventListener('touchcancel',() => {
  touchStarted = false;
});

/* LIKE BUTTON */

$('likeBtn').addEventListener('click',e => {

  e.preventDefault();
  e.stopPropagation();

  if (currentIndex < 0) return;

  const video = playQueue[currentIndex];

  if (!video) return;

  const id = video.videoId;

  let songs = getLikedSongs();
  let likes = getLikes();

  if (likes.includes(id)) {

    likes = likes.filter(x => x !== id);
    songs = songs.filter(x => x.videoId !== id);

  } else {

    likes.push(id);

    if (!songs.some(x => x.videoId === id)) {
      songs.unshift(video);
    }

  }

  saveLikedSongs(songs);

  $('likeBtn').classList.toggle(
    'liked',
    likes.includes(id)
  );

  if (activeTab === 'library') {
    renderLibrary();
  }

});

/* SONG CARDS */

function makeCard(video,index,list) {

  const card = document.createElement('article');

  card.className = 'card';
  card.tabIndex = 0;

  const img = document.createElement('img');

  img.className = 'thumb';
  img.loading = 'lazy';
  img.src = bestThumb(video);

  const title = document.createElement('div');

  title.className = 'title';
  title.textContent = video.title || 'Untitled';

  const artist = document.createElement('div');

  artist.className = 'artist';
  artist.textContent = video.author || 'YouTube';

  card.append(img,title,artist);

  const play = () => playSongAt(index,list);

  card.addEventListener('click',play);

  card.addEventListener('keydown',e => {

    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      play();
    }

  });

  return card;

}

/* FAST API FETCH */

async function fetchSongs(query,pageNumber,controller) {

  const controllers = [];

  const requests = instances.map(base => {

    const child = new AbortController();

    controllers.push(child);

    const abortParent = () => child.abort();

    controller.signal.addEventListener(
      'abort',
      abortParent,
      {once:true}
    );

    return fetch(
      `${base}/api/v1/search?q=${encodeURIComponent(query)}&type=video&page=${pageNumber}`,
      {
        signal:child.signal
      }
    )
    .then(response => {

      if (!response.ok) {
        throw new Error('Server error');
      }

      return response.json();

    })
    .then(json => {

      if (!Array.isArray(json)) {
        throw new Error('Invalid response');
      }

      return json;

    });

  });

  try {

    const result = await Promise.any(requests);

    controllers.forEach(c => c.abort());

    return result;

  } catch(e) {

    controllers.forEach(c => c.abort());

    return null;

  }

}

/* LOAD SONGS */

async function loadSongs(type,query,pageNumber=1,append=false) {

  const state = pageData[type];

  if (!state || state.busy) return;

  state.busy = true;

  if (state.controller) {
    state.controller.abort();
  }

  const controller = new AbortController();

  state.controller = controller;

  const grid = type === 'home'
    ? $('homeResults')
    : $('searchResults');

  const status = type === 'home'
    ? $('homeStatus')
    : $('searchStatus');

  const more = type === 'home'
    ? null
    : $('searchMore');

  if (more) {
    more.hidden = true;
    more.disabled = true;
  }

  if (!append && type === 'search') {
    grid.innerHTML = '';
    state.videos = [];
    state.page = 0;
  }

  let collected = [];

  let lastCheckedPage = pageNumber;
  let reachedEnd = false;
  let failed = false;

  const existing = new Set(
    state.videos.map(v => v.videoId)
  );

  const maxAttempts = type === 'home'
    ? HOME_MAX_PAGE_ATTEMPTS
    : 1;

  for (let attempt = 0; attempt < maxAttempts; attempt++) {

    if (controller.signal.aborted) break;

    const currentPage = pageNumber + attempt;

    lastCheckedPage = currentPage;

    const data = await fetchSongs(
      query,
      currentPage,
      controller
    );

    if (state.controller !== controller) return;

    if (controller.signal.aborted) {
      state.busy = false;
      return;
    }

    if (!data) {

      if (attempt === 0) failed = true;

      break;

    }

    const found = data.filter(v =>
      v.type === 'video' && v.videoId
    );

    if (!found.length) {
      reachedEnd = true;
      break;
    }

    for (const video of found) {

      const id = video.videoId;

      if (existing.has(id)) continue;

      if (type === 'home' && homeSeenIds.has(id)) {
        continue;
      }

      existing.add(id);
      collected.push(video);

      if (
        type === 'home' &&
        collected.length >= HOME_BATCH_SIZE
      ) {
        break;
      }

    }

    if (
      type === 'home' &&
      collected.length >= HOME_BATCH_SIZE
    ) {
      break;
    }

    if (type !== 'home') break;

  }

  if (state.controller !== controller) return;

  if (controller.signal.aborted) {
    state.busy = false;
    return;
  }

  if (failed && !append) {

    if (type === 'home') {
      status.textContent = 'Connection unavailable';
    } else {

      grid.innerHTML =
        '<div class="empty">সার্ভার সংযোগে ব্যর্থ। পরে আবার চেষ্টা করুন।</div>';

      status.textContent = 'Server Error';

    }

    state.busy = false;

    return;

  }

  /*
    HOME REFRESH:
    নতুন গান পাওয়া গেলেই পুরোনো Home cards replace হবে।
    নতুন গান না পেলে আগের গানগুলো screen-এ থাকবে।
  */

  if (
    type === 'home' &&
    !append &&
    state.videos.length &&
    collected.length
  ) {

    state.videos = [];
    grid.innerHTML = '';

  }

  if (collected.length) {

    collected.forEach(video => {

      state.videos.push(video);

      if (type === 'home') {
        markHomeSeen(video.videoId);
      }

      const index = state.videos.length - 1;

      grid.appendChild(
        makeCard(video,index,state.videos)
      );

    });

  }

  if (!state.videos.length && type === 'search') {

    grid.innerHTML =
      '<div class="empty">কোনো গান পাওয়া যায়নি।</div>';

  }

  state.page = lastCheckedPage;
  state.query = query;

  status.textContent = state.videos.length + ' Songs';

  if (type === 'search') {

    more.hidden =
      reachedEnd || collected.length === 0;

    more.disabled = false;

  }

  if (type === 'home') {

    if (reachedEnd) {

      homeHasMore = false;

    } else if (
      collected.length === 0 &&
      lastCheckedPage >= pageNumber + maxAttempts - 1
    ) {

      homeHasMore = false;

    } else if (collected.length > 0) {

      homeHasMore = true;

    }

    saveHomeCache();
    saveHomeSeen();

  }

  state.busy = false;

  if (type === 'home') {
    refreshHomeObserver();
  }

}

/* HOME INITIAL LOAD */

function loadHome() {

  const state = pageData.home;

  if (state.busy || homeAutoLoading) return;

  if (!state.videos.length) {

    homeHasMore = true;

    loadSongs(
      'home',
      state.query,
      1,
      false
    );

  } else {

    refreshHomeObserver();

  }

}

/* HOME REFRESH */

function refreshHomeFeed() {

  const state = pageData.home;

  /*
    আগের Home request চললে সেটি বন্ধ করে দেওয়া হবে।
    এতে পুরোনো request নতুন feed-কে বাধা দিতে পারবে না।
  */

  if (state.controller) {
    state.controller.abort();
  }

  state.busy = false;
  state.controller = null;

  homeAutoLoading = false;
  homeHasMore = true;

  /*
    প্রতিবার আলাদা search query নেওয়া হবে।
    আগের query সঙ্গে সঙ্গে আবার নেওয়া হবে না।
  */

  const newQuery = getHomeRefreshQuery();

  state.query = newQuery;
  state.page = 0;

  $('homeStatus').textContent = 'Discovering new songs...';

  /*
    পুরোনো গান fetch শেষ হওয়ার আগে সরানো হবে না।
    নতুন গান পাওয়া গেলে loadSongs নিজেই পুরোনো cards replace করবে।
  */

  loadSongs(
    'home',
    newQuery,
    1,
    false
  );

}

/* SEARCH */

$('searchForm').addEventListener('submit',e => {

  e.preventDefault();

  const query = $('query').value.trim();

  if (!query) return;

  loadSongs(
    'search',

$('searchMore').addEventListener('click',() => {

  );

});

/* LIBRARY */

const HEART_SVG = `
  <svg viewBox="0 0 24 24" fill="currentColor">
    <path d="M20.8 8.7c0 5.5-8.8 10.2-8.8 10.2S3.2 14.2 3.2 8.7A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.8 2.3Z"/>
  </svg>
`;

function setLibraryView(view) {

  libraryView = view;

  renderLibrary();

  window.scrollTo(0,0);

}

function makeFolderCard(name,songs,onOpen) {

  const card = document.createElement('article');

  card.className = 'card';
  card.tabIndex = 0;

  const cover = document.createElement('div');

  cover.className = 'folder-cover';

  if (songs.length) {

    const quad = songs.length >= 4;

    cover.dataset.layout = quad ? 'quad' : 'single';

    songs.slice(0,quad ? 4 : 1).forEach(video => {

      const img = document.createElement('img');

      img.loading = 'lazy';
      img.alt = '';
      img.src = bestThumb(video);

      cover.appendChild(img);

    });

    const badge = document.createElement('div');

    badge.className = 'folder-badge';
    badge.innerHTML = HEART_SVG;

    cover.appendChild(badge);

  } else {

    const icon = document.createElement('div');

    icon.className = 'folder-empty-icon';
    icon.innerHTML = HEART_SVG;

    cover.appendChild(icon);

  }

  const title = document.createElement('div');

  title.className = 'title';
  title.textContent = name;

  const count = document.createElement('div');

  count.className = 'artist';
  count.textContent =
    songs.length + (songs.length === 1 ? ' song' : ' songs');

  card.append(cover,title,count);

  card.addEventListener('click',onOpen);

  card.addEventListener('keydown',e => {

    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      onOpen();
    }

  });

  return card;

}

function renderLibrary() {

  const songs = getLikedSongs();

  const folders = $('libraryFolders');
  const grid = $('libraryResults');

  const back = $('libraryBack');
  const title = $('libraryTitle');
  const status = $('libraryStatus');

  if (libraryView === 'favourites') {

    folders.hidden = true;
    grid.hidden = false;

    back.hidden = false;

    title.textContent = 'Favourites';
    status.textContent = songs.length + ' Songs';

    grid.innerHTML = '';

    if (!songs.length) {

      grid.innerHTML = `
        <div class="empty">
          এখনো কোনো গান Favourite করা হয়নি।
          <br><br>
          গান শুনতে গিয়ে ❤️ বাটনে চাপ দাও।
        </div>
      `;

      return;

    }

    songs.forEach((video,index) => {

      grid.appendChild(
        makeCard(video,index,songs)
      );

    });

    return;

  }

  grid.hidden = true;
  folders.hidden = false;

  back.hidden = true;

  title.textContent = 'Library';
  status.textContent = '1 Folder';

  folders.innerHTML = '';

  folders.appendChild(
    makeFolderCard(
      'Favourites',
      songs,
      () => setLibraryView('favourites')
    )
  );

}

$('libraryBack').addEventListener('click',() => {
  setLibraryView('folders');
});

/* INITIALIZE */

updateIcons();
setProgressColor(0);
syncTint();

restoreHomeCache();

setupHomeObserver();

loadHome();

renderLibrary();

</script>
