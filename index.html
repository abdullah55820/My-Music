<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Apple Music Mobile</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #1c1c1e;
      --accent: #fa233b;
      --text-sub: #8e8e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: #fff;
      height: 100vh;
      overflow-y: auto;
      padding-bottom: 100px;
    }

    /* Mobile Header */
    .header {
      position: sticky;
      top: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 16px;
      z-index: 100;
    }

    .header h1 {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    /* Mobile Search Bar */
    .search-box {
      display: flex;
      align-items: center;
      background: #1c1c1e;
      padding: 10px 14px;
      border-radius: 10px;
      gap: 10px;
    }

    .search-box input {
      border: none;
      background: transparent;
      color: #fff;
      font-size: 16px;
      width: 100%;
      outline: none;
    }

    .search-box i {
      color: var(--text-sub);
    }

    /* Track Container */
    .content {
      padding: 16px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    /* Track Card */
    .track-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }

    .track-card:active {
      opacity: 0.6;
    }

    .track-info {
      display: flex;
      align-items: center;
      gap: 14px;
      overflow: hidden;
    }

    .track-info img {
      width: 54px;
      height: 54px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .meta {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist {
      font-size: 14px;
      color: var(--text-sub);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Apple Music Mobile Floating Bottom Player */
    .mobile-player {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      height: 64px;
      background: rgba(30, 30, 32, 0.9);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 1000;
    }

    .player-left {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 65%;
      overflow: hidden;
    }

    .player-left img {
      width: 44px;
      height: 44px;
      border-radius: 7px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    #yt-hidden-player {
      position: absolute;
      top: -9999px;
      left: -9999px;
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <div class="header">
    <h1>Listen Now</h1>
    <div class="search-box">
      <i data-lucide="search" size="18"></i>
      <input type="text" placeholder="Search YouTube Music..." id="searchInput">
    </div>
  </div>

  <!-- Main Playlist -->
  <div class="content">
    <div class="section-title">Recently Played</div>
    <div id="trackList"></div>
  </div>

  <!-- Bottom Mini Player -->
  <div class="mobile-player">
    <div class="player-left">
      <img id="pImg" src="https://via.placeholder.com/44" alt="cover">
      <div class="meta">
        <div class="title" id="pTitle">Not Playing</div>
        <div class="artist" id="pArtist">Select a song</div>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn" onclick="togglePlay()"><i data-lucide="play" fill="currentColor" id="playIcon" size="24"></i></button>
      <button class="ctrl-btn" onclick="nextSong()"><i data-lucide="skip-forward" fill="currentColor" size="24"></i></button>
    </div>
  </div>

  <div id="yt-hidden-player"><div id="player"></div></div>

  <script>
    lucide.createIcons();

    // Load YouTube API
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    var player;
    var isPlaying = false;
    var currentIndex = 0;

    const songs = [
      { id: "kJQP7kiw5Fk", title: "Despacito", artist: "Luis Fonsi ft. Daddy Yankee", img: "https://img.youtube.com/vi/kJQP7kiw5Fk/hqdefault.jpg" },
      { id: "JGwWNGJdvx8", title: "Shape of You", artist: "Ed Sheeran", img: "https://img.youtube.com/vi/JGwWNGJdvx8/hqdefault.jpg" },
      { id: "OPf0YbXqDM0", title: "Uptown Funk", artist: "Mark Ronson ft. Bruno Mars", img: "https://img.youtube.com/vi/OPf0YbXqDM0/hqdefault.jpg" }
    ];

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '0',
        width: '0',
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data == YT.PlayerState.PLAYING) {
        isPlaying = true;
        updateIcon(true);
      } else {
        isPlaying = false;
        updateIcon(false);
      }
    }

    function renderSongs() {
      const list = document.getElementById('trackList');
      list.innerHTML = '';
      songs.forEach((song, idx) => {
        const item = document.createElement('div');
        item.className = 'track-card';
        item.onclick = () => playSongIndex(idx);
        item.innerHTML = `
          <div class="track-info">
            <img src="${song.img}" alt="cover">
            <div class="meta">
              <div class="title">${song.title}</div>
              <div class="artist">${song.artist}</div>
            </div>
          </div>
          <i data-lucide="more-horizontal" size="18" style="color: var(--text-sub)"></i>
        `;
        list.appendChild(item);
      });
      lucide.createIcons();
    }

    function playSongIndex(index) {
      currentIndex = index;
      const song = songs[index];
      document.getElementById('pTitle').innerText = song.title;
      document.getElementById('pArtist').innerText = song.artist;
      document.getElementById('pImg').src = song.img;

      if (player && player.loadVideoById) {
        player.loadVideoById(song.id);
      }
    }

    function togglePlay() {
      if (!player) return;
      if (isPlaying) player.pauseVideo();
      else player.playVideo();
    }

    function updateIcon(playing) {
      const icon = document.getElementById('playIcon');
      if (playing) {
        icon.setAttribute('data-lucide', 'pause');
      } else {
        icon.setAttribute('data-lucide', 'play');
      }
      lucide.createIcons();
    }

    function nextSong() {
      if (currentIndex < songs.length - 1) playSongIndex(currentIndex + 1);
    }

    renderSongs();
  </script>
</body>
</html>
