<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>My Music Player</title>

<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">

<link rel="preload"
as="image"
href="background.jpg">

<link rel="apple-touch-icon"
sizes="180x180"
href="logo.png">

<link rel="icon"
type="image/png"
href="logo.png">


<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{

margin:0;

width:100%;
height:100%;

overflow:hidden;

background:#050505;

color:#fff;

font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
"Segoe UI",
sans-serif;

}

body{

position:relative;

overflow-x:hidden!important;

}


/* =================================================
   BACKGROUND
   ================================================= */

.bg{

position:fixed;

inset:0;

z-index:0;

background-image:url("background.jpg");

background-position:center center;

background-size:cover;

background-repeat:no-repeat;

transition:
filter .35s ease,
transform .35s ease;

}

.bg::after{

content:"";

position:absolute;

inset:0;

background:rgba(0,0,0,.15);

}


/* ONLY BACKGROUND BLURS WHEN VIDEO OPENS */

.bg.video-blur{

filter:blur(16px);

transform:scale(1.04);

}


/* =================================================
   TOP WIDGETS
   ================================================= */

.top-widgets{

position:fixed;

top:14px;

left:50%;

transform:translateX(-50%);

z-index:300;

display:flex;

flex-direction:column;

align-items:center;

gap:8px;

}


/* BD TIME */

.bd-time{

padding:5px 11px;

border-radius:20px;

background:rgba(0,0,0,.45);

border:1px solid rgba(255,255,255,.18);

color:rgba(255,255,255,.9);

font-size:11px;

font-weight:600;

letter-spacing:.3px;

backdrop-filter:blur(12px);

-webkit-backdrop-filter:blur(12px);

display:flex;

align-items:center;

gap:6px;

}


.live-dot{

width:7px;

height:7px;

background:#ff3b30;

border-radius:50%;

display:inline-block;

box-shadow:0 0 8px #ff3b30;

animation:pulse 1.5s infinite;

}


@keyframes pulse{

0%{
opacity:1;
transform:scale(1);
}

50%{
opacity:.3;
transform:scale(.8);
}

100%{
opacity:1;
transform:scale(1);
}

}


/* =================================================
   PLAYLIST BUTTON
   ================================================= */

.playlist-toggle-btn{

padding:5px 12px;

border-radius:20px;

background:rgba(0,0,0,.45);

border:1px solid rgba(255,255,255,.18);

color:rgba(255,255,255,.9);

font-size:11px;

font-weight:600;

backdrop-filter:blur(12px);

-webkit-backdrop-filter:blur(12px);

display:flex;

align-items:center;

gap:6px;

cursor:pointer;

transition:transform .2s;

}

.playlist-toggle-btn:active{

transform:scale(.95);

}

.playlist-toggle-btn svg{

width:14px;

height:14px;

fill:#fff;

}


/* =================================================
   HIDDEN AUDIO YOUTUBE
   ================================================= */

#yt{

position:fixed;

width:2px;

height:2px;

left:-20px;

bottom:-20px;

opacity:.01;

pointer-events:none;

}


/* =================================================
   APP
   ================================================= */

.app{

position:relative;

z-index:20;

height:100dvh;

width:100%;

display:flex;

align-items:flex-end;

justify-content:center;

padding:0 16px 65px;

}


/* =================================================
   MUSIC PLAYER
   ================================================= */

.player{

width:min(440px,94%);

height:120px;

padding:14px 18px;

border:1px solid rgba(255,255,255,.18);

border-radius:60px;

background:rgba(255,255,255,.06);

backdrop-filter:
blur(25px)
saturate(115%);

-webkit-backdrop-filter:
blur(25px)
saturate(115%);

box-shadow:
0 20px 50px rgba(0,0,0,.45);

display:flex;

align-items:center;

gap:12px;

position:relative;

overflow:hidden;

touch-action:pan-y;

}


/* =================================================
   COVER
   ================================================= */

.cover-wrapper{

position:relative;

width:84px;

height:84px;

flex-shrink:0;

display:flex;

align-items:center;

justify-content:center;

border-radius:50%;

overflow:hidden;

border:1px solid rgba(255,255,255,.3);

}

.cover{

width:137%;

height:137%;

margin:-18.5%;

border-radius:50%;

object-fit:cover;

object-position:center;

background:#222;

animation:spin 8s linear infinite;

animation-play-state:paused;

}

.cover-wrapper::after{

content:"";

position:absolute;

width:16px;

height:16px;

background:rgba(20,20,20,.85);

border:2px solid rgba(255,255,255,.3);

border-radius:50%;

left:50%;

top:50%;

transform:translate(-50%,-50%);

z-index:2;

}

.cover.spinning{

animation-play-state:running;

}

@keyframes spin{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}


/* =================================================
   SONG INFO
   ================================================= */

.middle{

flex:1;

min-width:0;

display:flex;

flex-direction:column;

justify-content:center;

}

.title{

font-size:16px;

font-weight:700;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

color:#fff;

letter-spacing:.2px;

}

.artist{

font-size:12px;

color:rgba(255,255,255,.65);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-top:2px;

margin-bottom:8px;

}


/* =================================================
   SEEK
   ================================================= */

.seek{

position:relative;

width:100%;

height:5px;

border-radius:10px;

background:rgba(255,255,255,.2);

cursor:pointer;

margin-bottom:6px;

touch-action:none;

user-select:none;

-webkit-user-select:none;

}

.seek::before{

content:"";

position:absolute;

top:-12px;

bottom:-12px;

left:-10px;

right:-10px;

z-index:1;

}

.fill{

position:absolute;

left:0;

top:0;

height:100%;

width:0;

background:#fff;

border-radius:10px;

pointer-events:none;

z-index:2;

}

.time-display{

font-size:11px;

color:rgba(255,255,255,.65);

font-variant-numeric:tabular-nums;

}


/* =================================================
   CONTROLS
   ================================================= */

.controls{

display:flex;

align-items:center;

gap:7px;

flex-shrink:0;

}


/* NORMAL BUTTON */

.btn{

width:30px;

height:30px;

border:0;

background:transparent;

color:#fff;

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

padding:0;

}


/* =================================================
   PLAY BUTTON
   ================================================= */

.play{

width:44px;

height:44px;

border-radius:50%;

border:0;

background:#fff;

color:#000;

display:flex;

align-items:center;

justify-content:center;

box-shadow:
0 4px 15px rgba(0,0,0,.3);

cursor:pointer;

flex-shrink:0;

}

.play svg{

width:20px;

height:20px;

fill:#000;

margin-left:2px;

}

.play.playing svg{

margin-left:0;

}


/* =================================================
   VIDEO BUTTON
   ================================================= */

.video-btn{

width:42px;

height:42px;

border-radius:14px;

border:1px solid rgba(255,255,255,.28);

background:
rgba(255,255,255,.12);

color:#fff;

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

backdrop-filter:blur(12px);

-webkit-backdrop-filter:blur(12px);

box-shadow:
0 5px 18px rgba(0,0,0,.25);

transition:
transform .2s,
background .2s;

flex-shrink:0;

}

.video-btn svg{

width:21px;

height:21px;

fill:#fff;

}

.video-btn.active{

background:
rgba(255,255,255,.24);

border-color:
rgba(255,255,255,.45);

}

.video-btn:active{

transform:scale(.90);

}


/* =================================================
   VOLUME
   ================================================= */

.vol-container{

display:flex;

align-items:center;

gap:4px;

background:rgba(0,0,0,.25);

border:1px solid rgba(255,255,255,.15);

padding:4px 6px;

border-radius:20px;

backdrop-filter:blur(10px);

-webkit-backdrop-filter:blur(10px);

}

.vol-slider-wrapper{

width:0;

overflow:hidden;

opacity:0;

display:flex;

align-items:center;

transition:
width .28s ease,
opacity .2s ease;

}

.vol-slider-wrapper.active{

width:55px;

opacity:1;

margin-left:2px;

}

.vol-slider{

-webkit-appearance:none;

appearance:none;

width:55px;

height:3.5px;

background:rgba(255,255,255,.3);

border-radius:10px;

outline:none;

}

.vol-slider::-webkit-slider-thumb{

-webkit-appearance:none;

appearance:none;

width:10px;

height:10px;

border-radius:50%;

background:#fff;

}

@supports (-webkit-touch-callout:none){

.vol-container{

display:none!important;

}

}


/* =================================================
   VIDEO POPUP
   ================================================= */

.video-popup{

position:fixed;

left:50%;

top:50%;

transform:
translate(-50%,-50%)
scale(.96);

width:min(665px,92vw);

aspect-ratio:16/9;

z-index:150;

display:none;

opacity:0;

pointer-events:none;

border-radius:24px;

overflow:hidden;

background:#000;

border:1px solid
rgba(255,255,255,.35);

box-shadow:
0 0 0 1px rgba(255,255,255,.08),
0 25px 70px rgba(0,0,0,.65);

transition:
opacity .25s ease,
transform .25s ease;

}

.video-popup.open{

display:block;

opacity:1;

transform:
translate(-50%,-50%)
scale(1);

pointer-events:none;

}


/*
   VERY IMPORTANT:
   video itself cannot be touched.
   Controller is used to close it.
*/

.video-popup iframe{

position:absolute;

inset:0;

width:100%;

height:100%;

border:0;

pointer-events:none;

}


/* =================================================
   PLAYLIST
   MUST STAY ABOVE VIDEO
   ================================================= */

.drawer-overlay{

position:fixed;

inset:0;

z-index:400;

background:transparent;

pointer-events:none;

display:none;

}

.drawer-overlay.active{

display:block;

pointer-events:auto;

}


/* DRAWER */

.playlist-drawer{

position:fixed;

top:0;

right:-100%;

width:170px;

height:100dvh;

background:
rgba(20,20,20,.38);

backdrop-filter:
blur(25px)
saturate(150%);

-webkit-backdrop-filter:
blur(25px)
saturate(150%);

border-left:
1px solid rgba(255,255,255,.15);

z-index:500;

transition:
right .35s cubic-bezier(.2,.8,.2,1);

display:flex;

flex-direction:column;

padding:12px 6px;

box-shadow:
-10px 0 30px rgba(0,0,0,.3);

visibility:hidden;

pointer-events:none;

}

.playlist-drawer.open{

right:0;

visibility:visible;

pointer-events:auto;

}


/* DRAWER HEADER */

.drawer-header{

display:flex;

align-items:center;

justify-content:space-between;

padding:6px 8px;

border-bottom:
1px solid rgba(255,255,255,.15);

margin-bottom:8px;

background:
rgba(255,255,255,.1);

border-radius:8px;

}

.drawer-title{

font-size:11px;

font-weight:700;

color:#fff;

}

.close-btn{

background:transparent;

border:0;

color:rgba(255,255,255,.9);

font-size:16px;

cursor:pointer;

padding:0 2px;

line-height:1;

}


/* SONG LIST */

.song-list{

flex:1;

overflow-y:auto;

display:flex;

flex-direction:column;

gap:4px;

padding-right:2px;

}

.song-list::-webkit-scrollbar{

width:2px;

}

.song-list::-webkit-scrollbar-thumb{

background:rgba(255,255,255,.3);

border-radius:3px;

}


/* SONG ITEM */

.song-item{

display:flex;

align-items:center;

gap:6px;

padding:4px 5px;

border-radius:7px;

background:
rgba(255,255,255,.08);

border:
1px solid rgba(255,255,255,.1);

cursor:pointer;

}

.song-item:active{

transform:scale(.96);

}

.song-item:hover,
.song-item.active{

background:
rgba(255,255,255,.22);

border-color:
rgba(255,255,255,.35);

}

.song-item img{

width:26px;

height:26px;

border-radius:5px;

object-fit:cover;

flex-shrink:0;

}

.song-item-info{

flex:1;

min-width:0;

}

.song-item-title{

font-size:9.5px;

font-weight:700;

color:#fff;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

}

.song-item-artist{

font-size:8px;

color:rgba(255,255,255,.55);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-top:.5px;

}


/* =================================================
   MOBILE
   ================================================= */

@media(max-width:480px){

.app{

padding-bottom:60px;

}

.player{

height:116px;

padding:12px 13px;

border-radius:58px;

gap:8px;

}

.cover-wrapper{

width:78px;

height:78px;

}

.title{

font-size:15px;

}

.artist{

font-size:11px;

}

.play{

width:42px;

height:42px;

}

.video-btn{

width:40px;

height:40px;

border-radius:13px;

}

.top-widgets{

top:10px;

}

.bd-time{

font-size:10px;

padding:4px 9px;

}

.playlist-toggle-btn{

font-size:10px;

padding:4px 9px;

}

.playlist-drawer{

width:170px;

}


/* VIDEO ON MOBILE */

.video-popup{

width:92vw;

border-radius:20px;

}

}


/* =================================================
   EXTRA SMALL
   ================================================= */

@media(max-width:380px){

.cover-wrapper{

width:70px;

height:70px;

}

.video-btn{

width:37px;

height:37px;

}

.play{

width:40px;

height:40px;

}

.player{

gap:6px;

padding-left:10px;

padding-right:10px;

}

}

</style>

</head>


<body>


<!-- BACKGROUND -->

<div
class="bg"
id="background"
></div>


<!-- =================================================
     TOP
     ================================================= -->

<div class="top-widgets">

<div class="bd-time">

<span>BD</span>

<span class="live-dot"></span>

<span id="bdTimeVal">
--:--:-- --
</span>

</div>


<button
class="playlist-toggle-btn"
onclick="toggleDrawer()"
>

<svg viewBox="0 0 24 24">

<path d="
M3 10h11v2H3zm0-4h11v2H3zm0 8h7v2H3zm13-1v8l6-4z
"/>

</svg>

<span>Playlist</span>

</button>

</div>


<!-- =================================================
     HIDDEN AUDIO YOUTUBE PLAYER
     ================================================= -->

<div id="yt"></div>


<!-- =================================================
     VIDEO POPUP
     NO CROSS HERE
     ================================================= -->

<div
class="video-popup"
id="videoPopup"
>

<div id="videoPlayer"></div>

</div>


<!-- =================================================
     PLAYLIST OVERLAY
     ================================================= -->

<div
class="drawer-overlay"
id="overlay"
onclick="toggleDrawer()"
></div>


<!-- =================================================
     PLAYLIST DRAWER
     ================================================= -->

<div
class="playlist-drawer"
id="drawer"
>

<div class="drawer-header">

<div class="drawer-title">
Playlist Songs
</div>

<button
class="close-btn"
onclick="toggleDrawer()"
>
&times;
</button>

</div>


<div
class="song-list"
id="songList"
>

<div
style="
text-align:center;
color:rgba(255,255,255,.7);
font-size:10px;
margin-top:15px;
"
>
Loading...
</div>

</div>

</div>


<!-- =================================================
     APP
     ================================================= -->

<div class="app">

<section
class="player"
id="playerCard"
>


<!-- COVER -->

<div class="cover-wrapper">

<img
id="cover"
class="cover"
src="logo.png"
alt="Album art"
>

</div>


<!-- INFO -->

<div class="middle">

<div
id="title"
class="title"
>
My Playlist
</div>

<div
id="artist"
class="artist"
>
YouTube Music
</div>


<div
class="seek"
id="seek"
>

<div
class="fill"
id="fill"
></div>

</div>


<div class="time-display">

<span id="current">
0:00
</span>

/

<span id="duration">
0:00
</span>

</div>

</div>


<!-- CONTROLS -->

<div class="controls">


<!-- PLAY -->

<button
class="play"
id="play"
onclick="togglePlay()"
>

<svg
id="play-icon"
viewBox="0 0 24 24"
>

<path d="M8 5v14l11-7z"/>

</svg>

<!-- VIDEO -->

<button
class="video-btn"
id="videoBtn"
onclick="toggleVideo()"
aria-label="Video"
>

<svg
id="videoIcon"
viewBox="0 0 24 24"
>

<!-- VIDEO CAMERA ICON -->

<path d="
M4 6
C2.9 6 2 6.9 2 8v8
c0 1.1.9 2 2 2h10
c1.1 0 2-.9 2-2v-1.2l3.3 2.4
c.7.5 1.7 0 1.7-.9V7.7
c0-.9-1-1.4-1.7-.9L16 9.2V8
c0-1.1-.9-2-2-2H4z
"/>

</svg>

<!-- VOLUME -->

<div class="vol-container">

<button
class="btn"
onclick="toggleVolume()"
>

<svg viewBox="0 0 24 24">

<path d="
M3 9v6h4l5 5V4L7 9H3
zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05
c1.48-.73 2.5-2.25 2.5-4.02z
M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71
v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z
"/>

</svg>

</button>


<div
class="vol-slider-wrapper"
id="volWrapper"
>

<input
type="range"
class="vol-slider"
id="volSlider"
min="0"
max="100"
value="100"
oninput="changeVolume(this.value)"
>

</div>

</div>


</div>

</section>

</div>


<script src="https://www.youtube.com/iframe_api"></script>
<script>

/* =================================================
   SETTINGS
   ================================================= */

const PLAYLIST_ID="PLbvY05KVYwoo";

let player=null;

let videoPlayer=null;

let playing=false;

let playlistItems=[];

let videoOpen=false;

let videoReady=false;


/* =================================================
   BD TIME
   ================================================= */

function updateBDTime(){

const options={

timeZone:"Asia/Dhaka",

hour:"2-digit",

minute:"2-digit",

second:"2-digit",

hour12:true

};

document.getElementById("bdTimeVal").textContent=

new Intl.DateTimeFormat(
"en-US",
options
).format(new Date());

}

updateBDTime();

setInterval(updateBDTime,1000);


/* =================================================
   YOUTUBE API
   ================================================= */

function onYouTubeIframeAPIReady(){

/* AUDIO PLAYER */

player=new YT.Player(
"yt",
{

width:"2",

height:"2",

playerVars:{

autoplay:0,

controls:0,

disablekb:1,

fs:0,

modestbranding:1,

playsinline:1,

rel:0,

listType:"playlist",

list:PLAYLIST_ID

},

events:{

onReady:audioReady,

onStateChange:audioState

}

});


/* VIDEO PLAYER */

videoPlayer=new YT.Player(
"videoPlayer",
{

width:"100%",

height:"100%",

playerVars:{

autoplay:0,

controls:0,

disablekb:1,

fs:0,

modestbranding:1,

playsinline:1,

rel:0,

iv_load_policy:3,

enablejsapi:1

},

events:{

onReady:videoReadyEvent

}

});

}


/* =================================================
   AUDIO READY
   ================================================= */

function audioReady(){

loadPlaylistItems();

setInterval(
updateProgress,
200
);

}


/* =================================================
   VIDEO READY
   ================================================= */

function videoReadyEvent(){

videoReady=true;

}


/* =================================================
   AUDIO STATE
   ================================================= */

function audioState(e){

const cover=
document.getElementById("cover");

const playBtn=
document.getElementById("play");

const playIcon=
document.getElementById("play-icon");


highlightActiveTrack();


if(e.data===YT.PlayerState.PLAYING){

playing=true;

playBtn.classList.add("playing");

playIcon.innerHTML=
'<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

cover.classList.add("spinning");

updateInfo();


/* IF VIDEO IS OPEN */

if(videoOpen){

startVideoAtAudioTime();

}

}


else if(

e.data===YT.PlayerState.PAUSED ||

e.data===YT.PlayerState.ENDED

){

playing=false;

playBtn.classList.remove("playing");

playIcon.innerHTML=
'<path d="M8 5v14l11-7z"/>';

cover.classList.remove("spinning");


/* PAUSE VIDEO TOO */

if(videoOpen && videoPlayer){

try{

videoPlayer.pauseVideo();

}catch(err){}

}

}

}


/* =================================================
   PLAY / PAUSE
   ================================================= */

function togglePlay(){

if(!player)
return;


if(playing){

player.pauseVideo();

}

else{

player.playVideo();

}

}


/* =================================================
   VIDEO TOGGLE
   ================================================= */

function toggleVideo(){

if(!player)
return;


if(videoOpen){

closeVideo();

}

else{

openVideo();

}

}


/* =================================================
   OPEN VIDEO
   ================================================= */

function openVideo(){

if(!player)
return;


const popup=
document.getElementById("videoPopup");

const bg=
document.getElementById("background");

const btn=
document.getElementById("videoBtn");

const icon=
document.getElementById("videoIcon");


videoOpen=true;


/* SHOW POPUP */

popup.classList.add("open");


/* ONLY BACKGROUND BLUR */

bg.classList.add("video-blur");


/* BUTTON ACTIVE */

btn.classList.add("active");


/* CHANGE ICON TO X */

icon.innerHTML=`

<path d="
M6.4 5L5 6.4
12.6 12
5 17.6
6.4 19

"/>

`;


/*
   Wait for popup to render,
   then sync exact audio time.
*/

setTimeout(()=>{

},250);

}


/* =================================================
   CLOSE VIDEO
   ================================================= */

function closeVideo(){

const popup=
document.getElementById("videoPopup");

const bg=
document.getElementById("background");

const btn=
document.getElementById("videoBtn");

const icon=
document.getElementById("videoIcon");


videoOpen=false;


/* STOP VIDEO */

if(videoPlayer){

try{

videoPlayer.stopVideo();

}catch(err){}

}


/* HIDE */

popup.classList.remove("open");


/* REMOVE ONLY BG BLUR */

bg.classList.remove("video-blur");


/* BUTTON */

btn.classList.remove("active");


/* VIDEO ICON AGAIN */

icon.innerHTML=`

<path d="
M4 6
C2.9 6 2 6.9 2 8v8
c0 1.1.9 2 2 2h10
c1.1 0 2-.9 2-2v-1.2l3.3 2.4
c.7.5 1.7 0 1.7-.9V7.7
c0-.9-1-1.4-1.7-.9L16 9.2V8
c0-1.1-.9-2-2-2H4z
"/>

`;

}


/* =================================================
   START VIDEO AT EXACT AUDIO TIME
   ================================================= */

function startVideoAtAudioTime(){

if(!videoPlayer)
return;

if(!videoReady)
return;

if(!player)
return;


try{

const videoId=
player.getVideoData().video_id;

const current=
player.getCurrentTime();


if(!videoId)
return;


/*
   Load SAME video.
   Then jump to SAME second.
*/

videoPlayer.loadVideoById({

videoId:videoId,

startSeconds:current

});


/*
   MUTE VIDEO
   Audio continues from hidden player.
*/

videoPlayer.mute();


/*
   Ensure video starts automatically.
*/

setTimeout(()=>{

if(!videoOpen)
return;

try{

videoPlayer.mute();

videoPlayer.playVideo();

}catch(err){}

},180);

}catch(err){}

}


/* =================================================
   KEEP VIDEO SYNCED
   ================================================= */

setInterval(()=>{

if(!videoOpen)
return;

if(!player || !videoPlayer)
return;

if(!playing)
return;

try{

const audioTime=
player.getCurrentTime();

const videoTime=
videoPlayer.getCurrentTime();


/*
   Correct only if drift is noticeable.
*/

if(
Math.abs(audioTime-videoTime)>0.45
){

videoPlayer.seekTo(
audioTime,
true
);

}

}catch(err){}

},700);


/* =================================================
   VOLUME
   ================================================= */

let volTimer=null;


function resetVolTimer(){

if(volTimer)
clearTimeout(volTimer);


volTimer=setTimeout(()=>{

document
.getElementById("volWrapper")
.classList.remove("active");

},3000);

}


function toggleVolume(){

const wrapper=
document.getElementById("volWrapper");


if(wrapper.classList.contains("active")){

wrapper.classList.remove("active");

if(volTimer)
clearTimeout(volTimer);

}

else{

wrapper.classList.add("active");

resetVolTimer();

}

}


function changeVolume(val){

if(
player &&
typeof player.setVolume==="function"
){

player.setVolume(val);

}

resetVolTimer();

}


/* =================================================
   NEXT
   ================================================= */

function nextSong(){

if(
!player ||
playlistItems.length===0
)
return;


const current=
player.getPlaylistIndex();


const next=
(current+1)%
playlistItems.length;


forceUpdateUI(next);

player.nextVideo();

}


/* =================================================
   PREVIOUS
   ================================================= */

function previousSong(){

if(
!player ||
playlistItems.length===0
)
return;


const current=
player.getPlaylistIndex();


const previous=
(current-1+
playlistItems.length)%
playlistItems.length;


forceUpdateUI(previous);

player.previousVideo();

}


/* =================================================
   FORCE UI
   ================================================= */

function forceUpdateUI(index){

if(!playlistItems[index])
return;


const id=
playlistItems[index];


document.getElementById("cover").src=

`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;


const title=
document.getElementById(`title-${index}`);

const artist=
document.getElementById(`artist-${index}`);


if(title){

document.getElementById("title")
.textContent=title.textContent;

}


if(artist){

document.getElementById("artist")
.textContent=artist.textContent;

}


/*
   If video is open,
   load the new song too.
*/

if(videoOpen){

setTimeout(()=>{

startVideoAtAudioTime();

},400);

}

}


/* =================================================
   SWIPE
   ================================================= */

let swipeStartX=0;

let swipeStartY=0;

let swipeActive=false;

let swipeFromSeek=false;


const playerCard=
document.getElementById("playerCard");


const seekElement=
document.getElementById("seek");


playerCard.addEventListener(
"pointerdown",
e=>{

swipeStartX=e.clientX;

swipeStartY=e.clientY;

swipeFromSeek=
!!e.target.closest("#seek");

swipeActive=true;

if(swipeFromSeek){

e.stopPropagation();

}

});


playerCard.addEventListener(
"pointermove",
e=>{

if(!swipeActive)
return;

if(swipeFromSeek){

e.stopPropagation();

}

});


playerCard.addEventListener(
"pointerup",
e=>{

if(!swipeActive)
return;


const dx=
e.clientX-swipeStartX;

const dy=
e.clientY-swipeStartY;


if(swipeFromSeek){

swipeActive=false;

return;

}


if(Math.abs(dx)<50){

swipeActive=false;

return;

}


if(Math.abs(dy)>Math.abs(dx)){

swipeActive=false;

return;

}


if(dx<-50){

nextSong();

}

else if(dx>50){

previousSong();

}


swipeActive=false;

});


playerCard.addEventListener(
"pointercancel",
()=>{

swipeActive=false;

});


/* =================================================
   SEEK
   ================================================= */

let isDragging=false;


function getSeekPosition(clientX){

const rect=
seekElement.getBoundingClientRect();


if(!rect.width)
return 0;


return Math.max(
0,
Math.min(
1,
(clientX-rect.left)/rect.width
)
);

}


function updateSeekVisual(pos){

document.getElementById("fill")
.style.width=
(pos*100)+"%";


if(
player &&
typeof player.getDuration==="function"
){

const duration=
player.getDuration();


if(duration){

document.getElementById("current")
.textContent=
format(pos*duration);

document.getElementById("duration")
.textContent=
format(duration);

}

}

}


/* SEEK DOWN */

seekElement.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

e.stopPropagation();

isDragging=true;

try{

seekElement.setPointerCapture(
e.pointerId
);

}catch(err){}


const pos=
getSeekPosition(e.clientX);

updateSeekVisual(pos);

},
{
passive:false
}
);


/* SEEK MOVE */

seekElement.addEventListener(
"pointermove",
e=>{

if(!isDragging)
return;

e.preventDefault();

e.stopPropagation();

const pos=
getSeekPosition(e.clientX);

updateSeekVisual(pos);

},
{
passive:false
}
);


/* SEEK UP */

seekElement.addEventListener(
"pointerup",
e=>{

if(!isDragging)
return;

e.preventDefault();

e.stopPropagation();


const pos=
getSeekPosition(e.clientX);


updateSeekVisual(pos);


if(player){

const duration=
player.getDuration();


if(duration){

player.seekTo(
pos*duration,
true
);


/*
   Keep video at same position.
*/

if(videoOpen && videoPlayer){

try{

videoPlayer.seekTo(
pos*duration,
true
);

}catch(err){}

}

}

}


isDragging=false;

try{

seekElement.releasePointerCapture(
e.pointerId
);

}catch(err){}

},
{
passive:false
}
);


/* =================================================
   PROGRESS
   ================================================= */

function updateProgress(){

if(isDragging)
return;


if(
!player ||
typeof player.getCurrentTime!=="function"
)
return;


try{

const current=
player.getCurrentTime();

const duration=
player.getDuration();


if(!duration)
return;


const pos=
Math.max(
0,
Math.min(
1,
current/duration
)
);


document.getElementById("fill")
.style.width=
(pos*100)+"%";


document.getElementById("current")
.textContent=
format(current);


document.getElementById("duration")
.textContent=
format(duration);

}catch(e){}

}


/* =================================================
   FORMAT
   ================================================= */

function format(s){

if(!s || isNaN(s))
return "0:00";


s=Math.floor(s);


return Math.floor(s/60)
+
":"
+
String(
s%60
).padStart(2,"0");

}


/* =================================================
   PLAYLIST
   ================================================= */

function loadPlaylistItems(){

if(
!player ||
typeof player.getPlaylist!=="function"
)
return;


playlistItems=
player.getPlaylist();


const list=
document.getElementById("songList");


if(
!playlistItems ||
playlistItems.length===0
){

list.innerHTML=`

<div style="
text-align:center;
color:rgba(255,255,255,.7);
font-size:10px;
margin-top:15px;
">

No tracks found

</div>

`;

return;

}


list.innerHTML="";


playlistItems.forEach(
(id,index)=>{

const item=
document.createElement("div");


item.className=
"song-item";


item.id=
`track-${index}`;


item.onclick=()=>{

playSpecificTrack(index);

};


item.innerHTML=`

<img
src="https://i.ytimg.com/vi/${id}/hqdefault.jpg"
alt="thumb"
>

<div class="song-item-info">

<div
class="song-item-title"
id="title-${index}"
>

Track #${index+1}

</div>

<div
class="song-item-artist"
id="artist-${index}"
>

YouTube Music

</div>

</div>

`;


list.appendChild(item);


fetchSongDetails(
id,
index
);

});


highlightActiveTrack();

updateInfo();

}


/* =================================================
   SONG DETAILS
   ================================================= */

function fetchSongDetails(
id,
index
){

fetch(
`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`
)

.then(r=>r.json())

.then(data=>{

if(!data)
return;


const title=
document.getElementById(
`title-${index}`
);

const artist=
document.getElementById(
`artist-${index}`
);


if(title && data.title){

title.textContent=
data.title;

}


if(artist && data.author_name){

artist.textContent=
data.author_name;

}

})

.catch(()=>{});

}


/* =================================================
   PLAY SPECIFIC
   ================================================= */

function playSpecificTrack(index){

if(!player)
return;


forceUpdateUI(index);


player.playVideoAt(index);


toggleDrawer();


/*
   If video was already open,
   sync it with selected song.
*/

if(videoOpen){

setTimeout(()=>{

startVideoAtAudioTime();

},600);

}

}


/* =================================================
   ACTIVE TRACK
   ================================================= */

function highlightActiveTrack(){

if(
!player ||
typeof player.getPlaylistIndex!=="function"
)
return;


const current=
player.getPlaylistIndex();


document
.querySelectorAll(".song-item")
.forEach(
(item,index)=>{

item.classList.toggle(
"active",
index===current
);

});

}


/* =================================================
   SONG INFO
   ================================================= */

function updateInfo(){

if(
!player ||
typeof player.getVideoData!=="function"
)
return;


try{

const d=
player.getVideoData();


if(!d || !d.video_id)
return;


document.getElementById("cover").src=

`https://i.ytimg.com/vi/${d.video_id}/hqdefault.jpg`;


if(d.title){

document.getElementById("title")
.textContent=d.title;

}


if(d.author){

document.getElementById("artist")
.textContent=d.author;

}

}catch(e){}

}


/* =================================================
   DRAWER
   ================================================= */

function toggleDrawer(){

const drawer=
document.getElementById("drawer");

const overlay=
document.getElementById("overlay");


drawer.classList.toggle("open");

overlay.classList.toggle("active");

}

</script>
