<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>My Music Player</title>

<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">

<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">

<style>

*{
box-sizing:border-box;
}

html,
body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#0a0a0c;
color:#f3f4f6;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

body{
position:relative;
overflow-x:hidden!important;
}

/* =========================================================
BACKGROUND
========================================================= */

.bg{
position:fixed;
inset:-20px;

background-image:url("background.jpg");
background-position:center center;
background-size:cover;
background-repeat:no-repeat;

z-index:0;
pointer-events:none;

filter: brightness(0.7);
}

.bg::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to bottom, rgba(10,10,12,0.6), rgba(10,10,12,0.85));
pointer-events:none;
}

body.popup-active .bg{
filter:blur(25px) brightness(0.5);
transform:scale(1.1);
}

/* =========================================================
TOP WIDGETS
========================================================= */

.top-widgets{
position:fixed;
top:16px;
left:50%;
transform:translateX(-50%);
z-index:2500;
display:flex;
flex-direction:row;
align-items:center;
gap:10px;
pointer-events:auto;
}

.bd-time{
padding:6px 14px;
border-radius:30px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.15);
color:#fff;
font-size:12px;
font-weight:500;
letter-spacing:.5px;
backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);
display:flex;
align-items:center;
gap:8px;
box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

.live-dot{
width:6px;
height:6px;
background:#10b981;
border-radius:50%;
box-shadow:0 0 10px #10b981;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{opacity:1;transform:scale(1);}
50%{opacity:.4;transform:scale(0.85);}
100%{opacity:1;transform:scale(1);}
}

.playlist-toggle-btn{
padding:6px 14px;
border-radius:30px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.15);
color:#fff;
font-size:12px;
font-weight:500;
backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);
display:flex;
align-items:center;
gap:6px;
cursor:pointer;
touch-action:manipulation;
-webkit-tap-highlight-color:transparent;
transition:all .25s ease;
box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

.playlist-toggle-btn:active{
transform:scale(.95);
background:rgba(255,255,255,.15);
}

.playlist-toggle-btn svg{
width:14px;
height:14px;
fill:#fff;
}

body.popup-active .playlist-toggle-btn{
display:none;
}

/* =========================================================
SPECTRUM VISUALIZER
========================================================= */

.spectrum-wrap{
position:fixed;
left:50%;
bottom:155px;
transform:translateX(-50%);
width:min(500px,70vw);
height:60px;
z-index:1500;
display:flex;
align-items:flex-end;
justify-content:center;
gap:3px;
pointer-events:none;
padding:0 10px;
}

.spectrum-bar{
width:4px;
height:4px;
border-radius:4px;
background:linear-gradient(to top, #6366f1, #a855f7, #ec4899);
box-shadow:0 0 8px rgba(168,85,247,0.4);
transform-origin:bottom;
transition:height 0.08s ease-out, opacity 0.15s ease;
}

.spectrum-wrap:not(.playing) .spectrum-bar{
height:4px!important;
opacity:0.2;
box-shadow:none;
}

@media(max-width:768px){
.spectrum-wrap{
display:none!important;
}
}

/* =========================================================
VIDEO OVERLAY & SECTION
========================================================= */

.video-overlay{
position:fixed;
inset:0;
z-index:1499;
display:none;
background:transparent;
pointer-events:none!important;
}

.video-overlay.active{
display:block;
}

.video-section{
position:fixed;
top:7%;
left:50%;
transform:translateX(-50%);
width:min(400px,92%);
z-index:1700;
display:flex;
flex-direction:column;
align-items:center;
pointer-events:none;
}

.video-popup{
position:relative;
width:100%;
aspect-ratio:16 / 9;
background:#000;
border-radius:20px;
overflow:hidden;
z-index:1701;
border:1px solid rgba(255,255,255,.15);
box-shadow:0 20px 40px rgba(0,0,0,0.6);
opacity:0;
visibility:hidden;
pointer-events:none;
transform:scale(.95);
transition:all .3s cubic-bezier(0.16, 1, 0.3, 1);
}

.video-popup.active{
opacity:1;
visibility:visible;
pointer-events:auto;
transform:scale(1);
}

#yt{
position:absolute;
inset:0;
width:100%;
height:100%;
border:0;
z-index:1702;
}

#yt iframe{
width:100%!important;
height:100%!important;
border:0;
}

.video-playlist{
width:100%;
margin-top:10px;
max-height:calc(100dvh - 380px);
padding:10px;
border-radius:16px;
background:rgba(18,18,22,.75);
border:1px solid rgba(255,255,255,.1);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
box-shadow:0 15px 35px rgba(0,0,0,0.5);
opacity:0;
visibility:hidden;
pointer-events:none;
position:relative;
z-index:1705;
overflow:hidden;
}

.video-playlist.active{
opacity:1;
visibility:visible;
pointer-events:auto;
}

.video-playlist-title{
font-size:11px;
font-weight:600;
color:rgba(255,255,255,.6);
padding:4px 6px 8px;
border-bottom:1px solid rgba(255,255,255,.08);
margin-bottom:6px;
text-transform:uppercase;
letter-spacing:1px;
}

.video-song-list{
width:100%;
height:calc(100% - 25px);
overflow-y:auto;
display:flex;
flex-direction:column;
gap:6px;
scrollbar-width:thin;
}

.video-song-list::-webkit-scrollbar{
width:3px;
}
.video-song-list::-webkit-scrollbar-thumb{
background:rgba(255,255,255,0.2);
border-radius:4px;
}

.video-song-item{
display:flex;
align-items:center;
gap:10px;
width:100%;
padding:8px;
border-radius:12px;
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.05);
cursor:pointer;
transition:all .2s ease;
}

.video-song-item:active{
transform:scale(0.98);
}

.video-song-item.active{
background:rgba(99,102,241,.15);
border-color:rgba(99,102,241,.4);
}

.video-song-item img{
width:40px;
height:40px;
border-radius:8px;
object-fit:cover;
}

.video-song-info{
flex:1;
min-width:0;
}

.video-song-title{
font-size:12px;
font-weight:600;
color:#fff;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.video-song-artist{
font-size:10px;
color:rgba(255,255,255,.5);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-top:2px;
}

/* =========================================================
APP & MUSIC PLAYER (FLOATING GLASS PILL DESIGN)
========================================================= */

.app{
position:relative;
z-index:1600;
height:100dvh;
width:100%;
display:flex;
align-items:flex-end;
justify-content:center;
padding:0 16px 28px;
}

.player{
width:min(420px,94%);
padding:16px 20px;
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
background:rgba(18, 18, 24, 0.65);
backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px);
box-shadow:0 25px 50px rgba(0,0,0,.6);
display:flex;
align-items:center;
gap:14px;
position:relative;
overflow:hidden;
transition:all .35s cubic-bezier(0.16, 1, 0.3, 1);
}

.cover-wrapper{
position:relative;
width:64px;
height:64px;
flex-shrink:0;
border-radius:16px;
overflow:hidden;
box-shadow:0 8px 20px rgba(0,0,0,0.4);
border:1px solid rgba(255,255,255,0.15);
}

.cover{
width:100%;
height:100%;
object-fit:cover;
}

.middle{
flex:1;
min-width:0;
display:flex;
flex-direction:column;
justify-content:center;
}

.title{
font-size:14px;
font-weight:600;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
color:#fff;
}

.artist{
font-size:11px;
color:rgba(255,255,255,.5);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-top:3px;
margin-bottom:10px;
}

.seek{
position:relative;
width:100%;
height:4px;
border-radius:10px;
background:rgba(255,255,255,.15);
cursor:pointer;
margin-bottom:6px;
touch-action:none;
}

.fill{
position:absolute;
left:0;
top:0;
height:100%;
width:0;
background:linear-gradient(to right, #6366f1, #ec4899);
border-radius:10px;
pointer-events:none;
}

.time-display{
font-size:10px;
color:rgba(255,255,255,.45);
font-variant-numeric:tabular-nums;
display:flex;
justify-content:space-between;
}

.controls{
display:flex;
align-items:center;
gap:10px;
flex-shrink:0;
}

.btn{
width:32px;
height:32px;
border:0;
background:transparent;
color:rgba(255,255,255,.8);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
border-radius:50%;
transition:background .2s;
}

.btn:hover{
background:rgba(255,255,255,.08);
}

.btn svg{
width:18px;
height:18px;
fill:#fff;
}

.play{
width:42px;
height:42px;
border-radius:50%;
border:0;
background:linear-gradient(135deg, #6366f1, #a855f7);
color:#fff;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 8px 20px rgba(99,102,241,.4);
cursor:pointer;
flex-shrink:0;
transition:transform .2s;
}

.play svg{
width:18px;
height:18px;
fill:#fff;
margin-left:1px;
}

.play.playing svg{
margin-left:0;
}

.play:active, .btn:active{
transform:scale(.92);
}

/* VOLUME */
.vol-container{
display:flex;
align-items:center;
position:relative;
}

.vol-slider-wrapper{
position:absolute;
right:40px;
background:rgba(20,20,28,0.9);
border:1px solid rgba(255,255,255,0.12);
padding:8px 12px;
border-radius:20px;
backdrop-filter:blur(15px);
display:none;
box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.vol-slider-wrapper.active{
display:flex;
align-items:center;
}

.vol-slider{
-webkit-appearance:none;
width:70px;
height:4px;
background:rgba(255,255,255,.2);
border-radius:10px;
outline:none;
}

.vol-slider::-webkit-slider-thumb{
-webkit-appearance:none;
width:10px;
height:10px;
border-radius:50%;
background:#fff;
cursor:pointer;
}

@supports (-webkit-touch-callout:none){
.vol-container{display:none!important;}
}

/* =========================================================
DESKTOP VIEW STYLING
========================================================= */

@media(min-width:769px){
.app{
justify-content:center;
padding:0 40px 30px;
}
.player{
width:min(480px,40vw);
}
.video-section{
position:fixed;
top:5vh;
right:4vw;
left:auto;
transform:none;
width:min(500px,38vw);
height:90dvh;
}
body.popup-active .app{
justify-content:flex-start;
padding-left:40px;
}
body.popup-active .player{
transform:scale(0.95);
transform-origin:left bottom;
}
body.popup-active .video-section{
display:flex;
}
body.popup-active .video-popup{
width:100%;
aspect-ratio:16/9;
}
body.popup-active .video-playlist{
flex:1;
height:auto;
max-height:none;
}
body.popup-active .top-widgets{
left:calc(40px + 240px);
}
body.popup-active .spectrum-wrap{
left:calc(40px + 240px);
width:min(450px, 32vw);
}
}

/* =========================================================
DRAWER (SIDEBAR PLAYLIST)
========================================================= */

.drawer-overlay{
position:fixed;
inset:0;
z-index:9999;
background:rgba(0,0,0,0.4);
backdrop-filter:blur(5px);
display:none;
}

.drawer-overlay.active{
display:block;
}

.playlist-drawer{
position:fixed;
top:0;
right:-100%;
width:280px;
height:100dvh;
background:rgba(15,15,20,0.85)!important;
backdrop-filter:blur(30px)!important;
-webkit-backdrop-filter:blur(30px)!important;
border-left:1px solid rgba(255,255,255,.1)!important;
z-index:10000;
transition:right .35s cubic-bezier(0.16, 1, 0.3, 1);
display:flex;
flex-direction:column;
padding:16px 12px;
box-shadow:-20px 0 50px rgba(0,0,0,0.7)!important;
}

.playlist-drawer.open{
right:0;
}

.drawer-header{
display:flex;
align-items:center;
justify-content:space-between;
padding:8px 10px;
border-bottom:1px solid rgba(255,255,255,.1);
margin-bottom:12px;
}

.drawer-title{
font-size:13px;
font-weight:600;
color:#fff;
text-transform:uppercase;
letter-spacing:1px;
}

.close-btn{
background:transparent;
border:0;
color:rgba(255,255,255,.7);
font-size:20px;
cursor:pointer;
padding:0;
line-height:1;
}

.song-list{
flex:1;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:6px;
scrollbar-width:thin;
}

.song-list::-webkit-scrollbar{
width:3px;
}
.song-list::-webkit-scrollbar-thumb{
background:rgba(255,255,255,0.2);
border-radius:4px;
}

.song-item{
display:flex;
align-items:center;
gap:10px;
padding:8px 10px;
border-radius:12px;
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.05);
cursor:pointer;
transition:all .2s;
}

.song-item:active{
transform:scale(0.97);
}

.song-item:hover,
.song-item.active{
background:rgba(99,102,241,.18);
border-color:rgba(99,102,241,.4);
}

.song-item img{
width:36px;
height:36px;
border-radius:8px;
object-fit:cover;
}

.song-item-info{
flex:1;
min-width:0;
}

.song-item-title{
font-size:11.5px;
font-weight:600;
color:#fff;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.song-item-artist{
font-size:9.5px;
color:rgba(255,255,255,.5);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-top:2px;
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="top-widgets">
<div class="bd-time">
<span>BD</span>
<span class="live-dot"></span>
<span id="bdTimeVal">--:--:-- --</span>
</div>
<button class="playlist-toggle-btn" onclick="toggleDrawer()">
<svg viewBox="0 0 24 24"><path d="M3 10h11v2H3zm0-4h11v2H3zm0 8h7v2H3zm13-1v8l6-4z"/></svg>
<span>Playlist</span>
</button>
</div>

<div class="spectrum-wrap" id="spectrum" aria-hidden="true"></div>

<div id="videoOverlay" class="video-overlay"></div>

<div class="video-section" id="videoSection">
<div id="videoPopup" class="video-popup">
<div id="yt"></div>
</div>
<div id="videoPlaylist" class="video-playlist">
<div class="video-playlist-title">Playlist Songs</div>
<div class="video-song-list" id="videoSongList">
<div style="text-align:center;color:rgba(255,255,255,.5);font-size:11px;padding:15px;">Loading...</div>
</div>
</div>
</div>

<div class="drawer-overlay" id="overlay" onclick="toggleDrawer()"></div>
<div class="playlist-drawer" id="drawer">
<div class="drawer-header">
<div class="drawer-title">Playlist Songs</div>
<button class="close-btn" onclick="toggleDrawer()">&times;</button>
</div>
<div class="song-list" id="songList">
<div style="text-align:center;color:rgba(255,255,255,.5);font-size:11px;margin-top:20px;">Loading...</div>
</div>
</div>

<div class="app">
<section class="player" id="playerCard">
<div class="cover-wrapper">
<img id="cover" class="cover" src="logo.png" alt="Album art">
</div>
<div class="middle">
<div id="title" class="title">My Playlist</div>
<div id="artist" class="artist">YouTube Music</div>
<div class="seek" id="seek">
<div class="fill" id="fill"></div>
</div>
<div class="time-display">
<span id="current">0:00</span>
<span id="duration">0:00</span>
</div>
</div>
<div class="controls">
<button class="btn" id="videoToggleBtn" onclick="toggleVideoPopup()" title="Toggle Video">
<svg id="videoToggleIcon" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
</button>
<button class="play" id="play" onclick="togglePlay()">
<svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
</button>
<div class="vol-container">
<button class="btn" onclick="toggleVolume()">
<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
</button>
<div class="vol-slider-wrapper" id="volWrapper">
<input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="100" oninput="changeVolume(this.value)">
</div>
</div>
</div>
</section>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const PLAYLIST_ID="PLbvY05KVYwoo";
let player=null, playing=false, playlistItems=[], sortedPlaylistItems=[], sortedPlaylistData=[], currentSortedIndex=0, sortingReady=false, volTimer=null, isDragging=false, changingTrack=false;

function updateBDTime(){
const options={timeZone:"Asia/Dhaka",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true};
document.getElementById("bdTimeVal").textContent=new Intl.DateTimeFormat("en-US",options).format(new Date());
}
updateBDTime();
setInterval(updateBDTime,1000);

function buildSpectrum(){
const spectrum=document.getElementById("spectrum");
if(!spectrum)return;
spectrum.innerHTML="";
let count=window.innerWidth>=1600?72:window.innerWidth>=1200?60:48;
for(let i=0;i<count;i++){
const bar=document.createElement("div");
bar.className="spectrum-bar";
spectrum.appendChild(bar);
}
}
buildSpectrum();

let spectrumAnimation=null;
function animateSpectrum(){
if(!playing||window.innerWidth<769){
const spectrum=document.getElementById("spectrum");
if(spectrum)spectrum.classList.remove("playing");
return;
}
const spectrum=document.getElementById("spectrum");
if(!spectrum)return;
spectrum.classList.add("playing");
const bars=spectrum.querySelectorAll(".spectrum-bar");
const now=Date.now(), center=(bars.length-1)/2;
bars.forEach((bar,index)=>{
const distance=Math.abs(index-center)/center;
const wave=(Math.sin(now/100+index*.4)+1)/2;
let height=4+(1-distance)*35+wave*25+Math.random()*12;
bar.style.height=Math.min(50,height)+"px";
bar.style.opacity=String(.3+(1-distance)*.7);
});
spectrumAnimation=requestAnimationFrame(animateSpectrum);
}

function startSpectrum(){if(window.innerWidth<769)return;if(spectrumAnimation)cancelAnimationFrame(spectrumAnimation);animateSpectrum();}
function stopSpectrum(){if(spectrumAnimation){cancelAnimationFrame(spectrumAnimation);spectrumAnimation=null;}const spectrum=document.getElementById("spectrum");if(spectrum)spectrum.classList.remove("playing");}
window.addEventListener("resize",()=>{buildSpectrum();if(playing)startSpectrum();});

function onYouTubeIframeAPIReady(){
player=new YT.Player("yt",{width:"100%",height:"100%",playerVars:{autoplay:0,controls:1,disablekb:0,fs:1,modestbranding:1,playsinline:1,rel:0,iv_load_policy:3,listType:"playlist",list:PLAYLIST_ID},events:{onReady:ready,onStateChange:state}});
}

function ready(){loadPlaylistItems();setInterval(updateProgress,250);}

function state(e){
const playBtn=document.getElementById("play"), playIcon=document.getElementById("play-icon");
highlightActiveTrack(); highlightVideoActiveTrack();
if(e.data===YT.PlayerState.PLAYING){
playing=true; playBtn.classList.add("playing");
playIcon.innerHTML='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
startSpectrum(); updateInfo();
}else if(e.data===YT.PlayerState.PAUSED){
playing=false; playBtn.classList.remove("playing");
playIcon.innerHTML='<path d="M8 5v14l11-7z"/>'; stopSpectrum();
}else if(e.data===YT.PlayerState.ENDED){
playing=false; playBtn.classList.remove("playing");
playIcon.innerHTML='<path d="M8 5v14l11-7z"/>'; stopSpectrum();
if(!changingTrack)setTimeout(nextSong,100);
}
}

function togglePlay(){
if(!player)return;
try{playing?player.pauseVideo():player.playVideo();}catch(e){}
}

function toggleVideoPopup(){
const popup=document.getElementById("videoPopup"), overlay=document.getElementById("videoOverlay"), videoPlaylist=document.getElementById("videoPlaylist"), iconSvg=document.getElementById("videoToggleIcon"), opening=!popup.classList.contains("active");
if(opening){
popup.classList.add("active"); overlay.classList.add("active"); videoPlaylist.classList.add("active"); document.body.classList.add("popup-active");
iconSvg.innerHTML='<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>';
if(sortingReady&&sortedPlaylistData.length>0)renderVideoPlaylist();else loadPlaylistItems();
}else{
popup.classList.remove("active"); overlay.classList.remove("active"); videoPlaylist.classList.remove("active"); document.body.classList.remove("popup-active");
iconSvg.innerHTML='<path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>';
}
}

function resetVolTimer(){if(volTimer)clearTimeout(volTimer);volTimer=setTimeout(()=>{document.getElementById("volWrapper").classList.remove("active");},3000);}
function toggleVolume(){const w=document.getElementById("volWrapper");w.classList.contains("active")?w.classList.remove("active"):(w.classList.add("active"),resetVolTimer());}
function changeVolume(val){if(player&&typeof player.setVolume==="function")player.setVolume(val);resetVolTimer();}

function nextSong(){if(!player||sortedPlaylistItems.length===0)return;let currentId="";try{currentId=player.getVideoData()&&player.getVideoData().video_id;}catch(e){}if(currentId){const found=sortedPlaylistItems.indexOf(currentId);if(found!==-1)currentSortedIndex=found;}playSpecificTrack((currentSortedIndex+1)%sortedPlaylistItems.length);}

function getSeekPosition(clientX,el){const rect=el.getBoundingClientRect();return rect.width?Math.max(0,Math.min(1,(clientX-rect.left)/rect.width)):0;}
function updateSeekVisual(pos){
document.getElementById("fill").style.width=(pos*100)+"%";
if(player&&typeof player.getDuration==="function"){
const duration=player.getDuration();
if(duration){document.getElementById("current").textContent=format(pos*duration);document.getElementById("duration").textContent=format(duration);}
}
}

const seekElement=document.getElementById("seek");
seekElement.addEventListener("pointerdown",e=>{e.preventDefault();isDragging=true;try{seekElement.setPointerCapture(e.pointerId);}catch(err){}updateSeekVisual(getSeekPosition(e.clientX,seekElement));});
seekElement.addEventListener("pointermove",e=>{if(!isDragging)return;e.preventDefault();updateSeekVisual(getSeekPosition(e.clientX,seekElement));});
seekElement.addEventListener("pointerup",e=>{if(!isDragging)return;e.preventDefault();const pos=getSeekPosition(e.clientX,seekElement);updateSeekVisual(pos);if(player&&typeof player.getDuration==="function"){const duration=player.getDuration();if(duration)player.seekTo(pos*duration,true);}isDragging=false;try{seekElement.releasePointerCapture(e.pointerId);}catch(err){}});

function updateProgress(){
if(isDragging)return;
if(!player||typeof player.getCurrentTime!=="function")return;
try{
const current=player.getCurrentTime(), duration=player.getDuration();
if(!duration)return;
const pos=Math.max(0,Math.min(1,current/duration));
document.getElementById("fill").style.width=(pos*100)+"%";
document.getElementById("current").textContent=format(current);
document.getElementById("duration").textContent=format(duration);
}catch(e){}
}

function format(s){if(!s||isNaN(s))return "0:00";s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}

function loadPlaylistItems(){
if(!player||typeof player.getPlaylist!=="function")return;
const ids=player.getPlaylist();
if(!ids||ids.length===0){setTimeout(loadPlaylistItems,600);return;}
playlistItems=ids; sortedPlaylistItems=[]; sortedPlaylistData=[]; sortingReady=false;
const requests=playlistItems.map((id,index)=>fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`).then(r=>r.json()).then(data=>({id:id,title:(data&&data.title)?data.title:`Track #${index+1}`,artist:(data&&data.author_name)?data.author_name:"YouTube Music",originalIndex:index})).catch(()=>({id:id,title:`Track #${index+1}`,artist:"YouTube Music",originalIndex:index})));
Promise.all(requests).then(results=>{
results.sort((a,b)=>a.title.localeCompare(b.title,undefined,{numeric:true,sensitivity:"base"}));
sortedPlaylistData=results; sortedPlaylistItems=results.map(item=>item.id); sortingReady=true;
let currentId="";try{currentId=player.getVideoData()&&player.getVideoData().video_id;}catch(e){}
if(currentId){const idx=sortedPlaylistItems.indexOf(currentId);if(idx!==-1)currentSortedIndex=idx;}
renderSortedPlaylists(); highlightActiveTrack(); highlightVideoActiveTrack(); updateInfo();
});
}

function renderSortedPlaylists(){renderMainPlaylist();renderVideoPlaylist();}

function renderMainPlaylist(){
const list=document.getElementById("songList"); list.innerHTML="";
sortedPlaylistData.forEach((data,index)=>{
const item=document.createElement("div"); item.className="song-item"; item.id=`track-${index}`;
item.onclick=()=>playSpecificTrack(index);
item.innerHTML=`<img src="https://i.ytimg.com/vi/${data.id}/hqdefault.jpg" alt="thumb"><div class="song-item-info"><div class="song-item-title">${escapeHtml(data.title)}</div><div class="song-item-artist">${escapeHtml(data.artist)}</div></div>`;
list.appendChild(item);
});
}

function renderVideoPlaylist(){
const list=document.getElementById("videoSongList");
if(!sortedPlaylistData||sortedPlaylistData.length===0){list.innerHTML=`<div style="text-align:center;color:rgba(255,255,255,.5);font-size:11px;padding:15px;">Loading...</div>`;return;}
list.innerHTML="";
sortedPlaylistData.forEach((data,index)=>{
const item=document.createElement("div"); item.className="video-song-item"; item.id=`video-track-${index}`;
item.addEventListener("click",e=>{e.preventDefault();playSpecificTrack(index);});
item.innerHTML=`<img src="https://i.ytimg.com/vi/${data.id}/hqdefault.jpg" alt="thumb"><div class="video-song-info"><div class="video-song-title">${escapeHtml(data.title)}</div><div class="video-song-artist">${escapeHtml(data.artist)}</div></div>`;
list.appendChild(item);
});
highlightVideoActiveTrack();
}

function escapeHtml(text){if(!text)return "";const div=document.createElement("div");div.textContent=text;return div.innerHTML;}

function playSpecificTrack(index){
if(!player||!sortedPlaylistData[index])return;
const data=sortedPlaylistData[index]; currentSortedIndex=index; forceUpdateUI(index); changingTrack=true;
try{player.loadVideoById(data.id);}catch(e){changingTrack=false;return;}
setTimeout(()=>{changingTrack=false;},700);
document.getElementById("drawer").classList.remove("open");
document.getElementById("overlay").classList.remove("active");
highlightActiveTrack(); highlightVideoActiveTrack();
}

function forceUpdateUI(index){
if(!sortedPlaylistData[index])return;
const data=sortedPlaylistData[index];
document.getElementById("cover").src=`https://i.ytimg.com/vi/${data.id}/hqdefault.jpg`;
document.getElementById("title").textContent=data.title||"YouTube Music";
document.getElementById("artist").textContent=data.artist||"YouTube Music";
currentSortedIndex=index;
highlightActiveTrack(); highlightVideoActiveTrack();
}

function highlightActiveTrack(){
if(!player||sortedPlaylistItems.length===0)return;
let currentId="";try{currentId=player.getVideoData()&&player.getVideoData().video_id;}catch(e){}
document.querySelectorAll(".song-item").forEach((item,index)=>{item.classList.toggle("active",sortedPlaylistItems[index]===currentId);});
}

function highlightVideoActiveTrack(){
if(!player||sortedPlaylistItems.length===0)return;
let currentId="";try{currentId=player.getVideoData()&&player.getVideoData().video_id;}catch(e){}
document.querySelectorAll(".video-song-item").forEach((item,index)=>{item.classList.toggle("active",sortedPlaylistItems[index]===currentId);});
}

function updateInfo(){
if(!player||typeof player.getVideoData!=="function")return;
try{
const d=player.getVideoData();
if(!d||!d.video_id)return;
document.getElementById("cover").src=`https://i.ytimg.com/vi/${d.video_id}/hqdefault.jpg`;
if(d.title)document.getElementById("title").textContent=d.title;
if(d.author)document.getElementById("artist").textContent=d.author;
const sortedIndex=sortedPlaylistItems.indexOf(d.video_id);
if(sortedIndex!==-1)currentSortedIndex=sortedIndex;
highlightActiveTrack(); highlightVideoActiveTrack();
}catch(e){}
}

function toggleDrawer(){
const popup=document.getElementById("videoPopup");if(popup&&popup.classList.contains("active"))return;
const drawer=document.getElementById("drawer"), overlay=document.getElementById("overlay"), opening=!drawer.classList.contains("open");
drawer.classList.toggle("open",opening); overlay.classList.toggle("active",opening);
if(opening&&!sortingReady)loadPlaylistItems();
}
</script>
</body>
</html>
