<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>My Music Player</title>
<style>
*{box-sizing:border-box}
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#050505;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}
body{position:relative}
/* BACKGROUND */
.bg{
position:fixed;
inset:0;
width:100%;
height:100%;
background-image:url("background.jpg");
background-position:center center;
background-size:cover;
background-repeat:no-repeat;
z-index:0;
}
.bg:after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,.18);
}
/* BD LIVE TIME */
.bd-time{
position:fixed;
top:14px;
left:50%;
transform:translateX(-50%);
z-index:10;
padding:5px 11px;
border-radius:20px;
background:rgba(0,0,0,.45);
border:1px solid rgba(255,255,255,.18);
color:rgba(255,255,255,.9);
font-size:11px;
font-weight:600;
letter-spacing:.3px;
backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
display:flex;
align-items:center;
gap:6px;
}
.live-dot{
width:7px;
height:7px;
background-color:#ff3b30;
border-radius:50%;
display:inline-block;
box-shadow:0 0 8px #ff3b30;
animation:pulse 1.5s infinite;
}
@keyframes pulse{
0%{opacity:1;transform:scale(1)}
50%{opacity:.3;transform:scale(.8)}
100%{opacity:1;transform:scale(1)}
}
/* YOUTUBE */
#yt{
position:fixed;
width:2px;
height:2px;
left:-10px;
bottom:-10px;
opacity:.01;
pointer-events:none;
}
/* APP */
.app{
position:relative;
z-index:2;
height:100dvh;
width:100%;
display:flex;
align-items:flex-end;
justify-content:center;
padding:0 14px 58px;
}
/* PLAYER */
.player{
width:min(520px,100%);
height:132px;
padding:14px 18px 14px 14px;
border:1px solid rgba(255,255,255,.2);
border-radius:66px;
background:rgba(40,25,20,.72);
box-shadow:0 20px 50px rgba(0,0,0,.6);
backdrop-filter:blur(25px) saturate(130%);
-webkit-backdrop-filter:blur(25px) saturate(130%);
display:flex;
align-items:center;
gap:16px;
transform:translateY(-10px);
}
/* THUMBNAIL */
.cover-wrapper{
position:relative;
width:82px;
height:82px;
flex-shrink:0;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
overflow:hidden;
}
.cover{
width:137%;
height:137%;
margin:-18.5%;
border-radius:50%;
object-fit:cover;
object-position:center;
background:#222;
box-shadow:0 4px 15px rgba(0,0,0,.4);
animation:spin 8s linear infinite;
animation-play-state:paused;
}
.cover-wrapper::after{
content:"";
position:absolute;
width:17px;
height:17px;
background:rgba(20,20,20,.85);
border:2px solid rgba(255,255,255,.3);
border-radius:50%;
left:50%;
top:50%;
transform:translate(-50%,-50%);
z-index:2;
}
.cover.spinning{
animation-play-state:running;
}
@keyframes spin{
from{transform:rotate(0deg)}
to{transform:rotate(360deg)}
}
/* SONG INFO */
.middle{
flex:1;
min-width:0;
display:flex;
flex-direction:column;
justify-content:center;
}
.title{
font-size:18px;
font-weight:700;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
color:#fff;
}
.artist{
font-size:15px;
color:rgba(255,255,255,.65);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-top:2px;
margin-bottom:9px;
}
/* SEEK BAR */
.seek{
position:relative;
width:100%;
height:6px;
border-radius:10px;
background:rgba(255,255,255,.2);
cursor:pointer;
margin-bottom:8px;
}
.fill{
position:absolute;
left:0;
top:0;
height:100%;
width:0;
background:#fff;
border-radius:10px;
}
.time-display{
font-size:13px;
color:rgba(255,255,255,.6);
font-variant-numeric:tabular-nums;
}
/* CONTROLS */
.controls{
display:flex;
align-items:center;
gap:14px;
flex-shrink:0;
}
.btn{
width:36px;
height:36px;
border:0;
background:transparent;
color:rgba(255,255,255,.9);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
padding:0;
transition:transform .1s;
}
.btn svg{
width:25px;
height:25px;
fill:#fff;
}
/* PLAY */
.play{
width:60px;
height:60px;
border-radius:50%;
border:0;
background:#fff;
color:#000;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 4px 15px rgba(0,0,0,.3);
cursor:pointer;
}
.play svg{
width:25px;
height:25px;
fill:#000;
margin-left:3px;
}
.play.playing svg{
margin-left:0;
}
.btn:active,
.play:active{
transform:scale(.90);
}
/* MOBILE — SAME LARGE ELEMENTS */
@media(max-width:480px){
.player{
height:126px;
padding:12px 14px;
border-radius:63px;
gap:11px;
transform:translateY(-10px);
}
.cover-wrapper{
width:78px;
height:78px;
}
.cover-wrapper::after{
width:16px;
height:16px;
}
.title{
font-size:17px;
}
.artist{
font-size:14px;
margin-top:2px;
margin-bottom:8px;
}
.seek{
height:5px;
margin-bottom:7px;
}
.time-display{
font-size:12px;
}
.controls{
gap:8px;
}
.btn{
width:32px;
height:32px;
}
.btn svg{
width:23px;
height:23px;
}
.play{
width:56px;
height:56px;
}
.play svg{
width:23px;
height:23px;
}
.bd-time{
top:10px;
font-size:10px;
padding:4px 9px;
}
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="bd-time">
  <span>BD</span>
  <span class="live-dot"></span>
  <span id="bdTimeVal">--:--:-- --</span>
</div>
<div id="yt"></div>
<div class="app">
<section class="player">
<div class="cover-wrapper">
<img 
id="cover" 
class="cover" 
alt="Album art"
>
</div>
<div class="middle">
<div id="title" class="title">
Loading…
</div>
<div id="artist" class="artist">
YouTube Playlist
</div>
<div
class="seek"
id="seek"
onclick="seek(event)"
>
<div
class="fill"
id="fill">
</div>
</div>
<div class="time-display">
<span id="current">0:00</span>
/
<span id="duration">0:00</span>
</div>
</div>
<div class="controls">
<button 
class="btn" 
onclick="previousSong()" 
aria-label="Previous"
>
<svg viewBox="0 0 24 24">
<path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
</svg>
</button>
<button 
class="play" 
id="play" 
onclick="togglePlay()" 
aria-label="Play"
>
<svg 
id="play-icon" 
viewBox="0 0 24 24"
>
<path d="M8 5v14l11-7z"/>
</svg>
</button>
<button 
class="btn" 
onclick="nextSong()" 
aria-label="Next"
>
<svg viewBox="0 0 24 24">
<path d="M6 18l8.5-6L6 6v12zM16 6v12h-2V6h2z"/>
</svg>
</button>
</div>
</section>
</div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const PLAYLIST_ID="PLbvY05KVYwoo";
let player=null;
let playing=false;
/* BD TIME */
function updateBDTime(){
const options={
timeZone:'Asia/Dhaka',
hour:'2-digit',
minute:'2-digit',
second:'2-digit',
hour12:true
};
const timeString=
new Intl.DateTimeFormat(
'en-US',
options
).format(new Date());
document.getElementById(
"bdTimeVal"
).textContent=timeString;
}
updateBDTime();
setInterval(
updateBDTime,
1000
);
/* YOUTUBE API */
function onYouTubeIframeAPIReady(){
player=new YT.Player(
"yt",
{
width:"2",
height:"2",
playerVars:{
autoplay:0,
controls:0,
disablekb:1,
fs:0,
modestbranding:1,
playsinline:1,
rel:0,
listType:"playlist",
list:PLAYLIST_ID
},
events:{
onReady:ready,
onStateChange:state
}
});
}
/* READY */
function ready(){
setTimeout(
updateInfo,
700
);
setInterval(
updateProgress,
400
);
}
/* STATE */
function state(e){
const cover=
document.getElementById("cover");
const playBtn=
document.getElementById("play");
const playIcon=
document.getElementById("play-icon");
if(e.data===YT.PlayerState.PLAYING){
playing=true;
playBtn.classList.add(
"playing"
);
playIcon.innerHTML=
'<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
cover.classList.add(
"spinning"
);
updateInfo();
}
else if(
e.data===YT.PlayerState.PAUSED ||
e.data===YT.PlayerState.ENDED
){
playing=false;
playBtn.classList.remove(
"playing"
);
playIcon.innerHTML=
'<path d="M8 5v14l11-7z"/>';
cover.classList.remove(
"spinning"
);
}
}
/* PLAY / PAUSE */
function togglePlay(){
if(!player)return;
if(playing){
player.pauseVideo();
}else{
player.playVideo();
}
}
/* NEXT */
function nextSong(){
if(!player)return;
player.nextVideo();
}
/* PREVIOUS */
function previousSong(){
if(!player)return;
player.previousVideo();
}
/* SONG INFO */
function updateInfo(){
if(
!player ||
typeof player.getVideoData!=="function"
)return;
try{
const d=
player.getVideoData();
if(
!d ||
!d.video_id
)return;
const id=
d.video_id;
const thumb=
"https://i.ytimg.com/vi/"
+
id
+
"/hqdefault.jpg";
document.getElementById(
"cover"
).src=thumb;
document.getElementById(
"title"
).textContent=
d.title ||
"Unknown";
if(d.author){
document.getElementById(
"artist"
).textContent=
d.author;
}
}catch(e){}
}
/* PROGRESS */
function updateProgress(){
if(
!player ||
typeof player.getCurrentTime!=="function"
)return;
try{
const c=
player.getCurrentTime();
const d=
player.getDuration();
if(!d)return;
const p=
Math.max(
0,
Math.min(
100,
(c/d)*100
)
);
document.getElementById(
"fill"
).style.width=
p+"%";
document.getElementById(
"current"
).textContent=
format(c);
document.getElementById(
"duration"
).textContent=
format(d);
if(playing){
updateInfo();
}
}catch(e){}
}
/* SEEK */
function seek(e){
if(
!player ||
typeof player.getDuration!=="function"
)return;
const r=
document
.getElementById("seek")
.getBoundingClientRect();
const p=
Math.max(
0,
Math.min(
1,
(e.clientX-r.left)/r.width
)
);
player.seekTo(
p*player.getDuration(),
true
);
}
/* FORMAT */
function format(s){
if(
!s ||
isNaN(s)
){
return "0:00";
}
s=Math.floor(s);
return Math.floor(s/60)
+
":"
+
String(
s%60
).padStart(
2,
"0"
);
}
</script>
</body>
</html>
