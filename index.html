<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>My Music Player</title>

<link rel="preconnect" href="https://api.jamendo.com">
<link rel="preconnect" href="https://prod-1.storage.jamendo.com">

<link rel="preload" as="image" href="background.jpg">

<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#050505;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
"Segoe UI",sans-serif;
}

body{
position:relative;
overflow-x:hidden!important;
}

/* BACKGROUND */

.bg{
position:fixed;
inset:0;
background-image:url("background.jpg");
background-position:center center;
background-size:cover;
background-repeat:no-repeat;
z-index:0;
}

.bg:after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,.15);
}

/* TOP */

.top-widgets{
position:fixed;
top:14px;
left:50%;
transform:translateX(-50%);
z-index:10;

display:flex;
flex-direction:column;
align-items:center;
gap:8px;
}

/* BD TIME */

.bd-time{
padding:5px 11px;
border-radius:20px;

background:rgba(0,0,0,.45);
border:1px solid rgba(255,255,255,.18);

color:rgba(255,255,255,.9);
font-size:11px;
font-weight:600;
letter-spacing:.3px;

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);

display:flex;
align-items:center;
gap:6px;
}

.live-dot{
width:7px;
height:7px;
background:#ff3b30;
border-radius:50%;
display:inline-block;

box-shadow:0 0 8px #ff3b30;

animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%{opacity:1;transform:scale(1)}
50%{opacity:.3;transform:scale(.8)}
100%{opacity:1;transform:scale(1)}
}

/* PLAYLIST BUTTON */

.playlist-toggle-btn{
padding:5px 12px;
border-radius:20px;

background:rgba(0,0,0,.45);
border:1px solid rgba(255,255,255,.18);

color:rgba(255,255,255,.9);
font-size:11px;
font-weight:600;

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);

display:flex;
align-items:center;
gap:6px;

cursor:pointer;
transition:transform .2s,background .2s;
}

.playlist-toggle-btn:active{
transform:scale(.95);
}

.playlist-toggle-btn svg{
width:14px;
height:14px;
fill:#fff;
}

/* APP */

.app{
position:relative;
z-index:2;

height:100dvh;
width:100%;

display:flex;
align-items:flex-end;
justify-content:center;

padding:0 16px 65px;
}

/* PLAYER */

.player{
width:min(400px,92%);
height:120px;

padding:16px 20px;

border:1px solid rgba(255,255,255,.18);
border-radius:60px;

background:rgba(55,30,25,.75);

box-shadow:0 20px 50px rgba(0,0,0,.6);

backdrop-filter:blur(30px) saturate(140%);
-webkit-backdrop-filter:blur(30px) saturate(140%);

display:flex;
align-items:center;
gap:14px;
}

/* COVER */

.cover-wrapper{
position:relative;

width:88px;
height:88px;

flex-shrink:0;

display:flex;
align-items:center;
justify-content:center;

border-radius:50%;
overflow:hidden;

border:1px solid rgba(255,255,255,.3);
}

.cover{
width:137%;
height:137%;

margin:-18.5%;

border-radius:50%;

object-fit:cover;
object-position:center;

background:#222;

animation:spin 8s linear infinite;
animation-play-state:paused;
}

.cover-wrapper:after{
content:"";

position:absolute;

width:16px;
height:16px;

background:rgba(20,20,20,.85);

border:2px solid rgba(255,255,255,.3);

border-radius:50%;

left:50%;
top:50%;

transform:translate(-50%,-50%);

z-index:2;
}

.cover.spinning{
animation-play-state:running;
}

@keyframes spin{
from{transform:rotate(0deg)}
to{transform:rotate(360deg)}
}

/* INFO */

.middle{
flex:1;
min-width:0;

display:flex;
flex-direction:column;
justify-content:center;
}

.title{
font-size:16px;
font-weight:700;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

color:#fff;
}

.artist{
font-size:13.5px;

color:rgba(255,255,255,.65);

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

margin-top:2px;
margin-bottom:8px;
}

/* SEEK */

.seek{
position:relative;

width:100%;
height:4px;

border-radius:10px;

background:rgba(255,255,255,.2);

cursor:pointer;

margin-bottom:6px;
}

.fill{
position:absolute;

left:0;
top:0;

height:100%;
width:0;

background:#fff;

border-radius:10px;
}

.time-display{
font-size:12px;

color:rgba(255,255,255,.65);

font-variant-numeric:tabular-nums;
}

/* CONTROLS */

.controls{
display:flex;
align-items:center;
gap:10px;
flex-shrink:0;
}

.btn{
width:28px;
height:28px;

border:0;
background:transparent;

color:rgba(255,255,255,.9);

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;
padding:0;

transition:transform .1s;
}

.btn svg{
width:22px;
height:22px;
fill:#fff;
}

.play{
width:52px;
height:52px;

border-radius:50%;
border:0;

background:#fff;
color:#000;

display:flex;
align-items:center;
justify-content:center;

box-shadow:0 4px 15px rgba(0,0,0,.3);

cursor:pointer;
}

.play svg{
width:22px;
height:22px;

fill:#000;

margin-left:2px;
}

.play.playing svg{
margin-left:0;
}

.btn:active,
.play:active{
transform:scale(.90);
}

/* OVERLAY */

.drawer-overlay{
position:fixed;
inset:0;

z-index:99;

background:transparent!important;

pointer-events:none;
display:none;
}

.drawer-overlay.active{
display:block;
pointer-events:auto;
}

/* PLAYLIST */

.playlist-drawer{
position:fixed;

top:0;
right:-100%;

width:170px;
height:100dvh;

background:rgba(20,20,20,.35)!important;

backdrop-filter:blur(25px) saturate(150%)!important;
-webkit-backdrop-filter:blur(25px) saturate(150%)!important;

border-left:1px solid rgba(255,255,255,.15)!important;

z-index:100;

transition:right .35s cubic-bezier(.2,.8,.2,1);

display:flex;
flex-direction:column;

padding:12px 6px;

box-shadow:-10px 0 30px rgba(0,0,0,.3)!important;

visibility:hidden;
pointer-events:none;
}

.playlist-drawer.open{
right:0;

visibility:visible;
pointer-events:auto;
}

.drawer-header{
display:flex;
align-items:center;
justify-content:space-between;

padding:6px 8px;

border-bottom:1px solid rgba(255,255,255,.15);

margin-bottom:8px;

background:rgba(255,255,255,.1);

border-radius:8px;
}

.drawer-title{
font-size:11px;
font-weight:700;
color:#fff;

text-shadow:0 1px 2px rgba(0,0,0,.4);
}

.close-btn{
background:transparent;
border:0;

color:rgba(255,255,255,.9);

font-size:16px;

cursor:pointer;
padding:0 2px;

line-height:1;
}

.song-list{
flex:1;

overflow-y:auto;

display:flex;
flex-direction:column;

gap:4px;

padding-right:2px;
}

.song-list::-webkit-scrollbar{
width:2px;
}

.song-list::-webkit-scrollbar-thumb{
background:rgba(255,255,255,.3);
border-radius:3px;
}

/* SONG ITEM */

.song-item{
display:flex;
align-items:center;

gap:6px;

padding:4px 5px;

border-radius:7px;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.1);

cursor:pointer;

transition:
background .2s,
border-color .2s,
transform .1s;
}

.song-item:active{
transform:scale(.96);
}

.song-item:hover,
.song-item.active{
background:rgba(255,255,255,.22);
border-color:rgba(255,255,255,.35);
}

.song-item img{
width:26px;
height:26px;

border-radius:5px;

object-fit:cover;

flex-shrink:0;

box-shadow:0 2px 5px rgba(0,0,0,.3);
}

.song-item-info{
flex:1;
min-width:0;
}

.song-item-title{
font-size:9.5px;
font-weight:700;

color:#fff;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

letter-spacing:.2px;
}

.song-item-artist{
font-size:8px;
font-weight:400;

color:rgba(255,255,255,.55);

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

margin-top:.5px;
}

/* MOBILE */

@media(max-width:480px){

.app{
padding-bottom:60px;
}

.player{
height:116px;

padding:14px 16px;

border-radius:58px;

gap:12px;
}

.cover-wrapper{
width:82px;
height:82px;
}

.title{
font-size:15px;
}

.artist{
font-size:12.5px;
}

.play{
width:48px;
height:48px;
}

.btn{
width:26px;
height:26px;
}

.top-widgets{
top:10px;
}

.bd-time{
font-size:10px;
padding:4px 9px;
}

.playlist-toggle-btn{
font-size:10px;
padding:4px 9px;
}

.playlist-drawer{
width:170px;
}
}
</style>
</head>

<body>

<div class="bg"></div>

<!-- TOP -->

<div class="top-widgets">

  <div class="bd-time">
    <span>BD</span>
    <span class="live-dot"></span>
    <span id="bdTimeVal">--:--:-- --</span>
  </div>

  <button class="playlist-toggle-btn"
          onclick="toggleDrawer()">

    <svg viewBox="0 0 24 24">
      <path d="M3 10h11v2H3zm0-4h11v2H3zm0 8h7v2H3zm13-1v8l6-4z"/>
    </svg>

    <span>Playlist</span>

  </button>

</div>


<!-- PLAYLIST -->

<div class="drawer-overlay"
     id="overlay"
     onclick="toggleDrawer()">
</div>


<div class="playlist-drawer"
     id="drawer">

  <div class="drawer-header">

    <div class="drawer-title">
      Jamendo Songs
    </div>

    <button class="close-btn"
            onclick="toggleDrawer()">
      &times;
    </button>

  </div>

  <div class="song-list"
       id="songList">

    <div style="
      text-align:center;
      color:rgba(255,255,255,.7);
      font-size:10px;
      margin-top:15px;
    ">
      Loading...
    </div>

  </div>

</div>


<!-- PLAYER -->

<div class="app">

<section class="player">

  <div class="cover-wrapper">

    <img id="cover"
         class="cover"
         src="logo.png"
         alt="Album art">

  </div>


  <div class="middle">

    <div id="title"
         class="title">
      Jamendo Music
    </div>

    <div id="artist"
         class="artist">
      Loading...
    </div>


    <div class="seek"
         id="seek">

      <div class="fill"
           id="fill">
      </div>

    </div>


    <div class="time-display">

      <span id="current">
        0:00
      </span>

      /

      <span id="duration">
        0:00
      </span>

    </div>

  </div>


  <div class="controls">

    <button class="btn"
            onclick="previousSong()"
            aria-label="Previous">

      <svg viewBox="0 0 24 24">
        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
      </svg>

    </button>


    <button class="play"
            id="play"
            onclick="togglePlay()"
            aria-label="Play">

      <svg id="play-icon"
           viewBox="0 0 24 24">

        <path d="M8 5v14l11-7z"/>

      </svg>

    </button>


    <button class="btn"
            onclick="nextSong()"
            aria-label="Next">

      <svg viewBox="0 0 24 24">
        <path d="M6 18l8.5-6L6 6v12zM16 6v12h-2V6h2z"/>
      </svg>

    </button>

  </div>

</section>

</div>


<!-- NATIVE AUDIO -->

<audio id="audio"
       preload="metadata"
       playsinline>
</audio>


<script>

/* =========================================
   JAMENDO
========================================= */

const JAMENDO_CLIENT_ID = "709fa152";

/*
  TEST SEARCH

  Change this to:
  rock
  pop
  chillout
  electronic
  instrumental
  etc.
*/

const JAMENDO_TAG = "pop";


let playlist = [];
let currentIndex = 0;

const audio =
  document.getElementById("audio");


/* =========================================
   BANGLADESH TIME
========================================= */

function updateBDTime(){

  const options = {
    timeZone:"Asia/Dhaka",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hour12:true
  };

  const timeString =
    new Intl.DateTimeFormat(
      "en-US",
      options
    ).format(new Date());

  document.getElementById(
    "bdTimeVal"
  ).textContent = timeString;
}

updateBDTime();

setInterval(
  updateBDTime,
  1000
);


/* =========================================
   LOAD JAMENDO TRACKS
========================================= */

async function loadJamendo(){

  const list =
    document.getElementById("songList");

  try{

    const url =
      "https://api.jamendo.com/v3.0/tracks/?" +
      "client_id=" +
      encodeURIComponent(JAMENDO_CLIENT_ID) +
      "&format=json" +
      "&limit=20" +
      "&audioformat=mp32" +
      "&fuzzytags=" +
      encodeURIComponent(JAMENDO_TAG);

    const response =
      await fetch(url);

    if(!response.ok){
      throw new Error(
        "Jamendo API error"
      );
    }

    const data =
      await response.json();

    if(
      !data.results ||
      data.results.length === 0
    ){
      throw new Error(
        "No tracks found"
      );
    }


    playlist =
      data.results
      .filter(track => track.audio)
      .map(track => ({

        id:track.id,

        title:
          track.name ||
          "Unknown Track",

        artist:
          track.artist_name ||
          "Unknown Artist",

        audio:
          track.audio,

        cover:
          track.album_image ||
          track.image ||
          "logo.png",

        duration:
          Number(track.duration || 0)

      }));


    renderPlaylist();

    if(playlist.length > 0){

      loadSong(0, false);

    }

  }
  catch(error){

    console.error(error);

    list.innerHTML = `
      <div style="
        text-align:center;
        color:rgba(255,255,255,.75);
        font-size:10px;
        margin-top:15px;
        padding:10px;
      ">
        Could not load Jamendo songs.
      </div>
    `;

  }

}


/* =========================================
   RENDER PLAYLIST
========================================= */

function renderPlaylist(){

  const list =
    document.getElementById("songList");

  list.innerHTML = "";


  playlist.forEach(
    (song,index) => {

      const item =
        document.createElement("div");

      item.className =
        "song-item";

      item.id =
        "track-" + index;


      item.innerHTML = `

        <img
          src="${escapeHTML(song.cover)}"
          alt="cover">

        <div class="song-item-info">

          <div class="song-item-title">
            ${escapeHTML(song.title)}
          </div>

          <div class="song-item-artist">
            ${escapeHTML(song.artist)}
          </div>

        </div>

      `;


      item.onclick =
        () => {

          loadSong(index,true);

          toggleDrawer();

        };


      list.appendChild(item);

    }
  );


  highlightActiveTrack();

}


/* =========================================
   LOAD SONG
========================================= */

function loadSong(
  index,
  autoplay = true
){

  if(
    !playlist[index]
  ) return;


  currentIndex =
    index;


  const song =
    playlist[index];


  audio.src =
    song.audio;

  audio.load();


  document.getElementById(
    "title"
  ).textContent =
    song.title;


  document.getElementById(
    "artist"
  ).textContent =
    song.artist;


  document.getElementById(
    "cover"
  ).src =
    song.cover;


  document.getElementById(
    "current"
  ).textContent =
    "0:00";


  document.getElementById(
    "duration"
  ).textContent =
    format(song.duration);


  document.getElementById(
    "fill"
  ).style.width =
    "0%";


  highlightActiveTrack();


  setupMediaSession(song);


  if(autoplay){

    /*
      This happens after a user click,
      so iPhone is much more likely
      to allow playback.
    */

    audio.play()
      .catch(error => {

        console.log(
          "Playback waiting for user:",
          error
        );

      });

  }

}


/* =========================================
   PLAY / PAUSE
========================================= */

function togglePlay(){

  if(!audio.src){

    if(playlist.length){
      loadSong(
        currentIndex,
        true
      );
    }

    return;
  }


  if(audio.paused){

    audio.play()
      .catch(console.error);

  }
  else{

    audio.pause();

  }

}


/* =========================================
   NEXT
========================================= */

function nextSong(){

  if(!playlist.length)
    return;


  let next =
    currentIndex + 1;


  if(
    next >= playlist.length
  ){

    next = 0;

  }


  loadSong(
    next,
    true
  );

}


/* =========================================
   PREVIOUS
========================================= */

function previousSong(){

  if(!playlist.length)
    return;


  let previous =
    currentIndex - 1;


  if(previous < 0){

    previous =
      playlist.length - 1;

  }


  loadSong(
    previous,
    true
  );

}


/* =========================================
   AUDIO EVENTS
========================================= */

audio.addEventListener(
  "play",
  () => {

    setPlayingUI(true);

  }
);


audio.addEventListener(
  "pause",
  () => {

    setPlayingUI(false);

  }
);


audio.addEventListener(
  "ended",
  () => {

    nextSong();

  }
);


audio.addEventListener(
  "loadedmetadata",
  () => {

    document.getElementById(
      "duration"
    ).textContent =
      format(audio.duration);

  }
);


audio.addEventListener(
  "timeupdate",
  updateProgress
);


/* =========================================
   PLAYER UI
========================================= */

function setPlayingUI(isPlaying){

  const cover =
    document.getElementById("cover");

  const play =
    document.getElementById("play");

  const icon =
    document.getElementById("play-icon");


  if(isPlaying){

    cover.classList.add(
      "spinning"
    );

    play.classList.add(
      "playing"
    );


    icon.innerHTML =
      '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

  }
  else{

    cover.classList.remove(
      "spinning"
    );

    play.classList.remove(
      "playing"
    );


    icon.innerHTML =
      '<path d="M8 5v14l11-7z"/>';

  }

}


/* =========================================
   PROGRESS
========================================= */

function updateProgress(){

  if(
    !audio.duration ||
    isNaN(audio.duration)
  ) return;


  const percent =
    (
      audio.currentTime /
      audio.duration
    ) * 100;


  document.getElementById(
    "fill"
  ).style.width =
    Math.max(
      0,
      Math.min(
        100,
        percent
      )
    ) + "%";


  document.getElementById(
    "current"
  ).textContent =
    format(
      audio.currentTime
    );


  document.getElementById(
    "duration"
  ).textContent =
    format(
      audio.duration
    );


  updateMediaPosition();

}


/* =========================================
   SEEK
========================================= */

document.getElementById(
  "seek"
).addEventListener(
  "click",
  function(event){

    if(!audio.duration)
      return;


    const rect =
      this.getBoundingClientRect();


    const position =
      Math.max(
        0,
        Math.min(
          1,
          (
            event.clientX -
            rect.left
          ) /
          rect.width
        )
      );


    audio.currentTime =
      position *
      audio.duration;

  }
);


/* =========================================
   MEDIA SESSION
========================================= */

function setupMediaSession(song){

  if(
    !("mediaSession" in navigator)
  ) return;


  navigator.mediaSession.metadata =
    new MediaMetadata({

      title:
        song.title,

      artist:
        song.artist,

      album:
        "My Music Player",

      artwork:[
        {
          src:song.cover,
          sizes:"300x300",
          type:"image/jpeg"
        }
      ]

    });


  navigator.mediaSession.setActionHandler(
    "play",
    () => audio.play()
  );


  navigator.mediaSession.setActionHandler(
    "pause",
    () => audio.pause()
  );


  navigator.mediaSession.setActionHandler(
    "nexttrack",
    () => nextSong()
  );


  navigator.mediaSession.setActionHandler(
    "previoustrack",
    () => previousSong()
  );


  try{

    navigator.mediaSession.setActionHandler(
      "seekbackward",
      () => {

        audio.currentTime =
          Math.max(
            0,
            audio.currentTime - 10
          );

      }
    );


    navigator.mediaSession.setActionHandler(
      "seekforward",
      () => {

        audio.currentTime =
          Math.min(
            audio.duration,
            audio.currentTime + 10
          );

      }
    );

  }
  catch(e){}

}


/* =========================================
   MEDIA POSITION
========================================= */

function updateMediaPosition(){

  if(
    !("mediaSession" in navigator)
  ) return;


  if(
    !audio.duration ||
    isNaN(audio.duration)
  ) return;


  try{

    navigator.mediaSession.setPositionState({

      duration:
        audio.duration,

      playbackRate:
        audio.playbackRate,

      position:
        Math.min(
          audio.currentTime,
          audio.duration
        )

    });

  }
  catch(e){}

}


/* =========================================
   ACTIVE TRACK
========================================= */

function highlightActiveTrack(){

  document
    .querySelectorAll(".song-item")
    .forEach(
      (item,index) => {

        if(
          index === currentIndex
        ){

          item.classList.add(
            "active"
          );

        }
        else{

          item.classList.remove(
            "active"
          );

        }

      }
    );

}


/* =========================================
   DRAWER
========================================= */

function toggleDrawer(){

  const drawer =
    document.getElementById(
      "drawer"
    );

  const overlay =
    document.getElementById(
      "overlay"
    );


  if(
    drawer.classList.contains(
      "open"
    )
  ){

    drawer.classList.remove(
      "open"
    );

    overlay.classList.remove(
      "active"
    );

  }
  else{

    drawer.classList.add(
      "open"
    );

    overlay.classList.add(
      "active"
    );

  }

}


/* =========================================
   FORMAT
========================================= */

function format(seconds){

  if(
    !seconds ||
    isNaN(seconds)
  ){

    return "0:00";

  }


  seconds =
    Math.floor(seconds);


  return (
    Math.floor(
      seconds / 60
    )
    +
    ":"
    +
    String(
      seconds % 60
    ).padStart(2,"0")
  );

}


/* =========================================
   BASIC HTML ESCAPE
========================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}
