<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1e3a8a">
<title>SoundFlow — Music</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000;--surface:#1c1c1e;--surface-2:#2c2c2e;--text:#fff;--muted:#a1a1a8;
  --accent:#0a84ff;--accent-soft:rgba(10,132,255,.16);
  --glass:rgba(28,28,30,.55);--gb:20px;--r:16px;--cols:2;
  --gborder:rgba(255,255,255,.16);--gshadow:rgba(0,0,0,.45);
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#f2f2f7;--surface:#fff;--surface-2:#e5e5ea;--text:#000;--muted:#6c6c70;
  --gborder:rgba(255,255,255,.8);--gshadow:rgba(30,40,80,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);overscroll-behavior-y:none}
body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;min-height:100dvh}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
[hidden]{display:none!important}
svg{display:block}

.g{background:var(--glass);border:1px solid var(--gborder);backdrop-filter:blur(var(--gb)) saturate(180%);box-shadow:0 8px 24px var(--gshadow)}
#bg{position:fixed;inset:-120px -60px;z-index:-1;background-size:cover;background-position:center;transition:background .3s}

.header{max-width:1050px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 4px}
.brand{font-size:25px;font-weight:900;letter-spacing:-1px}
.brand span{color:var(--accent)}
.page{display:none}
.page.active{display:block}
.wrap{max-width:1050px;margin:auto;padding:12px 16px 190px}
.section{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0}
.pill{display:inline-flex;align-items:center;padding:7px 14px;border-radius:99px}
.pill h2{margin:0;font-size:17px;font-weight:750}
.status{color:var(--muted);font-size:12px;padding:6px 12px;border-radius:99px}
.back{width:30px;height:30px;margin-left:-8px;display:grid;place-items:center;color:var(--accent)}

.sbox{display:flex;align-items:center;gap:10px;height:52px;padding:0 8px 0 16px;border-radius:26px;margin:8px 0 14px}
.sbox input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:16px}
.sbox input::placeholder{color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:12px;width:100%}
.card{border-radius:var(--r);padding:9px;cursor:pointer;transition:transform .2s}
.card:active{transform:scale(.97)}
.thumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:calc(var(--r) - 4px);background:var(--surface-2)}
.title{font-size:13px;font-weight:650;line-height:1.4;margin:9px 2px 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.artist{font-size:11px;color:var(--muted);margin:0 2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{grid-column:1/-1;text-align:center;padding:34px 15px;border-radius:var(--r);color:var(--muted);font-size:13px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:99px;font-size:13px;font-weight:650;color:var(--muted);background:var(--glass);border:1px solid var(--gborder)}
.chip.on{color:var(--accent);background:var(--accent-soft)}

.nav{position:fixed;z-index:9000;left:0;right:0;margin:auto;width:min(calc(100% - 32px),520px);bottom:calc(env(safe-area-inset-bottom) + 10px);height:66px;padding:6px;display:flex;gap:4px;border-radius:34px}
.nb{flex:1;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:28px;color:var(--muted)}
.nb svg{width:23px;height:23px}
.nb span{font-size:10px;font-weight:650}
.nb.active{color:var(--accent);background:var(--accent-soft)}

.player{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 24px calc(env(safe-area-inset-bottom) + 18px);background:#161618;visibility:hidden;transform:translateY(100%);transition:transform .4s cubic-bezier(.32,.72,0,1),visibility 0s .4s}
.player.active{visibility:visible;transform:none;transition:transform .4s cubic-bezier(.32,.72,0,1)}
.pbg{position:absolute;inset:-150px;z-index:-1;object-fit:cover;filter:blur(55px);transform:scale(1.3);pointer-events:none}
.grab{width:100%;height:30px;display:grid;place-items:center}
.grab span{width:46px;height:5px;border-radius:3px;background:rgba(255,255,255,.55)}
.pc{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.art{width:min(100%,340px);aspect-ratio:1;margin:auto;overflow:hidden;border-radius:14px;box-shadow:0 20px 55px rgba(0,0,0,.5)}
.art img{width:100%;height:100%;object-fit:cover}
.meta{display:flex;justify-content:space-between;align-items:center}
.meta h3{margin:0 0 5px;font-size:20px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta p{margin:0;font-size:15px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seek{width:100%;height:6px;appearance:none;background:rgba(255,255,255,.3);border-radius:3px;outline:0}
.seek::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:#fff}
.trow{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.7)}
.ctr{display:flex;justify-content:center;align-items:center;gap:35px}
.cb{width:64px;height:64px;display:grid;place-items:center;color:#fff}
.cb svg{width:40px;height:40px}
.cb.big{width:80px;height:80px}
.cb.big svg{width:56px;height:56px}
.opts{display:flex;justify-content:space-around;padding:8px;border-radius:24px;background:rgba(255,255,255,.12);backdrop-filter:blur(20px)}
.opt{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff}
.opt svg{width:22px;height:22px}
.opt.on{background:#fff;color:#111}

.mini{position:fixed;z-index:9500;left:0;right:0;margin:auto;width:min(calc(100% - 32px),520px);bottom:calc(env(safe-area-inset-bottom) + 86px);min-height:68px;padding:9px 11px;display:flex;align-items:center;gap:11px;border-radius:22px;opacity:0;visibility:hidden;transform:translateY(35px);transition:.3s}
.mini.visible{opacity:1;visibility:visible;transform:none}
.mini img{width:47px;height:47px;border-radius:10px;object-fit:cover}
.mi{flex:1;min-width:0}
.mt{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ma{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sp{position:fixed;inset:0;z-index:12000;display:flex;flex-direction:column;background:var(--bg);transform:translate3d(100%,0,0);transition:transform .3s}
.sp.open{transform:translate3d(0,0,0)}
.sph{display:flex;align-items:center;justify-content:between;padding:calc(env(safe-area-inset-top) + 10px) 16px 8px}
.spb{flex:1;overflow-y:auto;padding:6px 16px 40px;max-width:560px;margin:auto;width:100%}
.sec{padding:16px;border-radius:22px;margin-bottom:14px}
.sec h3{margin:0 0 12px;font-size:12px;color:var(--muted);text-transform:uppercase}
.row{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--surface-2);border-radius:12px}
.seg button{padding:8px;border-radius:9px;color:var(--muted);font-size:12px;font-weight:700}
.seg button.on{background:var(--surface);color:var(--accent)}
#yt{position:fixed;opacity:0;pointer-events:none}
</style>
</head>
<body>

<div id="bg"></div>

<div class="header"><div class="brand">SOUND<span>FLOW</span></div></div>

<main class="page active" id="homePage">
  <div class="wrap">
    <div class="section"><span class="pill g"><h2>Home</h2></span><span class="status g" id="homeStatus">Discover</span></div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="homeGrid"></div>
  </div>
</main>

<main class="page" id="searchPage">
  <div class="wrap">
    <form class="sbox g" id="sForm">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
      <input id="q" type="search" placeholder="Songs, artists..." autocomplete="off">
    </form>
    <div class="grid" id="searchGrid"></div>
  </div>
</main>

<main class="page" id="libraryPage">
  <div class="wrap">
    <div class="section"><span class="pill g"><h2 id="libTitle">Library</h2></span></div>
    <div class="grid" id="libGrid"></div>
  </div>
</main>

<nav class="nav g">
  <button class="nb active" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 10 9-7 9 7v11H5z"/></svg><span>Home</span></button>
  <button class="nb" data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><span>Search</span></button>
  <button class="nb" data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v17H4z"/><path d="M8 4v17"/></svg><span>Library</span></button>
  <button class="nb" data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.6-4 3-6 7-6s6.4 2 7 6"/></svg><span>Profile</span></button>
</nav>

<section class="player" id="player">
  <img class="pbg" id="pBg" alt="">
  <button class="grab" id="minBtn"><span></span></button>
  <div class="pc">
    <div class="art"><img id="pThumb" alt=""></div>
    <div>
      <div class="meta"><div><h3 id="pTitle">Song</h3><p id="pArtist">Artist</p></div></div>
      <input type="range" id="seek" class="seek" min="0" max="100" value="0">
      <div class="trow"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="ctr">
      <button class="cb" id="prevBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 6v12L2 12zM21 6v12l-9-6z"/></svg></button>
      <button class="cb big" id="playBtn"><svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg></button>
      <button class="cb" id="nextBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6v12l9-6zM13 6v12l9-6z"/></svg></button>
    </div>
    <div class="opts">
      <button class="opt" id="shBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20l17-17M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
      <button class="opt" id="rpBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4M3 11v-1a4 4 0 014-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 01-4 4H3"/></svg></button>
    </div>
  </div>
</section>

<div class="mini g" id="mini">
  <img id="mThumb" alt="">
  <div class="mi"><div class="mt" id="mTitle">Song</div><div class="ma" id="mArtist">Artist</div></div>
  <button class="cb" id="mPlay" style="width:40px;height:40px"><svg id="mIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg></button>
</div>

<section class="sp" id="sp">
  <div class="sph"><button class="back" id="spBack">✕</button><h2>Settings</h2><div></div></div>
  <div class="spb">
    <div class="sec g">
      <h3>Theme</h3>
      <div class="seg" data-k="theme"><button data-v="system">System</button><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
    </div>
    <div class="sec g">
      <h3>Songs per Row</h3>
      <div class="seg" data-k="cols"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button></div>
    </div>
  </div>
</section>

<div id="yt"><div id="ytp"></div></div>

<script>
const $=id=>document.getElementById(id);
const LS={get:(k,d)=>JSON.parse(localStorage.getItem(k)||(d?JSON.stringify(d):'null')),set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};

let S=LS.get('sf_set',{theme:'system',cols:2});
function applySettings(){
  document.documentElement.dataset.theme=S.theme;
  document.documentElement.style.setProperty('--cols',S.cols);
  document.querySelectorAll('.seg').forEach(g=>{
    const k=g.dataset.k;
    g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',String(S[k])===b.dataset.v));
  });
}
applySettings();

document.querySelectorAll('.seg').forEach(g=>g.onclick=e=>{
  const b=e.target.closest('button');
  if(!b)return;
  S[g.dataset.k]=isNaN(b.dataset.v)?b.dataset.v:+b.dataset.v;
  LS.set('sf_set',S);
  applySettings();
});

// Navigation
const setTab=t=>{
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===t+'Page'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  if(t==='library') renderLiked();
};
document.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{
  if(b.dataset.tab==='profile') $('sp').classList.add('open');
  else setTab(b.dataset.tab);
});
$('spBack').onclick=()=>$('sp').classList.remove('open');

// Player & API
let yt=null,apiReady=false,queue=[],idx=-1,playing=false,shuf=false,rep=0;
window.onYouTubeIframeAPIReady=()=>{yt=new YT.Player('ytp',{height:200,width:200,events:{onReady:()=>apiReady=true,onStateChange:e=>{if(e.data===0)next()}}})};
const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);

const thumbOf=v=>(v.videoThumbnails||[])[0]?.url||`https://i.ytimg.com/vi/${v.videoId}/hqdefault.jpg`;

async function fetchSongs(q){
  try{
    const r=await fetch(`https://invidious.nerdvpn.de/api/v1/search?q=${encodeURIComponent(q)}&type=video`);
    const d=await r.json();
    return d.filter(x=>x.videoId);
  }catch(e){return []}
}

const renderGrid=(videos,gridId,listName)=>{
  const grid=$(gridId);
  grid.innerHTML='';
  videos.forEach((v,i)=>{
    const c=document.createElement('article');
    c.className='card g';
    c.innerHTML=`<img class="thumb" src="${thumbOf(v)}" loading="lazy"><div class="title">${v.title}</div><div class="artist">${v.author}</div>`;
    c.onclick=()=>playAt(i,videos);
    grid.appendChild(c);
  });
};

function playAt(i,list){
  if(list)queue=list;
  idx=i;
  const v=queue[idx];
  $('pThumb').src=$('mThumb').src=thumbOf(v);
  $('pTitle').textContent=$('mTitle').textContent=v.title;
  $('pArtist').textContent=$('mArtist').textContent=v.author;
  $('pBg').src=thumbOf(v);
  $('player').classList.add('active');
  $('mini').classList.add('visible');
  if(apiReady)yt.loadVideoById(v.videoId);
  playing=true;
  updatePlayIcons();
}

const updatePlayIcons=()=>{
  const icon=playing?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>';
  $('playIcon').innerHTML=$('mIcon').innerHTML=icon;
};

$('playBtn').onclick=$('mPlay').onclick=()=>{
  if(!apiReady)return;
  playing?yt.pauseVideo():yt.playVideo();
  playing=!playing;
  updatePlayIcons();
};

const next=()=>playAt(shuf?Math.floor(Math.random()*queue.length):(idx+1)%queue.length);
const prev=()=>playAt((idx-1+queue.length)%queue.length);
$('nextBtn').onclick=next;
$('prevBtn').onclick=prev;

$('minBtn').onclick=()=>$('player').classList.remove('active');
$('mThumb').onclick=$('mTitle').onclick=()=>$('player').classList.add('active');

// Search & Home Feed
const CHIPS=['Hindi Songs','Bangla Songs','Lo-Fi','Punjabi','Trending'];
const chipsEl=$('chips');
CHIPS.forEach((c,i)=>{
  const b=document.createElement('button');
  b.className='chip'+(i===0?' on':'');
  b.textContent=c;
  b.onclick=()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    loadFeed(c);
  };
  chipsEl.appendChild(b);
});

async function loadFeed(q){
  $('homeStatus').textContent='Loading...';
  const res=await fetchSongs(q);
  renderGrid(res,'homeGrid');
  $('homeStatus').textContent=res.length+' Songs';
}
loadFeed(CHIPS[0]);

$('sForm').onsubmit=async e=>{
  e.preventDefault();
  const q=$('q').value.trim();
  if(!q)return;
  const res=await fetchSongs(q);
  renderGrid(res,'searchGrid');
};

function renderLiked(){
  const liked=LS.get('sf_liked',[]);
  renderGrid(liked,'libGrid');
}
</script>
</body>
</html>
