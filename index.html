<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 40px;
      background: #111; /* ব্যাকগ্রাউন্ড কালার */
    }

    /* মোটা ও চওড়া প্লেয়ার কন্টেইনার */
    .player-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 90%;
      max-width: 440px;
      padding: 22px 24px; /* প্যাডিং বাড়িয়ে মোটা করা হয়েছে */
      background: rgba(35, 30, 30, 0.75);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 35px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      color: #fff;
    }

    /* ওপরের অংশ: ইমেজ, টাইটেল ও বাটন */
    .player-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .song-details {
      display: flex;
      align-items: center;
      gap: 14px;
      overflow: hidden;
    }

    /* মোটা অ্যালবামের ছবি */
    .album-art {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      object-fit: cover;
    }

    .info {
      display: flex;
      flex-direction: column;
    }

    .song-title {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }

    .artist-name {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 3px;
    }

    /* কন্ট্রোল বাটনগুলো */
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 1;
    }

    .play-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #ffffff;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      opacity: 1;
    }

    /* প্রোগ্রেস বার ও সময় */
    .progress-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      width: 35%; /* প্লে হওয়ার প্রোগ্রেস পার্সেন্টেজ */
      height: 100%;
      background: #fff;
      border-radius: 10px;
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>

  <!-- ফ্লক্টিং মিউজিক প্লেয়ার -->
  <div class="player-container">
    <div class="player-top">
      <div class="song-details">
        <img src="https://picsum.photos/200" alt="Album Cover" class="album-art">
        <div class="info">
          <span class="song-title">Tera Mera Rishta</span>
          <span class="artist-name">Pritam - Topic</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn"><i class="fa-solid fa-backward-step"></i></button>
        <button class="btn play-btn"><i class="fa-solid fa-play"></i></button>
        <button class="btn"><i class="fa-solid fa-forward-step"></i></button>
      </div>
    </div>

    <!-- টাইম ও প্রোগ্রেস বার -->
    <div class="progress-section">
      <div class="progress-bar-bg">
        <div class="progress-fill"></div>
      </div>
      <div class="time-info">
        <span>0:05</span>
        <span>5:04</span>
      </div>
    </div>
  </div>

</body>
</html>
