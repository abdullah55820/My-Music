<script src="https://www.youtube.com/iframe_api"></script>

<script>

const PLAYLIST_ID="PLbvY05KVYwoo";

let player=null;
let playing=false;

let playlistItems=[];
let playlistReady=false;

let volTimer=null;
let isDragging=false;

let swipeStartX=0;
let swipeStartY=0;
let swipeActive=false;
let swipeFromSeek=false;


/* =========================================================
   ANDROID
========================================================= */

const isAndroidDevice=
/Android/i.test(navigator.userAgent);

if(isAndroidDevice){

document.body.classList.add(
"android-device"
);

}


/* =========================================================
   BD TIME
========================================================= */

function updateBDTime(){

const options={

timeZone:"Asia/Dhaka",
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:true

};

document.getElementById(
"bdTimeVal"
).textContent=

new Intl.DateTimeFormat(
"en-US",
options
).format(new Date());

}

updateBDTime();

setInterval(
updateBDTime,
1000
);


/* =========================================================
   YOUTUBE API
========================================================= */

function onYouTubeIframeAPIReady(){

player=new YT.Player(
"yt",
{

width:"100%",
height:"100%",

playerVars:{

autoplay:0,

controls:1,

disablekb:0,

fs:1,

modestbranding:1,

playsinline:1,

rel:0,

iv_load_policy:3,

listType:"playlist",

list:PLAYLIST_ID

},

events:{

onReady:ready,
onStateChange:state

}

});

}


/* =========================================================
   READY
========================================================= */

function ready(){

setInterval(
updateProgress,
250
);


/*
IMPORTANT:

YouTube playlist load হওয়ার পর
নিজের playlist data তৈরি করব।
*/

setTimeout(
loadPlaylistItems,
1000
);

}


/* =========================================================
   PLAYER STATE
========================================================= */

function state(e){

const cover=
document.getElementById("cover");

const playBtn=
document.getElementById("play");

const playIcon=
document.getElementById("play-icon");


/*
PLAYING
*/

if(
e.data===YT.PlayerState.PLAYING
){

playing=true;

playBtn.classList.add(
"playing"
);

playIcon.innerHTML=
'<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

cover.classList.add(
"spinning"
);


/*
YouTube player-এর actual video
থেকেই information নেব।
*/

updateInfo();

highlightCurrentByVideoId();

}


/*
PAUSED
*/

else if(
e.data===YT.PlayerState.PAUSED
){

playing=false;

playBtn.classList.remove(
"playing"
);

playIcon.innerHTML=
'<path d="M8 5v14l11-7z"/>';

cover.classList.remove(
"spinning"
);

}


/*
ENDED

এখানেই সবচেয়ে গুরুত্বপূর্ণ fix।

YouTube-এর নিজের next order ব্যবহার করব না।

আমাদের A-Z playlist অনুযায়ী next চালাব।
*/

else if(
e.data===YT.PlayerState.ENDED
){

playing=false;

playBtn.classList.remove(
"playing"
);

playIcon.innerHTML=
'<path d="M8 5v14l11-7z"/>';

cover.classList.remove(
"spinning"
);


/*
A-Z order অনুযায়ী next
*/

setTimeout(
()=>{

playNextSorted();

},
100
);

}

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePlay(){

if(!player)
return;

try{

if(playing){

player.pauseVideo();

}
else{

/*
যদি কোনো video selected না থাকে,
প্রথম A-Z song চালাবে।
*/

if(
playlistItems.length>0 &&
typeof player.getVideoData==="function"
){

const data=
player.getVideoData();

if(
!data ||
!data.video_id
){

playSpecificTrack(0);

}
else{

player.playVideo();

}

}
else{

player.playVideo();

}

}

}
catch(e){}

}


/* =========================================================
   VIDEO POPUP
========================================================= */

function toggleVideoPopup(){

const popup=
document.getElementById(
"videoPopup"
);

const overlay=
document.getElementById(
"videoOverlay"
);

const videoPlaylist=
document.getElementById(
"videoPlaylist"
);

const iconSvg=
document.getElementById(
"videoToggleIcon"
);

const opening=
!popup.classList.contains(
"active"
);


if(opening){

popup.classList.add(
"active"
);

overlay.classList.add(
"active"
);

videoPlaylist.classList.add(
"active"
);

document.body.classList.add(
"popup-active"
);

iconSvg.innerHTML=
'<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>';


loadVideoPlaylist();

setTimeout(
adjustVideoPlaylistHeight,
50
);

}
else{

popup.classList.remove(
"active"
);

overlay.classList.remove(
"active"
);

videoPlaylist.classList.remove(
"active"
);

document.body.classList.remove(
"popup-active"
);

iconSvg.innerHTML=
'<path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>';

}

}


/* =========================================================
   VIDEO PLAYLIST HEIGHT
========================================================= */

function adjustVideoPlaylistHeight(){

const popup=
document.getElementById(
"videoPopup"
);

const playlist=
document.getElementById(
"videoPlaylist"
);

const playerCard=
document.getElementById(
"playerCard"
);

if(
!popup ||
!playlist ||
!playerCard
)
return;

if(
!popup.classList.contains("active")
)
return;


const popupRect=
popup.getBoundingClientRect();

const playerRect=
playerCard.getBoundingClientRect();

const top=
popupRect.bottom+1;

const bottom=
playerRect.top-20;

const available=
bottom-top;


if(available>70){

playlist.style.height=
available+"px";

playlist.style.maxHeight=
available+"px";

}
else{

playlist.style.height=
"80px";

playlist.style.maxHeight=
"80px";

}

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
"resize",
()=>{

handleDeviceOrientation();

setTimeout(
adjustVideoPlaylistHeight,
100
);

}
);


window.addEventListener(
"orientationchange",
()=>{

setTimeout(
handleDeviceOrientation,
150
);

setTimeout(
adjustVideoPlaylistHeight,
300
);

}
);


/* =========================================================
   ORIENTATION
========================================================= */

function handleDeviceOrientation(){

const isLandscape=
window.innerWidth>
window.innerHeight;


const popup=
document.getElementById(
"videoPopup"
);

const overlay=
document.getElementById(
"videoOverlay"
);

const videoPlaylist=
document.getElementById(
"videoPlaylist"
);

const iconSvg=
document.getElementById(
"videoToggleIcon"
);


if(isLandscape){

if(
popup &&
!popup.classList.contains(
"active"
)
){

popup.classList.add(
"active"
);

overlay.classList.add(
"active"
);

document.body.classList.add(
"popup-active"
);

}

if(videoPlaylist){

videoPlaylist.classList.remove(
"active"
);

}

document.body.classList.add(
"landscape-mode"
);


if(iconSvg){

iconSvg.innerHTML=
'<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>';

}

}
else{

document.body.classList.remove(
"landscape-mode"
);


if(
popup &&
popup.classList.contains(
"active"
)
){

videoPlaylist.classList.add(
"active"
);

setTimeout(
adjustVideoPlaylistHeight,
100
);

}

}

}


/* =========================================================
   VOLUME
========================================================= */

function resetVolTimer(){

if(volTimer){

clearTimeout(
volTimer
);

}

volTimer=setTimeout(
()=>{

document
.getElementById(
"volWrapper"
)
.classList.remove(
"active"
);

},
3000
);

}


function toggleVolume(){

const wrapper=
document.getElementById(
"volWrapper"
);

if(
wrapper.classList.contains(
"active"
)
){

wrapper.classList.remove(
"active"
);

if(volTimer){

clearTimeout(
volTimer
);

}

}
else{

wrapper.classList.add(
"active"
);

resetVolTimer();

}

}


function changeVolume(val){

if(
player &&
typeof player.setVolume===
"function"
){

player.setVolume(
Number(val)
);

}

resetVolTimer();

}


/* =========================================================
   SORTED PLAYLIST INDEX
========================================================= */

function getCurrentSortedIndex(){

if(
!player ||
playlistItems.length===0
)
return -1;


let currentId="";


try{

const data=
player.getVideoData();

if(data){

currentId=
data.video_id || "";

}

}
catch(e){}


if(!currentId)
return -1;


return playlistItems.findIndex(
item=>
item.id===currentId
);

}


/* =========================================================
   NEXT SONG
========================================================= */

function nextSong(){

playNextSorted();

}


/* =========================================================
   NEXT SORTED
========================================================= */

function playNextSorted(){

if(
!player ||
playlistItems.length===0
)
return;


const current=
getCurrentSortedIndex();


let nextIndex=0;


if(current>=0){

nextIndex=
(current+1)%
playlistItems.length;

}


playSpecificTrack(
nextIndex
);

}


/* =========================================================
   PREVIOUS SONG
========================================================= */

function previousSong(){

if(
!player ||
playlistItems.length===0
)
return;


const current=
getCurrentSortedIndex();


let previousIndex=
playlistItems.length-1;


if(current>=0){

previousIndex=
(current-1+
playlistItems.length)%
playlistItems.length;

}


playSpecificTrack(
previousIndex
);

}


/* =========================================================
   FORCE UPDATE UI
========================================================= */

function forceUpdateUI(index){

if(
!playlistItems[index]
)
return;


const item=
playlistItems[index];

const id=
item.id;


document.getElementById(
"cover"
).src=
`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;


document.getElementById(
"title"
).textContent=
item.title ||
"Loading...";


document.getElementById(
"artist"
).textContent=
item.artist ||
"YouTube Music";


highlightActiveTrack();

highlightVideoActiveTrack();

}


/* =========================================================
   SWIPE
========================================================= */

const playerCard=
document.getElementById(
"playerCard"
);

const seekElement=
document.getElementById(
"seek"
);


playerCard.addEventListener(
"pointerdown",
e=>{

swipeStartX=
e.clientX;

swipeStartY=
e.clientY;

swipeFromSeek=
!!e.target.closest(
"#seek"
);

swipeActive=true;

}
);


playerCard.addEventListener(
"pointerup",
e=>{

if(!swipeActive)
return;


const endX=
e.clientX;

const endY=
e.clientY;


const dx=
endX-swipeStartX;

const dy=
endY-swipeStartY;


if(swipeFromSeek){

swipeActive=false;

return;

}


if(Math.abs(dx)<50){

swipeActive=false;

return;

}


if(
Math.abs(dy)>
Math.abs(dx)
){

swipeActive=false;

return;

}


if(dx<-50){

nextSong();

}
else if(dx>50){

previousSong();

}


swipeActive=false;

}
);


playerCard.addEventListener(
"pointercancel",
()=>{

swipeActive=false;

}
);


/* =========================================================
   SEEK
========================================================= */

function getSeekPosition(
clientX,
el
){

const rect=
el.getBoundingClientRect();


if(!rect.width)
return 0;


return Math.max(
0,
Math.min(
1,
(clientX-rect.left)/
rect.width
)
);

}


function updateSeekVisual(pos){

document.getElementById(
"fill"
).style.width=
(pos*100)+"%";


if(
player &&
typeof player.getDuration===
"function"
){

const duration=
player.getDuration();


if(duration){

document.getElementById(
"current"
).textContent=
format(pos*duration);

document.getElementById(
"duration"
).textContent=
format(duration);

}

}

}


seekElement.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

e.stopPropagation();

isDragging=true;


try{

seekElement.setPointerCapture(
e.pointerId
);

}
catch(err){}


updateSeekVisual(
getSeekPosition(
e.clientX,
seekElement
)
);

},
{
passive:false
}
);


seekElement.addEventListener(
"pointermove",
e=>{

if(!isDragging)
return;


e.preventDefault();

e.stopPropagation();


updateSeekVisual(
getSeekPosition(
e.clientX,
seekElement
)
);

},
{
passive:false
}
);


seekElement.addEventListener(
"pointerup",
e=>{

if(!isDragging)
return;


e.preventDefault();

e.stopPropagation();


const pos=
getSeekPosition(
e.clientX,
seekElement
);


updateSeekVisual(pos);


if(
player &&
typeof player.getDuration===
"function"
){

const duration=
player.getDuration();


if(duration){

player.seekTo(
pos*duration,
true
);

}

}


isDragging=false;


try{

seekElement.releasePointerCapture(
e.pointerId
);

}
catch(err){}

},
{
passive:false
}
);


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(){

if(isDragging)
return;


if(
!player ||
typeof player.getCurrentTime!==
"function"
)
return;


try{

const current=
player.getCurrentTime();

const duration=
player.getDuration();


if(!duration)
return;


const pos=
Math.max(
0,
Math.min(
1,
current/duration
)
);


document.getElementById(
"fill"
).style.width=
(pos*100)+"%";


document.getElementById(
"current"
).textContent=
format(current);


document.getElementById(
"duration"
).textContent=
format(duration);

}
catch(e){}

}


/* =========================================================
   FORMAT
========================================================= */

function format(s){

if(
!s ||
isNaN(s)
){

return "0:00";

}


s=Math.floor(s);


return Math.floor(s/60)+":"+
String(
s%60
).padStart(
2,"0"
);

}


/* =========================================================
   LOAD YOUTUBE PLAYLIST
========================================================= */

function loadPlaylistItems(){

if(
!player ||
typeof player.getPlaylist!==
"function"
)
return;


let ids=[];

try{

ids=
player.getPlaylist() || [];

}
catch(e){

ids=[];

}


if(
!ids.length
){

setTimeout(
loadPlaylistItems,
700
);

return;

}


/*
আগের data মুছে নতুন করে তৈরি।
*/

playlistItems=
ids.map(
(id,index)=>({

id:id,

title:`Track #${index+1}`,

artist:"YouTube Music",

originalIndex:index

})
);


/*
প্রথমে UI দেখাই।
তারপর title fetch হবে।
*/

renderSortedPlaylist();

loadVideoPlaylist();

playlistReady=true;


/*
Title fetch হওয়ার পর
আবার A-Z sort হবে।
*/

playlistItems.forEach(
(item,index)=>{

fetchSongDetailsForSortedItem(
item.id
);

});

}


/* =========================================================
   FETCH DETAILS
========================================================= */

function fetchSongDetailsForSortedItem(
id
){

fetch(
`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`
)

.then(
r=>r.json()
)

.then(
data=>{

if(!data)
return;


/*
ID দিয়ে item খুঁজে বের করি।
Index-এর উপর depend করছি না।
*/

const item=
playlistItems.find(
x=>x.id===id
);

if(!item)
return;


if(data.title){

item.title=
data.title;

}


if(data.author_name){

item.artist=
data.author_name;

}


/*
সব title আসার সাথে সাথে
A-Z order update হবে।
*/

sortPlaylistAZ();

renderSortedPlaylist();

loadVideoPlaylist();

highlightCurrentByVideoId();

}
)

.catch(
()=>{}
);

}


/* =========================================================
   SORT A-Z
========================================================= */

function sortPlaylistAZ(){

playlistItems.sort(
(a,b)=>{

const titleA=
(a.title || "").trim();

const titleB=
(b.title || "").trim();


return titleA.localeCompare(
titleB,
undefined,
{
numeric:true,
sensitivity:"base"
}
);

}
);

}


/* =========================================================
   RENDER MAIN DRAWER
========================================================= */

function renderSortedPlaylist(){

const list=
document.getElementById(
"songList"
);

if(!list)
return;


list.innerHTML="";


playlistItems.forEach(
(item,index)=>{

const div=
document.createElement(
"div"
);

div.className=
"song-item";


div.dataset.videoId=
item.id;


div.innerHTML=`

<img
src="https://i.ytimg.com/vi/${item.id}/hqdefault.jpg"
alt="thumb"
>

<div class="song-item-info">

<div
class="song-item-title"
>
${escapeHTML(item.title)}
</div>

<div
class="song-item-artist"
>
${escapeHTML(item.artist)}
</div>

</div>

`;


/*
IMPORTANT:

Sorted array-এর index পাঠানো হবে।

YouTube playlist index নয়।
*/

div.onclick=()=>{

playSpecificTrack(
index
);

};


list.appendChild(
div
);

});


highlightActiveTrack();

}


/* =========================================================
   VIDEO PLAYLIST
========================================================= */

function loadVideoPlaylist(){

const list=
document.getElementById(
"videoSongList"
);

if(!list)
return;


if(
!playlistItems ||
playlistItems.length===0
){

list.innerHTML=`

<div style="
text-align:center;
color:rgba(255,255,255,.7);
font-size:9px;
padding:10px;
">
Loading...
</div>

`;

return;

}


list.innerHTML="";


playlistItems.forEach(
(item,index)=>{

const div=
document.createElement(
"div"
);

div.className=
"video-song-item";


div.dataset.videoId=
item.id;


div.innerHTML=`

<img
src="https://i.ytimg.com/vi/${item.id}/hqdefault.jpg"
alt="thumb"
draggable="false"
>

<div class="video-song-info">

<div
class="video-song-title"
>
${escapeHTML(item.title)}
</div>

<div
class="video-song-artist"
>
${escapeHTML(item.artist)}
</div>

</div>

`;


div.addEventListener(
"click",
function(e){

e.preventDefault();

e.stopPropagation();

playSpecificTrack(
index
);

},
{
passive:false
}
);


list.appendChild(
div
);

});


highlightVideoActiveTrack();

setTimeout(
adjustVideoPlaylistHeight,
50
);

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text){

if(text===undefined ||
text===null
)
return "";

return String(text)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}


/* =========================================================
   PLAY SPECIFIC TRACK
   *** MAIN FIX ***
========================================================= */

function playSpecificTrack(
index
){

if(
!player ||
!playlistItems[index]
)
return;


const item=
playlistItems[index];

const id=
item.id;


/*
আগেই UI update করি।
*/

forceUpdateUI(index);


/*
YouTube-এর playlist index ব্যবহার করছি না।

সরাসরি VIDEO ID দিয়ে video load করছি।

এটাই মূল fix।
*/

try{

player.loadVideoById({
videoId:id
});

}
catch(e){

/*
Fallback
*/

try{

player.loadVideoById(id);

}
catch(err){}

}


/*
OLD DRAWER CLOSE
*/

const drawer=
document.getElementById(
"drawer"
);

const drawerOverlay=
document.getElementById(
"overlay"
);


drawer.classList.remove(
"open"
);

drawerOverlay.classList.remove(
"active"
);


/*
VIDEO PLAYLIST OPEN থাকলে
খোলা থাকবে।
*/

const popup=
document.getElementById(
"videoPopup"
);


if(
popup &&
popup.classList.contains(
"active"
)
){

document
.getElementById(
"videoPlaylist"
)
.classList.add(
"active"
);

setTimeout(
adjustVideoPlaylistHeight,
80
);

}


/*
Active state
*/

highlightActiveTrack();

highlightVideoActiveTrack();

}


/* =========================================================
   CURRENT VIDEO ID
========================================================= */

function getCurrentVideoId(){

if(
!player ||
typeof player.getVideoData!==
"function"
)
return "";


try{

const data=
player.getVideoData();

return data &&
data.video_id
?
data.video_id
:
"";

}
catch(e){

return "";

}

}


/* =========================================================
   HIGHLIGHT CURRENT
========================================================= */

function highlightCurrentByVideoId(){

const currentId=
getCurrentVideoId();


if(!currentId)
return;


document
.querySelectorAll(
".song-item"
)
.forEach(
item=>{

item.classList.toggle(
"active",
item.dataset.videoId===
currentId
);

});


document
.querySelectorAll(
".video-song-item"
)
.forEach(
item=>{

item.classList.toggle(
"active",
item.dataset.videoId===
currentId
);

});

}


/* =========================================================
   OLD FUNCTION COMPATIBILITY
========================================================= */

function highlightActiveTrack(){

highlightCurrentByVideoId();

}


function highlightVideoActiveTrack(){

highlightCurrentByVideoId();

}


/* =========================================================
   UPDATE MAIN INFO
========================================================= */

function updateInfo(){

if(
!player ||
typeof player.getVideoData!==
"function"
)
return;


try{

const d=
player.getVideoData();


if(
!d ||
!d.video_id
)
return;


const id=
d.video_id;


document.getElementById(
"cover"
).src=
`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;


if(d.title){

document.getElementById(
"title"
).textContent=
d.title;

}


if(d.author){

document.getElementById(
"artist"
).textContent=
d.author;

}


highlightCurrentByVideoId();

}

function toggleDrawer(){

const popup=
document.getElementById(
"videoPopup"
);


if(
popup &&
popup.classList.contains(
"active"
)
){

return;

}


const drawer=
document.getElementById(
"drawer"
);

const overlay=
document.getElementById(
"overlay"
);


const opening=
!drawer.classList.contains(
"open"
);


drawer.classList.toggle(
"open",
opening
);

overlay.classList.toggle(
"active",
opening
);


if(
opening &&
playlistItems.length===0
){

loadPlaylistItems();

}

}
