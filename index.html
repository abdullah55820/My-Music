<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Media Player with Synchronized Lyrics</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0f0d13;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }

    /* Player Container Frame */
    .desktop-setup {
      position: relative;
      width: 420px;
      background: #18151f;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 105, 180, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top Screen Area (Video / Room Aesthetics Background) */
    .main-screen {
      position: relative;
      width: 100%;
      height: 240px;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #video-wrapper {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    #youtube-player {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Lyrics Overlay (Hides video when toggled) */
    .lyrics-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 13, 19, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
      overflow-y: auto;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
    }

    .lyrics-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lyrics-content {
      text-align: center;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Individual Lyric Line Styling */
    .lyric-line {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.4);
      transition: all 0.3s ease;
      cursor: pointer;
      font-weight: 500;
    }

    /* Active Lyric Line (Spotify Style) */
    .lyric-line.active {
      color: #1db954;
      font-size: 18px;
      font-weight: 700;
      transform: scale(1.04);
      text-shadow: 0 0 10px rgba(29, 185, 84, 0.3);
    }

    /* Mini Bottom Control Bar */
    .mini-player-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #231f2d;
      padding: 12px 18px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .track-details {
      display: flex;
      flex-direction: column;
      max-width: 170px;
    }

    .track-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }

    .track-subtitle {
      font-size: 12px;
      color: #8b8599;
      margin-top: 2px;
    }

    .control-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #8b8599;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      color: #fff;
    }

    .icon-btn.active {
      color: #1db954;
    }

    .action-play-btn {
      background: #fff;
      color: #000;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-play-btn:hover {
      background: #e2e2e2;
      transform: scale(1.05);
    }

    /* Custom Scrollbar for Lyrics Overlay */
    .lyrics-overlay::-webkit-scrollbar {
      width: 4px;
    }
    .lyrics-overlay::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="desktop-setup">
    <!-- Screen View Area -->
    <div class="main-screen">
      <div id="video-wrapper">
        <div id="youtube-player"></div>
      </div>
      
      <!-- Lyrics Overlay Container -->
      <div id="lyrics-overlay" class="lyrics-overlay">
        <div id="lyrics-content" class="lyrics-content">
          <p class="lyric-line" data-time="0">Chittiyaan Kalaiyaan Ve...</p>
          <p class="lyric-line" data-time="8">Oh baby meri chittiyaan kalaiyaan ve</p>
          <p class="lyric-line" data-time="15">Tere naal nachna main</p>
          <p class="lyric-line" data-time="22">Tu leja mujhe shopping pe</p>
          <p class="lyric-line" data-time="28">Dil ka ye shor sun le</p>
        </div>
      </div>
    </div>

    <!-- Mini Bottom Controller -->
    <div class="mini-player-bar">
      <div class="track-details">
        <span class="track-title">'Chittiyaan Kalaiyaan...</span>
        <span class="track-subtitle">T-Series</span>
      </div>

      <div class="control-actions">
        <!-- Mic Icon Button (Toggles Video/Lyrics) -->
        <button id="mic-btn" class="icon-btn" onclick="toggleLyrics()" title="Toggle Lyrics Display">
          🎤
        </button>
        <!-- Play/Pause Control -->
        <button id="play-btn" class="icon-btn action-play-btn" onclick="togglePlay()">
          ▶
        </button>
      </div>
    </div>
  </div>

  <!-- YouTube IFrame API Script -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let player;
    let isLyricsVisible = false;
    let syncInterval;

    // Load YouTube iFrame Player
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        videoId: 'zPqy4k-4mms',
        playerVars: {
          'playsinline': 1,
          'controls': 1,
          'rel': 0,
          'modestbranding': 1
        },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    // Toggle Play / Pause Logic
    function togglePlay() {
      if (!player || typeof player.getPlayerState !== 'function') return;
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    // Listen to Player Events
    function onPlayerStateChange(event) {
      const playBtn = document.getElementById('play-btn');
      if (event.data === YT.PlayerState.PLAYING) {
        playBtn.innerText = '⏸';
        startLyricsSync();
      } else {
        playBtn.innerText = '▶';
        stopLyricsSync();
      }
    }

    // Toggle Lyrics Screen Overlay on Mic Click
    function toggleLyrics() {
      isLyricsVisible = !isLyricsVisible;
      const overlay = document.getElementById('lyrics-overlay');
      const micBtn = document.getElementById('mic-btn');

      if (isLyricsVisible) {
        overlay.classList.add('active');
        micBtn.classList.add('active');
      } else {
        overlay.classList.remove('active');
        micBtn.classList.remove('active');
      }
    }

    // Track playback time and update highlighted lyric line
    function startLyricsSync() {
      stopLyricsSync();
      syncInterval = setInterval(() => {
        if (player && typeof player.getCurrentTime === 'function') {
          const currentTime = player.getCurrentTime();
          updateActiveLyric(currentTime);
        }
      }, 300);
    }

    function stopLyricsSync() {
      clearInterval(syncInterval);
    }

    function updateActiveLyric(currentTime) {
      const lines = document.querySelectorAll('.lyric-line');
      let currentActiveIndex = -1;

      lines.forEach((line, index) => {
        const lineTime = parseFloat(line.getAttribute('data-time'));
        if (currentTime >= lineTime) {
          currentActiveIndex = index;
        }
      });

      lines.forEach((line, index) => {
        if (index === currentActiveIndex) {
          if (!line.classList.contains('active')) {
            line.classList.add('active');
            line.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        } else {
          line.classList.remove('active');
        }
      });
    }
  </script>
</body>
</html>
