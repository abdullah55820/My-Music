<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>SoundFlow — Music</title>

<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --muted: #99999f;
  --line: rgba(255,255,255,.12);
  --accent: #ff2d55;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
}

body.player-open {
  overflow: hidden;
}

.wrap {
  max-width: 1050px;
  margin: auto;
  padding: 22px 18px 120px;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: -1px;
}

.brand span { color: var(--accent); }

.tag {
  color: var(--muted);
  font-size: 12px;
}

.search {
  display: flex;
  gap: 9px;
  margin: 25px 0 12px;
}

.search input {
  min-width: 0;
  flex: 1;
  background: #1c1c1e;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  color: white;
  font-size: 16px;
  outline: none;
}

.search input:focus {
  border-color: var(--accent);
}

button {
  border: 0;
  cursor: pointer;
  font-family: inherit;
}

.search button {
  border-radius: 14px;
  padding: 0 19px;
  background: linear-gradient(135deg,#ff2d55,#ff5e3a);
  color: white;
  font-weight: 700;
  font-size: 15px;
}

.hint {
  color: var(--muted);
  font-size: 12px;
  margin: 0 0 22px;
}

.section {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 24px 0 13px;
}

.section h2 {
  font-size: 18px;
  margin: 0;
}

.status {
  font-size: 12px;
  color: var(--muted);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(155px,1fr));
  gap: 15px;
}

.card {
  background: #1c1c1e;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 10px;
  cursor: pointer;
  min-width: 0;
  transition: .2s;
}

.card:active {
  transform: scale(.97);
}

.thumb {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 12px;
  background: #2c2c2e;
}

.title {
  font-size: 13px;
  font-weight: 650;
  line-height: 1.35;
  margin: 10px 2px 5px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.artist {
  font-size: 11px;
  color: var(--muted);
  margin: 0 2px 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.empty {
  border: 1px dashed var(--line);
  padding: 28px 15px;
  border-radius: 16px;
  color: var(--muted);
  text-align: center;
  grid-column: 1/-1;
}

.load {
  display: block;
  margin: 22px auto 0;
  padding: 13px 22px;
  background: #1c1c1e;
  border: 1px solid var(--line);
  border-radius: 14px;
  color: white;
}

.note {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.5;
  margin-top: 24px;
}

/* =========================
   FULL SCREEN MUSIC PLAYER
========================= */

.player {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding:
    calc(16px + env(safe-area-inset-top))
    25px
    calc(35px + env(safe-area-inset-bottom));
  overflow-y: auto;
  background: #080808;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  transform: translateY(30px);
  transition: opacity .3s, transform .35s, visibility .35s;
}

.player.active {
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

/* Blurred artwork background */

.player-bg {
  position: absolute;
  inset: -35px;
  z-index: -2;
  background-size: cover;
  background-position: center;
  filter: blur(38px);
  transform: scale(1.15);
  opacity: .75;
  transition: background-image .4s;
}

.player-shade {
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(
    180deg,
    rgba(0,0,0,.64),
    rgba(0,0,0,.48) 45%,
    rgba(0,0,0,.88)
  );
  backdrop-filter: saturate(120%);
  -webkit-backdrop-filter: saturate(120%);
}

.player-top-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  min-height: 42px;
  flex-shrink: 0;
}

.player-top-bar span {
  font-size: 12px;
  font-weight: 700;
  color: rgba(255,255,255,.8);
  letter-spacing: 1px;
  text-transform: uppercase;
}

.collapse-btn {
  position: absolute;
  left: 0;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: white;
  background: rgba(255,255,255,.13);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
}

.collapse-btn svg {
  width: 21px;
  height: 21px;
}

.player-content-center {
  max-width: 390px;
  width: 100%;
  margin: auto;
  padding: 15px 0;
}

.big-artwork-wrap {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 22px;
  overflow: hidden;
  background: #222;
  box-shadow: 0 22px 65px rgba(0,0,0,.55);
  margin-bottom: 30px;
}

.big-artwork-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.song-meta-box {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 27px;
}

.song-info-text {
  min-width: 0;
  flex: 1;
}

.song-info-text h3 {
  font-size: 21px;
  margin: 0 0 7px;
  font-weight: 750;
  color: white;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.song-info-text p {
  font-size: 14px;
  color: rgba(255,255,255,.65);
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.like-btn {
  background: transparent;
  color: rgba(255,255,255,.65);
  padding: 8px;
}

.like-btn svg {
  width: 27px;
  height: 27px;
}

.like-btn.liked {
  color: #ff2d55;
}

/* PROGRESS BAR */

.progress-container {
  margin-bottom: 32px;
}

.seek-slider {
  width: 100%;
  height: 5px;
  display: block;
  border-radius: 10px;
  outline: none;
  appearance: none;
  -webkit-appearance: none;
  background: linear-gradient(
    to right,
    #fff 0%,
    #fff 0%,
    rgba(255,255,255,.28) 0%,
    rgba(255,255,255,.28) 100%
  );
  cursor: pointer;
  touch-action: pan-y;
}

.seek-slider::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 1px 8px rgba(0,0,0,.5);
}

.seek-slider::-moz-range-thumb {
  width: 13px;
  height: 13px;
  border: 0;
  border-radius: 50%;
  background: white;
}

.time-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: rgba(255,255,255,.65);
  margin-top: 10px;
  font-variant-numeric: tabular-nums;
}

/* REALISTIC CONTROLS */

.controls-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 48px;
}

.ctrl-btn {
  background: transparent;
  color: white;
  padding: 8px;
  display: grid;
  place-items: center;
  opacity: .95;
}

.ctrl-btn svg {
  width: 32px;
  height: 32px;
}

.ctrl-btn:active {
  transform: scale(.88);
}

.play-pause-circle {
  width: 74px;
  height: 74px;
  border-radius: 50%;
  background: #fff;
  color: #000;
  display: grid;
  place-items: center;
  box-shadow: 0 7px 25px rgba(0,0,0,.3);
  transition: transform .15s;
}

.play-pause-circle:active {
  transform: scale(.91);
}

.play-pause-circle svg {
  width: 30px;
  height: 30px;
}

/* =========================
   MINI PLAYER
========================= */

.mini-player {
  position: fixed;
  z-index: 9998;
  left: 12px;
  right: 12px;
  bottom: calc(10px + env(safe-area-inset-bottom));
  min-height: 66px;
  padding: 9px 12px;
  border-radius: 17px;
  background: rgba(37,37,39,.94);
  border: 1px solid rgba(255,255,255,.13);
  backdrop-filter: blur(25px) saturate(160%);
  -webkit-backdrop-filter: blur(25px) saturate(160%);
  display: flex;
  align-items: center;
  gap: 11px;
  box-shadow: 0 8px 30px rgba(0,0,0,.4);
  opacity: 0;
  visibility: hidden;
  transform: translateY(25px);
  transition: .28s ease;
}

.mini-player.visible {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.mini-thumb {
  width: 46px;
  height: 46px;
  border-radius: 9px;
  object-fit: cover;
  flex-shrink: 0;
  background: #333;
}

.mini-info {
  flex: 1;
  min-width: 0;
}

.mini-title {
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mini-artist {
  font-size: 11px;
  color: rgba(255,255,255,.6);
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mini-control {
  background: transparent;
  color: white;
  width: 39px;
  height: 42px;
  display: grid;
  place-items: center;
}

.mini-control svg {
  width: 24px;
  height: 24px;
}

/* Hidden YouTube player */

#ytPlayerContainer {
  position: fixed;
  width: 200px;
  height: 200px;
  left: -1000px;
  top: 0;
  opacity: .01;
  pointer-events: none;
}

@media(max-width:480px) {
  .wrap {
    padding: 17px 13px 110px;
  }

  .grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 11px;
  }

  .brand { font-size: 22px; }

  .player {
    padding-left: 23px;
    padding-right: 23px;
  }

  .player-content-center {
    max-width: 360px;
  }

  .big-artwork-wrap {
    border-radius: 20px;
    margin-bottom: 26px;
  }

  .controls-row {
    gap: 40px;
  }
}

@media(max-height:700px) {
  .player-content-center {
    max-width: 300px;
  }

  .big-artwork-wrap {
    margin-bottom: 19px;
  }

  .song-meta-box {
    margin-bottom: 18px;
  }

  .progress-container {
    margin-bottom: 20px;
  }

  .play-pause-circle {
    width: 64px;
    height: 64px;
  }
}
</style>
</head>

<body>

<main class="wrap">

<header class="top">
  <div>
    <div class="brand">SOUND<span>FLOW</span></div>
    <div class="tag">Discover • Search • Listen</div>
  </div>
  <div class="tag">Music Player</div>
</header>

<form class="search" id="searchForm">
  <input
    id="query"
    type="search"
    placeholder="গানের নাম বা শিল্পীর নাম লিখো…"
    autocomplete="off"
  >
  <button type="submit">Search</button>
</form>

<p class="hint">যেমন: Arijit Singh, Atif Aslam, বাংলা গান…</p>

<div class="section">
  <h2 id="heading">Trending All Songs</h2>
  <span class="status" id="status">Ready</span>
</div>

<div class="grid" id="results">
  <div class="empty">গান লোড হচ্ছে...</div>
</div>

<button class="load" id="loadMore" type="button" hidden>
  আরও গান দেখাও
</button>

<p class="note">
  Discover your favourite music and enjoy listening.
</p>

</main>

<!-- FULL SCREEN PLAYER -->

<section class="player" id="player">

  <div class="player-bg" id="playerBg"></div>
  <div class="player-shade"></div>

  <div class="player-top-bar">
    <button class="collapse-btn" id="minimizePlayer" aria-label="Minimize">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round">
        <path d="m6 9 6 6 6-6"/>
      </svg>
    </button>

    <span>NOW PLAYING</span>
  </div>

  <div class="player-content-center">

    <div class="big-artwork-wrap">
      <img id="playingThumb" alt="Artwork">
    </div>

    <div class="song-meta-box">

      <div class="song-info-text">
        <h3 id="playingTitle">Song Title</h3>
        <p id="playingArtist">Artist Name</p>
      </div>

      <button class="like-btn" id="likeBtn" aria-label="Favourite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round"
             stroke-linejoin="round">
          <path d="M20.8 8.7c0 5.5-8.8 10.2-8.8 10.2S3.2 14.2 3.2 8.7A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.8 2.3Z"/>
        </svg>
      </button>

    </div>

    <div class="progress-container">

      <input
        type="range"
        class="seek-slider"
        id="seekSlider"
        value="0"
        min="0"
        max="100"
      >

      <div class="time-row">
        <span id="currentTime">0:00</span>
        <span id="durationTime">0:00</span>
      </div>

    </div>

    <div class="controls-row">

      <button class="ctrl-btn" id="prevBtn" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 5h2v14H6zM19 6v12L9 12z"/>
        </svg>
      </button>

      <button class="play-pause-circle" id="mainPlayBtn" aria-label="Play">
        <svg id="mainPlayIcon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M7 4v16l13-8z"/>
        </svg>
      </button>

      <button class="ctrl-btn" id="nextBtn" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 5h2v14h-2zM5 6v12l10-6z"/>
        </svg>
      </button>

    </div>

  </div>

  <div></div>

</section>

<!-- MINI PLAYER -->

<div class="mini-player" id="miniPlayer">

  <img class="mini-thumb" id="miniThumb" alt="">

  <div class="mini-info" id="expandPlayer">
    <div class="mini-title" id="miniTitle">Song Title</div>
    <div class="mini-artist" id="miniArtist">Artist</div>
  </div>

  <button class="mini-control" id="miniPlayBtn" aria-label="Play/Pause">
    <svg id="miniPlayIcon" viewBox="0 0 24 24" fill="currentColor">
      <path d="M7 4v16l13-8z"/>
    </svg>
  </button>

  <button class="mini-control" id="miniCloseBtn" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round">
      <path d="M6 6l12 12M18 6 6 18"/>
    </svg>
  </button>

</div>

<!-- YOUTUBE PLAYER -->

<div id="ytPlayerContainer">
  <div id="ytPlayer"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
/* =========================
   CONFIGURATION
========================= */

const instances = [
  'https://invidious.privacyredirect.com',
  'https://inv.nadeko.net',
  'https://invidious.nerdvpn.de',
  'https://yt.chocolatemoo53.com',
  'https://invidious.tiekoetter.com'
];

const $ = id => document.getElementById(id);

const form = $('searchForm');
const input = $('query');
const results = $('results');
const statusEl = $('status');
const heading = $('heading');
const more = $('loadMore');

const playerScreen = $('player');
const miniPlayer = $('miniPlayer');

let ytPlayer = null;
let apiReady = false;

let videos = [];
let currentIndex = -1;

let page = 1;
let currentQuery = 'Top Bangla and Hindi hits';

let busy = false;
let isPlaying = false;
let seeking = false;
let updateTimer = null;
let searchToken = 0;

let pendingVideoId = null;

/* =========================
   YOUTUBE API
========================= */

window.onYouTubeIframeAPIReady = function() {

  ytPlayer = new YT.Player('ytPlayer', {
    height: '200',
    width: '200',

    playerVars: {
      autoplay: 0,
      controls: 0,
      disablekb: 1,
      playsinline: 1,
      rel: 0
    },

    events: {
      onReady: () => {
        apiReady = true;

        if (pendingVideoId) {
          const id = pendingVideoId;
          pendingVideoId = null;
          ytPlayer.loadVideoById(id);
        }
      },

      onStateChange: onPlayerStateChange,

      onError: event => {
        console.log('YouTube playback error:', event.data);
        statusEl.textContent = 'Playback Error';
      }
    }
  });

};

/* =========================
   PLAYER STATE
========================= */

function onPlayerStateChange(event) {

  if (event.data === YT.PlayerState.PLAYING) {

    isPlaying = true;
    updatePlayIcons();
    startTimer();

  } else if (
    event.data === YT.PlayerState.PAUSED ||
    event.data === YT.PlayerState.ENDED
  ) {

    isPlaying = false;
    updatePlayIcons();
    stopTimer();

    if (event.data === YT.PlayerState.ENDED) {
      nextSong();
    }

  } else if (event.data === YT.PlayerState.BUFFERING) {

    statusEl.textContent = 'Buffering…';

  }
}

/* =========================
   ICONS
========================= */

const playSVG = `
<path d="M7 4v16l13-8z"/>
`;

const pauseSVG = `
<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>
`;

function updatePlayIcons() {

  $('mainPlayIcon').innerHTML = isPlaying ? pauseSVG : playSVG;
  $('miniPlayIcon').innerHTML = isPlaying ? pauseSVG : playSVG;

}

/* =========================
   TIME & PROGRESS
========================= */

function formatTime(seconds) {

  if (!Number.isFinite(seconds) || seconds < 0) return '0:00';

  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);

  return `${m}:${String(s).padStart(2,'0')}`;

}

function updateProgress() {

  if (!ytPlayer || !apiReady) return;

  try {

    const current = ytPlayer.getCurrentTime() || 0;
    const duration = ytPlayer.getDuration() || 0;

    $('currentTime').textContent = formatTime(current);
    $('durationTime').textContent = formatTime(duration);

    if (duration > 0 && !seeking) {

      const percent = Math.min(100, (current / duration) * 100);

      seekSlider.value = percent;

      seekSlider.style.background =
        `linear-gradient(to right,
        #fff 0%,
        #fff ${percent}%,
        rgba(255,255,255,.28) ${percent}%,
        rgba(255,255,255,.28) 100%)`;

    }

  } catch(e) {}

}

function startTimer() {

  stopTimer();

  updateTimer = setInterval(updateProgress, 400);

}

function stopTimer() {

  if (updateTimer) {
    clearInterval(updateTimer);
    updateTimer = null;
  }

}

/* SEEK */

seekSlider.addEventListener('input', () => {

  seeking = true;

  const percent = Number(seekSlider.value);

  seekSlider.style.background =
    `linear-gradient(to right,
    #fff 0%,
    #fff ${percent}%,
    rgba(255,255,255,.28) ${percent}%,
    rgba(255,255,255,.28) 100%)`;

  const duration = ytPlayer && apiReady
    ? ytPlayer.getDuration() || 0
    : 0;

  $('currentTime').textContent = formatTime(duration * percent / 100);

});

function finishSeek() {

  if (!seeking) return;

  seeking = false;

  if (ytPlayer && apiReady) {

    const duration = ytPlayer.getDuration() || 0;

    if (duration > 0) {
      ytPlayer.seekTo(duration * Number(seekSlider.value) / 100, true);
    }

  }

  updateProgress();

}

seekSlider.addEventListener('change', finishSeek);
seekSlider.addEventListener('pointerup', finishSeek);
seekSlider.addEventListener('touchend', finishSeek);

/* =========================
   PLAY / PAUSE
========================= */

function togglePlay() {

  if (!ytPlayer || !apiReady) return;

  if (isPlaying) {
    ytPlayer.pauseVideo();
  } else {
    ytPlayer.playVideo();
  }

}

$('mainPlayBtn').addEventListener('click', togglePlay);
$('miniPlayBtn').addEventListener('click', togglePlay);

/* =========================
   SONG NAVIGATION
========================= */

function playSongAt(index) {

  if (index < 0 || index >= videos.length) return;

  currentIndex = index;

  const video = videos[currentIndex];

  if (!video || !video.videoId) return;

  const thumbnail = bestThumb(video);

  setSongInfo(video, thumbnail);

  resetProgress();

  if (apiReady && ytPlayer) {

    ytPlayer.loadVideoById({
      videoId: video.videoId,
      startSeconds: 0
    });

  } else {

    pendingVideoId = video.videoId;

  }

  showFullPlayer();

}

function nextSong() {

  if (currentIndex < 0 || !videos.length) return;

  let next = currentIndex + 1;

  // Playlist-এর শেষ গান হলে প্রথম গান থেকে শুরু
  if (next >= videos.length) {
    next = 0;
  }

  playSongAt(next);

}

function previousSong() {

  if (currentIndex < 0 || !videos.length) return;

  let previous = currentIndex - 1;

  // প্রথম গান হলে শেষ গান থেকে শুরু
  if (previous < 0) {
    previous = videos.length - 1;
  }

  playSongAt(previous);

}

$('nextBtn').addEventListener('click', nextSong);
$('prevBtn').addEventListener('click', previousSong);

function resetProgress() {

  seekSlider.value = 0;

  seekSlider.style.background =
    'linear-gradient(to right,#fff 0%,#fff 0%,rgba(255,255,255,.28) 0%,rgba(255,255,255,.28) 100%)';

  $('currentTime').textContent = '0:00';
  $('durationTime').textContent = '0:00';

}

/* =========================
   SONG INFORMATION
========================= */

function setSongInfo(video, thumbnail) {

  $('playingThumb').src = thumbnail;
  $('playingTitle').textContent = video.title || 'Unknown Song';
  $('playingArtist').textContent = video.author || 'YouTube';

  $('miniThumb').src = thumbnail;
  $('miniTitle').textContent = video.title || 'Unknown Song';
  $('miniArtist').textContent = video.author || 'YouTube';

  $('playerBg').style.backgroundImage =
    `url("${thumbnail}")`;

  const liked = getLikes().includes(video.videoId);

  $('likeBtn').classList.toggle('liked', liked);

}

/* =========================
   FULL & MINI PLAYER
========================= */

function showFullPlayer() {

  playerScreen.classList.add('active');
  miniPlayer.classList.remove('visible');

  document.body.classList.add('player-open');

}

function minimizePlayer() {

  if (currentIndex < 0) return;

  playerScreen.classList.remove('active');
  miniPlayer.classList.add('visible');

  document.body.classList.remove('player-open');

}

function expandPlayer() {

  if (currentIndex < 0) return;

  showFullPlayer();

}

$('minimizePlayer').addEventListener('click', minimizePlayer);

$('expandPlayer').addEventListener('click', expandPlayer);

/* Close mini player and stop playback */

$('miniCloseBtn').addEventListener('click', () => {

  if (ytPlayer && apiReady) {
    ytPlayer.stopVideo();
  }

  stopTimer();

  isPlaying = false;
  currentIndex = -1;

  miniPlayer.classList.remove('visible');
  playerScreen.classList.remove('active');

  document.body.classList.remove('player-open');

  updatePlayIcons();

});

/* =========================
   SWIPE DOWN TO MINIMIZE
========================= */

let touchStartY = 0;
let touchStartX = 0;

playerScreen.addEventListener('touchstart', e => {

  touchStartY = e.touches[0].clientY;
  touchStartX = e.touches[0].clientX;

}, {passive:true});

playerScreen.addEventListener('touchend', e => {

  const endY = e.changedTouches[0].clientY;
  const endX = e.changedTouches[0].clientX;

  const deltaY = endY - touchStartY;
  const deltaX = Math.abs(endX - touchStartX);

  if (deltaY > 85 && deltaY > deltaX * 1.3) {
    minimizePlayer();
  }

}, {passive:true});

/* =========================
   FAVOURITES
========================= */

function getLikes() {

  try {
    return JSON.parse(localStorage.getItem('soundflow_likes') || '[]');
  } catch(e) {
    return [];
  }

}

$('likeBtn').addEventListener('click', () => {

  if (currentIndex < 0) return;

  const id = videos[currentIndex].videoId;

  let likes = getLikes();

  if (likes.includes(id)) {
    likes = likes.filter(x => x !== id);
  } else {
    likes.push(id);
  }

  localStorage.setItem('soundflow_likes', JSON.stringify(likes));

  $('likeBtn').classList.toggle('liked', likes.includes(id));

});

/* =========================
   THUMBNAILS
========================= */

function bestThumb(video) {

  const thumbnails = video.videoThumbnails || [];

  return (
    thumbnails.find(x => x.quality === 'maxres') ||
    thumbnails.find(x => x.quality === 'high') ||
    thumbnails.find(x => x.quality === 'medium') ||
    thumbnails[0] ||
    {}
  ).url || `https://i.ytimg.com/vi/${video.videoId}/hqdefault.jpg`;

}

/* =========================
   SEARCH CARDS
========================= */

function makeCard(video, index) {

  const card = document.createElement('article');

  card.className = 'card';
  card.tabIndex = 0;

  const img = document.createElement('img');

  img.className = 'thumb';
  img.loading = 'lazy';
  img.src = bestThumb(video);
  img.alt = video.title || 'Song artwork';

  const title = document.createElement('div');

  title.className = 'title';
  title.textContent = video.title || 'Untitled';

  const artist = document.createElement('div');

  artist.className = 'artist';
  artist.textContent = video.author || 'YouTube';

  card.append(img,title,artist);

  const play = () => playSongAt(index);

  card.addEventListener('click', play);

  card.addEventListener('keydown', e => {

    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      play();
    }

  });

  return card;

}

/* =========================
   SEARCH SYSTEM
========================= */

async function search(query, pageNumber = 1, append = false) {

  if (busy) return;

  busy = true;

  const token = ++searchToken;

  statusEl.textContent = 'গান লোড হচ্ছে…';

  more.hidden = true;

  if (!append) {
    results.innerHTML = '<div class="empty">গান খোঁজা হচ্ছে…</div>';
  }

  let data = null;

  for (const base of instances) {

    if (token !== searchToken) return;

    try {

      const controller = new AbortController();

      const timeout = setTimeout(() => controller.abort(), 7000);

      const response = await fetch(
        `${base}/api/v1/search?q=${encodeURIComponent(query)}&type=video&page=${pageNumber}`,
        {signal:controller.signal}
      );

      clearTimeout(timeout);

      if (!response.ok) continue;

      const json = await response.json();

      if (Array.isArray(json)) {
        data = json;
        break;
      }

    } catch(e) {}

  }

  if (token !== searchToken) return;

  if (!data) {

    if (!append) {
      results.innerHTML =
        '<div class="empty">সার্ভার সংযোগে ব্যর্থ। পরে আবার চেষ্টা করুন।</div>';
    }

    statusEl.textContent = 'Server Error';

    busy = false;

    return;

  }

  const found = data.filter(v => v.type === 'video' && v.videoId);

  if (!append) {

    videos = [];
    results.innerHTML = '';

  }

  const existingIds = new Set(videos.map(v => v.videoId));

  const newVideos = found.filter(v => !existingIds.has(v.videoId));

  newVideos.forEach(video => {

    videos.push(video);

    const index = videos.length - 1;

    results.appendChild(makeCard(video,index));

  });

  if (!videos.length) {

    results.innerHTML =
      '<div class="empty">কোনো গান পাওয়া যায়নি। অন্য নাম দিয়ে Search করুন।</div>';

  }

  page = pageNumber;
  currentQuery = query;

  heading.textContent =
    append || pageNumber > 1 ? 'Search Results' : 'Trending All Songs';

  statusEl.textContent = videos.length + 'টি গান';

  more.hidden = newVideos.length === 0;

  busy = false;

}

/* =========================
   SEARCH EVENTS
========================= */

form.addEventListener('submit', e => {

  e.preventDefault();

  const q = input.value.trim();

  if (q) {
    search(q,1,false);
  }

});

more.addEventListener('click', () => {

  if (currentQuery) {
    search(currentQuery,page + 1,true);
  }

});

/* =========================
   INITIAL LOAD
========================= */

window.addEventListener('DOMContentLoaded', () => {

  search(currentQuery,1,false);

});

/* INITIAL ICONS */

updatePlayIcons();

</script>
