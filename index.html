<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>My Music Player</title>

<link rel="apple-touch-icon"
sizes="180x180"
href="logo.png">

<link rel="icon"
type="image/png"
href="logo.png">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;

    background:#d9d9d9;

    color:#111;

    user-select:none;
}


/* =========================================================
   FULL SCREEN IPOD BACKGROUND
========================================================= */

body::before{
    content:"";

    position:fixed;
    inset:0;

    background:
    radial-gradient(
        ellipse at center top,
        #ffffff 0%,
        #eeeeee 22%,
        #cfcfcf 55%,
        #a9a9a9 100%
    );

    z-index:-10;
}


/* =========================================================
   METAL BRUSH EFFECT
========================================================= */

body::after{
    content:"";

    position:fixed;
    inset:0;

    background:
    repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.08) 0px,
        rgba(255,255,255,.08) 1px,
        rgba(0,0,0,.025) 2px,
        transparent 3px
    );

    pointer-events:none;

    z-index:-9;
}


/* =========================================================
   IPOD DEVICE
========================================================= */

.ipod{
    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    background:
    linear-gradient(
        110deg,
        #fafafa 0%,
        #dedede 20%,
        #f8f8f8 42%,
        #cfcfcf 67%,
        #f4f4f4 100%
    );

    box-shadow:
    inset 0 0 80px rgba(0,0,0,.15);

    overflow:hidden;
}


/* =========================================================
   TOP IPOD AREA
========================================================= */

.ipod-top{
    width:100%;

    height:10vh;
    min-height:58px;

    display:flex;

    align-items:flex-end;
    justify-content:center;

    padding-bottom:10px;

    flex-shrink:0;
}

.apple-logo{
    font-size:clamp(16px,4vw,25px);

    color:#555;

    font-weight:600;

    letter-spacing:-1px;

    text-shadow:
    0 1px 1px #fff;
}


/* =========================================================
   SCREEN FRAME
========================================================= */

.screen-frame{

    position:relative;

    width:min(92vw,520px);

    height:min(48vh,420px);

    min-height:260px;

    background:#777;

    padding:9px;

    border-radius:10px;

    box-shadow:
    0 5px 12px rgba(0,0,0,.35),
    inset 0 1px 1px rgba(255,255,255,.7);

    flex-shrink:0;
}


/* =========================================================
   SCREEN
========================================================= */

.screen{

    width:100%;
    height:100%;

    border-radius:4px;

    overflow:hidden;

    background:
    linear-gradient(
        180deg,
        #fafafa,
        #ededed
    );

    border:2px solid #222;

    box-shadow:
    inset 0 0 12px rgba(0,0,0,.25);

    display:flex;

    flex-direction:column;
}


/* =========================================================
   IPOD STATUS BAR
========================================================= */

.status-bar{

    height:30px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 10px;

    color:#fff;

    background:
    linear-gradient(
        180deg,
        #666,
        #222
    );

    font-size:11px;

    font-weight:700;
}

.status-left{
    display:flex;
    align-items:center;
    gap:6px;
}

.status-center{
    position:absolute;

    left:50%;

    transform:translateX(-50%);

    font-size:10px;
}

.status-right{
    display:flex;

    align-items:center;

    gap:5px;
}


/* battery */

.battery{
    width:18px;
    height:9px;

    border:1px solid #fff;

    border-radius:2px;

    position:relative;
}

.battery::after{
    content:"";

    position:absolute;

    right:-3px;
    top:2px;

    width:2px;
    height:4px;

    background:#fff;
}

.battery-level{
    width:75%;
    height:100%;

    background:#fff;
}


/* =========================================================
   NOW PLAYING SCREEN
========================================================= */

.now-screen{

    flex:1;

    padding:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:18px;

    min-height:0;
}


/* =========================================================
   COVER
========================================================= */

.cover-area{

    width:clamp(120px,30vw,190px);

    aspect-ratio:1;

    flex-shrink:0;
}

.cover{

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    border:1px solid #555;

    box-shadow:
    0 3px 7px rgba(0,0,0,.35);
}


/* =========================================================
   SONG DETAILS
========================================================= */

.song-details{

    min-width:0;

    flex:1;

    display:flex;

    flex-direction:column;

    justify-content:center;
}

.now-label{

    font-size:10px;

    font-weight:700;

    color:#777;

    margin-bottom:7px;
}

.title{

    font-size:clamp(15px,3vw,23px);

    line-height:1.1;

    font-weight:800;

    color:#111;

    overflow:hidden;

    text-overflow:ellipsis;

    display:-webkit-box;

    -webkit-line-clamp:2;

    -webkit-box-orient:vertical;
}

.artist{

    font-size:clamp(10px,2vw,13px);

    color:#555;

    margin-top:7px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


/* =========================================================
   PROGRESS
========================================================= */

.seek{

    width:100%;

    height:8px;

    margin-top:22px;

    background:#aaa;

    border:1px solid #777;

    border-radius:1px;

    position:relative;

    touch-action:none;
}

.fill{

    position:absolute;

    left:0;
    top:0;

    width:0;
    height:100%;

    background:
    linear-gradient(
        180deg,
        #555,
        #111
    );
}

.time{

    display:flex;

    justify-content:space-between;

    margin-top:5px;

    font-size:9px;

    color:#555;

    font-variant-numeric:tabular-nums;
}


/* =========================================================
   CLICK WHEEL SECTION
========================================================= */

.wheel-area{

    flex:1;

    width:100%;

    min-height:0;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;
}


/* =========================================================
   CLICK WHEEL
========================================================= */

.click-wheel{

    position:relative;

    width:min(53vw,330px);

    height:min(53vw,330px);

    max-width:330px;
    max-height:330px;

    min-width:190px;
    min-height:190px;

    border-radius:50%;

    background:
    radial-gradient(
        circle at 35% 25%,
        #ffffff 0%,
        #eeeeee 28%,
        #d9d9d9 62%,
        #bcbcbc 100%
    );

    border:2px solid #999;

    box-shadow:
    0 8px 18px rgba(0,0,0,.35),
    inset 0 2px 2px #fff,
    inset 0 -5px 12px rgba(0,0,0,.15);

    flex-shrink:0;
}


/* =========================================================
   CENTER BUTTON
========================================================= */

.select-button{

    position:absolute;

    width:38%;

    aspect-ratio:1;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    border:1px solid #aaa;

    background:
    radial-gradient(
        circle,
        #fafafa,
        #ddd
    );

    box-shadow:
    inset 0 2px 3px #fff,
    0 2px 5px rgba(0,0,0,.25);

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:clamp(9px,2vw,13px);

    font-weight:800;

    color:#555;
}

.select-button:active{
    transform:
    translate(-50%,-50%)
    scale(.94);
}


/* =========================================================
   WHEEL BUTTONS
========================================================= */

.wheel-btn{

    position:absolute;

    width:24%;

    height:18%;

    border:0;

    background:transparent;

    color:#555;

    font-size:clamp(10px,2.5vw,16px);

    font-weight:800;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.wheel-btn:active{
    color:#111;

    transform:scale(.85);
}


.menu-btn{

    top:5%;
    left:38%;
}

.prev-btn{

    left:5%;
    top:41%;
}

.next-btn{

    right:5%;
    top:41%;
}

.play-btn{

    bottom:5%;
    left:38%;
}


/* =========================================================
   EXTRA TOP/BOTTOM SHADOW
========================================================= */

.bottom-metal{

    width:100%;

    height:8vh;

    min-height:35px;

    flex-shrink:0;

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,.5),
        rgba(0,0,0,.08)
    );

    border-top:1px solid rgba(255,255,255,.7);

    display:flex;

    align-items:center;
    justify-content:center;

    color:#777;

    font-size:9px;

    letter-spacing:2px;

    font-weight:700;
}


/* =========================================================
   PLAYLIST SCREEN
========================================================= */

.playlist-screen{

    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;

    justify-content:center;

    background:
    linear-gradient(
        135deg,
        #f7f7f7,
        #cfcfcf
    );
}

.playlist-screen.open{

    display:flex;
}

.playlist-inner{

    width:min(92vw,520px);

    height:min(80vh,650px);

    background:#eee;

    border:10px solid #777;

    border-radius:10px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.5);

    display:flex;

    flex-direction:column;

    overflow:hidden;
}


/* playlist header */

.playlist-header{

    height:42px;

    background:
    linear-gradient(
        180deg,
        #777,
        #222
    );

    color:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 10px;

    flex-shrink:0;
}

.playlist-title{

    font-size:12px;

    font-weight:800;
}

.close-playlist{

    border:0;

    background:transparent;

    color:white;

    font-size:18px;
}


/* search */

.search-area{

    padding:7px;

    background:#ddd;

    border-bottom:1px solid #999;

    display:flex;

    gap:5px;

    flex-shrink:0;
}

.search-input{

    flex:1;

    height:30px;

    border:1px solid #888;

    border-radius:4px;

    padding:0 8px;

    background:white;

    outline:none;

    font-size:11px;
}

.clear-search{

    width:30px;

    border:1px solid #888;

    background:#eee;

    border-radius:4px;
}


/* song list */

.song-list{

    flex:1;

    overflow-y:auto;

    padding:6px;

    background:#eee;
}

.song-item{

    min-height:48px;

    display:flex;

    align-items:center;

    gap:8px;

    padding:5px;

    border-bottom:1px solid #bbb;

    background:#eee;
}

.song-item.active{

    background:
    linear-gradient(
        180deg,
        #777,
        #333
    );

    color:white;
}

.song-item img{

    width:38px;
    height:38px;

    object-fit:cover;

    border:1px solid #777;

    flex-shrink:0;
}

.song-info{

    min-width:0;

    flex:1;
}

.song-name{

    font-size:10px;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.song-artist{

    font-size:8px;

    opacity:.65;

    margin-top:3px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =========================================================
   VIDEO SCREEN
========================================================= */

.video-overlay{

    position:fixed;

    inset:0;

    z-index:200;

    display:none;

    background:
    linear-gradient(
        135deg,
        #e8e8e8,
        #aaa
    );
}

.video-overlay.open{

    display:flex;

    align-items:center;

    justify-content:center;
}

.video-device{

    width:min(94vw,800px);

    background:#777;

    padding:10px;

    border-radius:12px;

    box-shadow:
    0 20px 60px rgba(0,0,0,.7);
}

.video-screen{

    width:100%;

    aspect-ratio:16/9;

    background:#000;

    border:2px solid #222;

    position:relative;

    overflow:hidden;
}

#yt{

    width:100%;
    height:100%;
}

.video-close{

    position:absolute;

    top:8px;
    right:8px;

    width:34px;
    height:34px;

    border-radius:50%;

    border:1px solid #777;

    background:#ddd;

    color:#333;

    font-weight:800;

    z-index:10;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .ipod-top{

        height:7vh;

        min-height:42px;
    }

    .screen-frame{

        width:94vw;

        height:34vh;

        min-height:220px;
    }

    .now-screen{

        gap:10px;

        padding:8px;
    }

    .cover-area{

        width:34vw;

        max-width:145px;
    }

    .title{

        font-size:14px;
    }

    .artist{

        font-size:9px;
    }

    .seek{

        margin-top:13px;
    }

    .wheel-area{

        padding:10px;
    }

    .click-wheel{

        width:55vw;
        height:55vw;

        min-width:190px;
        min-height:190px;

        max-width:300px;
        max-height:300px;
    }

    .bottom-metal{

        height:5vh;

        min-height:25px;
    }

}


/* =========================================================
   SMALL PHONES
========================================================= */

@media(max-height:700px){

    .ipod-top{

        height:5vh;
    }

    .screen-frame{

        height:32vh;

        min-height:190px;
    }

    .wheel-area{

        padding:5px;
    }

    .click-wheel{

        width:47vh;
        height:47vh;

        min-width:170px;
        min-height:170px;
    }

    .bottom-metal{

        height:4vh;
    }

}


/* =========================================================
   LANDSCAPE
========================================================= */

@media(
    orientation:landscape
) and (max-height:600px){

    .ipod{

        flex-direction:row;

        align-items:center;

        justify-content:center;

        gap:30px;
    }

    .ipod-top,
    .bottom-metal{

        display:none;
    }

    .screen-frame{

        width:45vw;

        height:80vh;

        min-height:200px;
    }

    .wheel-area{

        width:40vw;

        height:100vh;

        flex:none;
    }

}


/* =========================================================
   HIDE OLD ELEMENTS
========================================================= */

.digital-clock,
.bg,
.drawer-overlay,
.playlist-drawer,
.video-section,
#videoSection{

    display:none!important;
}

</style>
</head>

<script src="https://www.youtube.com/iframe_api"></script>


<script>

/* =========================================================
   PLAYLIST
========================================================= */

const PLAYLIST_ID="PLbvY05KVYwoo";

let player=null;

let playing=false;

let sortedPlaylistData=[];

let sortedPlaylistItems=[];

let currentSortedIndex=0;

let changingTrack=false;

let isDragging=false;


/* =========================================================
   CLOCK
========================================================= */

function updateClock(){

    const now=new Date();

    const time=
    new Intl.DateTimeFormat(
        "en-US",
        {
            timeZone:"Asia/Dhaka",
            hour:"2-digit",
            minute:"2-digit",
            hour12:true
        }
    ).format(now);

    document.getElementById(
        "clockTime"
    ).textContent=time;

}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =========================================================
   YOUTUBE READY
========================================================= */

function onYouTubeIframeAPIReady(){

    player=new YT.Player(
        "yt",
        {

            width:"100%",
            height:"100%",

            playerVars:{
                autoplay:0,
                controls:1,
                disablekb:0,
                fs:1,
                modestbranding:1,
                playsinline:1,
                rel:0,
                iv_load_policy:3,
                listType:"playlist",
                list:PLAYLIST_ID
            },

            events:{
                onReady:onPlayerReady,
                onStateChange:onPlayerState
            }

        }
    );

}


/* =========================================================
   PLAYER READY
========================================================= */

function onPlayerReady(){

    loadPlaylist();

    setInterval(
        updateProgress,
        250
    );

}


/* =========================================================
   PLAYER STATE
========================================================= */

function onPlayerState(e){

    const icon=
    document.getElementById(
        "playIcon"
    );

    if(
        e.data===YT.PlayerState.PLAYING
    ){

        playing=true;

        icon.textContent="Ⅱ";

        updateInfo();

    }

    else if(
        e.data===YT.PlayerState.PAUSED
    ){

        playing=false;

        icon.textContent="▶";

    }

    else if(
        e.data===YT.PlayerState.ENDED
    ){

        playing=false;

        icon.textContent="▶";

        if(!changingTrack){

            nextSong();

        }

    }

    highlightActive();

}


/* =========================================================
   PLAY PAUSE
========================================================= */

function togglePlay(){

    if(!player)
    return;

    if(playing){

        player.pauseVideo();

    }else{

        player.playVideo();

    }

}


/* =========================================================
   NEXT
========================================================= */

function nextSong(){

    if(
        !player ||
        !sortedPlaylistItems.length
    )
    return;

    let id="";

    try{

        id=
        player
        .getVideoData()
        .video_id;

    }catch(e){}

    const found=
    sortedPlaylistItems.indexOf(id);

    if(found>=0){

        currentSortedIndex=found;

    }

    currentSortedIndex=
    (
        currentSortedIndex+1
    )%
    sortedPlaylistItems.length;

    playTrack(
        currentSortedIndex
    );

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousSong(){

    if(
        !player ||
        !sortedPlaylistItems.length
    )
    return;

    let id="";

    try{

        id=
        player
        .getVideoData()
        .video_id;

    }catch(e){}

    const found=
    sortedPlaylistItems.indexOf(id);

    if(found>=0){

        currentSortedIndex=found;

    }

    currentSortedIndex=
    (
        currentSortedIndex-
        1+
        sortedPlaylistItems.length
    )%
    sortedPlaylistItems.length;

    playTrack(
        currentSortedIndex
    );

}


/* =========================================================
   PLAY TRACK
========================================================= */

function playTrack(index){

    if(
        !player ||
        !sortedPlaylistData[index]
    )
    return;

    currentSortedIndex=index;

    const track=
    sortedPlaylistData[index];

    changingTrack=true;

    forceUpdate(track);

    player.loadVideoById(
        track.id
    );

    setTimeout(
        ()=>{
            changingTrack=false;
        },
        700
    );

    closePlaylist();

}


/* =========================================================
   UPDATE INFO
========================================================= */

function updateInfo(){

    if(!player)
    return;

    try{

        const data=
        player.getVideoData();

        if(
            !data ||
            !data.video_id
        )
        return;

        document.getElementById(
            "cover"
        ).src=
        `https://i.ytimg.com/vi/${data.video_id}/hqdefault.jpg`;

        document.getElementById(
            "title"
        ).textContent=
        data.title ||
        "YouTube Music";

        document.getElementById(
            "artist"
        ).textContent=
        data.author ||
        "YouTube Music";

    }catch(e){}

}


/* =========================================================
   FORCE UPDATE
========================================================= */

function forceUpdate(track){

    document.getElementById(
        "cover"
    ).src=
    `https://i.ytimg.com/vi/${track.id}/hqdefault.jpg`;

    document.getElementById(
        "title"
    ).textContent=
    track.title;

    document.getElementById(
        "artist"
    ).textContent=
    track.artist;

}


/* =========================================================
   LOAD PLAYLIST
========================================================= */

function loadPlaylist(){

    if(
        !player ||
        typeof player.getPlaylist!=="function"
    ){

        setTimeout(
            loadPlaylist,
            500
        );

        return;
    }

    const ids=
    player.getPlaylist();

    if(
        !ids ||
        !ids.length
    ){

        setTimeout(
            loadPlaylist,
            500
        );

        return;
    }


    const requests=
    ids.map(
        (id,index)=>{

            return fetch(
                `https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`
            )

            .then(
                r=>r.json()
            )

            .then(
                data=>({

                    id:id,

                    title:
                    data.title ||
                    `Track ${index+1}`,

                    artist:
                    data.author_name ||
                    "YouTube Music"

                })
            )

            .catch(
                ()=>({

                    id:id,

                    title:
                    `Track ${index+1}`,

                    artist:
                    "YouTube Music"

                })
            );

        }
    );


    Promise.all(requests)
    .then(
        results=>{

            results.sort(
                (a,b)=>
                a.title.localeCompare(
                    b.title,
                    undefined,
                    {
                        numeric:true,
                        sensitivity:"base"
                    }
                )
            );

            sortedPlaylistData=
            results;

            sortedPlaylistItems=
            results.map(
                x=>x.id
            );

            renderPlaylist();

            updateInfo();

        }
    );

}


/* =========================================================
   RENDER PLAYLIST
========================================================= */

function renderPlaylist(){

    const list=
    document.getElementById(
        "songList"
    );

    list.innerHTML="";


    sortedPlaylistData.forEach(
        (track,index)=>{

            const item=
            document.createElement(
                "div"
            );

            item.className=
            "song-item";

            item.dataset.index=
            index;


            item.innerHTML=`

                <img
                    src="https://i.ytimg.com/vi/${track.id}/hqdefault.jpg"
                >

                <div class="song-info">

                    <div class="song-name">
                        ${escapeHtml(track.title)}
                    </div>

                    <div class="song-artist">
                        ${escapeHtml(track.artist)}
                    </div>

                </div>

            `;


            item.onclick=()=>{
                playTrack(index);
            };


            list.appendChild(
                item
            );

        }
    );


    highlightActive();

}


/* =========================================================
   ACTIVE SONG
========================================================= */

function highlightActive(){

    if(!player)
    return;

    let id="";

    try{

        id=
        player
        .getVideoData()
        .video_id;

    }catch(e){}


    document
    .querySelectorAll(
        ".song-item"
    )
    .forEach(
        (item,index)=>{

            item.classList.toggle(
                "active",
                sortedPlaylistItems[index]===id
            );

        }
    );

}


/* =========================================================
   PLAYLIST OPEN
========================================================= */

function openPlaylist(){

    document
    .getElementById(
        "playlistScreen"
    )
    .classList.add(
        "open"
    );

}


/* =========================================================
   PLAYLIST CLOSE
========================================================= */

function closePlaylist(){

    document
    .getElementById(
        "playlistScreen"
    )
    .classList.remove(
        "open"
    );

}


/* =========================================================
   SEARCH
========================================================= */

function filterPlaylist(query){

    query=
    query
    .toLowerCase()
    .trim();


    document
    .querySelectorAll(
        ".song-item"
    )
    .forEach(
        item=>{

            const title=
            item
            .querySelector(
                ".song-name"
            )
            .textContent
            .toLowerCase();

            const artist=
            item
            .querySelector(
                ".song-artist"
            )
            .textContent
            .toLowerCase();


            item.style.display=
            (
                title.includes(query) ||
                artist.includes(query)
            )
            ?
            "flex"
            :
            "none";

        }
    );

}


/* =========================================================
   CLEAR SEARCH
========================================================= */

function clearSearch(){

    const input=
    document.getElementById(
        "searchInput"
    );

    input.value="";

    filterPlaylist("");

}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(){

    if(
        isDragging ||
        !player
    )
    return;

    try{

        const current=
        player.getCurrentTime();

        const duration=
        player.getDuration();

        if(!duration)
        return;


        const percentage=
        (
            current/
            duration
        )*100;


        document.getElementById(
            "fill"
        ).style.width=
        percentage+"%";


        document.getElementById(
            "current"
        ).textContent=
        formatTime(current);


        document.getElementById(
            "duration"
        ).textContent=
        formatTime(duration);

    }catch(e){}

}


/* =========================================================
   FORMAT
========================================================= */

function formatTime(sec){

    if(
        !sec ||
        isNaN(sec)
    )
    return "0:00";

    sec=Math.floor(sec);

    return (
        Math.floor(sec/60)
        +
        ":"
        +
        String(
            sec%60
        ).padStart(2,"0")
    );

}


/* =========================================================
   SEEK
========================================================= */

const seek=
document.getElementById(
    "seek"
);


function seekAt(x){

    const rect=
    seek.getBoundingClientRect();

    const percentage=
    Math.max(
        0,
        Math.min(
            1,
            (
                x-
                rect.left
            )/
            rect.width
        )
    );


    document.getElementById(
        "fill"
    ).style.width=
    (
        percentage*100
    )+"%";


    return percentage;

}


seek.addEventListener(
    "pointerdown",
    e=>{

        isDragging=true;

        seekAt(
            e.clientX
        );

    }
);


seek.addEventListener(
    "pointermove",
    e=>{

        if(!isDragging)
        return;

        seekAt(
            e.clientX
        );

    }
);


seek.addEventListener(
    "pointerup",
    e=>{

        if(!isDragging)
        return;

        const percentage=
        seekAt(
            e.clientX
        );

        if(
            player &&
            player.getDuration()
        ){

            player.seekTo(
                percentage*
                player.getDuration(),
                true
            );

        }

        isDragging=false;

    }
);


/* =========================================================
   VIDEO
========================================================= */

function openVideo(){

    document
    .getElementById(
        "videoOverlay"
    )
    .classList.add(
        "open"
    );

}


function closeVideo(){

    document
    .getElementById(
        "videoOverlay"
    )
    .classList.remove(
        "open"
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text){

    const div=
    document.createElement(
        "div"
    );

    div.textContent=
    text || "";

    return div.innerHTML;

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.code==="Space"
        ){

            e.preventDefault();

            togglePlay();

        }

        if(
            e.key==="ArrowRight"
        ){

            nextSong();

        }

        if(
            e.key==="ArrowLeft"
        ){

            previousSong();

        }

        if(
            e.key==="Escape"
        ){

            closePlaylist();

            closeVideo();

        }

    }
);

</script>
