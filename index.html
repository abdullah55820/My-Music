<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Music App</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #1c1c1e;
      --accent: #fa233b;
      --text-sub: #8e8e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    /* Main App Screen */
    .app-screen {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px 16px 120px 16px;
    }

    .top-header {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .profile-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Horizontal Banner / Charts Section */
    .section-header {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .horizontal-scroll {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 24px;
      scrollbar-width: none;
    }
    .horizontal-scroll::-webkit-scrollbar { display: none; }

    .banner-card {
      min-width: 280px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .banner-img-wrap {
      width: 100%;
      height: 160px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background: #2c2c2e;
    }

    .banner-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .banner-title {
      font-size: 16px;
      font-weight: 700;
      margin-top: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .banner-sub {
      font-size: 14px;
      color: var(--text-sub);
    }

    /* Song Mixes List */
    .mixes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .mixes-title {
      font-size: 22px;
      font-weight: 700;
    }

    .see-all {
      color: var(--accent);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .track-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      cursor: pointer;
    }

    .track-left {
      display: flex;
      align-items: center;
      gap: 16px;
      overflow: hidden;
    }

    .track-index {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      width: 16px;
      text-align: center;
    }

    .track-left img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .track-meta {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .t-title {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .t-artist {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Floating Mini Player (Above Nav Bar) */
    .mini-player {
      position: fixed;
      bottom: 70px;
      left: 12px;
      right: 12px;
      height: 60px;
      background: rgba(40, 40, 44, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 99;
      cursor: pointer;
    }

    .mini-left {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
      width: 65%;
    }

    .mini-left img {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .mini-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-icon {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(20, 20, 22, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 0.5px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 98;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-sub);
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--accent);
    }

    /* FULLSCREEN PLAYER (Slide up) */
    .full-player {
      position: fixed;
      top: 100%;
      left: 0;
      right: 0;
      bottom: 0;
      background: #111113;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 24px 36px 24px;
      transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .full-player.expanded {
      transform: translateY(-100%);
    }

    .grab-handle {
      width: 36px;
      height: 5px;
      background: rgba(255,255,255,0.3);
      border-radius: 3px;
      margin: 0 auto 12px auto;
    }

    .full-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .art-box {
      width: 100%;
      aspect-ratio: 1/1;
      margin: 16px 0;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .art-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .art-box img.paused { transform: scale(0.85); }

    .track-details-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .f-title { font-size: 22px; font-weight: 700; }
    .f-artist { font-size: 16px; color: var(--text-sub); margin-top: 2px; }

    /* Timeline */
    .timeline {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      margin-bottom: 24px;
      cursor: pointer;
      position: relative;
    }

    .timeline-fill {
      width: 0%;
      height: 100%;
      background: #fff;
      border-radius: 2px;
    }

    .playback-controls {
      display: flex;
      align-items: center;
      justify-content: space-around;
      margin-bottom: 24px;
    }

    .sub-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-sub);
      padding: 0 10px;
    }

    #yt-hidden { position: absolute; top: -9999px; left: -9999px; }
  </style>
</head>
<body>

  <!-- Home Screen Content -->
  <div class="app-screen" id="mainScreen">
    <div class="top-header">
      Home
      <div class="profile-icon"><i data-lucide="user" size="18"></i></div>
    </div>

    <!-- Charts / Horizontal Banners -->
    <div class="section-header">Charts (India)</div>
    <div class="horizontal-scroll">
      <div class="banner-card" onclick="playSongIndex(0)">
        <div class="banner-img-wrap"><img src="https://img.youtube.com/vi/kJQP7kiw5Fk/hqdefault.jpg" alt=""></div>
        <div class="banner-title">Despacito (Remix Anthem)</div>
        <div class="banner-sub">Luis Fonsi</div>
      </div>
      <div class="banner-card" onclick="playSongIndex(1)">
        <div class="banner-img-wrap"><img src="https://img.youtube.com/vi/JGwWNGJdvx8/hqdefault.jpg" alt=""></div>
        <div class="banner-title">Shape of You</div>
        <div class="banner-sub">Ed Sheeran</div>
      </div>
    </div>

    <!-- Song Mixes -->
    <div class="mixes-header">
      <div class="mixes-title">Song mixes</div>
      <div class="see-all">See all</div>
    </div>

    <div id="mixesList"></div>
  </div>

  <!-- Mini Player -->
  <div class="mini-player" id="miniPlayer" onclick="expandPlayer()">
    <div class="mini-left">
      <img id="mImg" src="https://via.placeholder.com/40" alt="">
      <div class="track-meta">
        <div class="t-title" id="mTitle">Not Playing</div>
        <div class="t-artist" id="mArtist">Select a song</div>
      </div>
    </div>
    <div class="mini-controls" onclick="event.stopPropagation()">
      <button class="btn-icon" style="color:var(--accent);"><i data-lucide="heart" size="20" fill="currentColor"></i></button>
      <button class="btn-icon" onclick="togglePlay()"><i data-lucide="play" size="22" fill="currentColor" id="miniPlayIcon"></i></button>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <div class="nav-item active"><i data-lucide="home" size="22"></i>Home</div>
    <div class="nav-item"><i data-lucide="radio" size="22"></i>Charts</div>
    <div class="nav-item"><i data-lucide="library" size="22"></i>Library</div>
    <div class="nav-item"><i data-lucide="search" size="22"></i>Search</div>
  </div>

  <!-- Fullscreen Expanded Player -->
  <div class="full-player" id="fullPlayer">
    <div>
      <div class="grab-handle"></div>
      <div class="full-top-bar">
        <button class="btn-icon" onclick="collapsePlayer()"><i data-lucide="chevron-down" size="28"></i></button>
        <div style="font-size:12px; font-weight:600; color:var(--text-sub);">PLAYING FROM MIXES</div>
        <button class="btn-icon"><i data-lucide="more-horizontal" size="22"></i></button>
      </div>

      <div class="art-box">
        <img id="fImg" class="paused" src="https://via.placeholder.com/300" alt="">
      </div>

      <div class="track-details-row">
        <div>
          <div class="f-title" id="fTitle">Song Title</div>
          <div class="f-artist" id="fArtist">Artist Name</div>
        </div>
        <button class="btn-icon" style="color:var(--accent);"><i data-lucide="heart" size="26" fill="currentColor"></i></button>
      </div>

      <div class="timeline" onclick="seek(event)">
        <div class="timeline-fill" id="timeFill"></div>
      </div>

      <div class="playback-controls">
        <button class="btn-icon" onclick="prevSong()"><i data-lucide="skip-back" size="36" fill="currentColor"></i></button>
        <button class="btn-icon" onclick="togglePlay()"><i data-lucide="play" size="52" fill="currentColor" id="fullPlayIcon"></i></button>
        <button class="btn-icon" onclick="nextSong()"><i data-lucide="skip-forward" size="36" fill="currentColor"></i></button>
      </div>

      <div class="sub-controls">
        <button class="btn-icon"><i data-lucide="quote" size="20"></i></button>
        <button class="btn-icon"><i data-lucide="airplay" size="20"></i></button>
        <button class="btn-icon"><i data-lucide="list-music" size="20"></i></button>
      </div>
    </div>
  </div>

  <div id="yt-hidden"><div id="player"></div></div>

  <script>
    lucide.createIcons();

    // YouTube API Integration
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    var player;
    var isPlaying = false;
    var currentIndex = 0;
    var progressTimer;

    const songs = [
      { id: "kJQP7kiw5Fk", title: "Despacito (Remix)", artist: "Luis Fonsi, Daddy Yankee", img: "https://img.youtube.com/vi/kJQP7kiw5Fk/hqdefault.jpg" },
      { id: "JGwWNGJdvx8", title: "Shape of You", artist: "Ed Sheeran", img: "https://img.youtube.com/vi/JGwWNGJdvx8/hqdefault.jpg" },
      { id: "OPf0YbXqDM0", title: "Uptown Funk", artist: "Mark Ronson, Bruno Mars", img: "https://img.youtube.com/vi/OPf0YbXqDM0/hqdefault.jpg" },
      { id: "kJQP7kiw5Fk", title: "Tomare Na Dekhile", artist: "Hridoy Khan", img: "https://img.youtube.com/vi/kJQP7kiw5Fk/hqdefault.jpg" }
    ];

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '0', width: '0',
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data == YT.PlayerState.PLAYING) {
        isPlaying = true;
        updatePlayerUI(true);
        startTracker();
      } else {
        isPlaying = false;
        updatePlayerUI(false);
        stopTracker();
      }
    }

    function renderMixes() {
      const container = document.getElementById('mixesList');
      container.innerHTML = '';
      songs.forEach((song, idx) => {
        const row = document.createElement('div');
        row.className = 'track-row';
        row.onclick = () => {
          playSongIndex(idx);
          expandPlayer();
        };
        row.innerHTML = `
          <div class="track-left">
            <span class="track-index">${idx + 1}</span>
            <img src="${song.img}" alt="">
            <div class="track-meta">
              <div class="t-title">${song.title}</div>
              <div class="t-artist">${song.artist}</div>
            </div>
          </div>
          <button class="btn-icon" style="color:var(--text-sub);"><i data-lucide="more-horizontal" size="18"></i></button>
        `;
        container.appendChild(row);
      });
      lucide.createIcons();
    }

    function playSongIndex(idx) {
      currentIndex = idx;
      const song = songs[idx];
      
      document.getElementById('mTitle').innerText = song.title;
      document.getElementById('mArtist').innerText = song.artist;
      document.getElementById('mImg').src = song.img;

      document.getElementById('fTitle').innerText = song.title;
      document.getElementById('fArtist').innerText = song.artist;
      document.getElementById('fImg').src = song.img;

      if(player && player.loadVideoById) {
        player.loadVideoById(song.id);
      }
    }

    function togglePlay() {
      if(!player) return;
      if(isPlaying) player.pauseVideo();
      else player.playVideo();
    }

    function updatePlayerUI(playing) {
      const mIcon = document.getElementById('miniPlayIcon');
      const fIcon = document.getElementById('fullPlayIcon');
      const fImg = document.getElementById('fImg');

      if(playing) {
        mIcon.setAttribute('data-lucide', 'pause');
        fIcon.setAttribute('data-lucide', 'pause');
        fImg.classList.remove('paused');
      } else {
        mIcon.setAttribute('data-lucide', 'play');
        fIcon.setAttribute('data-lucide', 'play');
        fImg.classList.add('paused');
      }
      lucide.createIcons();
    }

    function expandPlayer() {
      document.getElementById('fullPlayer').classList.add('expanded');
    }

    function collapsePlayer() {
      document.getElementById('fullPlayer').classList.remove('expanded');
    }

    // Swipe down gesture to minimize player
    let startY = 0;
    const fullEl = document.getElementById('fullPlayer');
    fullEl.addEventListener('touchstart', e => { startY = e.touches[0].clientY; });
    fullEl.addEventListener('touchmove', e => {
      if(e.touches[0].clientY - startY > 90) collapsePlayer();
    });

    function startTracker() {
      stopTracker();
      progressTimer = setInterval(() => {
        if(player && player.getCurrentTime && player.getDuration) {
          const cur = player.getCurrentTime();
          const dur = player.getDuration();
          if(dur > 0) {
            document.getElementById('timeFill').style.width = (cur / dur) * 100 + '%';
          }
        }
      }, 500);
    }

    function stopTracker() { clearInterval(progressTimer); }

    function seek(e) {
      if(!player || !player.getDuration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      player.seekTo(player.getDuration() * pos, true);
    }

    function prevSong() { if(currentIndex > 0) playSongIndex(currentIndex - 1); }
    function nextSong() { if(currentIndex < songs.length - 1) playSongIndex(currentIndex + 1); }

    renderMixes();
  </script>
</body>
</html>
