  <section class="player" id="playerCard">

    <div class="cover-wrapper">

      </div>

      <div class="seek" id="seek"><div class="fill" id="fill"></div></div>
    </div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const PLAYLIST_ID="PLbvY05KVYwoo";

let player=null;
let playing=false;
let playlistItems=[];
let sortedPlaylistItems=[];
let sortedPlaylistData=[];
let currentSortedIndex=0;
let sortingReady=false;
let isDragging=false;
let changingTrack=false;

function updateBDTime(){
  const options={
    timeZone:"Asia/Dhaka",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true
  };
  document.getElementById("bdTimeVal").textContent=
    new Intl.DateTimeFormat("en-US",options).format(new Date());
}
updateBDTime();
setInterval(updateBDTime,1000);

function onYouTubeIframeAPIReady(){
  player=new YT.Player("yt",{
    width:"100%",height:"100%",
    playerVars:{
      autoplay:0,controls:1,disablekb:0,fs:1,modestbranding:1,
      playsinline:1,rel:0,iv_load_policy:3,listType:"playlist",list:PLAYLIST_ID
    },
    events:{onReady:ready,onStateChange:state}
  });
}

function ready(){
  loadPlaylistItems();
  setInterval(updateProgress,250);
}

function state(e){
  const cover=document.getElementById("cover");
  const playBtn=document.getElementById("play");
  const playIcon=document.getElementById("play-icon");

  highlightActiveTrack();
  highlightVideoActiveTrack();

  if(e.data===YT.PlayerState.PLAYING){
    playing=true;
    playBtn.classList.add("playing");
    playIcon.innerHTML='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    cover.classList.add("spinning");
    updateInfo();
  }else if(e.data===YT.PlayerState.PAUSED){
    playing=false;
    playBtn.classList.remove("playing");
    playIcon.innerHTML='<path d="M8 5v14l11-7z"/>';
    cover.classList.remove("spinning");
  }else if(e.data===YT.PlayerState.ENDED){
    playing=false;
    playBtn.classList.remove("playing");
    playIcon.innerHTML='<path d="M8 5v14l11-7z"/>';
    cover.classList.remove("spinning");
    if(!changingTrack)setTimeout(nextSong,100);
  }
}

function togglePlay(){
  if(!player)return;
  try{
    if(playing) player.pauseVideo();
    else{
      const currentId=player.getVideoData()&&player.getVideoData().video_id;
      if(sortedPlaylistItems.length && sortingReady && !currentId)
        player.loadVideoById(sortedPlaylistItems[currentSortedIndex]);
      else player.playVideo();
    }
  }catch(e){}
}

function toggleVideoPopup(){
  const popup=document.getElementById("videoPopup");
  const overlay=document.getElementById("videoOverlay");
  const videoPlaylist=document.getElementById("videoPlaylist");
  const icon=document.getElementById("videoToggleIcon");
  const opening=!popup.classList.contains("active");

  if(opening){
    popup.classList.add("active");
    overlay.classList.add("active");
    videoPlaylist.classList.add("active");
    document.body.classList.add("popup-active");
    icon.innerHTML='<path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>';
    if(sortingReady) renderVideoPlaylist(); else loadPlaylistItems();
    setTimeout(adjustVideoPlaylistHeight,50);
    setTimeout(adjustVideoPlaylistHeight,200);
  }else{
    popup.classList.remove("active");
    overlay.classList.remove("active");
    videoPlaylist.classList.remove("active");
    document.body.classList.remove("popup-active");
    icon.innerHTML='<path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11z"/>';
  }
}

function adjustVideoPlaylistHeight(){
  const popup=document.getElementById("videoPopup");
  const playlist=document.getElementById("videoPlaylist");
  const section=document.getElementById("videoSection");
  if(!popup||!playlist||!section||!popup.classList.contains("active"))return;

  if(window.innerWidth>=769){
    const sr=section.getBoundingClientRect();
    const pr=popup.getBoundingClientRect();
    const h=Math.max(100,sr.bottom-pr.bottom-10);
    playlist.style.height=h+"px";
    playlist.style.maxHeight=h+"px";
    return;
  }

  const pr=popup.getBoundingClientRect();
  const playerRect=document.getElementById("playerCard").getBoundingClientRect();
  const top=pr.bottom+1;
  const available=playerRect.top-top-20;
  const h=Math.max(70,Math.min(available,playerRect.top-top-2));
  playlist.style.height=h+"px";
  playlist.style.maxHeight=h+"px";
}

window.addEventListener("resize",()=>setTimeout(adjustVideoPlaylistHeight,80));

function nextSong(){
  if(!player||!sortedPlaylistItems.length)return;
  const id=player.getVideoData()&&player.getVideoData().video_id;
  const found=sortedPlaylistItems.indexOf(id);
  if(found!==-1)currentSortedIndex=found;
  currentSortedIndex=(currentSortedIndex+1)%sortedPlaylistItems.length;
  playSpecificTrack(currentSortedIndex);
}

function previousSong(){
  if(!player||!sortedPlaylistItems.length)return;
  const id=player.getVideoData()&&player.getVideoData().video_id;
  const found=sortedPlaylistItems.indexOf(id);
  if(found!==-1)currentSortedIndex=found;
  currentSortedIndex=(currentSortedIndex-1+sortedPlaylistItems.length)%sortedPlaylistItems.length;
  playSpecificTrack(currentSortedIndex);
}

function forceUpdateUI(index){
  if(!sortedPlaylistData[index])return;
  const data=sortedPlaylistData[index];
  document.getElementById("cover").src=`https://i.ytimg.com/vi/${data.id}/hqdefault.jpg`;
  document.getElementById("title").textContent=data.title||"YouTube Music";
  document.getElementById("artist").textContent=data.artist||"YouTube Music";
  currentSortedIndex=index;
  highlightActiveTrack();
  highlightVideoActiveTrack();
}

function getSeekPosition(clientX,el){
  const rect=el.getBoundingClientRect();
  if(!rect.width)return 0;
  return Math.max(0,Math.min(1,(clientX-rect.left)/rect.width));
}

const seekElement=document.getElementById("seek");
seekElement.addEventListener("pointerdown",e=>{
  e.preventDefault();e.stopPropagation();isDragging=true;
  try{seekElement.setPointerCapture(e.pointerId)}catch(err){}
  updateSeekVisual(getSeekPosition(e.clientX,seekElement));
},{passive:false});

seekElement.addEventListener("pointermove",e=>{
  if(!isDragging)return;
  e.preventDefault();e.stopPropagation();
  updateSeekVisual(getSeekPosition(e.clientX,seekElement));
},{passive:false});

seekElement.addEventListener("pointerup",e=>{
  if(!isDragging)return;
  e.preventDefault();e.stopPropagation();
  const pos=getSeekPosition(e.clientX,seekElement);
  updateSeekVisual(pos);
  if(player){
    const duration=player.getDuration();
    if(duration)player.seekTo(pos*duration,true);
  }
  isDragging=false;
  try{seekElement.releasePointerCapture(e.pointerId)}catch(err){}
},{passive:false});

function updateSeekVisual(pos){
  document.getElementById("fill").style.width=(pos*100)+"%";
  if(player){
    const duration=player.getDuration();
    if(duration){
      document.getElementById("current").textContent=format(pos*duration);
      document.getElementById("duration").textContent=format(duration);
    }
  }
}

function updateProgress(){
  if(isDragging||!player)return;
  try{
    const current=player.getCurrentTime();
    const duration=player.getDuration();
    if(!duration)return;
    const pos=Math.max(0,Math.min(1,current/duration));
    document.getElementById("fill").style.width=(pos*100)+"%";
    document.getElementById("current").textContent=format(current);
    document.getElementById("duration").textContent=format(duration);
  }catch(e){}
}

function format(s){
  if(!s||isNaN(s))return"0:00";
  s=Math.floor(s);
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}

function loadPlaylistItems(){
  if(!player||typeof player.getPlaylist!=="function")return;
  const ids=player.getPlaylist();
  if(!ids||!ids.length){setTimeout(loadPlaylistItems,600);return;}

  playlistItems=ids;
  sortedPlaylistItems=[];sortedPlaylistData=[];sortingReady=false;

  Promise.all(ids.map((id,index)=>
    fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`)
      .then(r=>r.json())
      .then(data=>({
        id,
        title:data&&data.title?data.title:`Track #${index+1}`,
        artist:data&&data.author_name?data.author_name:"YouTube Music",
        originalIndex:index
      }))
      .catch(()=>({
        id,title:`Track #${index+1}`,artist:"YouTube Music",originalIndex:index
      }))
  )).then(results=>{
    results.sort((a,b)=>a.title.localeCompare(b.title,undefined,{numeric:true,sensitivity:"base"}));
    sortedPlaylistData=results;
    sortedPlaylistItems=results.map(x=>x.id);
    sortingReady=true;

    const currentId=player.getVideoData()&&player.getVideoData().video_id;
    const idx=sortedPlaylistItems.indexOf(currentId);
    if(idx!==-1)currentSortedIndex=idx;

    renderSortedPlaylists();
    highlightActiveTrack();
    highlightVideoActiveTrack();
    updateInfo();
  });
}

function renderSortedPlaylists(){
  renderMainPlaylist();
  renderMiniPlaylist();
  renderVideoPlaylist();
}

function renderMiniPlaylist(){
  const list=document.getElementById("miniList");
  list.innerHTML="";
  sortedPlaylistData.forEach((data,index)=>{
    const item=document.createElement("div");
    item.className="mini-item";
    item.id=`mini-track-${index}`;
    item.onclick=()=>playSpecificTrack(index);
    item.innerHTML=`
      <img src="https://i.ytimg.com/vi/${data.id}/hqdefault.jpg" alt="thumb">
      <div class="mini-info">
        <div class="mini-title">${escapeHtml(data.title)}</div>
        <div class="mini-artist">${escapeHtml(data.artist)}</div>
      </div>
      <div class="mini-duration">${data.duration||"--:--"}</div>
    `;
    list.appendChild(item);
  });
}

function renderMainPlaylist(){
  const list=document.getElementById("songList");
  list.innerHTML="";
  sortedPlaylistData.forEach((data,index)=>{
    const item=document.createElement("div");
    item.className="song-item";
    item.id=`track-${index}`;
    item.onclick=()=>playSpecificTrack(index);
    item.innerHTML=`
      <img src="https://i.ytimg.com/vi/${data.id}/hqdefault.jpg" alt="thumb">
      <div class="song-item-info">
        <div class="song-item-title">${escapeHtml(data.title)}</div>
        <div class="song-item-artist">${escapeHtml(data.artist)}</div>
      </div>`;
    list.appendChild(item);
  });
}

function renderVideoPlaylist(){
  const list=document.getElementById("videoSongList");
  if(!sortedPlaylistData.length){
    list.innerHTML='<div style="text-align:center;color:rgba(255,255,255,.7);font-size:9px;padding:10px">Loading...</div>';
    return;
  }
  list.innerHTML="";
  sortedPlaylistData.forEach((data,index)=>{
    const item=document.createElement("div");
    item.className="video-song-item";
    item.onclick=e=>{e.preventDefault();e.stopPropagation();playSpecificTrack(index)};
    item.innerHTML=`
      <img src="https://i.ytimg.com/vi/${data.id}/hqdefault.jpg" alt="thumb" draggable="false">
      <div class="video-song-info">
        <div class="video-song-title">${escapeHtml(data.title)}</div>
        <div class="video-song-artist">${escapeHtml(data.artist)}</div>
      </div>`;
    list.appendChild(item);
  });
  highlightVideoActiveTrack();
}

function escapeHtml(text){
  if(!text)return"";
  const div=document.createElement("div");
  div.textContent=text;
  return div.innerHTML;
}

function playSpecificTrack(index){
  if(!player||!sortedPlaylistData[index])return;
  currentSortedIndex=index;
  forceUpdateUI(index);
  changingTrack=true;
  try{player.loadVideoById(sortedPlaylistData[index].id)}
  catch(e){changingTrack=false;return}
  setTimeout(()=>changingTrack=false,700);

  document.getElementById("drawer").classList.remove("open");
  document.getElementById("overlay").classList.remove("active");
  highlightActiveTrack();
  highlightVideoActiveTrack();
}

function highlightActiveTrack(){
  if(!sortedPlaylistItems.length||!player)return;
  let id="";
  try{id=player.getVideoData()&&player.getVideoData().video_id}catch(e){}
  document.querySelectorAll(".song-item,.mini-item").forEach((item,index)=>{
    item.classList.toggle("active",sortedPlaylistItems[index]===id);
  });
}

function highlightVideoActiveTrack(){
  if(!sortedPlaylistItems.length||!player)return;
  let id="";
  try{id=player.getVideoData()&&player.getVideoData().video_id}catch(e){}
  document.querySelectorAll(".video-song-item").forEach((item,index)=>{
    item.classList.toggle("active",sortedPlaylistItems[index]===id);
  });
}

function updateInfo(){
  if(!player)return;
  try{
    const d=player.getVideoData();
    if(!d||!d.video_id)return;
    document.getElementById("cover").src=`https://i.ytimg.com/vi/${d.video_id}/hqdefault.jpg`;
    if(d.title)document.getElementById("title").textContent=d.title;
    if(d.author)document.getElementById("artist").textContent=d.author;
    const idx=sortedPlaylistItems.indexOf(d.video_id);
    if(idx!==-1)currentSortedIndex=idx;
    highlightActiveTrack();
    highlightVideoActiveTrack();
  }catch(e){}
}

function toggleDrawer(){
  const popup=document.getElementById("videoPopup");
  if(popup&&popup.classList.contains("active"))return;

  const drawer=document.getElementById("drawer");
  const overlay=document.getElementById("overlay");
  const opening=!drawer.classList.contains("open");

  drawer.classList.toggle("open",opening);
  overlay.classList.toggle("active",opening);

  if(opening&&!sortingReady)loadPlaylistItems();
}
</script>
</body>
</html>
