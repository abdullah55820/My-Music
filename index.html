<script>

/* PLAYLIST */
const PLAYLIST_ID="PLbvY05KVYwoo";

let player=null;
let playing=false;
let playlistItems = [];


/* BANGLADESH LIVE TIME */
function updateBDTime(){
  const options = { 
    timeZone: 'Asia/Dhaka', 
    hour: '2-digit', 
    minute: '2-digit', 
    second: '2-digit', 
    hour12: true 
  };
  const timeString = new Intl.DateTimeFormat('en-US', options).format(new Date());
  document.getElementById("bdTimeVal").textContent = timeString;
}

updateBDTime();
setInterval(updateBDTime,1000);


/* YOUTUBE API */
function onYouTubeIframeAPIReady(){
  player=new YT.Player("yt",{
    width:"2",
    height:"2",
    playerVars:{
      autoplay:0,
      controls:0,
      disablekb:1,
      fs:0,
      modestbranding:1,
      playsinline:1,
      rel:0,
      listType:"playlist",
      list:PLAYLIST_ID
    },
    events:{
      onReady:ready,
      onStateChange:state
    }
  });
}


/* INSTANT READY */
function ready(){
  updateInfo();
  loadPlaylistItems();
  setInterval(updateProgress, 250);
}


/* PLAYER STATE */
function state(e){
  const cover=document.getElementById("cover");
  const playBtn=document.getElementById("play");
  const playIcon=document.getElementById("play-icon");

  updateInfo();
  highlightActiveTrack();

  if(e.data===YT.PlayerState.PLAYING){
    playing=true;
    playBtn.classList.add("playing");
    playIcon.innerHTML='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    cover.classList.add("spinning");
  }
  else if(e.data===YT.PlayerState.PAUSED || e.data===YT.PlayerState.ENDED){
    playing=false;
    playBtn.classList.remove("playing");
    playIcon.innerHTML='<path d="M8 5v14l11-7z"/>';
    cover.classList.remove("spinning");
  }
}


/* PLAY / PAUSE */
function togglePlay(){
  if(!player)return;
  if(playing){
    player.pauseVideo();
  }else{
    player.playVideo();
  }
}


/* NEXT & PREVIOUS (INSTANT UI UPDATE) */
function nextSong(){
  if(!player || typeof player.getPlaylistIndex !== 'function')return;
  const currentIdx = player.getPlaylistIndex();
  const totalItems = playlistItems.length;
  if(totalItems > 0) {
    let nextIdx = (currentIdx + 1) % totalItems;
    forceUpdateInfo(nextIdx);
  }
  player.nextVideo();
}

function previousSong(){
  if(!player || typeof player.getPlaylistIndex !== 'function')return;
  const currentIdx = player.getPlaylistIndex();
  const totalItems = playlistItems.length;
  if(totalItems > 0) {
    let prevIdx = (currentIdx - 1 + totalItems) % totalItems;
    forceUpdateInfo(prevIdx);
  }
  player.previousVideo();
}

/* FORCE INSTANT INFO UPDATE */
function forceUpdateInfo(index) {
  if(playlistItems && playlistItems[index]) {
    const videoId = playlistItems[index];
    // Instant thumbnail update
    document.getElementById("cover").src = "https://i.ytimg.com/vi/" + videoId + "/hqdefault.jpg";
    
    // Instant title/artist update from drawer if available
    const titleEl = document.getElementById(`title-${index}`);
    const artistEl = document.getElementById(`artist-${index}`);
    
    if(titleEl && titleEl.textContent !== `Track #${index + 1}`) {
      document.getElementById("title").textContent = titleEl.textContent;
    } else {
      document.getElementById("title").textContent = `Track #${index + 1}`;
    }
    
    if(artistEl) {
      document.getElementById("artist").textContent = artistEl.textContent;
    }
  }
}


/* DRAWER & PLAYLIST FUNCTIONS */
function toggleDrawer(){
  const drawer = document.getElementById("drawer");
  const overlay = document.getElementById("overlay");
  
  if(drawer.classList.contains("open")){
    drawer.classList.remove("open");
    overlay.classList.remove("active");
  } else {
    drawer.classList.add("open");
    overlay.classList.add("active");
  }
}

function loadPlaylistItems(){
  if(!player || typeof player.getPlaylist !== 'function') return;
  
  playlistItems = player.getPlaylist();
  const listContainer = document.getElementById("songList");
  
  if(!playlistItems || playlistItems.length === 0){
    listContainer.innerHTML = '<div style="text-align:center; color:rgba(255,255,255,0.7); font-size:10px; margin-top:15px;">No tracks found</div>';
    return;
  }
  
  listContainer.innerHTML = "";
  
  playlistItems.forEach((id, index) => {
    const item = document.createElement("div");
    item.className = "song-item";
    item.id = `track-${index}`;
    item.onclick = () => playSpecificTrack(index);
    
    item.innerHTML = `
      <img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="thumb">
      <div class="song-item-info">
        <div class="song-item-title" id="title-${index}">Track #${index + 1}</div>
        <div class="song-item-artist" id="artist-${index}">YouTube Music</div>
      </div>
    `;
    
    listContainer.appendChild(item);
    fetchSongDetails(id, index);
  });
  
  highlightActiveTrack();
}

function fetchSongDetails(id, index){
  fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`)
    .then(res => res.json())
    .then(data => {
      if(data && data.title) {
        const titleEl = document.getElementById(`title-${index}`);
        const artistEl = document.getElementById(`artist-${index}`);
        
        if(titleEl) titleEl.textContent = data.title;
        if(artistEl && data.author_name) artistEl.textContent = data.author_name;
      }
    })
    .catch(() => {});
}

function playSpecificTrack(index){
  if(!player) return;
  forceUpdateInfo(index);
  player.playVideoAt(index);
  toggleDrawer();
}

function highlightActiveTrack(){
  if(!player || typeof player.getPlaylistIndex !== 'function') return;
  
  const currentIndex = player.getPlaylistIndex();
  const items = document.querySelectorAll(".song-item");
  
  items.forEach((item, index) => {
    if(index === currentIndex){
      item.classList.add("active");
    } else {
      item.classList.remove("active");
    }
  });
}


/* SONG INFORMATION & PROGRESS */
function updateInfo(){
  if(!player || typeof player.getVideoData !== 'function')return;
  try{
    const d = player.getVideoData();
    if(!d || !d.video_id)return;
    
    document.getElementById("cover").src = "https://i.ytimg.com/vi/" + d.video_id + "/hqdefault.jpg";
    
    if(d.title && d.title !== "") {
      document.getElementById("title").textContent = d.title;
    }
    if(d.author && d.author !== "") {
      document.getElementById("artist").textContent = d.author;
    }
  }catch(e){}
}

function updateProgress(){
  if(!player || typeof player.getCurrentTime !== 'function')return;
  try{
    const c=player.getCurrentTime();
    const d=player.getDuration();
    if(!d)return;
    document.getElementById("fill").style.width=Math.max(0,Math.min(100,(c/d)*100))+"%";
    document.getElementById("current").textContent=format(c);
    document.getElementById("duration").textContent=format(d);
  }catch(e){}
}

function seek(e){
  if(!player || typeof player.getDuration !== 'function')return;
  const r=document.getElementById("seek").getBoundingClientRect();
  const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  player.seekTo(p*player.getDuration(),true);
}

function format(s){
  if(!s || isNaN(s)) return "0:00";
  s=Math.floor(s);
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}

</script>
