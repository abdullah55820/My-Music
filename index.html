<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>My Music Player - PC Setup</title>

<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">

<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#030405;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
    "Segoe UI",sans-serif;
}

body{
    position:relative;
    overflow-x:hidden!important;
}

/* =========================================================
BACKGROUND
========================================================= */

.bg{
    position:fixed;
    inset:-30px;

    background-image:url("background.jpg");
    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;

    z-index:0;
    pointer-events:none;

    filter:saturate(1.08);
}

.bg::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(0,120,255,.08),
            transparent 45%
        ),
        rgba(0,0,0,.58);
}

/* =========================================================
DESKTOP PC SETUP
========================================================= */

.pc-setup{
    position:fixed;
    inset:0;

    z-index:800;

    display:none;

    align-items:center;
    justify-content:center;

    pointer-events:none;
}

/* desk */

.desk{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:24vh;

    background:
        linear-gradient(
            to bottom,
            rgba(25,25,28,.92),
            rgba(5,6,8,.98)
        );

    border-top:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 -20px 60px rgba(0,0,0,.65);
}

.desk::before{
    content:"";

    position:absolute;

    top:-8px;
    left:0;
    right:0;

    height:8px;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,.10),
            transparent
        );
}

/* =========================================================
MONITOR
========================================================= */

.monitor{
    position:absolute;

    width:min(900px,70vw);
    height:min(530px,58vh);

    top:5vh;
    left:50%;

    transform:translateX(-50%);

    background:#08090b;

    border-radius:18px;

    border:8px solid #111318;

    box-shadow:
        0 35px 80px rgba(0,0,0,.8),
        0 0 0 1px rgba(255,255,255,.08),
        inset 0 0 20px rgba(255,255,255,.04);

    overflow:hidden;
}

.monitor-screen{
    position:absolute;
    inset:7px;

    border-radius:9px;

    overflow:hidden;

    background:#000;

    border:1px solid rgba(255,255,255,.12);
}

/* monitor glow */

.monitor-screen::after{
    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(0,140,255,.10),
            transparent 55%
        );

    z-index:10;
}

/* monitor stand */

.monitor-stand{
    position:absolute;

    left:50%;
    top:100%;

    transform:translateX(-50%);

    width:110px;
    height:90px;

    background:
        linear-gradient(
            90deg,
            #101216,
            #272a30,
            #101216
        );

    clip-path:polygon(
        35% 0,
        65% 0,
        72% 70%,
        100% 100%,
        0 100%,
        28% 70%
    );

    z-index:-1;
}

.monitor-base{
    position:absolute;

    left:50%;
    top:calc(100% + 82px);

    transform:translateX(-50%);

    width:260px;
    height:15px;

    border-radius:50%;

    background:#111318;

    box-shadow:
        0 8px 20px rgba(0,0,0,.6);
}

/* =========================================================
PC VIDEO AREA
========================================================= */

#pcVideo{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    border:0;

    z-index:2;
}

/* =========================================================
RGB LIGHT
========================================================= */

.rgb-light{
    position:absolute;

    left:50%;
    bottom:22vh;

    transform:translateX(-50%);

    width:min(1000px,78vw);
    height:3px;

    background:
        linear-gradient(
            90deg,
            #ff004c,
            #ff8a00,
            #fff000,
            #00ff9d,
            #00c8ff,
            #7b4dff,
            #ff00c8
        );

    background-size:300% 100%;

    animation:rgbMove 5s linear infinite;

    filter:
        blur(.5px)
        drop-shadow(0 0 10px rgba(0,200,255,.5));

    opacity:.8;

    z-index:5;
}

@keyframes rgbMove{
    0%{background-position:0% 50%}
    100%{background-position:300% 50%}
}

/* =========================================================
PC CASE
========================================================= */

.pc-case{
    position:absolute;

    right:5vw;
    bottom:19vh;

    width:155px;
    height:285px;

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            #15171b,
            #050607
        );

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
        0 25px 50px rgba(0,0,0,.7),
        inset 0 0 25px rgba(255,255,255,.03);

    overflow:hidden;
}

.pc-glass{
    position:absolute;

    inset:10px;

    border-radius:10px;

    border:1px solid rgba(255,255,255,.08);

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,.06),
            transparent 35%
        );
}

.pc-fan{
    position:absolute;

    width:48px;
    height:48px;

    border-radius:50%;

    left:50%;
    transform:translateX(-50%);

    border:2px solid rgba(0,180,255,.3);

    box-shadow:
        0 0 14px rgba(0,180,255,.35);

    animation:fanSpin 2s linear infinite;
}

.pc-fan:nth-child(1){top:25px}
.pc-fan:nth-child(2){top:92px}
.pc-fan:nth-child(3){top:159px}

.pc-fan::after{
    content:"";

    position:absolute;

    inset:9px;

    border-radius:50%;

    border:5px dotted rgba(0,220,255,.55);
}

@keyframes fanSpin{
    from{transform:translateX(-50%) rotate(0)}
    to{transform:translateX(-50%) rotate(360deg)}
}

/* =========================================================
KEYBOARD
========================================================= */

.keyboard{
    position:absolute;

    left:50%;
    bottom:8vh;

    transform:translateX(-50%);

    width:min(600px,50vw);
    height:72px;

    border-radius:12px;

    background:#111318;

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
        0 15px 35px rgba(0,0,0,.7);

    padding:9px;

    display:grid;

    grid-template-columns:repeat(15,1fr);

    gap:4px;

    transform-origin:center;

    pointer-events:none;
}

.key{
    border-radius:3px;

    background:#252931;

    border:1px solid rgba(255,255,255,.05);

    box-shadow:
        inset 0 -2px 3px rgba(0,0,0,.5);
}

.key:nth-child(3n){
    box-shadow:
        0 0 6px rgba(0,190,255,.16);
}

.key.space{
    grid-column:span 6;
}

/* =========================================================
MOUSE
========================================================= */

.mouse{
    position:absolute;

    left:calc(50% + min(330px,28vw));
    bottom:8vh;

    width:55px;
    height:80px;

    border-radius:27px 27px 30px 30px;

    background:
        linear-gradient(
            135deg,
            #202329,
            #090a0d
        );

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
        0 15px 30px rgba(0,0,0,.65);
}

.mouse::before{
    content:"";

    position:absolute;

    top:12px;
    left:50%;

    transform:translateX(-50%);

    width:5px;
    height:16px;

    border-radius:5px;

    background:#00d9ff;

    box-shadow:
        0 0 10px #00d9ff;
}

/* =========================================================
TOP WIDGETS
========================================================= */

.top-widgets{
    position:fixed;

    top:14px;
    left:50%;

    transform:translateX(-50%);

    z-index:2500;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:8px;
}

.bd-time,
.playlist-toggle-btn{
    padding:5px 11px;

    border-radius:20px;

    background:rgba(0,0,0,.48);

    border:1px solid rgba(255,255,255,.18);

    color:rgba(255,255,255,.92);

    font-size:11px;
    font-weight:600;

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
}

.bd-time{
    display:flex;
    align-items:center;
    gap:6px;
}

.live-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#ff3b30;

    box-shadow:0 0 8px #ff3b30;

    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%,100%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:.3;
        transform:scale(.8);
    }
}

.playlist-toggle-btn{
    display:flex;
    align-items:center;
    gap:6px;

    cursor:pointer;

    touch-action:manipulation;
}

.playlist-toggle-btn svg{
    width:14px;
    height:14px;
    fill:#fff;
}

/* =========================================================
VISUALIZER
========================================================= */

.desktop-visualizer{
    position:fixed;

    left:50%;
    bottom:calc(24vh + 18px);

    transform:translateX(-50%);

    width:min(760px,62vw);
    height:82px;

    z-index:1200;

    display:none;

    align-items:flex-end;
    justify-content:center;

    gap:4px;

    pointer-events:none;

    padding:0 10px;
}

.visual-bar{
    width:6px;

    min-height:5px;

    border-radius:10px 10px 2px 2px;

    background:
        linear-gradient(
            to top,
            #00c6ff,
            #00ff95,
            #ffe600,
            #ff5b00,
            #ff007a
        );

    box-shadow:
        0 0 8px rgba(0,220,255,.55);

    animation:
        visualizer .65s ease-in-out infinite alternate;

    animation-delay:calc(var(--i) * -0.035s);
}

@keyframes visualizer{
    0%{
        height:8%;
        opacity:.45;
    }

    45%{
        opacity:.8;
    }

    100%{
        height:var(--h);
        opacity:1;
    }
}

/* =========================================================
VIDEO POPUP
========================================================= */

.video-overlay{
    position:fixed;
    inset:0;

    z-index:1499;

    display:none;

    background:transparent;

    pointer-events:none!important;
}

.video-overlay.active{
    display:block;
}

.video-section{
    position:fixed;

    top:4vh;
    right:4vw;

    width:min(620px,42vw);
    height:92dvh;

    z-index:1700;

    display:none;

    flex-direction:column;

    pointer-events:none;
}

.video-popup{
    position:relative;

    width:100%;

    aspect-ratio:16/9;

    background:#000;

    border-radius:18px;

    overflow:hidden;

    border:1px solid rgba(255,255,255,.25);

    box-shadow:
        0 25px 50px rgba(0,0,0,.7);

    opacity:0;
    visibility:hidden;

    pointer-events:none;

    transform:scale(.92);

    transition:
        opacity .3s ease,
        transform .3s ease,
        visibility .3s ease;
}

.video-popup.active{
    opacity:1;
    visibility:visible;

    pointer-events:auto;

    transform:scale(1);
}

#yt{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    border:0;

    pointer-events:auto!important;
}

/* =========================================================
VIDEO PLAYLIST
========================================================= */

.video-playlist{
    width:100%;

    margin-top:10px;

    flex:1;

    min-height:100px;

    padding:7px;

    border-radius:15px;

    background:rgba(20,20,20,.55);

    border:1px solid rgba(255,255,255,.18);

    backdrop-filter:blur(25px) saturate(150%);
    -webkit-backdrop-filter:blur(25px) saturate(150%);

    box-shadow:
        0 15px 40px rgba(0,0,0,.55);

    opacity:0;
    visibility:hidden;

    pointer-events:none;

    overflow:hidden;
}

.video-playlist.active{
    opacity:1;
    visibility:visible;

    pointer-events:auto;
}

.video-playlist-title{
    font-size:10px;
    font-weight:700;

    padding:4px 7px 6px;

    border-bottom:1px solid rgba(255,255,255,.13);

    margin-bottom:5px;
}

.video-song-list{
    width:100%;
    height:calc(100% - 27px);

    overflow-y:auto;

    display:flex;
    flex-direction:column;

    gap:5px;

    touch-action:pan-y;

    -webkit-overflow-scrolling:touch;
}

.video-song-item{
    display:flex;
    align-items:center;

    gap:9px;

    width:100%;
    min-height:54px;

    padding:7px 8px;

    border-radius:10px;

    background:rgba(255,255,255,.07);

    border:1px solid rgba(255,255,255,.08);

    cursor:pointer;

    flex-shrink:0;

    transition:.2s;
}

.video-song-item:hover,
.video-song-item.active{
    background:rgba(255,255,255,.20);

    border-color:rgba(255,255,255,.30);
}

.video-song-item img{
    width:44px;
    height:44px;

    border-radius:8px;

    object-fit:cover;

    flex-shrink:0;
}

.video-song-info{
    flex:1;
    min-width:0;
}

.video-song-title{
    font-size:11.5px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.video-song-artist{
    font-size:9.5px;

    color:rgba(255,255,255,.55);

    margin-top:2px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================================================
MAIN PLAYER
========================================================= */

.app{
    position:relative;

    z-index:1600;

    height:100dvh;
    width:100%;

    display:flex;

    align-items:flex-end;
    justify-content:center;

    padding:0 16px 65px;

    pointer-events:auto;
}

.player{
    width:min(440px,94%);
    height:120px;

    padding:14px 18px;

    border:1px solid rgba(255,255,255,.18);

    border-radius:60px;

    background:rgba(20,20,20,.38);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 20px 50px rgba(0,0,0,.45);

    display:flex;
    align-items:center;

    gap:12px;

    position:relative;

    z-index:1601;
}

/* =========================================================
COVER
========================================================= */

.cover-wrapper{
    position:relative;

    width:84px;
    height:84px;

    flex-shrink:0;

    border-radius:50%;

    overflow:hidden;

    border:1px solid rgba(255,255,255,.3);
}

.cover{
    width:137%;
    height:137%;

    margin:-18.5%;

    border-radius:50%;

    object-fit:cover;

    background:#222;

    animation:spin 8s linear infinite;

    animation-play-state:paused;
}

.cover.spinning{
    animation-play-state:running;
}

.cover-wrapper::after{
    content:"";

    position:absolute;

    width:16px;
    height:16px;

    background:rgba(20,20,20,.85);

    border:2px solid rgba(255,255,255,.3);

    border-radius:50%;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
SONG INFO
========================================================= */

.middle{
    flex:1;
    min-width:0;

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.title{
    font-size:16px;

    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.artist{
    font-size:12px;

    color:rgba(255,255,255,.65);

    margin-top:2px;
    margin-bottom:8px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================================================
SEEK
========================================================= */

.seek{
    position:relative;

    width:100%;
    height:5px;

    border-radius:10px;

    background:rgba(255,255,255,.2);

    cursor:pointer;

    margin-bottom:6px;

    touch-action:none;
}

.fill{
    position:absolute;

    left:0;
    top:0;

    height:100%;
    width:0;

    background:#fff;

    border-radius:10px;

    pointer-events:none;
}

.time-display{
    font-size:11px;

    color:rgba(255,255,255,.65);

    font-variant-numeric:tabular-nums;
}

/* =========================================================
CONTROLS
========================================================= */

.controls{
    display:flex;

    align-items:center;

    gap:8px;

    flex-shrink:0;
}

.btn{
    width:28px;
    height:28px;

    border:0;

    background:transparent;

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    padding:0;

    position:relative;
    z-index:1611;
}

.btn svg{
    width:20px;
    height:20px;

    fill:#fff;
}

/* =========================================================
PLAY BUTTON FIX
========================================================= */

.play{
    width:44px;
    height:44px;

    border-radius:50%;

    border:0;

    background:#fff;

    color:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 4px 15px rgba(0,0,0,.3);

    cursor:pointer;

    flex-shrink:0;

    position:relative;
    z-index:1611;
}

.play svg{
    width:20px;
    height:20px;

    fill:#000;

    margin-left:2px;
}

.play.playing svg{
    margin-left:0;
}

.btn:active,
.play:active{
    transform:scale(.90);
}

/* =========================================================
VOLUME
========================================================= */

.vol-container{
    display:flex;
    align-items:center;

    gap:4px;

    background:rgba(0,0,0,.25);

    border:1px solid rgba(255,255,255,.15);

    padding:4px 6px;

    border-radius:20px;
}

.vol-slider-wrapper{
    width:0;

    overflow:hidden;

    opacity:0;

    transition:.28s;
}

.vol-slider-wrapper.active{
    width:55px;
    opacity:1;
}

.vol-slider{
    width:55px;
}

/* =========================================================
DRAWER
========================================================= */

.drawer-overlay{
    position:fixed;
    inset:0;

    z-index:9999;

    background:transparent;

    display:none;
}

.drawer-overlay.active{
    display:block;
}

.playlist-drawer{
    position:fixed;

    top:0;
    right:-100%;

    width:180px;
    height:100dvh;

    background:rgba(20,20,20,.55);

    backdrop-filter:blur(30px);

    border-left:1px solid rgba(255,255,255,.18);

    z-index:10000;

    transition:right .35s ease;

    display:flex;
    flex-direction:column;

    padding:12px 6px;

    box-shadow:
        -15px 0 40px rgba(0,0,0,.5);
}

.playlist-drawer.open{
    right:0;
}

.drawer-header{
    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:6px 8px;

    border-bottom:1px solid rgba(255,255,255,.15);

    margin-bottom:8px;
}

.drawer-title{
    font-size:11px;
    font-weight:700;
}

.close-btn{
    background:transparent;
    border:0;

    color:#fff;

    font-size:18px;

    cursor:pointer;
}

.song-list{
    flex:1;

    overflow-y:auto;

    display:flex;
    flex-direction:column;

    gap:4px;
}

.song-item{
    display:flex;
    align-items:center;

    gap:6px;

    padding:4px 5px;

    border-radius:7px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.1);

    cursor:pointer;
}

.song-item.active,
.song-item:hover{
    background:rgba(255,255,255,.22);
}

.song-item img{
    width:26px;
    height:26px;

    border-radius:5px;

    object-fit:cover;
}

.song-item-info{
    flex:1;
    min-width:0;
}

.song-item-title{
    font-size:9.5px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.song-item-artist{
    font-size:8px;

    color:rgba(255,255,255,.55);

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================================================
DESKTOP
========================================================= */

@media(min-width:769px){

    .pc-setup{
        display:block;
    }

    .desktop-visualizer{
        display:flex;
    }

    .app{
        align-items:flex-end;

        justify-content:center;

        padding:
            0
            40px
            58px;
    }

    /*
       Controller একটু নিচে রাখা হয়েছে
       এবং visualizer controller-এর কাছাকাছি।
    */

    .player{
        width:min(760px,55vw);

        height:118px;

        transform:translateY(12px);
    }

    .top-widgets{
        top:14px;
    }

    /* video popup open হলে */

    body.popup-active .player{
        transform:
            translateX(-5px)
            translateY(12px)
            scale(.92);

        transform-origin:left bottom;
    }

    body.popup-active .desktop-visualizer{
        display:none;
    }

    body.popup-active .video-section{
        display:flex;
    }
}

/* =========================================================
MOBILE
========================================================= */

@media(max-width:768px){

    .pc-setup,
    .desktop-visualizer{
        display:none!important;
    }

    .app{
        padding-bottom:60px;
    }

    .player{
        height:116px;

        padding:12px 14px;

        border-radius:58px;

        gap:10px;
    }

    .cover-wrapper{
        width:78px;
        height:78px;
    }

    .title{
        font-size:15px;
    }

                        2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86
                        5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91
                        7-4.49 7-8.77s-2.99-7.86-7-8.77z

<script src="https://www.youtube.com/iframe_api"></script>

<script>

/* =========================================================
PLAYLIST
========================================================= */

const PLAYLIST_ID = "PLbvY05KVYwoo";

let player = null;
let playing = false;

let playlistItems = [];
let sortedPlaylistItems = [];
let sortedPlaylistData = [];

let currentSortedIndex = 0;
let sortingReady = false;

let volTimer = null;
let isDragging = false;

let changingTrack = false;


/* =========================================================
BD TIME
========================================================= */

function updateBDTime(){

    const options = {

        timeZone:"Asia/Dhaka",

        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",

        hour12:true

    };

    document.getElementById(
        "bdTimeVal"
    ).textContent =

        new Intl.DateTimeFormat(
            "en-US",
            options
        ).format(new Date());

}

updateBDTime();

setInterval(
    updateBDTime,
    1000
);


/* =========================================================
SPECTRUM
========================================================= */

function createVisualizer(){

    const visualizer =
        document.getElementById(
            "visualizer"
        );

    if(!visualizer) return;

    visualizer.innerHTML = "";

    const bars = 85;

    for(let i=0;i<bars;i++){

        const bar =
            document.createElement(
                "div"
            );

        bar.className =
            "visual-bar";

        const h =
            20 +
            Math.random()*75;

        bar.style.setProperty(
            "--h",
            h + "%"
        );

        bar.style.setProperty(
            "--i",
            i
        );

        visualizer.appendChild(bar);

    }

}

createVisualizer();


/* =========================================================
YOUTUBE API
========================================================= */

function onYouTubeIframeAPIReady(){

    player =
        new YT.Player(
            "yt",
            {

                width:"100%",
                height:"100%",

                playerVars:{

                    autoplay:0,
                    controls:1,
                    disablekb:0,
                    fs:1,
                    modestbranding:1,
                    playsinline:1,
                    rel:0,
                    iv_load_policy:3,

                    listType:"playlist",
                    list:PLAYLIST_ID

                },

                events:{

                    onReady:ready,
                    onStateChange:state

                }

            }
        );

}


/* =========================================================
READY
========================================================= */

function ready(){

    loadPlaylistItems();

    setInterval(
        updateProgress,
        250
    );

}


/* =========================================================
PLAYER STATE
========================================================= */

function state(e){

    const cover =
        document.getElementById(
            "cover"
        );

    const playIcon =
        document.getElementById(
            "play-icon"
        );

    if(
        e.data ===
        YT.PlayerState.PLAYING
    ){

        playing = true;

        playIcon.innerHTML =
            '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

        cover.classList.add(
            "spinning"
        );

        updateInfo();

    }

    else if(
        e.data ===
        YT.PlayerState.PAUSED
    ){

        playing = false;

        playIcon.innerHTML =
            '<path d="M8 5v14l11-7z"/>';

        cover.classList.remove(
            "spinning"
        );

    }

    else if(
        e.data ===
        YT.PlayerState.ENDED
    ){

        playing = false;

        playIcon.innerHTML =
            '<path d="M8 5v14l11-7z"/>';

        cover.classList.remove(
            "spinning"
        );

        if(!changingTrack){

            setTimeout(
                nextSong,
                100
            );

        }

    }

}


/* =========================================================
PLAY / PAUSE
========================================================= */

function togglePlay(){

    if(!player) return;

    try{

        if(playing){

            player.pauseVideo();

        }
        else{

            player.playVideo();

        }

    }
    catch(e){}

}


/* =========================================================
VIDEO POPUP
========================================================= */

function toggleVideoPopup(){

    const popup =
        document.getElementById(
            "videoPopup"
        );

    const overlay =
        document.getElementById(
            "videoOverlay"
        );

    const playlist =
        document.getElementById(
            "videoPlaylist"
        );

    const icon =
        document.getElementById(
            "videoToggleIcon"
        );

    const opening =
        !popup.classList.contains(
            "active"
        );

    if(opening){

        popup.classList.add(
            "active"
        );

        overlay.classList.add(
            "active"
        );

        playlist.classList.add(
            "active"
        );

        document.body.classList.add(
            "popup-active"
        );

        icon.innerHTML =
            '<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>';

        if(
            sortingReady &&
            sortedPlaylistData.length
        ){

            renderVideoPlaylist();

        }
        else{

            loadPlaylistItems();

        }

    }
    else{

        popup.classList.remove(
            "active"
        );

        overlay.classList.remove(
            "active"
        );

        playlist.classList.remove(
            "active"
        );

        document.body.classList.remove(
            "popup-active"
        );

        icon.innerHTML =
            '<path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>';

    }

}


/* =========================================================
VOLUME
========================================================= */

function toggleVolume(){

    const wrapper =
        document.getElementById(
            "volWrapper"
        );

    wrapper.classList.toggle(
        "active"
    );

    if(
        wrapper.classList.contains(
            "active"
        )
    ){

        resetVolTimer();

    }

}

function resetVolTimer(){

    if(volTimer){

        clearTimeout(
            volTimer
        );

    }

    volTimer =
        setTimeout(
            ()=>{

                document
                    .getElementById(
                        "volWrapper"
                    )
                    .classList.remove(
                        "active"
                    );

            },
            3000
        );

}

function changeVolume(value){

    if(
        player &&
        typeof player.setVolume ===
        "function"
    ){

        player.setVolume(
            Number(value)
        );

    }

    resetVolTimer();

}


/* =========================================================
NEXT SONG
========================================================= */

function nextSong(){

    if(
        !player ||
        !sortedPlaylistItems.length
    )
    return;

    let currentId = "";

    try{

        currentId =
            player.getVideoData() &&
            player.getVideoData().video_id;

    }
    catch(e){}

    if(currentId){

        const found =
            sortedPlaylistItems.indexOf(
                currentId
            );

        if(found !== -1){

            currentSortedIndex =
                found;

        }

    }

    const nextIndex =
        (
            currentSortedIndex + 1
        ) %
        sortedPlaylistItems.length;

    currentSortedIndex =
        nextIndex;

    playSpecificTrack(
        nextIndex
    );

}


/* =========================================================
PREVIOUS
========================================================= */

function previousSong(){

    if(
        !player ||
        !sortedPlaylistItems.length
    )
    return;

    const previousIndex =
        (
            currentSortedIndex -
            1 +
            sortedPlaylistItems.length
        ) %
        sortedPlaylistItems.length;

    currentSortedIndex =
        previousIndex;

    playSpecificTrack(
        previousIndex
    );

}


/* =========================================================
LOAD PLAYLIST
========================================================= */

function loadPlaylistItems(){

    if(
        !player ||
        typeof player.getPlaylist !==
        "function"
    )
    return;

    const ids =
        player.getPlaylist();

    if(
        !ids ||
        !ids.length
    ){

        setTimeout(
            loadPlaylistItems,
            600
        );

        return;

    }

    playlistItems = ids;

    const requests =
        playlistItems.map(
            (id,index)=>{

                return fetch(
                    `https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`
                )

                .then(
                    r=>r.json()
                )

                .then(
                    data=>{

                        return {

                            id:id,

                            title:
                                data &&
                                data.title
                                ?
                                data.title
                                :
                                `Track #${index+1}`,

                            artist:
                                data &&
                                data.author_name
                                ?
                                data.author_name
                                :
                                "YouTube Music"

                        };

                    }
                )

                .catch(
                    ()=>({

                        id:id,

                        title:
                            `Track #${index+1}`,

                        artist:
                            "YouTube Music"

                    })
                );

            }
        );

    Promise.all(
        requests
    )
    .then(
        results=>{

            results.sort(
                (a,b)=>
                    a.title.localeCompare(
                        b.title,
                        undefined,
                        {
                            numeric:true,
                            sensitivity:"base"
                        }
                    )
            );

            sortedPlaylistData =
                results;

            sortedPlaylistItems =
                results.map(
                    item=>item.id
                );

            sortingReady = true;

            renderMainPlaylist();
            renderVideoPlaylist();

            updateInfo();

        }
    );

}


/* =========================================================
RENDER MAIN PLAYLIST
========================================================= */

function renderMainPlaylist(){

    const list =
        document.getElementById(
            "songList"
        );

    list.innerHTML = "";

    sortedPlaylistData.forEach(
        (data,index)=>{

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "song-item";

            item.onclick =
                ()=>playSpecificTrack(
                    index
                );

            item.innerHTML = `

                <img
                    src="https://i.ytimg.com/vi/${data.id}/hqdefault.jpg"
                    alt="thumb">

                <div class="song-item-info">

                    <div class="song-item-title">
                        ${escapeHtml(data.title)}
                    </div>

                    <div class="song-item-artist">
                        ${escapeHtml(data.artist)}
                    </div>

                </div>

            `;

            list.appendChild(
                item
            );

        }
    );

}


/* =========================================================
RENDER VIDEO PLAYLIST
========================================================= */

function renderVideoPlaylist(){

    const list =
        document.getElementById(
            "videoSongList"
        );

    if(
        !sortedPlaylistData.length
    ){

        list.innerHTML =
            "<div style='padding:10px;text-align:center'>Loading...</div>";

        return;

    }

    list.innerHTML = "";

    sortedPlaylistData.forEach(
        (data,index)=>{

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "video-song-item";

            item.onclick =
                ()=>{
                    playSpecificTrack(
                        index
                    );
                };

            item.innerHTML = `

                <img
                    src="https://i.ytimg.com/vi/${data.id}/hqdefault.jpg"
                    alt="thumb">

                <div class="video-song-info">

                    <div class="video-song-title">
                        ${escapeHtml(data.title)}
                    </div>

                    <div class="video-song-artist">
                        ${escapeHtml(data.artist)}
                    </div>

                </div>

            `;

            list.appendChild(
                item
            );

        }
    );

}


/* =========================================================
PLAY SPECIFIC
========================================================= */

function playSpecificTrack(index){

    if(
        !player ||
        !sortedPlaylistData[index]
    )
    return;

    const data =
        sortedPlaylistData[index];

    currentSortedIndex =
        index;

    document.getElementById(
        "cover"
    ).src =
        `https://i.ytimg.com/vi/${data.id}/hqdefault.jpg`;

    document.getElementById(
        "title"
    ).textContent =
        data.title;

    document.getElementById(
        "artist"
    ).textContent =
        data.artist;

    changingTrack = true;

    try{

        player.loadVideoById(
            data.id
        );

    }
    catch(e){}

    setTimeout(
        ()=>{
            changingTrack = false;
        },
        700
    );

    highlightActiveTrack();

    highlightVideoActiveTrack();

}


/* =========================================================
ACTIVE TRACK
========================================================= */

function getCurrentId(){

    if(!player) return "";

    try{

        const data =
            player.getVideoData();

        return data &&
            data.video_id
            ?
            data.video_id
            :
            "";

    }
    catch(e){

        return "";

    }

}

function highlightActiveTrack(){

    const id =
        getCurrentId();

    document
        .querySelectorAll(
            ".song-item"
        )
        .forEach(
            (item,index)=>{

                item.classList.toggle(
                    "active",
                    sortedPlaylistItems[index] === id
                );

            }
        );

}

function highlightVideoActiveTrack(){

    const id =
        getCurrentId();

    document
        .querySelectorAll(
            ".video-song-item"
        )
        .forEach(
            (item,index)=>{

                item.classList.toggle(
                    "active",
                    sortedPlaylistItems[index] === id
                );

            }
        );

}


/* =========================================================
UPDATE INFO
========================================================= */

function updateInfo(){

    if(
        !player ||
        typeof player.getVideoData !==
        "function"
    )
    return;

    try{

        const data =
            player.getVideoData();

        if(
            !data ||
            !data.video_id
        )
        return;

        document.getElementById(
            "cover"
        ).src =
            `https://i.ytimg.com/vi/${data.video_id}/hqdefault.jpg`;

        if(data.title){

            document.getElementById(
                "title"
            ).textContent =
                data.title;

        }

        if(data.author){

            document.getElementById(
                "artist"
            ).textContent =
                data.author;

        }

        highlightActiveTrack();
        highlightVideoActiveTrack();

    }
    catch(e){}

}


/* =========================================================
PROGRESS
========================================================= */

function updateProgress(){

    if(
        !player ||
        typeof player.getCurrentTime !==
        "function"
    )
    return;

    try{

        const current =
            player.getCurrentTime();

        const duration =
            player.getDuration();

        if(!duration) return;

        const position =
            Math.max(
                0,
                Math.min(
                    1,
                    current/duration
                )
            );

        document.getElementById(
            "fill"
        ).style.width =
            position*100 + "%";

        document.getElementById(
            "current"
        ).textContent =
            format(current);

        document.getElementById(
            "duration"
        ).textContent =
            format(duration);

    }
    catch(e){}

}


/* =========================================================
SEEK
========================================================= */

const seek =
    document.getElementById(
        "seek"
    );

seek.addEventListener(
    "click",
    e=>{

        if(!player) return;

        const rect =
            seek.getBoundingClientRect();

        const position =
            Math.max(
                0,
                Math.min(
                    1,
                    (
                        e.clientX -
                        rect.left
                    ) /
                    rect.width
                )
            );

        const duration =
            player.getDuration();

        if(duration){

            player.seekTo(
                position*duration,
                true
            );

        }

    }
);


/* =========================================================
FORMAT
========================================================= */

function format(seconds){

    if(
        !seconds ||
        isNaN(seconds)
    )
    return "0:00";

    seconds =
        Math.floor(
            seconds
        );

    return (
        Math.floor(
            seconds/60
        )
        +
        ":"
        +
        String(
            seconds%60
        ).padStart(
            2,
            "0"
        )
    );

}


/* =========================================================
ESCAPE
========================================================= */

function escapeHtml(text){

    if(!text)
    return "";

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


/* =========================================================
DRAWER
========================================================= */

function toggleDrawer(){

    const popup =
        document.getElementById(
            "videoPopup"
        );

    if(
        popup &&
        popup.classList.contains(
            "active"
        )
    )
    return;

    const drawer =
        document.getElementById(
            "drawer"
        );

    const overlay =
        document.getElementById(
            "overlay"
        );

    const opening =
        !drawer.classList.contains(
            "open"
        );

    drawer.classList.toggle(
        "open",
        opening
    );

    overlay.classList.toggle(
        "active",
        opening
    );

}


/* =========================================================
RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        if(window.innerWidth >= 769){

            document
                .getElementById(
                    "visualizer"
                )
                .style.display =
                "flex";

        }

    }
);

</script>
