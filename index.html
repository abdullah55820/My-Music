<script src="https://www.youtube.com/iframe_api"></script>

<script>

const PLAYLIST_ID = "PLbvY05KVYwoo";

let player = null;
let playerReady = false;
let playing = false;

let playlistItems = [];
let sortedPlaylistItems = [];
let sortedPlaylistData = [];

let currentSortedIndex = 0;

let sortingReady = false;
let isDragging = false;

let changingTrack = false;
let trackRequestId = 0;


/* ================= BD TIME ================= */

function updateBDTime(){

    const options = {
        timeZone:"Asia/Dhaka",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:true
    };

    document.getElementById("bdTimeVal").textContent =
        new Intl.DateTimeFormat("en-US",options).format(new Date());
}

updateBDTime();
setInterval(updateBDTime,1000);


/* ================= YOUTUBE API ================= */

function onYouTubeIframeAPIReady(){

    player = new YT.Player("yt",{

        width:"100%",
        height:"100%",

        playerVars:{
            autoplay:0,
            controls:1,
            disablekb:0,
            fs:1,
            modestbranding:1,
            playsinline:1,
            rel:0,
            iv_load_policy:3,
            listType:"playlist",
            list:PLAYLIST_ID
        },

        events:{
            onReady:onPlayerReady,
            onStateChange:onPlayerStateChange
        }

    });
}


/* ================= PLAYER READY ================= */

function onPlayerReady(){

    playerReady = true;

    loadPlaylistItems();

    setInterval(updateProgress,250);
}


/* ================= PLAYER STATE ================= */

function onPlayerStateChange(e){

    const cover =
        document.getElementById("cover");

    const playBtn =
        document.getElementById("play");

    const playIcon =
        document.getElementById("play-icon");


    /* PLAYING */

    if(e.data === YT.PlayerState.PLAYING){

        playing = true;

        changingTrack = false;

        playBtn.classList.add("playing");

        playIcon.innerHTML =
        '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

        cover.classList.add("spinning");

        updateInfo();
        highlightActiveTrack();

        return;
    }


    /* PAUSED */

    if(e.data === YT.PlayerState.PAUSED){

        playing = false;

        playBtn.classList.remove("playing");

        playIcon.innerHTML =
        '<path d="M8 5v14l11-7z"/>';

        cover.classList.remove("spinning");

        return;
    }


    /* ENDED */

    if(e.data === YT.PlayerState.ENDED){

        playing = false;

        playBtn.classList.remove("playing");

        playIcon.innerHTML =
        '<path d="M8 5v14l11-7z"/>';

        cover.classList.remove("spinning");

        if(!changingTrack){

            setTimeout(function(){

                nextSong(true);

            },50);

        }

        return;
    }

}


/* ================= PLAY / PAUSE ================= */

function togglePlay(){

    if(!player || !playerReady) return;

    try{

        const state = player.getPlayerState();


        /* Currently playing */

        if(state === YT.PlayerState.PLAYING){

            player.pauseVideo();

            return;
        }


        /* Currently paused */

        if(state === YT.PlayerState.PAUSED){

            player.playVideo();

            return;
        }


        /* No active video yet */

        if(sortedPlaylistItems.length){

            playTrackNow(
                sortedPlaylistItems[currentSortedIndex]
            );

            return;
        }


        /* Playlist not loaded yet */

        if(playlistItems.length){

            playTrackNow(playlistItems[0]);

            return;
        }

    }catch(err){

        console.log("Play error:",err);

    }

}


/* ================= PLAY TRACK ================= */

function playTrackNow(id){

    if(!player || !playerReady || !id) return;

    const request = ++trackRequestId;

    changingTrack = true;


    const index =
        sortedPlaylistItems.indexOf(id);

    if(index !== -1){

        currentSortedIndex = index;

        forceUpdateUI(index);

    }


    try{

        /*
         IMPORTANT:
         loadVideoById directly loads AND starts playback.
        */

        player.loadVideoById({
            videoId:id,
            startSeconds:0
        });


        /*
         Small fallback.
         Some mobile browsers need playVideo
         after loadVideoById.
        */

        setTimeout(function(){

            if(request !== trackRequestId) return;

            try{

                const state =
                    player.getPlayerState();

                if(
                    state === YT.PlayerState.CUED ||
                    state === YT.PlayerState.UNSTARTED
                ){

                    player.playVideo();

                }

            }catch(err){}

        },250);


    }catch(err){

        console.log("Track load error:",err);

        changingTrack = false;

    }

}


/* ================= NEXT ================= */

function nextSong(auto=false){

    if(
        !player ||
        !playerReady ||
        !sortedPlaylistItems.length
    ) return;


    changingTrack = true;


    currentSortedIndex =
        (currentSortedIndex + 1)
        % sortedPlaylistItems.length;


    const nextId =
        sortedPlaylistItems[currentSortedIndex];


    playTrackNow(nextId);

}


/* ================= PREVIOUS ================= */

function previousSong(){

    if(
        !player ||
        !playerReady ||
        !sortedPlaylistItems.length
    ) return;


    changingTrack = true;


    currentSortedIndex =
        (
            currentSortedIndex - 1
            + sortedPlaylistItems.length
        )
        % sortedPlaylistItems.length;


    const previousId =
        sortedPlaylistItems[currentSortedIndex];


    playTrackNow(previousId);

}


/* ================= FORCE UI ================= */

function forceUpdateUI(index){

    if(!sortedPlaylistData[index]) return;

    const data =
        sortedPlaylistData[index];


    document.getElementById("cover").src =
        `https://i.ytimg.com/vi/${data.id}/hqdefault.jpg`;


    document.getElementById("title").textContent =
        data.title || "YouTube Music";


    document.getElementById("artist").textContent =
        data.artist || "YouTube Music";


    currentSortedIndex = index;

    highlightActiveTrack();
}


/* ================= VIDEO POPUP ================= */

function toggleVideoPopup(){

    const coverWrapper =
        document.getElementById("coverWrapper");

    const icon =
        document.getElementById("videoToggleIcon");

    if(!coverWrapper) return;


    const opening =
        !coverWrapper.classList.contains("video-active");


    if(opening){

        coverWrapper.classList.add("video-active");

        document.body.classList.add("popup-active");

        icon.innerHTML =
        '<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>';

    }else{

        coverWrapper.classList.remove("video-active");

        document.body.classList.remove("popup-active");

        icon.innerHTML =
        '<path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>';

    }

}


/* ================= SEEK ================= */

function getSeekPosition(clientX,el){

    const rect =
        el.getBoundingClientRect();

    if(!rect.width) return 0;

    return Math.max(
        0,
        Math.min(
            1,
            (clientX - rect.left) / rect.width
        )
    );

}


const seekElement =
    document.getElementById("seek");


seekElement.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();
        e.stopPropagation();

        isDragging = true;

        try{
            seekElement.setPointerCapture(e.pointerId);
        }catch(err){}

        updateSeekVisual(
            getSeekPosition(
                e.clientX,
                seekElement
            )
        );

    },
    {passive:false}
);


seekElement.addEventListener(
    "pointermove",
    function(e){

        if(!isDragging) return;

        e.preventDefault();
        e.stopPropagation();

        updateSeekVisual(
            getSeekPosition(
                e.clientX,
                seekElement
            )
        );

    },
    {passive:false}
);


seekElement.addEventListener(
    "pointerup",
    function(e){

        if(!isDragging) return;

        e.preventDefault();
        e.stopPropagation();


        const pos =
            getSeekPosition(
                e.clientX,
                seekElement
            );


        updateSeekVisual(pos);


        if(player){

            try{

                const duration =
                    player.getDuration();

                if(duration){

                    player.seekTo(
                        pos * duration,
                        true
                    );

                }

            }catch(err){}

        }


        isDragging = false;


        try{
            seekElement.releasePointerCapture(e.pointerId);
        }catch(err){}

    },
    {passive:false}
);


function updateSeekVisual(pos){

    document.getElementById("fill").style.width =
        (pos * 100) + "%";


    if(player){

        try{

            const duration =
                player.getDuration();

            if(duration){

                document.getElementById("current").textContent =
                    format(pos * duration)
                    + " / "
                    + format(duration);

                document.getElementById("duration").textContent =
                    format(duration);

            }

        }catch(err){}

    }

}


/* ================= PROGRESS ================= */

function updateProgress(){

    if(isDragging || !player) return;

    try{

        const current =
            player.getCurrentTime();

        const duration =
            player.getDuration();


        if(!duration || isNaN(duration)) return;


        const pos =
            Math.max(
                0,
                Math.min(
                    1,
                    current / duration
                )
            );


        document.getElementById("fill").style.width =
            (pos * 100) + "%";


        document.getElementById("current").textContent =
            format(current)
            + " / "
            + format(duration);


        document.getElementById("duration").textContent =
            format(duration);

    }catch(err){}

}


/* ================= FORMAT ================= */

function format(s){

    if(!s || isNaN(s))
        return "0:00";

    s = Math.floor(s);

    return (
        Math.floor(s / 60)
        + ":"
        + String(s % 60).padStart(2,"0")
    );

}


/* ================= LOAD PLAYLIST ================= */

function loadPlaylistItems(){

    if(
        !player ||
        typeof player.getPlaylist !== "function"
    ) return;


    let ids = [];


    try{

        ids = player.getPlaylist();

    }catch(err){

        setTimeout(
            loadPlaylistItems,
            500
        );

        return;

    }


    if(!ids || !ids.length){

        setTimeout(
            loadPlaylistItems,
            500
        );

        return;
    }


    playlistItems = ids.slice();

    sortedPlaylistItems = [];
    sortedPlaylistData = [];

    sortingReady = false;


    Promise.all(

        ids.map(

            function(id,index){

                return fetch(
                    `https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`
                )

                .then(function(r){
                    return r.json();
                })

                .then(function(data){

                    return {

                        id:id,

                        title:
                            data && data.title
                            ? data.title
                            : `Track #${index+1}`,

                        artist:
                            data && data.author_name
                            ? data.author_name
                            : "YouTube Music",

                        originalIndex:index

                    };

                })

                .catch(function(){

                    return {

                        id:id,

                        title:`Track #${index+1}`,

                        artist:"YouTube Music",

                        originalIndex:index

                    };

                });

            }

        )

    )

    .then(function(results){

        results.sort(
            function(a,b){

                return a.title.localeCompare(
                    b.title,
                    undefined,
                    {
                        numeric:true,
                        sensitivity:"base"
                    }
                );

            }
        );


        sortedPlaylistData = results;

        sortedPlaylistItems =
            results.map(function(x){
                return x.id;
            });


        sortingReady = true;


        let currentId = "";

        try{

            const data =
                player.getVideoData();

            if(data){
                currentId = data.video_id || "";
            }

        }catch(err){}


        const idx =
            sortedPlaylistItems.indexOf(currentId);


        if(idx !== -1){

            currentSortedIndex = idx;

        }else{

            currentSortedIndex = 0;

        }


        renderSortedPlaylists();

        highlightActiveTrack();

        updateInfo();

    });

}


/* ================= RENDER PLAYLIST ================= */

function renderSortedPlaylists(){

    const list =
        document.getElementById("songList");

    list.innerHTML = "";


    sortedPlaylistData.forEach(
        function(data,index){

            const item =
                document.createElement("div");

            item.className = "song-item";

            item.id =
                `track-${index}`;


            item.onclick =
                function(){

                    playSpecificTrack(index);

                };


            item.innerHTML = `

                <img
                    src="https://i.ytimg.com/vi/${data.id}/hqdefault.jpg"
                    alt="thumb">

                <div class="song-item-info">

                    <div class="song-item-title">
                        ${escapeHtml(data.title)}
                    </div>

                    <div class="song-item-artist">
                        ${escapeHtml(data.artist)}
                    </div>

                </div>

            `;


            list.appendChild(item);

        }
    );

}


/* ================= ESCAPE ================= */

function escapeHtml(text){

    if(!text) return "";

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* ================= SPECIFIC TRACK ================= */

function playSpecificTrack(index){

    if(
        !player ||
        !playerReady ||
        !sortedPlaylistData[index]
    ) return;


    const id =
        sortedPlaylistData[index].id;


    currentSortedIndex = index;


    forceUpdateUI(index);


    playTrackNow(id);


    document
        .getElementById("drawer")
        .classList.remove("open");


    document
        .getElementById("overlay")
        .classList.remove("active");

}


/* ================= ACTIVE SONG ================= */

function highlightActiveTrack(){

    if(
        !sortedPlaylistItems.length ||
        !player
    ) return;


    let id = "";


    try{

        const data =
            player.getVideoData();

        if(data){
            id = data.video_id || "";
        }

    }catch(err){}


    document
        .querySelectorAll(".song-item")
        .forEach(
            function(item,index){

                item.classList.toggle(
                    "active",
                    sortedPlaylistItems[index] === id
                );

            }
        );

}


/* ================= UPDATE INFO ================= */

function updateInfo(){

    if(!player) return;


    try{

        const d =
            player.getVideoData();


        if(
            !d ||
            !d.video_id
        ) return;


        document.getElementById("cover").src =
            `https://i.ytimg.com/vi/${d.video_id}/hqdefault.jpg`;


        if(d.title){

            document.getElementById("title").textContent =
                d.title;

        }


        if(d.author){

            document.getElementById("artist").textContent =
                d.author;

        }


        const idx =
            sortedPlaylistItems.indexOf(d.video_id);


        if(idx !== -1){

            currentSortedIndex = idx;

        }


        highlightActiveTrack();

    }catch(err){}

}


/* ================= DRAWER ================= */

function toggleDrawer(){

    const coverWrapper =
        document.getElementById("coverWrapper");


    /*
       FIX:
       coverwrapper -> coverWrapper
    */

    if(
        coverWrapper &&
        coverWrapper.classList.contains("video-active")
    ){
        return;
    }


    const drawer =
        document.getElementById("drawer");

    const overlay =
        document.getElementById("overlay");


    const opening =
        !drawer.classList.contains("open");


    drawer.classList.toggle(
        "open",
        opening
    );


    overlay.classList.toggle(
        "active",
        opening
    );


    if(
        opening &&
        !sortingReady
    ){

        loadPlaylistItems();

    }

}

</script>
