<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player UI</title>
  <!-- jsmediatags CDN to read audio ID3 metadata -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #1a0507;
      color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Blurred Background Effect */
    .bg-blur {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: blur(60px) brightness(0.5);
      transform: scale(1.2);
      z-index: 1;
      transition: background-image 0.5s ease;
    }

    .player-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 380px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Grab Bar Indicator */
    .top-bar {
      width: 40px;
      height: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      margin-bottom: 25px;
    }

    /* Album Cover */
    .album-art-container {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 30px rgba(0,0,0,0.6);
      margin-bottom: 30px;
      position: relative;
      background-color: #2c0b0e;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .album-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Track Information */
    .track-info {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .title-artist {
      max-width: 75%;
    }

    .track-title {
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .action-icons {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .icon-btn:hover {
      opacity: 1;
    }

    /* Progress Bar */
    .progress-container {
      width: 100%;
      margin-bottom: 25px;
    }

    .slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      cursor: pointer;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 8px;
    }

    .badge-lossless {
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Player Controls */
    .controls {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      margin-bottom: 25px;
    }

    .play-btn {
      width: 60px;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Volume Slider */
    .volume-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      opacity: 0.7;
    }

    /* Bottom Navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-between;
      width: 70%;
      opacity: 0.7;
      margin-bottom: 20px;
    }

    /* Custom Upload Button */
    .file-input-wrapper {
      margin-top: 5px;
    }

    .file-label {
      background: rgba(255, 255, 255, 0.2);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: background 0.2s;
    }

    .file-label:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    #audio-file {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Blurred Dynamic Background -->
  <div class="bg-blur" id="bg-blur"></div>

  <div class="player-card">
    <div class="top-bar"></div>

    <!-- Album Cover Image -->
    <div class="album-art-container">
      <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Album Cover" class="album-art" id="album-art">
    </div>

    <!-- Dynamic Song Details -->
    <div class="track-info">
      <div class="title-artist">
        <div class="track-title" id="track-title">No Song Selected</div>
        <div class="track-artist" id="track-artist">Select an audio file</div>
      </div>
      <div class="action-icons">
        <button class="icon-btn">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </button>
        <button class="icon-btn">
          <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-container">
      <input type="range" id="seek-slider" class="slider" value="0" min="0" max="100">
      <div class="time-info">
        <span id="current-time">0:00</span>
        <span class="badge-lossless">Lossless</span>
        <span id="duration">-0:00</span>
      </div>
    </div>

    <!-- Playback Controls -->
    <div class="controls">
      <button class="icon-btn" id="prev-btn">
        <svg width="32" height="32" fill="currentColor" viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
      </button>

      <button class="icon-btn play-btn" id="play-btn">
        <svg id="play-icon" width="45" height="45" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <button class="icon-btn" id="next-btn">
        <svg width="32" height="32" fill="currentColor" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
      </button>
    </div>

    <!-- Volume Controls -->
    <div class="volume-container">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
      <input type="range" id="volume-slider" class="slider" value="80" min="0" max="100">
      <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-nav">
      <button class="icon-btn">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button class="icon-btn">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
      </button>
      <button class="icon-btn">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </button>
    </div>

    <!-- Storage Audio File Selector -->
    <div class="file-input-wrapper">
      <label for="audio-file" class="file-label">🎵 Select Audio File</label>
      <input type="file" id="audio-file" accept="audio/*">
    </div>

  </div>

  <audio id="audio-player"></audio>

  <script>
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const seekSlider = document.getElementById('seek-slider');
    const volumeSlider = document.getElementById('volume-slider');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const audioFileInput = document.getElementById('audio-file');
    const trackTitle = document.getElementById('track-title');
    const trackArtist = document.getElementById('track-artist');
    const albumArt = document.getElementById('album-art');
    const bgBlur = document.getElementById('bg-blur');

    let isPlaying = false;

    // Handle File Selection and ID3 Tag Reading
    audioFileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const fileURL = URL.createObjectURL(file);
      audio.src = fileURL;

      // Reset Cover Photo to default state initially
      resetCoverArt();

      // Read Metadata using jsmediatags
      jsmediatags.read(file, {
        onSuccess: function(tag) {
          const tags = tag.tags;

          // Set Title
          trackTitle.textContent = tags.title || file.name.replace(/\.[^/.]+$/, "");
          
          // Set Artist
          trackArtist.textContent = tags.artist || 'Unknown Artist';

          // Set Album Cover Art if present in file
          if (tags.picture) {
            const { data, format } = tags.picture;
            let base64String = "";
            for (let i = 0; i < data.length; i++) {
              base64String += String.fromCharCode(data[i]);
            }
            const imageUrl = `data:${format};base64,${window.btoa(base64String)}`;
            setCoverArt(imageUrl);
          }
        },
        onError: function(error) {
          // Fallback if metadata fails to load
          trackTitle.textContent = file.name.replace(/\.[^/.]+$/, "");
          trackArtist.textContent = 'Local File';
        }
      });

      playAudio();
    });

    function setCoverArt(url) {
      albumArt.src = url;
      bgBlur.style.backgroundImage = `url(${url})`;
    }

    function resetCoverArt() {
      albumArt.src = '';
      bgBlur.style.backgroundImage = 'none';
      bgBlur.style.backgroundColor = '#2c0b0e';
    }

    // Play & Pause
    function playAudio() {
      if (!audio.src) return;
      audio.play();
      isPlaying = true;
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    }

    function pauseAudio() {
      audio.pause();
      isPlaying = false;
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) pauseAudio();
      else playAudio();
    });

    // Time Seek & Updating
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        seekSlider.value = (audio.currentTime / audio.duration) * 100;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationEl.textContent = '-' + formatTime(audio.duration - audio.currentTime);
      }
    });

    seekSlider.addEventListener('input', () => {
      if (audio.duration) {
        audio.currentTime = (seekSlider.value / 100) * audio.duration;
      }
    });

    volumeSlider.addEventListener('input', (e) => {
      audio.volume = e.target.value / 100;
    });

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }
  </script>
</body>
</html>
