<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>My Music Player</title>

<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">

<link rel="preload"
as="image"
href="background.jpg">

<link rel="apple-touch-icon"
sizes="180x180"
href="logo.png">

<link rel="icon"
type="image/png"
href="logo.png">

<style>

/* =================================================
   BASIC
   ================================================= */

*{
box-sizing:border-box;
}

html,
body{

margin:0;

width:100%;
height:100%;

overflow:hidden;

background:#050505;

color:#fff;

font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
"Segoe UI",
sans-serif;

}

body{

position:relative;

overflow-x:hidden!important;

}


/* =================================================
   BACKGROUND
   ================================================= */

.bg{

position:fixed;

inset:0;

background-image:url("background.jpg");

background-position:center center;

background-size:cover;

background-repeat:no-repeat;

z-index:0;

transition:
filter .25s ease,
transform .25s ease;

}

.bg:after{

content:"";

position:absolute;

inset:0;

background:rgba(0,0,0,.15);

}


/* =================================================
   VIDEO OPEN
   ONLY BACKGROUND BLURS
   ================================================= */

body.video-open .bg{

filter:blur(18px);

transform:scale(1.04);

}


/* =================================================
   TOP WIDGETS
   ================================================= */

.top-widgets{

position:fixed;

top:14px;

left:50%;

transform:translateX(-50%);

z-index:10;

display:flex;

flex-direction:column;

align-items:center;

gap:8px;

}


/* BD TIME */

.bd-time{

padding:5px 11px;

border-radius:20px;

background:rgba(0,0,0,.45);

border:1px solid rgba(255,255,255,.18);

color:rgba(255,255,255,.9);

font-size:11px;

font-weight:600;

letter-spacing:.3px;

backdrop-filter:blur(12px);

-webkit-backdrop-filter:blur(12px);

display:flex;

align-items:center;

gap:6px;

}


.live-dot{

width:7px;

height:7px;

background:#ff3b30;

border-radius:50%;

display:inline-block;

box-shadow:
0 0 8px #ff3b30;

animation:pulse 1.5s infinite;

}


@keyframes pulse{

0%{
opacity:1;
transform:scale(1);
}

50%{
opacity:.3;
transform:scale(.8);
}

100%{
opacity:1;
transform:scale(1);
}

}


/* =================================================
   PLAYLIST BUTTON
   ================================================= */

.playlist-toggle-btn{

padding:5px 12px;

border-radius:20px;

background:rgba(0,0,0,.45);

border:1px solid rgba(255,255,255,.18);

color:rgba(255,255,255,.9);

font-size:11px;

font-weight:600;

backdrop-filter:blur(12px);

-webkit-backdrop-filter:blur(12px);

display:flex;

align-items:center;

gap:6px;

cursor:pointer;

transition:
transform .2s,
background .2s;

}

.playlist-toggle-btn:active{

transform:scale(.95);

}

.playlist-toggle-btn svg{

width:14px;

height:14px;

fill:#fff;

}


/* =================================================
   HIDDEN YOUTUBE PLAYER
   ================================================= */

#yt{

position:fixed;

width:2px;

height:2px;

left:-10px;

bottom:-10px;

opacity:1;

pointer-events:none;

z-index:1;

}


/* =================================================
   APP
   ================================================= */

.app{

position:relative;

z-index:2;

height:100dvh;

width:100%;

display:flex;

align-items:flex-end;

justify-content:center;

padding:0 16px 65px;

}


/* =================================================
   MUSIC PLAYER
   ================================================= */

.player{

width:min(440px,94%);

height:120px;

padding:14px 18px;

border:
1px solid rgba(255,255,255,.18);

border-radius:60px;

background:
rgba(255,255,255,.06);

backdrop-filter:
blur(25px) saturate(115%);

-webkit-backdrop-filter:
blur(25px) saturate(115%);

box-shadow:
0 20px 50px rgba(0,0,0,.45);

display:flex;

align-items:center;

gap:12px;

position:relative;

overflow:hidden;

touch-action:pan-y;

}


/* =================================================
   COVER
   ================================================= */

.cover-wrapper{

position:relative;

width:84px;

height:84px;

flex-shrink:0;

display:flex;

align-items:center;

justify-content:center;

border-radius:50%;

overflow:hidden;

border:
1px solid rgba(255,255,255,.3);

}


.cover{

width:137%;

height:137%;

margin:-18.5%;

border-radius:50%;

object-fit:cover;

object-position:center;

background:#222;

animation:
spin 8s linear infinite;

animation-play-state:paused;

}


.cover-wrapper::after{

content:"";

position:absolute;

width:16px;

height:16px;

background:
rgba(20,20,20,.85);

border:
2px solid rgba(255,255,255,.3);

border-radius:50%;

left:50%;

top:50%;

transform:
translate(-50%,-50%);

z-index:2;

}


.cover.spinning{

animation-play-state:running;

}


@keyframes spin{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}


/* =================================================
   SONG INFO
   ================================================= */

.middle{

flex:1;

min-width:0;

display:flex;

flex-direction:column;

justify-content:center;

}


.title{

font-size:16px;

font-weight:700;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

color:#fff;

letter-spacing:.2px;

}


.artist{

font-size:12px;

color:
rgba(255,255,255,.65);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-top:2px;

margin-bottom:8px;

}


/* =================================================
   SEEK
   ================================================= */

.seek{

position:relative;

width:100%;

height:5px;

border-radius:10px;

background:
rgba(255,255,255,.2);

cursor:pointer;

margin-bottom:6px;

touch-action:none;

user-select:none;

-webkit-user-select:none;

}


.seek::before{

content:"";

position:absolute;

top:-12px;

bottom:-12px;

left:-10px;

right:-10px;

z-index:1;

}


.fill{

position:absolute;

left:0;

top:0;

height:100%;

width:0;

background:#fff;

border-radius:10px;

pointer-events:none;

z-index:2;

}


.time-display{

font-size:11px;

color:
rgba(255,255,255,.65);

font-variant-numeric:
tabular-nums;

}


/* =================================================
   CONTROLS
   ================================================= */

.controls{

display:flex;

align-items:center;

gap:7px;

flex-shrink:0;

}


/* NORMAL BUTTON */

.btn{

width:28px;

height:28px;

border:0;

background:transparent;

color:
rgba(255,255,255,.9);

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

padding:0;

}


.btn svg{

width:20px;

height:20px;

fill:#fff;

}


/* =================================================
   VIDEO BUTTON
   ================================================= */

.video-btn{

width:34px;

height:34px;

border-radius:50%;

border:
1px solid rgba(255,255,255,.25);

background:
rgba(255,255,255,.10);

color:#fff;

display:flex;

align-items:center;

justify-content:center;

padding:0;

cursor:pointer;

flex-shrink:0;

backdrop-filter:blur(10px);

-webkit-backdrop-filter:blur(10px);

transition:
transform .15s,
background .2s;

}


.video-btn svg{

width:18px;

height:18px;

fill:#fff;

}


.video-btn:active{

transform:scale(.88);

}


.video-btn.active{

background:
rgba(255,255,255,.22);

}


/* =================================================
   VOLUME
   ================================================= */

.vol-container{

display:flex;

align-items:center;

gap:4px;

background:
rgba(0,0,0,.25);

border:
1px solid rgba(255,255,255,.15);

padding:4px 6px;

border-radius:20px;

backdrop-filter:blur(10px);

-webkit-backdrop-filter:blur(10px);

}


.vol-slider-wrapper{

width:0;

overflow:hidden;

opacity:0;

display:flex;

align-items:center;

transition:
width .28s cubic-bezier(.2,.8,.2,1),
opacity .2s ease;

}


.vol-slider-wrapper.active{

width:55px;

opacity:1;

margin-left:2px;

}


.vol-slider{

-webkit-appearance:none;

appearance:none;

width:55px;

height:3.5px;

background:
rgba(255,255,255,.3);

border-radius:10px;

outline:none;

cursor:pointer;

}


.vol-slider::-webkit-slider-thumb{

-webkit-appearance:none;

appearance:none;

width:10px;

height:10px;

border-radius:50%;

background:#fff;

cursor:pointer;

box-shadow:
0 0 5px rgba(0,0,0,.5);

}


/* IOS VOLUME HIDE */

@supports (-webkit-touch-callout:none){

.vol-container{

display:none!important;

}

}


/* =================================================
   PLAY BUTTON
   ================================================= */

.play{

width:44px;

height:44px;

border-radius:50%;

border:0;

background:#fff;

color:#000;

display:flex;

align-items:center;

justify-content:center;

box-shadow:
0 4px 15px rgba(0,0,0,.3);

cursor:pointer;

flex-shrink:0;

}


.play svg{

width:20px;

height:20px;

fill:#000;

margin-left:2px;

}


.play.playing svg{

margin-left:0;

}


.btn:active,
.play:active{

transform:scale(.90);

}


/* =================================================
   DRAWER OVERLAY
   ================================================= */

.drawer-overlay{

position:fixed;

inset:0;

z-index:99;

background:transparent!important;

backdrop-filter:none!important;

-webkit-backdrop-filter:none!important;

pointer-events:none;

display:none;

}


.drawer-overlay.active{

display:block;

pointer-events:auto;

}


/* =================================================
   PLAYLIST DRAWER
   ================================================= */

.playlist-drawer{

position:fixed;

top:0;

right:-100%;

width:170px;

height:100dvh;

background:
rgba(20,20,20,.35)!important;

backdrop-filter:
blur(25px) saturate(150%)!important;

-webkit-backdrop-filter:
blur(25px) saturate(150%)!important;

border-left:
1px solid rgba(255,255,255,.15)!important;

z-index:100;

transition:
right .35s cubic-bezier(.2,.8,.2,1);

display:flex;

flex-direction:column;

padding:12px 6px;

box-shadow:
-10px 0 30px rgba(0,0,0,.3)!important;

visibility:hidden;

pointer-events:none;

}


.playlist-drawer.open{

right:0;

visibility:visible;

pointer-events:auto;

}


.drawer-header{

display:flex;

align-items:center;

justify-content:space-between;

padding:6px 8px;

border-bottom:
1px solid rgba(255,255,255,.15);

margin-bottom:8px;

background:
rgba(255,255,255,.1);

border-radius:8px;

}


.drawer-title{

font-size:11px;

font-weight:700;

color:#fff;

}


.close-btn{

background:transparent;

border:0;

color:
rgba(255,255,255,.9);

font-size:16px;

cursor:pointer;

padding:0 2px;

line-height:1;

}


.song-list{

flex:1;

overflow-y:auto;

display:flex;

flex-direction:column;

gap:4px;

padding-right:2px;

}


.song-list::-webkit-scrollbar{

width:2px;

}


.song-list::-webkit-scrollbar-thumb{

background:
rgba(255,255,255,.3);

border-radius:3px;

}


/* =================================================
   SONG ITEM
   ================================================= */

.song-item{

display:flex;

align-items:center;

gap:6px;

padding:4px 5px;

border-radius:7px;

background:
rgba(255,255,255,.08);

border:
1px solid rgba(255,255,255,.1);

cursor:pointer;

}


.song-item:active{

transform:scale(.96);

}


.song-item:hover,
.song-item.active{

background:
rgba(255,255,255,.22);

border-color:
rgba(255,255,255,.35);

}


.song-item img{

width:26px;

height:26px;

border-radius:5px;

object-fit:cover;

flex-shrink:0;

box-shadow:
0 2px 5px rgba(0,0,0,.3);

}


.song-item-info{

flex:1;

min-width:0;

}


.song-item-title{

font-size:9.5px;

font-weight:700;

color:#fff;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

letter-spacing:.2px;

}


.song-item-artist{

font-size:8px;

font-weight:400;

color:
rgba(255,255,255,.55);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-top:.5px;

}


/* =================================================
   VIDEO POPUP
   ================================================= */

.video-popup{

position:fixed;

left:50%;

top:50%;

transform:
translate(-50%,-50%);

width:min(92vw,665px);

aspect-ratio:16 / 9;

border-radius:22px;

overflow:hidden;

background:#000;

border:
1px solid rgba(255,255,255,.48);

box-shadow:

0 0 0 1px
rgba(255,255,255,.08),

0 0 22px
rgba(255,255,255,.16),

0 25px 70px
rgba(0,0,0,.65);

z-index:500;

display:none;

}


/* ACTIVE */

.video-popup.active{

display:block;

}


/* VIDEO ITSELF */

#yt{

position:absolute!important;

left:0!important;

top:0!important;

width:100%!important;

height:100%!important;

opacity:1!important;

pointer-events:none!important;

z-index:1!important;

}


/* YOUTUBE IFRAME */

#yt iframe{

position:absolute!important;

left:0!important;

top:0!important;

width:100%!important;

height:100%!important;

border:0!important;

display:block!important;

pointer-events:none!important;

}


/* =================================================
   VIDEO CLOSE
   ================================================= */

.video-close{

position:absolute;

top:8px;

right:8px;

width:36px;

height:36px;

border-radius:50%;

border:
1px solid rgba(255,255,255,.40);

background:
rgba(0,0,0,.38);

color:#fff;

display:flex;

align-items:center;

justify-content:center;

font-size:24px;

line-height:1;

padding:0;

z-index:20;

cursor:pointer;

backdrop-filter:blur(12px);

-webkit-backdrop-filter:blur(12px);

}


/* =================================================
   MOBILE
   ================================================= */

@media(max-width:480px){

.app{

padding-bottom:60px;

}


.player{

height:116px;

padding:12px 14px;

border-radius:58px;

gap:8px;

}


.cover-wrapper{

width:78px;

height:78px;

}


.title{

font-size:15px;

}


.artist{

font-size:11px;

}


.play{

width:42px;

height:42px;

}


.video-btn{

width:34px;

height:34px;

}


.top-widgets{

top:10px;

}


.bd-time{

font-size:10px;

padding:4px 9px;

}


.playlist-toggle-btn{

font-size:10px;

padding:4px 9px;

}


.playlist-drawer{

width:170px;

}


.video-popup{

width:94vw;

border-radius:20px;

}

}


/* SMALL PHONE */

@media(max-width:370px){

.player{

gap:5px;

padding-left:10px;

padding-right:10px;

}


.cover-wrapper{

width:70px;

height:70px;

}


.controls{

gap:4px;

}


.video-btn{

width:31px;

height:31px;

}


.play{

width:40px;

height:40px;

}

}

</style>
</head>

<body>


<!-- =================================================
     BACKGROUND
     ================================================= -->

<div class="bg"></div>


<!-- =================================================
     TOP WIDGETS
     ================================================= -->

<span class="live-dot"></span>

<script
src="https://www.youtube.com/iframe_api">
</script>
<script>

/* =================================================
   PLAYLIST
   ================================================= */

const PLAYLIST_ID =
"PLbvY05KVYwoo";


let player = null;

let playing = false;

let playlistItems = [];

let videoOpen = false;

let videoWasPlaying = false;


/* =================================================
   BD TIME
   ================================================= */

function updateBDTime(){

const options = {

timeZone:"Asia/Dhaka",

hour:"2-digit",

minute:"2-digit",

second:"2-digit",

hour12:true

};


document.getElementById(
"bdTimeVal"
).textContent =

new Intl.DateTimeFormat(
"en-US",
options
).format(new Date());

}


updateBDTime();

setInterval(
updateBDTime,
1000
);


/* =================================================
   YOUTUBE API
   ================================================= */

function onYouTubeIframeAPIReady(){

player = new YT.Player(
"yt",
{

width:"2",

height:"2",

playerVars:{

autoplay:0,

controls:0,

disablekb:1,

fs:0,

modestbranding:1,

playsinline:1,

rel:0,

iv_load_policy:3,

listType:"playlist",

list:PLAYLIST_ID

},

events:{

onReady:ready,

onStateChange:state

}

});

}


/* =================================================
   READY
   ================================================= */

function ready(){

try{

player.setVolume(100);

}catch(e){}


loadPlaylistItems();


setInterval(
updateProgress,
250
);

}


/* =================================================
   STATE
   ================================================= */

function state(e){

const cover =
document.getElementById(
"cover"
);

const playBtn =
document.getElementById(
"play"
);

const playIcon =
document.getElementById(
"play-icon"
);


highlightActiveTrack();


if(
e.data ===
YT.PlayerState.PLAYING
){

playing = true;

playBtn.classList.add(
"playing"
);

playIcon.innerHTML =
`
<path d="
M6 19h4V5H6v14zm8-14v14h4V5h-4z
"/>
`;

cover.classList.add(
"spinning"
);


/*
   Video popup open থাকলে
   audio/video same player
*/

updateInfo();

}


else if(

e.data ===
YT.PlayerState.PAUSED ||

e.data ===
YT.PlayerState.ENDED

){

playing = false;

playBtn.classList.remove(
"playing"
);

playIcon.innerHTML =
`
<path d="
M8 5v14l11-7z
"/>
`;

cover.classList.remove(
"spinning"
);

}

}


/* =================================================
   PLAY / PAUSE
   ================================================= */

function togglePlay(){

if(!player)
return;


if(playing){

player.pauseVideo();

}else{

player.playVideo();

}

}


/* =================================================
   VOLUME
   ================================================= */

let volTimer = null;


function resetVolTimer(){

if(volTimer)
clearTimeout(volTimer);


volTimer =
setTimeout(()=>{

document
.getElementById(
"volWrapper"
)
.classList.remove(
"active"
);

},3000);

}


function toggleVolume(){

const wrapper =
document.getElementById(
"volWrapper"
);


if(
wrapper.classList.contains(
"active"
)
){

wrapper.classList.remove(
"active"
);

if(volTimer)
clearTimeout(volTimer);

}else{

wrapper.classList.add(
"active"
);

resetVolTimer();

}

}


function changeVolume(val){

if(
player &&
typeof player.setVolume ===
"function"
){

player.setVolume(val);

}

resetVolTimer();

}


/* =================================================
   NEXT SONG
   ================================================= */

function nextSong(){

if(
!player ||
playlistItems.length === 0
)
return;


const current =
player.getPlaylistIndex();


const next =
(
current + 1
)
%
playlistItems.length;


forceUpdateUI(next);


player.nextVideo();

}


/* =================================================
   PREVIOUS SONG
   ================================================= */

function previousSong(){

if(
!player ||
playlistItems.length === 0
)
return;


const current =
player.getPlaylistIndex();


const previous =
(
current - 1 +
playlistItems.length
)
%
playlistItems.length;


forceUpdateUI(previous);


player.previousVideo();

}


/* =================================================
   FORCE UI
   ================================================= */

function forceUpdateUI(index){

if(
!playlistItems[index]
)
return;


const id =
playlistItems[index];


document.getElementById(
"cover"
).src =
`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;


const title =
document.getElementById(
`title-${index}`
);


const artist =
document.getElementById(
`artist-${index}`
);


if(title){

document.getElementById(
"title"
).textContent =
title.textContent;

}


if(artist){

document.getElementById(
"artist"
).textContent =
artist.textContent;

}

}


/* =================================================
   SWIPE
   ================================================= */

let swipeStartX = 0;

let swipeStartY = 0;

let swipeActive = false;

let swipeFromSeek = false;


const playerCard =
document.getElementById(
"playerCard"
);


const seekElement =
document.getElementById(
"seek"
);


/* POINTER DOWN */

playerCard.addEventListener(
"pointerdown",
e=>{

swipeStartX =
e.clientX;

swipeStartY =
e.clientY;

swipeFromSeek =
!!e.target.closest(
"#seek"
);

swipeActive = true;


if(swipeFromSeek){

e.stopPropagation();

}

});


/* POINTER MOVE */

playerCard.addEventListener(
"pointermove",
e=>{

if(!swipeActive)
return;


if(swipeFromSeek){

e.stopPropagation();

}

});


/* POINTER UP */

playerCard.addEventListener(
"pointerup",
e=>{

if(!swipeActive)
return;


const endX =
e.clientX;

const endY =
e.clientY;


const dx =
endX - swipeStartX;

const dy =
endY - swipeStartY;


if(swipeFromSeek){

swipeActive = false;

return;

}


if(
Math.abs(dx) < 50
){

swipeActive = false;

return;

}


if(
Math.abs(dy) >
Math.abs(dx)
){

swipeActive = false;

return;

}


if(dx < -50){

nextSong();

}
else if(dx > 50){

previousSong();

}


swipeActive = false;

});


/* CANCEL */

playerCard.addEventListener(
"pointercancel",
()=>{

swipeActive = false;

}
);


/* =================================================
   SEEK
   ================================================= */

let isDragging = false;

let seekPointerId = null;


/* POSITION */

function getSeekPosition(
clientX
){

const rect =
seekElement
.getBoundingClientRect();


if(!rect.width)
return 0;


return Math.max(
0,
Math.min(
1,
(
clientX -
rect.left
) /
rect.width
)
);

}


/* VISUAL */

function updateSeekVisual(
pos
){

document.getElementById(
"fill"
).style.width =
(pos * 100) + "%";


if(
player &&
typeof player.getDuration ===
"function"
){

const duration =
player.getDuration();


if(duration){

document.getElementById(
"current"
).textContent =
format(
pos * duration
);

document.getElementById(
"duration"
).textContent =
format(duration);

}

}

}


/* SEEK START */

seekElement.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

e.stopPropagation();

isDragging = true;

seekPointerId =
e.pointerId;


try{

seekElement.setPointerCapture(
e.pointerId
);

}catch(err){}


const pos =
getSeekPosition(
e.clientX
);


updateSeekVisual(pos);

},
{
passive:false
}
);


/* SEEK MOVE */

seekElement.addEventListener(
"pointermove",
e=>{

if(!isDragging)
return;


e.preventDefault();

e.stopPropagation();


const pos =
getSeekPosition(
e.clientX
);


updateSeekVisual(pos);

},
{
passive:false
}
);


/* SEEK END */

seekElement.addEventListener(
"pointerup",
e=>{

if(!isDragging)
return;


e.preventDefault();

e.stopPropagation();


const pos =
getSeekPosition(
e.clientX
);


updateSeekVisual(pos);


if(
player &&
typeof player.getDuration ===
"function"
){

const duration =
player.getDuration();


if(duration){

player.seekTo(
pos * duration,
true
);

}

}


isDragging = false;

seekPointerId = null;


try{

seekElement.releasePointerCapture(
e.pointerId
);

}catch(err){}

},
{
passive:false
}
);


/* SEEK CANCEL */

seekElement.addEventListener(
"pointercancel",
()=>{

isDragging = false;

seekPointerId = null;

}
);


/* =================================================
   PROGRESS
   ================================================= */

function updateProgress(){

if(isDragging)
return;


if(
!player ||
typeof player.getCurrentTime !==
"function"
)
return;


try{

const current =
player.getCurrentTime();

const duration =
player.getDuration();


if(!duration)
return;


const pos =
Math.max(
0,
Math.min(
1,
current / duration
)
);


document.getElementById(
"fill"
).style.width =
(pos * 100) + "%";


document.getElementById(
"current"
).textContent =
format(current);


document.getElementById(
"duration"
).textContent =
format(duration);


}catch(e){}

}


/* =================================================
   FORMAT
   ================================================= */

function format(s){

if(
!s ||
isNaN(s)
)
return "0:00";


s =
Math.floor(s);


return Math.floor(s / 60)
+
":"
+
String(
s % 60
).padStart(
2,
"0"
);

}


/* =================================================
   PLAYLIST LOAD
   ================================================= */

function loadPlaylistItems(){

if(
!player ||
typeof player.getPlaylist !==
"function"
)
return;


playlistItems =
player.getPlaylist();


const list =
document.getElementById(
"songList"
);


if(
!playlistItems ||
playlistItems.length === 0
){

list.innerHTML =
`
<div style="
text-align:center;
color:rgba(255,255,255,.7);
font-size:10px;
margin-top:15px;
">
No tracks found
</div>
`;

return;

}


list.innerHTML = "";


playlistItems.forEach(
(id,index)=>{

const item =
document.createElement(
"div"
);


item.className =
"song-item";


item.id =
`track-${index}`;


item.onclick = ()=>{
playSpecificTrack(index);
};


item.innerHTML =
`

<img
src="https://i.ytimg.com/vi/${id}/hqdefault.jpg"
alt="thumb"
>

<div class="song-item-info">

<div
class="song-item-title"
id="title-${index}"
>
Track #${index+1}
</div>

<div
class="song-item-artist"
id="artist-${index}"
>
YouTube Music
</div>

</div>

`;


list.appendChild(item);


fetchSongDetails(
id,
index
);

});


highlightActiveTrack();

updateInfo();

}


/* =================================================
   DETAILS
   ================================================= */

function fetchSongDetails(
id,
index
){

fetch(
`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`
)

.then(
r=>r.json()
)

.then(
data=>{

if(!data)
return;


const title =
document.getElementById(
`title-${index}`
);


const artist =
document.getElementById(
`artist-${index}`
);


if(
title &&
data.title
){

title.textContent =
data.title;

}


if(
artist &&
data.author_name
){

artist.textContent =
data.author_name;

}

})

.catch(
()=>{}
);

}


/* =================================================
   PLAY SPECIFIC TRACK
   ================================================= */

function playSpecificTrack(
index
){

if(!player)
return;


forceUpdateUI(index);


player.playVideoAt(index);


toggleDrawer();

}


/* =================================================
   ACTIVE TRACK
   ================================================= */

function highlightActiveTrack(){

if(
!player ||
typeof player.getPlaylistIndex !==
"function"
)
return;


const current =
player.getPlaylistIndex();


document
.querySelectorAll(
".song-item"
)
.forEach(
(item,index)=>{

item.classList.toggle(
"active",
index === current
);

});

}


/* =================================================
   SONG INFO
   ================================================= */

function updateInfo(){

if(
!player ||
typeof player.getVideoData !==
"function"
)
return;


try{

const d =
player.getVideoData();


if(
!d ||
!d.video_id
)
return;


document.getElementById(
"cover"
).src =
`https://i.ytimg.com/vi/${d.video_id}/hqdefault.jpg`;


if(d.title){

document.getElementById(
"title"
).textContent =
d.title;

}


if(d.author){

document.getElementById(
"artist"
).textContent =
d.author;

}

}catch(e){}

}


/* =================================================
   DRAWER
   ================================================= */

function toggleDrawer(){

const drawer =
document.getElementById(
"drawer"
);

const overlay =
document.getElementById(
"overlay"
);


drawer.classList.toggle(
"open"
);

overlay.classList.toggle(
"active"
);

}


/* =================================================
   VIDEO POPUP
   ================================================= */

/*
   IMPORTANT:

   নতুন YT.Player() তৈরি করা হচ্ছে না।

   একই player resize করে popup-এ
   দেখানো হচ্ছে।
*/


function toggleVideo(){

if(videoOpen){

closeVideo();

}else{

openVideo();

}

}


/* =================================================
   OPEN VIDEO
   ================================================= */

function openVideo(){

if(
!player ||
typeof player.getCurrentTime !==
"function"
)
return;


/*
   Audio যেখানে আছে
   সেই exact position
*/

let currentTime = 0;

try{

currentTime =
player.getCurrentTime() || 0;

}catch(e){}


/*
   এই সময়ের playing state
*/

videoWasPlaying =
playing;


/*
   Popup open
*/

const popup =
document.getElementById(
"videoPopup"
);

popup.classList.add(
"active"
);

document.body.classList.add(
"video-open"
);


/*
   Button -> X
*/

const btn =
document.getElementById(
"videoBtn"
);

btn.classList.add(
"active"
);

btn.innerHTML =
`
<svg viewBox="0 0 24 24">

<path d="
M18.3 5.71
L12 12
l6.3 6.29
-1.41 1.42
L10.59 13.41
4.29 19.71
2.88 18.3
9.17 12
2.88 5.7
4.29 4.29
10.59 10.59
16.89 4.29
z
"/>

</svg>
`;


videoOpen = true;


/*
   Popup-এর real size পাওয়ার জন্য
   সামান্য delay
*/

setTimeout(()=>{

if(!player)
return;


try{

const width =
popup.clientWidth;

const height =
popup.clientHeight;


/*
   SAME PLAYER RESIZE
*/

player.setSize(
width,
height
);

}catch(e){}


/*
   Audio position -> Video position
*/

setTimeout(()=>{

if(!player)
return;


try{

player.seekTo(
currentTime,
true
);

/*
   Button click user gesture হওয়ায়
   video play করার চেষ্টা
*/

player.playVideo();

}catch(e){}

},80);

},40);

}


/* =================================================
   CLOSE VIDEO
   ================================================= */

function closeVideo(){

if(!player)
return;


/*
   Video এখন যেখানে আছে
*/

let currentTime = 0;

try{

currentTime =
player.getCurrentTime() || 0;

}catch(e){}


/*
   Popup বন্ধ
*/

const popup =
document.getElementById(
"videoPopup"
);

popup.classList.remove(
"active"
);

document.body.classList.remove(
"video-open"
);


/*
   Button -> Video icon
*/

const btn =
document.getElementById(
"videoBtn"
);

btn.classList.remove(
"active"
);

btn.innerHTML =
`
<svg viewBox="0 0 24 24">

<path d="
M8 5.5
A2.5 2.5 0 0 1 10.5 3
h7
A2.5 2.5 0 0 1 20 5.5
v13
a2.5 2.5 0 0 1-2.5 2.5
h-7
A2.5 2.5 0 0 1 8 18.5z
M10.5 7
v10
l7-5z
"/>

</svg>
`;


videoOpen = false;


/*
   Player আবার ছোট hidden size
*/

setTimeout(()=>{

if(!player)
return;


try{

/*
   Current video position
*/

player.setSize(
2,
2
);

}catch(e){}


/*
   একই position-এ audio ফিরিয়ে দিই
*/

setTimeout(()=>{

if(!player)
return;


try{

player.seekTo(
currentTime,
true
);


/*
   Video খোলার আগে audio
   চললে আবার চলবে।

   আগে pause থাকলে pause-ই থাকবে।
*/

if(videoWasPlaying){

player.playVideo();

}else{

player.pauseVideo();

}

}catch(e){}

},50);

},50);

}


/* =================================================
   PREVENT VIDEO POPUP TOUCH
   ================================================= */

/*
   Video iframe-এ pointer-events:none
   রাখা হয়েছে।

   তাই YouTube-এর:
   Share
   Like
   Next
   Previous
   YouTube button
   ইত্যাদিতে touch করা যাবে না।

   শুধু আমাদের X button কাজ করবে।
*/


document
.getElementById("videoPopup")
.addEventListener(
"touchstart",
e=>{

if(
e.target.closest(
".video-close"
)
)
return;

e.preventDefault();

},
{
passive:false
}
);


/* =================================================
   ESC CLOSE
   ================================================= */

document.addEventListener(
"keydown",
e=>{

if(
e.key === "Escape" &&
videoOpen
){

closeVideo();

}

});


</script>
