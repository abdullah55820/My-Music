<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My Music</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{position:relative}

.bg{
  position:fixed;inset:-35px;
  background:#111 center/cover no-repeat;
  filter:blur(34px);
  transform:scale(1.12);
  transition:background-image .7s ease;
}
.bg:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.30),rgba(0,0,0,.75));
}

#yt{
  position:fixed;width:2px;height:2px;left:-10px;bottom:-10px;opacity:.01;
  pointer-events:none;
}

.app{
  position:relative;z-index:2;height:100dvh;width:100%;
  display:flex;align-items:flex-end;justify-content:center;
  padding:0 12px 30px;
}

/* স্লিম ১-লাইনার মিউজিক বার */
.player{
  width:min(500px,100%);
  height:64px;
  padding:0 12px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:32px;
  background:rgba(20,20,20,.65);
  box-shadow:0 15px 40px rgba(0,0,0,.5);
  backdrop-filter:blur(25px) saturate(140%);
  -webkit-backdrop-filter:blur(25px) saturate(140%);
  display:flex;
  align-items:center;
  gap:10px;
}

/* ছোট ঘোরানো থাম্বনেইল */
.cover{
  width:42px;height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
  flex-shrink:0;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
  animation: spin 8s linear infinite;
  animation-play-state: paused;
}

.cover.spinning {
  animation-play-state: running;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* মাঝের অংশ: টাইটেল ও সিকবার */
.middle{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:4px;
}

.title{
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:rgba(255,255,255,.95);
}

.seekwrap{
  display:flex;
  align-items:center;
  gap:8px;
}

.time{
  font-size:9px;
  color:rgba(255,255,255,.5);
  font-variant-numeric: tabular-nums;
  flex-shrink:0;
}

.seek{
  position:relative;
  flex:1;
  height:3px;
  border-radius:10px;
  background:rgba(255,255,255,.2);
  cursor:pointer;
}

.fill{
  position:absolute;
  left:0;top:0;
  height:100%;
  width:0;
  background:#fff;
  border-radius:10px;
}

/* ডানপাশের ১-লাইনার কন্ট্রোল বাটন */
.controls{
  display:flex;
  align-items:center;
  gap:4px;
  flex-shrink:0;
}

.btn{
  width:32px;height:32px;
  border:0;background:transparent;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:16px;
  opacity:.85;
  padding:0;
  cursor:pointer;
}

.play{
  width:38px;height:38px;
  border-radius:50%;
  border:0;
  background:#fff;
  color:#111;
  display:grid;
  place-items:center;
  font-size:15px;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
  cursor:pointer;
}

.btn:active,.play:active{transform:scale(.92)}

@media(max-width:400px){
  .player{height:58px;padding:0 10px;gap:8px}
  .cover{width:36px;height:36px}
  .title{font-size:12px}
  .play{width:34px;height:34px;font-size:13px}
  .btn{width:28px;height:28px;font-size:14px}
}
</style>
</head>
<body>

<div class="bg" id="bg"></div>
<div id="yt"></div>

<div class="app">
  <section class="player">
    <!-- থাম্বনেইল -->
    <img id="cover" class="cover" alt="Album art">
    
    <!-- মাঝের গান ও সিকবার -->
    <div class="middle">
      <div id="title" class="title">Loading…</div>
      <div class="seekwrap">
        <span id="current" class="time">0:00</span>
        <div class="seek" id="seek" onclick="seek(event)">
          <div class="fill" id="fill"></div>
        </div>
        <span id="duration" class="time">0:00</span>
      </div>
    </div>

    <!-- বাটনসমূহ (Previous, Play/Pause, Next) -->
    <div class="controls">
      <button class="btn" onclick="previousSong()" aria-label="Previous">◀|</button>
      <button class="play" id="play" onclick="togglePlay()" aria-label="Play">▶</button>
      <button class="btn" onclick="nextSong()" aria-label="Next">|▶</button>
    </div>
  </section>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const PLAYLIST_ID="PLQHkh385IaNU";
let player=null, playing=false;

function onYouTubeIframeAPIReady(){
  player=new YT.Player("yt",{
    width:"2",height:"2",
    playerVars:{
      autoplay:0,controls:0,disablekb:1,fs:0,
      modestbranding:1,playsinline:1,
      rel:0,listType:"playlist",list:PLAYLIST_ID
    },
    events:{onReady:ready,onStateChange:state}
  });
}

function ready(){
  setTimeout(updateInfo,700);
  setInterval(updateProgress,400);
}

function state(e){
  const cover = document.getElementById("cover");
  if(e.data===YT.PlayerState.PLAYING){
    playing=true;
    document.getElementById("play").textContent="Ⅱ";
    cover.classList.add("spinning");
    updateInfo();
  }else if(e.data===YT.PlayerState.PAUSED || e.data===YT.PlayerState.ENDED){
    playing=false;
    document.getElementById("play").textContent="▶";
    cover.classList.remove("spinning");
  }
}

function togglePlay(){
  if(!player)return;
  playing?player.pauseVideo():player.playVideo();
}
function nextSong(){
  if(!player)return;
  player.nextVideo();
}
function previousSong(){
  if(!player)return;
  player.previousVideo();
}
function updateInfo(){
  if(!player)return;
  try{
    const d=player.getVideoData();
    if(!d||!d.video_id)return;
    const id=d.video_id;
    const thumb="https://i.ytimg.com/vi/"+id+"/hqdefault.jpg";
    document.getElementById("cover").src=thumb;
    document.getElementById("bg").style.backgroundImage=
      'linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.60)),url("'+thumb+'")';
    document.getElementById("title").textContent=d.title||"Unknown";
  }catch(e){}
}
function updateProgress(){
  if(!player)return;
  try{
    const c=player.getCurrentTime(),d=player.getDuration();
    if(!d)return;
    const p=Math.max(0,Math.min(100,c/d*100));
    document.getElementById("fill").style.width=p+"%";
    document.getElementById("current").textContent=format(c);
    document.getElementById("duration").textContent=format(d);
    if(playing)updateInfo();
  }catch(e){}
}
function seek(e){
  if(!player)return;
  const r=document.getElementById("seek").getBoundingClientRect();
  const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  player.seekTo(p*player.getDuration(),true);
}
function format(s){
  if(!s||isNaN(s))return"0:00";
  s=Math.floor(s);
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}
</script>
</body>
</html>
