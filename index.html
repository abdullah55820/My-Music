<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My Music</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{position:relative}

.bg{
  position:fixed;inset:-35px;
  background:#111 center/cover no-repeat;
  filter:blur(34px);
  transform:scale(1.12);
  transition:background-image .7s ease;
}
.bg:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.20),rgba(0,0,0,.38) 48%,rgba(0,0,0,.78));
}
.shade{
  position:fixed;inset:0;
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.05),transparent 42%);
  pointer-events:none;
}

#yt{
  position:fixed;width:2px;height:2px;left:-10px;bottom:-10px;opacity:.01;
  pointer-events:none;
}

.app{
  position:relative;z-index:2;height:100dvh;width:100%;
  display:flex;align-items:flex-end;justify-content:center;
  padding:0 18px 58px;
}

.player{
  width:min(620px,100%);
  padding:20px 20px 17px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:28px;
  background:rgba(28,28,28,.42);
  box-shadow:0 25px 80px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.08);
  backdrop-filter:blur(24px) saturate(130%);
  -webkit-backdrop-filter:blur(24px) saturate(130%);
}

.top{
  display:flex;align-items:center;gap:14px;
}

/* কভার আর্ট স্পিন অ্যানিমেশন সেটিংস */
.cover{
  width:64px;height:64px;
  border-radius:50%; /* গান ঘোরার সময় সুন্দর ডিস্কের মতো দেখানোর জন্য গোল শেপ */
  object-fit:cover;
  background:#222;
  box-shadow:0 8px 25px rgba(0,0,0,.35);
  animation: spin 10s linear infinite;
  animation-play-state: paused; /* ডিফল্টভাবে ঘোরা বন্ধ থাকবে */
  transition: border-radius 0.3s ease;
}

/* প্লে করার সময় ঘোরা শুরু হওয়ার ক্লাস */
.cover.spinning {
  animation-play-state: running;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.info{min-width:0;flex:1}
.title{
  font-size:18px;font-weight:700;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.artist{
  margin-top:5px;font-size:13px;color:rgba(255,255,255,.62);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.more{
  width:38px;height:38px;border:0;border-radius:50%;
  color:#fff;background:rgba(255,255,255,.07);font-size:20px;
}

.seekwrap{margin-top:17px}
.times{display:flex;justify-content:space-between;color:rgba(255,255,255,.57);font-size:11px;margin-bottom:7px}
.seek{
  position:relative;height:4px;border-radius:20px;background:rgba(255,255,255,.22);
  cursor:pointer;
}
.fill{position:absolute;left:0;top:0;height:100%;width:0;background:#fff;border-radius:20px}
.dot{
  position:absolute;top:50%;left:0;width:10px;height:10px;border-radius:50%;
  background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 12px rgba(255,255,255,.45)
}

.controls{
  display:flex;align-items:center;justify-content:space-between;margin-top:16px;
}
.btn{
  width:44px;height:44px;border:0;background:transparent;color:#fff;
  display:grid;place-items:center;font-size:20px;opacity:.9;padding:0;
}
.play{
  width:58px;height:58px;border-radius:50%;border:0;background:#fff;color:#111;
  display:grid;place-items:center;font-size:20px;box-shadow:0 8px 24px rgba(0,0,0,.3)
}
.btn:active,.play:active{transform:scale(.9)}
.active{opacity:1!important;text-shadow:0 0 12px rgba(255,255,255,.7)}

.playlist{
  position:absolute;left:18px;right:18px;bottom:8px;
  text-align:center;font-size:10px;color:rgba(255,255,255,.35);
}

@media(max-width:600px){
  .app{padding:0 12px 38px}
  .player{padding:17px 16px 14px;border-radius:24px}
  .cover{width:58px;height:58px}
  .title{font-size:16px}
  .artist{font-size:12px}
  .play{width:54px;height:54px}
  .btn{width:40px;height:40px}
}
</style>
</head>
<body>

<div class="bg" id="bg"></div>
<div class="shade"></div>
<div id="yt"></div>

<div class="app">
  <section class="player">
    <div class="top">
      <img id="cover" class="cover" alt="Album art">
      <div class="info">
        <div id="title" class="title">Loading…</div>
        <div id="artist" class="artist">My Music</div>
      </div>
      <button class="more" onclick="openPlaylist()" aria-label="Playlist">⋯</button>
    </div>

    <div class="seekwrap">
      <div class="times">
        <span id="current">0:00</span>
        <span id="duration">0:00</span>
      </div>
      <div class="seek" id="seek" onclick="seek(event)">
        <div class="fill" id="fill"></div>
        <div class="dot" id="dot"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="shuffle" onclick="toggleShuffle()" aria-label="Shuffle">⌘</button>
      <button class="btn" onclick="previousSong()" aria-label="Previous">◀|</button>
      <button class="play" id="play" onclick="togglePlay()" aria-label="Play">▶</button>
      <button class="btn" onclick="nextSong()" aria-label="Next">|▶</button>
      <button class="btn" id="repeat" onclick="toggleRepeat()" aria-label="Repeat">↻</button>
    </div>
  </section>

  <div class="playlist">YouTube Playlist • PLQHkh385IaNU</div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const PLAYLIST_ID="PLQHkh385IaNU";
let player=null, playing=false, shuffle=false, repeat=false;

function onYouTubeIframeAPIReady(){
  player=new YT.Player("yt",{
    width:"2",height:"2",
    playerVars:{
      autoplay:0,controls:0,disablekb:1,fs:0,
      modestbranding:1,playsinline:1,
      rel:0,listType:"playlist",list:PLAYLIST_ID
    },
    events:{onReady:ready,onStateChange:state}
  });
}

function ready(){
  setTimeout(updateInfo,700);
  setInterval(updateProgress,400);
}

function state(e){
  const cover = document.getElementById("cover");
  if(e.data===YT.PlayerState.PLAYING){
    playing=true;
    document.getElementById("play").textContent="Ⅱ";
    cover.classList.add("spinning"); // গান চললে থাম্বনেইল ঘোরা শুরু হবে
    updateInfo();
  }else if(e.data===YT.PlayerState.PAUSED || e.data===YT.PlayerState.ENDED){
    playing=false;
    document.getElementById("play").textContent="▶";
    cover.classList.remove("spinning"); // গান পজ বা শেষ হলে ঘোরা বন্ধ হবে
  }
}

function togglePlay(){
  if(!player)return;
  playing?player.pauseVideo():player.playVideo();
}
function nextSong(){
  if(!player)return;
  if(shuffle)player.setShuffle(true);
  player.nextVideo();
}
function previousSong(){
  if(!player)return;
  player.previousVideo();
}
function toggleShuffle(){
  shuffle=!shuffle;
  document.getElementById("shuffle").classList.toggle("active",shuffle);
  if(player)player.setShuffle(shuffle);
}
function toggleRepeat(){
  repeat=!repeat;
  document.getElementById("repeat").classList.toggle("active",repeat);
}
function updateInfo(){
  if(!player)return;
  try{
    const d=player.getVideoData();
    if(!d||!d.video_id)return;
    const id=d.video_id;
    const thumb="https://i.ytimg.com/vi/"+id+"/hqdefault.jpg";
    document.getElementById("cover").src=thumb;
    document.getElementById("bg").style.backgroundImage=
      'linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.50)),url("'+thumb+'")';
    document.getElementById("title").textContent=d.title||"Unknown";
    document.getElementById("artist").textContent="YouTube Playlist";
  }catch(e){}
}
function updateProgress(){
  if(!player)return;
  try{
    const c=player.getCurrentTime(),d=player.getDuration();
    if(!d)return;
    const p=Math.max(0,Math.min(100,c/d*100));
    document.getElementById("fill").style.width=p+"%";
    document.getElementById("dot").style.left=p+"%";
    document.getElementById("current").textContent=format(c);
    document.getElementById("duration").textContent=format(d);
    if(playing)updateInfo();
  }catch(e){}
}
function seek(e){
  if(!player)return;
  const r=document.getElementById("seek").getBoundingClientRect();
  const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  player.seekTo(p*player.getDuration(),true);
}
function format(s){
  if(!s||isNaN(s))return"0:00";
  s=Math.floor(s);
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}
function openPlaylist(){
  window.open("https://www.youtube.com/playlist?list="+PLAYLIST_ID,"_blank");
}
</script>
</body>
</html>
