<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>My Music Player</title>

<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preload" as="image" href="background.jpg">

<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#050505;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

body{
position:relative;
overflow-x:hidden!important;
}


/* =========================
   BACKGROUND
   ========================= */

.bg{
position:fixed;
inset:0;

background-image:url("background.jpg");
background-position:center center;
background-size:cover;
background-repeat:no-repeat;

z-index:0;

transition:
filter .35s ease,
transform .35s ease;
}

.bg:after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,.15);
}


/* ONLY BACKGROUND BLUR WHEN VIDEO OPEN */

.bg.video-open{
filter:blur(13px);
transform:scale(1.035);
}


/* =========================
   TOP WIDGETS
   ========================= */

.top-widgets{
position:fixed;
top:14px;
left:50%;

transform:translateX(-50%);

z-index:30;

display:flex;
flex-direction:column;
align-items:center;
gap:8px;
}


/* BD TIME */

.bd-time{
padding:5px 11px;

border-radius:20px;

background:rgba(0,0,0,.45);

border:1px solid rgba(255,255,255,.18);

color:rgba(255,255,255,.9);

font-size:11px;
font-weight:600;

letter-spacing:.3px;

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);

display:flex;
align-items:center;
gap:6px;
}


.live-dot{
width:7px;
height:7px;

background:#ff3b30;

border-radius:50%;

display:inline-block;

box-shadow:0 0 8px #ff3b30;

animation:pulse 1.5s infinite;
}


@keyframes pulse{

0%{
opacity:1;
transform:scale(1);
}

50%{
opacity:.3;
transform:scale(.8);
}

100%{
opacity:1;
transform:scale(1);
}

}


/* PLAYLIST BUTTON */

.playlist-toggle-btn{
padding:5px 12px;

border-radius:20px;

background:rgba(0,0,0,.45);

border:1px solid rgba(255,255,255,.18);

color:rgba(255,255,255,.9);

font-size:11px;
font-weight:600;

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);

display:flex;
align-items:center;
gap:6px;

cursor:pointer;

transition:transform .2s,background .2s;
}

.playlist-toggle-btn:active{
transform:scale(.95);
}

.playlist-toggle-btn svg{
width:14px;
height:14px;
fill:#fff;
}


/* =========================
   YOUTUBE HOLDER
   ========================= */

#yt{
position:fixed;

width:2px;
height:2px;

left:-20px;
bottom:-20px;

opacity:.01;

pointer-events:none;

overflow:hidden;
}


/* =========================
   VIDEO POPUP
   ========================= */

.video-popup{

position:fixed;

left:50%;
top:50%;

transform:
translate(-50%,-50%)
scale(.94);

width:min(650px,92vw);

aspect-ratio:16/9;

z-index:15;

border-radius:22px;

padding:2px;

background:
linear-gradient(
135deg,
rgba(255,255,255,.38),
rgba(255,255,255,.08),
rgba(255,255,255,.25)
);

box-shadow:
0 25px 70px rgba(0,0,0,.55),
0 0 35px rgba(255,255,255,.08);

opacity:0;

visibility:hidden;

pointer-events:none;

transition:
opacity .28s ease,
transform .28s ease,
visibility .28s ease;

overflow:hidden;
}


/* SLIM GLASS BLUR BORDER */

.video-popup::before{

content:"";

position:absolute;

inset:0;

border-radius:22px;

border:1px solid rgba(255,255,255,.38);

box-shadow:
inset 0 0 12px rgba(255,255,255,.12);

backdrop-filter:blur(4px);

-webkit-backdrop-filter:blur(4px);

pointer-events:none;

z-index:5;
}


/* INNER VIDEO */

.video-inner{

position:absolute;

inset:2px;

border-radius:20px;

overflow:hidden;

background:#000;

}


/*
   IMPORTANT:
   iframe cannot receive touch.
   So YouTube share / controls / touch
   won't appear.
*/

.video-inner iframe{

position:absolute;

left:50%;
top:50%;

width:118%!important;
height:118%!important;

transform:translate(-50%,-50%);

border:0;

pointer-events:none!important;

display:block;

}


/* EXTRA CROP TO HIDE YOUTUBE OVERLAYS */

.video-crop-top,
.video-crop-bottom{

position:absolute;

left:0;
right:0;

z-index:4;

pointer-events:none;

background:rgba(0,0,0,0);
}

.video-crop-top{
top:0;
height:8%;
}

.video-crop-bottom{
bottom:0;
height:10%;
}


/* OPEN */

.video-popup.open{

opacity:1;

visibility:visible;

pointer-events:none;

transform:
translate(-50%,-50%)
scale(1);
}


/* =========================
   APP
   ========================= */

.app{
position:relative;

z-index:20;

height:100dvh;
width:100%;

display:flex;

align-items:flex-end;
justify-content:center;

padding:0 16px 65px;
}


/* =========================
   MUSIC PLAYER
   ========================= */

.player{

width:min(440px,94%);

height:120px;

padding:14px 18px;

border:1px solid rgba(255,255,255,.18);

border-radius:60px;

background:rgba(255,255,255,.06);

backdrop-filter:blur(25px) saturate(115%);
-webkit-backdrop-filter:blur(25px) saturate(115%);

box-shadow:
0 20px 50px rgba(0,0,0,.45);

display:flex;

align-items:center;

gap:12px;

position:relative;

overflow:hidden;

touch-action:pan-y;
}


/* =========================
   COVER
   ========================= */

.cover-wrapper{

position:relative;

width:84px;
height:84px;

flex-shrink:0;

display:flex;

align-items:center;
justify-content:center;

border-radius:50%;

overflow:hidden;

border:1px solid rgba(255,255,255,.3);
}


.cover{

width:137%;
height:137%;

margin:-18.5%;

border-radius:50%;

object-fit:cover;

object-position:center;

background:#222;

animation:spin 8s linear infinite;

animation-play-state:paused;
}


.cover-wrapper::after{

content:"";

position:absolute;

width:16px;
height:16px;

background:rgba(20,20,20,.85);

border:2px solid rgba(255,255,255,.3);

border-radius:50%;

left:50%;
top:50%;

transform:translate(-50%,-50%);

z-index:2;
}


.cover.spinning{
animation-play-state:running;
}


@keyframes spin{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}


/* =========================
   SONG INFO
   ========================= */

.middle{

flex:1;

min-width:0;

display:flex;

flex-direction:column;

justify-content:center;
}


.title{

font-size:16px;

font-weight:700;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

color:#fff;

letter-spacing:.2px;
}


.artist{

font-size:12px;

color:rgba(255,255,255,.65);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-top:2px;

margin-bottom:8px;
}


/* =========================
   SEEK
   ========================= */

.seek{

position:relative;

width:100%;

height:5px;

border-radius:10px;

background:rgba(255,255,255,.2);

cursor:pointer;

margin-bottom:6px;

touch-action:none;

user-select:none;

-webkit-user-select:none;
}


.seek::before{

content:"";

position:absolute;

top:-12px;
bottom:-12px;

left:-10px;
right:-10px;

z-index:1;
}


.fill{

position:absolute;

left:0;
top:0;

height:100%;

width:0;

background:#fff;

border-radius:10px;

pointer-events:none;

z-index:2;
}


.time-display{

font-size:11px;

color:rgba(255,255,255,.65);

font-variant-numeric:tabular-nums;
}


/* =========================
   CONTROLS
   ========================= */

.controls{

display:flex;

align-items:center;

gap:7px;

flex-shrink:0;
}


.btn{

width:28px;
height:28px;

border:0;

background:transparent;

color:rgba(255,255,255,.9);

display:flex;

align-items:center;
justify-content:center;

cursor:pointer;

padding:0;
}


.btn svg{

width:20px;
height:20px;

fill:#fff;
}


/* =========================
   VIDEO BUTTON
   ========================= */

.video-btn{

width:40px;
height:40px;

border-radius:13px;

border:1px solid rgba(255,255,255,.28);

background:
linear-gradient(
135deg,
rgba(255,255,255,.18),
rgba(255,255,255,.06)
);

color:#fff;

display:flex;

align-items:center;
justify-content:center;

cursor:pointer;

flex-shrink:0;

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);

box-shadow:
0 5px 15px rgba(0,0,0,.25);

transition:
transform .18s ease,
background .18s ease;
}


.video-btn svg{

width:20px;
height:20px;

fill:none;

stroke:#fff;

stroke-width:2;

stroke-linecap:round;

stroke-linejoin:round;
}


.video-btn.active{

background:
rgba(255,255,255,.18);

}


.video-btn:active{

transform:scale(.88);
}


/* =========================
   PLAY BUTTON
   ========================= */

.play{

width:44px;
height:44px;

border-radius:50%;

border:0;

background:#fff;

color:#000;

display:flex;

align-items:center;
justify-content:center;

box-shadow:
0 4px 15px rgba(0,0,0,.3);

cursor:pointer;

flex-shrink:0;
}


.play svg{

width:20px;
height:20px;

fill:#000;

margin-left:2px;
}


.play.playing svg{
margin-left:0;
}


.btn:active,
.play:active{

transform:scale(.90);
}


/* =========================
   VOLUME
   ========================= */

.vol-container{

display:flex;

align-items:center;

gap:4px;

background:rgba(0,0,0,.25);

border:1px solid rgba(255,255,255,.15);

padding:4px 6px;

border-radius:20px;

backdrop-filter:blur(10px);

-webkit-backdrop-filter:blur(10px);
}


.vol-slider-wrapper{

width:0;

overflow:hidden;

opacity:0;

display:flex;

align-items:center;

transition:
width .28s cubic-bezier(.2,.8,.2,1),
opacity .2s ease;
}


.vol-slider-wrapper.active{

width:55px;

opacity:1;

margin-left:2px;
}


.vol-slider{

-webkit-appearance:none;

appearance:none;

width:55px;

height:3.5px;

background:rgba(255,255,255,.3);

border-radius:10px;

outline:none;

cursor:pointer;
}


.vol-slider::-webkit-slider-thumb{

-webkit-appearance:none;

appearance:none;

width:10px;
height:10px;

border-radius:50%;

background:#fff;

cursor:pointer;
}


@supports (-webkit-touch-callout:none){

.vol-container{
display:none!important;
}

}


/* =========================
   DRAWER
   ========================= */

.drawer-overlay{

position:fixed;

inset:0;

z-index:99;

background:transparent!important;

backdrop-filter:none!important;

-webkit-backdrop-filter:none!important;

pointer-events:none;

display:none;
}


.drawer-overlay.active{

display:block;

pointer-events:auto;
}


.playlist-drawer{

position:fixed;

top:0;

right:-100%;

width:170px;

height:100dvh;

background:rgba(20,20,20,.35)!important;

backdrop-filter:blur(25px) saturate(150%)!important;

-webkit-backdrop-filter:blur(25px) saturate(150%)!important;

border-left:1px solid rgba(255,255,255,.15)!important;

z-index:100;

transition:
right .35s cubic-bezier(.2,.8,.2,1);

display:flex;

flex-direction:column;

padding:12px 6px;

box-shadow:
-10px 0 30px rgba(0,0,0,.3)!important;

visibility:hidden;

pointer-events:none;
}


.playlist-drawer.open{

right:0;

visibility:visible;

pointer-events:auto;
}


.drawer-header{

display:flex;

align-items:center;

justify-content:space-between;

padding:6px 8px;

border-bottom:
1px solid rgba(255,255,255,.15);

margin-bottom:8px;

background:rgba(255,255,255,.1);

border-radius:8px;
}


.drawer-title{

font-size:11px;

font-weight:700;

color:#fff;
}


.close-btn{

background:transparent;

border:0;

color:rgba(255,255,255,.9);

font-size:16px;

cursor:pointer;

padding:0 2px;

line-height:1;
}


.song-list{

flex:1;

overflow-y:auto;

display:flex;

flex-direction:column;

gap:4px;

padding-right:2px;
}


.song-list::-webkit-scrollbar{
width:2px;
}


.song-list::-webkit-scrollbar-thumb{

background:rgba(255,255,255,.3);

border-radius:3px;
}


.song-item{

display:flex;

align-items:center;

gap:6px;

padding:4px 5px;

border-radius:7px;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.1);

cursor:pointer;
}


.song-item:active{
transform:scale(.96);
}


.song-item:hover,
.song-item.active{

background:rgba(255,255,255,.22);

border-color:rgba(255,255,255,.35);
}


.song-item img{

width:26px;
height:26px;

border-radius:5px;

object-fit:cover;

flex-shrink:0;
}


.song-item-info{

flex:1;

min-width:0;
}


.song-item-title{

font-size:9.5px;

font-weight:700;

color:#fff;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;
}


.song-item-artist{

font-size:8px;

color:rgba(255,255,255,.55);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-top:.5px;
}


/* =========================
   MOBILE
   ========================= */

@media(max-width:480px){

.app{
padding-bottom:60px;
}

.player{

height:116px;

padding:12px 14px;

border-radius:58px;

gap:8px;
}

.cover-wrapper{

width:78px;
height:78px;
}

.title{
font-size:15px;
}

.artist{
font-size:11px;
}

.play{

width:42px;
height:42px;
}

.video-btn{

width:38px;
height:38px;

border-radius:12px;
}

.video-btn svg{

width:19px;
height:19px;
}

.top-widgets{
top:10px;
}

.bd-time{

font-size:10px;

padding:4px 9px;
}

.playlist-toggle-btn{

font-size:10px;

padding:4px 9px;
}

.playlist-drawer{
width:170px;
}

.video-popup{

width:94vw;

border-radius:20px;
}

.video-inner{

border-radius:18px;
}

}

</style>
</head>

<body>

<div class="bg" id="bg"></div>


<!-- TOP -->

<div class="top-widgets">

<div class="bd-time">

<span>BD</span>

<span class="live-dot"></span>

<span id="bdTimeVal">
--:--:-- --
</span>

</div>


<button
class="playlist-toggle-btn"
onclick="toggleDrawer()"
>

<svg viewBox="0 0 24 24">

<path d="
M3 10h11v2H3zm0-4h11v2H3zm0 8h7v2H3zm13-1v8l6-4z
"/>

</svg>

<span>Playlist</span>

</button>

</div>


<!-- YOUTUBE ORIGINAL HOLDER -->

<div id="yt"></div>


<!-- =========================
     VIDEO POPUP
     ========================= -->

<div
class="video-popup"
id="videoPopup"
>

<div
class="video-inner"
id="videoInner"
>

<!-- SAME YOUTUBE IFRAME WILL MOVE HERE -->

<div class="video-crop-top"></div>
<div class="video-crop-bottom"></div>

</div>

</div>


<!-- DRAWER -->

<div
class="drawer-overlay"
id="overlay"
onclick="toggleDrawer()"
></div>


<div
class="playlist-drawer"
id="drawer"
>

<div class="drawer-header">

<div class="drawer-title">
Playlist Songs
</div>

<button
class="close-btn"
onclick="toggleDrawer()"
>
&times;
</button>

</div>


<div
class="song-list"
id="songList"
>

<div
style="
text-align:center;
color:rgba(255,255,255,.7);
font-size:10px;
margin-top:15px;
"
>
Loading...
</div>

</div>

</div>


<!-- APP -->

<div class="app">

<section
class="player"
id="playerCard"
>


<!-- COVER -->

<div class="cover-wrapper">

<img
id="cover"
class="cover"
src="logo.png"
alt="Album art"
>

</div>


<!-- INFO -->

<div class="middle">

<div
id="title"
class="title"
>
My Playlist
</div>


<div
id="artist"
class="artist"
>
YouTube Music
</div>


<div
class="seek"
id="seek"
>

<div
class="fill"
id="fill"
></div>

</div>


<div class="time-display">

<span id="current">
0:00
</span>

/

<span id="duration">
0:00
</span>

</div>

</div>


<!-- CONTROLS -->

<!-- PLAY -->

id="play"

>

>

<!-- VIDEO -->

>

class="btn"
onclick="toggleVolume()"
>

<svg viewBox="0 0 24 24">

<path d="
M3 9v6h4l5 5V4L7 9H3
zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05
c1.48-.73 2.5-2.25 2.5-4.02z
M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71
v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z
"/>

</svg>

</button>

id="volWrapper"
>

type="range"
class="vol-slider"

>

</div>

</div>


</div>

</section>

</div>


<script src="https://www.youtube.com/iframe_api"></script>

<script>
  /* =========================
   PLAYLIST
   ========================= */

const PLAYLIST_ID="PLbvY05KVYwoo";

let player=null;

let playing=false;

let playlistItems=[];

let videoOpen=false;


/* =========================
   BD TIME
   ========================= */

function updateBDTime(){

const options={

timeZone:"Asia/Dhaka",

hour:"2-digit",

minute:"2-digit",

second:"2-digit",

hour12:true

};

document.getElementById("bdTimeVal").textContent=

new Intl.DateTimeFormat(
"en-US",
options
).format(new Date());

}

updateBDTime();

setInterval(updateBDTime,1000);


/* =========================
   YOUTUBE API
   ========================= */

function onYouTubeIframeAPIReady(){

player=new YT.Player(
"yt",
{

width:"2",
height:"2",

playerVars:{

autoplay:0,

controls:0,

disablekb:1,

fs:0,

modestbranding:1,

rel:0,

iv_load_policy:3,

playsinline:1,

enablejsapi:1,

listType:"playlist",

list:PLAYLIST_ID

},

events:{

onReady:ready,

onStateChange:state

}

});

}


/* =========================
   READY
   ========================= */

function ready(){

loadPlaylistItems();

setInterval(
updateProgress,
250
);

}


/* =========================
   STATE
   ========================= */

function state(e){

const cover=
document.getElementById("cover");

const playBtn=
document.getElementById("play");

const playIcon=
document.getElementById("play-icon");


highlightActiveTrack();


if(
e.data===YT.PlayerState.PLAYING
){

playing=true;

playBtn.classList.add("playing");

playIcon.innerHTML=
'<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

cover.classList.add("spinning");

updateInfo();

}


else if(

e.data===YT.PlayerState.PAUSED ||

e.data===YT.PlayerState.ENDED

){

playing=false;

playBtn.classList.remove("playing");

playIcon.innerHTML=
'<path d="M8 5v14l11-7z"/>';

cover.classList.remove("spinning");

}

}


/* =========================
   PLAY / PAUSE
   ========================= */

function togglePlay(){

if(!player)
return;


if(playing){

player.pauseVideo();

}

else{

player.playVideo();

}

}


/* =========================
   VIDEO POPUP
   ========================= */

function toggleVideo(){

if(!player)
return;


const popup=
document.getElementById("videoPopup");

const inner=
document.getElementById("videoInner");

const bg=
document.getElementById("bg");

const btn=
document.getElementById("videoBtn");

const icon=
document.getElementById("videoIcon");

const iframe=
player.getIframe();


if(!iframe)
return;


/* =========================
   CLOSE VIDEO
   ========================= */

if(videoOpen){

videoOpen=false;


/*
   Move SAME iframe back
   to hidden YouTube holder.
   Playback position stays the same.
*/

document
.getElementById("yt")
.appendChild(iframe);


iframe.style.position="fixed";

iframe.style.width="2px";

iframe.style.height="2px";

iframe.style.left="-20px";

iframe.style.top="auto";

iframe.style.bottom="-20px";

iframe.style.transform="none";

iframe.style.pointerEvents="none";

iframe.style.opacity=".01";


popup.classList.remove("open");

bg.classList.remove("video-open");

btn.classList.remove("active");


/* VIDEO ICON */

icon.innerHTML=`

<rect
x="3"
y="6"
width="13"
height="12"
rx="3"
></rect>

<path d="M16 10l5-3v10l-5-3z"></path>

`;

return;

}


/* =========================
   OPEN VIDEO
   ========================= */

videoOpen=true;


/*
   Move the EXACT SAME YouTube iframe
   into popup.

   No second player.
   No second playback.
   No sync problem.
*/

inner.insertBefore(
iframe,
inner.firstChild
);

iframe.style.top="50%";

"translate(-50%,-50%)";

iframe.style.opacity="1";

iframe.style.pointerEvents="none";

/* CHANGE VIDEO ICON TO X */

<path d="M6 6l12 12"></path>

<path d="M18 6L6 18"></path>

`;

}


/* =========================
   VOLUME
   ========================= */

let volTimer=null;


function resetVolTimer(){

if(volTimer)
clearTimeout(volTimer);


volTimer=setTimeout(()=>{

document
.getElementById("volWrapper")
.classList.remove("active");

},3000);

}


function toggleVolume(){

const wrapper=
document.getElementById("volWrapper");


if(
wrapper.classList.contains("active")
){

wrapper.classList.remove("active");

if(volTimer)
clearTimeout(volTimer);

}

else{

wrapper.classList.add("active");

resetVolTimer();

}

}


function changeVolume(val){

if(
player &&
typeof player.setVolume==="function"
){

player.setVolume(val);

}

resetVolTimer();

}


/* =========================
   NEXT
   ========================= */

function nextSong(){

if(
!player ||
playlistItems.length===0
)
return;


const current=
player.getPlaylistIndex();


const next=
(current+1)%
playlistItems.length;


forceUpdateUI(next);

player.nextVideo();

}


/* =========================
   PREVIOUS
   ========================= */

function previousSong(){

if(
!player ||
playlistItems.length===0
)
return;


const current=
player.getPlaylistIndex();


const previous=
(current-1+
playlistItems.length)%
playlistItems.length;


forceUpdateUI(previous);

player.previousVideo();

}


/* =========================
   FORCE UI
   ========================= */

function forceUpdateUI(index){

if(
!playlistItems[index]
)
return;


const id=
playlistItems[index];


document.getElementById("cover").src=

`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;


const title=
document.getElementById(
`title-${index}`
);


const artist=
document.getElementById(
`artist-${index}`
);


if(title){

document.getElementById("title")
.textContent=
title.textContent;

}


if(artist){

document.getElementById("artist")
.textContent=
artist.textContent;

}

}


/* =========================
   SWIPE
   ========================= */

let swipeStartX=0;

let swipeStartY=0;

let swipeActive=false;

let swipeFromSeek=false;


const playerCard=
document.getElementById("playerCard");


const seekElement=
document.getElementById("seek");


playerCard.addEventListener(
"pointerdown",
e=>{

swipeStartX=e.clientX;

swipeStartY=e.clientY;

swipeFromSeek=
!!e.target.closest("#seek");

swipeActive=true;

if(swipeFromSeek){

e.stopPropagation();

}

});


playerCard.addEventListener(
"pointermove",
e=>{

if(!swipeActive)
return;

if(swipeFromSeek){

e.stopPropagation();

}

});


playerCard.addEventListener(
"pointerup",
e=>{

if(!swipeActive)
return;


const endX=e.clientX;

const endY=e.clientY;

const dx=
endX-swipeStartX;

const dy=
endY-swipeStartY;


if(swipeFromSeek){

swipeActive=false;

return;

}


if(
Math.abs(dx)<50
){

swipeActive=false;

return;

}


if(
Math.abs(dy)>
Math.abs(dx)
){

swipeActive=false;

return;

}


if(dx<-50){

nextSong();

}

else if(dx>50){

previousSong();

}


swipeActive=false;

});


playerCard.addEventListener(
"pointercancel",
()=>{

swipeActive=false;

}
);


/* =========================
   SEEK
   ========================= */

let isDragging=false;

let seekPointerId=null;


function getSeekPosition(clientX){

const rect=
seekElement.getBoundingClientRect();


if(!rect.width)
return 0;


return Math.max(
0,
Math.min(
1,
(clientX-rect.left)/
rect.width
)
);

}


function updateSeekVisual(pos){

document.getElementById("fill")
.style.width=
(pos*100)+"%";


if(
player &&
typeof player.getDuration==="function"
){

const duration=
player.getDuration();


if(duration){

document.getElementById("current")
.textContent=
format(pos*duration);

document.getElementById("duration")
.textContent=
format(duration);

}

}

}


seekElement.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

e.stopPropagation();

isDragging=true;

seekPointerId=e.pointerId;


try{

seekElement.setPointerCapture(
e.pointerId
);

}catch(err){}


const pos=
getSeekPosition(e.clientX);

updateSeekVisual(pos);

},
{
passive:false
}
);


seekElement.addEventListener(
"pointermove",
e=>{

if(!isDragging)
return;


e.preventDefault();

e.stopPropagation();


const pos=
getSeekPosition(e.clientX);

updateSeekVisual(pos);

},
{
passive:false
}
);


seekElement.addEventListener(
"pointerup",
e=>{

if(!isDragging)
return;


e.preventDefault();

e.stopPropagation();


const pos=
getSeekPosition(e.clientX);

updateSeekVisual(pos);


if(
player &&
typeof player.getDuration==="function"
){

const duration=
player.getDuration();


if(duration){

player.seekTo(
pos*duration,
true
);

}

}


isDragging=false;

seekPointerId=null;


try{

seekElement.releasePointerCapture(
e.pointerId
);

}catch(err){}

},
{
passive:false
}
);


seekElement.addEventListener(
"pointercancel",
()=>{

isDragging=false;

seekPointerId=null;

}
);


/* =========================
   PROGRESS
   ========================= */

function updateProgress(){

if(isDragging)
return;


if(
!player ||
typeof player.getCurrentTime!=="function"
)
return;


try{

const current=
player.getCurrentTime();


const duration=
player.getDuration();


if(!duration)
return;


const pos=
Math.max(
0,
Math.min(
1,
current/duration
)
);


document.getElementById("fill")
.style.width=
(pos*100)+"%";


document.getElementById("current")
.textContent=
format(current);


document.getElementById("duration")
.textContent=
format(duration);

}catch(e){}

}


/* =========================
   FORMAT
   ========================= */

function format(s){

if(
!s ||
isNaN(s)
)
return "0:00";


s=Math.floor(s);


return Math.floor(s/60)
+
":"
+
String(
s%60
).padStart(2,"0");

}


/* =========================
   PLAYLIST
   ========================= */

function loadPlaylistItems(){

if(
!player ||
typeof player.getPlaylist!=="function"
)
return;


playlistItems=
player.getPlaylist();


const list=
document.getElementById("songList");


if(
!playlistItems ||
playlistItems.length===0
){

list.innerHTML=
`
<div style="
text-align:center;
color:rgba(255,255,255,.7);
font-size:10px;
margin-top:15px;
">
No tracks found
</div>
`;

return;

}


list.innerHTML="";


playlistItems.forEach(
(id,index)=>{

const item=
document.createElement("div");


item.className=
"song-item";


item.id=
`track-${index}`;


item.onclick=()=>{
playSpecificTrack(index);
};


item.innerHTML=
`

<img
src="https://i.ytimg.com/vi/${id}/hqdefault.jpg"
alt="thumb"
>

<div class="song-item-info">

<div
class="song-item-title"
id="title-${index}"
>
Track #${index+1}
</div>

<div
class="song-item-artist"
id="artist-${index}"
>
YouTube Music
</div>

</div>

`;


list.appendChild(item);


fetchSongDetails(
id,
index
);

});


highlightActiveTrack();

updateInfo();

}


/* =========================
   DETAILS
   ========================= */

function fetchSongDetails(
id,
index
){

fetch(
`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`
)

.then(
r=>r.json()
)

.then(
data=>{

if(!data)
return;


const title=
document.getElementById(
`title-${index}`
);


const artist=
document.getElementById(
`artist-${index}`
);


if(
title &&
data.title
){

title.textContent=
data.title;

}


if(
artist &&
data.author_name
){

artist.textContent=
data.author_name;

}

})

.catch(
()=>{}
);

}


/* =========================
   PLAY SPECIFIC
   ========================= */

function playSpecificTrack(index){

if(!player)
return;


forceUpdateUI(index);

player.playVideoAt(index);

toggleDrawer();

}


/* =========================
   ACTIVE TRACK
   ========================= */

function highlightActiveTrack(){

if(
!player ||
typeof player.getPlaylistIndex!=="function"
)
return;


const current=
player.getPlaylistIndex();


document
.querySelectorAll(".song-item")
.forEach(
(item,index)=>{

item.classList.toggle(
"active",
index===current
);

});

}


/* =========================
   SONG INFO
   ========================= */

function updateInfo(){

if(
!player ||
typeof player.getVideoData!=="function"
)
return;


try{

const d=
player.getVideoData();


if(
!d ||
!d.video_id
)
return;


document.getElementById("cover").src=
`https://i.ytimg.com/vi/${d.video_id}/hqdefault.jpg`;


if(d.title){

document.getElementById("title")
.textContent=d.title;

}


if(d.author){

document.getElementById("artist")
.textContent=d.author;

}

}catch(e){}

}


/* =========================
   DRAWER
   ========================= */

function toggleDrawer(){

const drawer=
document.getElementById("drawer");

const overlay=
document.getElementById("overlay");


drawer.classList.toggle("open");

overlay.classList.toggle("active");

}


/* =========================
   SAFETY:
   IF SONG CHANGES WHILE
   VIDEO IS OPEN, KEEP VIDEO
   ON THE SAME PLAYER
   ========================= */

setInterval(()=>{

if(!videoOpen || !player)
return;

try{

const iframe=player.getIframe();

if(
iframe &&
iframe.parentElement !==
document.getElementById("videoInner")
){

document
.getElementById("videoInner")
.insertBefore(
iframe,
document.getElementById("videoInner").firstChild
);

}

}catch(e){}

},500);

</script>
