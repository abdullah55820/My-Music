<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#000000" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>SoundFlow — Music</title>

<style>
:root {
  color-scheme:dark;
  --bg:#000;
  --muted:#98989f;
  --accent:#ff2d55;
  --line:rgba(255,255,255,.12);
  --player-tint:#2a2a2c;
}

* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html {
  background:#000;
  min-height:100%;
}

body {
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,
  "SF Pro Display","Segoe UI",sans-serif;
  min-height:100vh;
}

/*
  Full player খোলা থাকলে অন্য page গুলো লুকানো থাকে এবং player নিজেই
  document এর content হয়ে যায় (fixed না)। এতে Safari home page এর মতোই
  status bar এর নিচে content blur করে দেখায়।
*/
html.full-player-open {
  overscroll-behavior:none;
}

body.full-player-open > .header,
body.full-player-open > main.page {
  display:none !important;
}

button {
  font-family:inherit;
  border:0;
  cursor:pointer;
  color:inherit;
}

[hidden] {
  display:none!important;
}

/* HEADER */

.header {
  max-width:1050px;
  margin:auto;
  padding:20px 16px 5px;
}

.brand {
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
}

.brand span {
  color:var(--accent);
}

/* PAGES */

.page {
  display:none;
}

.page.active {
  display:block;
}

.wrap {
  max-width:1050px;
  margin:auto;
  padding:15px 16px 160px;
}

.section {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:18px 0 15px;
}

.section h2 {
  font-size:19px;
  margin:0;
  font-weight:750;
}

.status {
  color:var(--muted);
  font-size:12px;
}

/* SEARCH */

.search {
  display:flex;
  gap:9px;
  margin:10px 0 18px;
}

.search input {
  flex:1;
  min-width:0;
  padding:14px;
  background:#1c1c1e;
  color:white;
  border:1px solid var(--line);
  border-radius:14px;
  font-size:16px;
  outline:none;
}

.search input:focus {
  border-color:var(--accent);
}

.search button {
  padding:0 19px;
  border-radius:14px;
  background:linear-gradient(135deg,#ff2d55,#ff5e3a);
  font-weight:700;
}

/* SONG GRID */

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
  gap:14px;
}

.card {
  background:#1c1c1e;
  border:1px solid var(--line);
  border-radius:16px;
  padding:10px;
  cursor:pointer;
  min-width:0;
  transition:transform .2s;
}

.card:active {
  transform:scale(.97);
}

.thumb {
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:12px;
  background:#292929;
}

.title {
  font-size:13px;
  font-weight:650;
  line-height:1.4;
  margin:10px 2px 5px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.artist {
  font-size:11px;
  color:var(--muted);
  margin:0 2px 4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.empty {
  grid-column:1/-1;
  text-align:center;
  padding:35px 15px;
  border:1px dashed var(--line);
  border-radius:16px;
  color:var(--muted);
  font-size:13px;
}

.load {
  display:block;
  margin:22px auto;
  padding:13px 22px;
  border-radius:14px;
  background:#1c1c1e;
  border:1px solid var(--line);
  color:white;
  font-weight:650;
}

.load:active {
  transform:scale(.96);
}

.load:disabled {
  opacity:.5;
}

/* HOME SENTINEL */

#homeSentinel {
  width:100%;
  height:2px;
  pointer-events:none;
}

/* BOTTOM NAV */

.bottom-nav {
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:9000;

  display:flex;
  justify-content:space-around;
  align-items:center;

  height:calc(68px + env(safe-area-inset-bottom));
  padding:7px 15px calc(7px + env(safe-area-inset-bottom));

  background:rgba(20,20,22,.94);
  border-top:1px solid rgba(255,255,255,.09);

  backdrop-filter:blur(25px) saturate(160%);
  -webkit-backdrop-filter:blur(25px) saturate(160%);
}

.nav-btn {
  flex:1;
  height:53px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;

  background:transparent;
  color:#85858d;

  transition:color .2s,transform .2s;
}

.nav-btn svg {
  width:23px;
  height:23px;
}

.nav-btn span {
  font-size:10px;
  font-weight:650;
}

.nav-btn.active {
  color:var(--accent);
}

.nav-btn:active {
  transform:scale(.91);
}

body.full-player-open .bottom-nav {
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

/* FULL PLAYER */

.player {
  position:fixed;
  inset:0;
  z-index:9999;

  display:flex;
  flex-direction:column;

  padding:
    calc(env(safe-area-inset-top) + 12px)
    24px
    calc(env(safe-area-inset-bottom) + 24px);

  overflow:hidden;
  overscroll-behavior:none;

  /*
    Safari (iOS) status bar / Dynamic Island এর পেছনের রং
    নেয় উপরের fixed element এর background-color থেকে।
    আগে এটা transparent ছিল, তাই body-র কালো রং আসত।
    এখন album art থেকে বের করা রং বসে (JS দিয়ে --player-tint সেট হয়)।
  */
  background-color:var(--player-tint,#2a2a2c) !important;

  isolation:isolate;

  visibility:hidden;
  opacity:0;
  pointer-events:none;

  /* iOS compositing fix */
  transform:none;
  -webkit-transform:none;

  transition:
    opacity .38s cubic-bezier(.22,1,.36,1),
    visibility .38s,
    background-color .4s ease;
}

/*
  Active অবস্থায় player fixed না, document এর ভেতরের absolute content।
  --player-lift: উপরে বাড়তি জায়গা, যেটা scroll করে status bar এর নিচে
  পাঠানো হয় (JS সেট করে), যাতে Safari সেখানে blur effect দেখায়।
*/
.player.active {
  position:absolute;
  inset:auto;
  top:0;
  left:0;
  right:0;

  height:calc(100vh + var(--player-lift,0px));

  padding-top:calc(
    env(safe-area-inset-top) + var(--player-lift,0px) + 12px
  );

  visibility:visible;
  opacity:1;
  pointer-events:auto;
}

/* FULL SCREEN ALBUM BLUR BACKGROUND */

.player-bg {
  position:absolute;

  top:-250px;
  left:-150px;
  right:-150px;
  bottom:-250px;

  z-index:0;

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  filter:blur(55px);
  -webkit-filter:blur(55px);

  transform:translateZ(0) scale(1.3);
  -webkit-transform:translateZ(0) scale(1.3);

  opacity:1;

  pointer-events:none;

  will-change:background-image,transform;
  transition:background-image .3s ease;
}

/* PLAYER SHADE */

.player-shade {
  position:absolute;

  top:0;
  left:0;
  right:0;
  bottom:0;

  z-index:1;

  background:linear-gradient(
    180deg,
    rgba(0,0,0,.04) 0%,
    rgba(0,0,0,.12) 20%,
    rgba(0,0,0,.30) 48%,
    rgba(0,0,0,.58) 75%,
    rgba(0,0,0,.78) 100%
  );

  pointer-events:none;
}

/*
  TOP FADE
  Status bar এর পেছনের অংশ Safari নিজে একটা flat রং দিয়ে ভরে (page এর বাইরে)।
  সেই রং থেকে blur background-এ যেন seam ছাড়া মিশে যায়, তাই
  উপর থেকে tint রং ধীরে ধীরে transparent হয়ে যাচ্ছে।
*/

.player-top-fade {
  position:absolute;

  top:0;
  left:0;
  right:0;

  height:calc(env(safe-area-inset-top) + 150px);

  z-index:1;

  background:linear-gradient(
    180deg,
    var(--player-tint,#2a2a2c) 0%,
    color-mix(in srgb,var(--player-tint,#2a2a2c) 92%,transparent) 14%,
    color-mix(in srgb,var(--player-tint,#2a2a2c) 70%,transparent) 32%,
    color-mix(in srgb,var(--player-tint,#2a2a2c) 42%,transparent) 52%,
    color-mix(in srgb,var(--player-tint,#2a2a2c) 18%,transparent) 76%,
    transparent 100%
  );

  pointer-events:none;
}

/* TOP BAR */

.player-top-bar {
  position:relative;
  z-index:2;

  display:flex;
  align-items:center;
  justify-content:center;

  min-height:46px;
  flex-shrink:0;
}

.player-top-bar span {
  font-size:13px;
  font-weight:750;
  letter-spacing:1.5px;
  color:rgba(255,255,255,.88);
}

.collapse-btn {
  position:absolute;
  left:0;

  width:43px;
  height:43px;

  display:grid;
  place-items:center;

  border-radius:50%;
  background:rgba(255,255,255,.15);

  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}

.collapse-btn svg {
  width:22px;
  height:22px;
}

/* CENTER */

.player-content-center {
  position:relative;
  z-index:2;

  width:100%;
  max-width:390px;
  margin:auto;

  display:flex;
  flex-direction:column;

  min-height:0;
  flex-shrink:1;
}

/* ARTWORK */

.big-artwork-wrap {
  width:100%;
  aspect-ratio:1/1;
  max-height:min(40vh,390px);

  flex-shrink:1;
  overflow:hidden;

  border-radius:23px;
  background:#222;

  box-shadow:0 20px 55px rgba(0,0,0,.5);
  margin-bottom:25px;
}

.big-artwork-wrap img {
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* SONG INFO */

.song-meta-box {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;

  margin-bottom:25px;
  flex-shrink:0;
}

.song-info-text {
  flex:1;
  min-width:0;
}

.song-info-text h3 {
  margin:0 0 7px;
  font-size:21px;
  font-weight:750;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.song-info-text p {
  margin:0;
  font-size:14px;
  color:rgba(255,255,255,.7);

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.like-btn {
  width:44px;
  height:44px;

  display:grid;
  place-items:center;

  background:transparent;
  color:rgba(255,255,255,.8);
  flex-shrink:0;
}

.like-btn svg {
  width:27px;
  height:27px;
}

.like-btn.liked {
  color:#ff2d55;
}

/* PROGRESS */

.progress-container {
  width:100%;
  margin-bottom:28px;
  flex-shrink:0;
}

.seek-slider {
  width:100%;
  height:5px;

  display:block;
  appearance:none;
  -webkit-appearance:none;

  border-radius:10px;
  outline:none;

  background:linear-gradient(
    to right,
    #fff 0%,
    #fff 0%,
    rgba(255,255,255,.3) 0%,
    rgba(255,255,255,.3) 100%
  );
}

.seek-slider::-webkit-slider-thumb {
  appearance:none;
  -webkit-appearance:none;

  width:13px;
  height:13px;

  border-radius:50%;
  background:#fff;

  box-shadow:0 1px 7px rgba(0,0,0,.4);
}

.seek-slider::-moz-range-thumb {
  width:13px;
  height:13px;
  border:none;
  border-radius:50%;
  background:#fff;
}

.time-row {
  display:flex;
  justify-content:space-between;

  margin-top:10px;

  font-size:11px;
  color:rgba(255,255,255,.7);
  font-variant-numeric:tabular-nums;
}

/* CONTROLS */

.controls-row {
  display:flex;
  justify-content:center;
  align-items:center;

  gap:clamp(35px,12vw,55px);
  flex-shrink:0;
}

.ctrl-btn {
  width:48px;
  height:48px;

  display:grid;
  place-items:center;

  background:transparent;
  color:white;

  transition:transform .15s;
}

.ctrl-btn svg {
  width:32px;
  height:32px;
}

.ctrl-btn:active {
  transform:scale(.85);
}

.play-pause-circle {
  width:72px;
  height:72px;

  display:grid;
  place-items:center;

  border-radius:50%;
  background:#fff;
  color:#000;

  box-shadow:0 8px 25px rgba(0,0,0,.3);
  transition:transform .15s;
}

.play-pause-circle:active {
  transform:scale(.91);
}

.play-pause-circle svg {
  width:31px;
  height:31px;
}

/* MINI PLAYER */

.mini-player {
  position:fixed;
  z-index:9500;

  left:12px;
  right:12px;

  bottom:calc(77px + env(safe-area-inset-bottom));

  min-height:68px;
  padding:9px 11px;

  display:flex;
  align-items:center;
  gap:11px;

  background:rgba(40,40,42,.94);

  border:1px solid rgba(255,255,255,.13);
  border-radius:17px;

  backdrop-filter:blur(25px) saturate(160%);
  -webkit-backdrop-filter:blur(25px) saturate(160%);

  box-shadow:0 8px 30px rgba(0,0,0,.4);

  opacity:0;
  visibility:hidden;
  pointer-events:none;

  transform:translateY(35px) scale(.97);

  transition:
    opacity .35s cubic-bezier(.22,1,.36,1),
    transform .48s cubic-bezier(.22,1,.36,1),
    visibility .35s;
}

.mini-player.visible {
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:translateY(0) scale(1);
}

.mini-thumb {
  width:47px;
  height:47px;

  border-radius:9px;
  object-fit:cover;
  flex-shrink:0;
}

.mini-info {
  flex:1;
  min-width:0;
  cursor:pointer;
}

.mini-title {
  font-size:13px;
  font-weight:700;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.mini-artist {
  font-size:11px;
  color:rgba(255,255,255,.6);
  margin-top:4px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.mini-control {
  width:38px;
  height:42px;

  display:grid;
  place-items:center;

  background:transparent;
  color:white;
  flex-shrink:0;
}

.mini-control svg {
  width:24px;
  height:24px;
}

/* YOUTUBE */

#ytPlayerContainer {
  position:fixed;
  left:-1000px;
  top:0;

  width:200px;
  height:200px;

  opacity:.01;
  pointer-events:none;
}

/* RESPONSIVE */

@media(max-width:480px) {

  .wrap {
    padding:12px 13px 160px;
  }

  .header {
    padding:17px 13px 5px;
  }

  .grid {
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:11px;
  }

  .brand {
    font-size:23px;
  }

  .player {
    padding-left:22px;
    padding-right:22px;
  }

  .player-content-center {
    max-width:370px;
  }

}

@media(max-height:720px) {

  .big-artwork-wrap {
    max-height:min(34vh,280px);
    margin-bottom:16px;
  }

  .song-meta-box {
    margin-bottom:17px;
  }

  .progress-container {
    margin-bottom:18px;
  }

  .play-pause-circle {
    width:64px;
    height:64px;
  }

}

@media(max-height:600px) {

  .big-artwork-wrap {
    max-height:29vh;
    margin-bottom:12px;
  }

  .song-meta-box {
    margin-bottom:12px;
  }

  .progress-container {
    margin-bottom:12px;
  }

}
</style>
</head>

<body>

<header class="header">
  <div class="brand">SOUND<span>FLOW</span></div>
</header>

<!-- HOME -->

<main class="page active" id="homePage">

  <div class="wrap">

    <div class="section">
      <h2>Home</h2>
      <span class="status" id="homeStatus">Discover music</span>
    </div>

    <div class="grid" id="homeResults"></div>

    <div id="homeSentinel" aria-hidden="true"></div>

  </div>

</main>

<!-- SEARCH -->

<main class="page" id="searchPage">

  <div class="wrap">

    <form class="search" id="searchForm">

      <input
        id="query"
        type="search"
        placeholder="গানের নাম বা শিল্পীর নাম লিখো…"
        autocomplete="off"
      >

      <button type="submit">Search</button>

    </form>

    <div class="section">
      <h2>Search Results</h2>
      <span class="status" id="searchStatus">Search songs</span>
    </div>

    <div class="grid" id="searchResults">
      <div class="empty">তোমার পছন্দের গান খুঁজে নাও।</div>
    </div>

    <button class="load" id="searchMore" hidden>
      আরও গান দেখাও
    </button>

  </div>

</main>

<!-- LIBRARY -->

<main class="page" id="libraryPage">

  <div class="wrap">

    <div class="section">
      <h2>My Library</h2>
      <span class="status" id="libraryStatus">0 Songs</span>
    </div>

    <div class="grid" id="libraryResults">
      <div class="empty">
        এখনো কোনো গান Favourite করা হয়নি।
      </div>
    </div>

  </div>

</main>

<!-- BOTTOM NAV -->

<nav class="bottom-nav" id="bottomNav">

  <button class="nav-btn active" data-tab="home" type="button">
    <svg viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="m3 10 9-7 9 7"/>
      <path d="M5 9v11h14V9"/>
      <path d="M9 20v-6h6v6"/>
    </svg>
    <span>Home</span>
  </button>

  <button class="nav-btn" data-tab="search" type="button">
    <svg viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.9"
         stroke-linecap="round">
      <circle cx="10.8" cy="10.8" r="6.8"/>
      <path d="m16 16 5 5"/>
    </svg>
    <span>Search</span>
  </button>

  <button class="nav-btn" data-tab="library" type="button">
    <svg viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4h16v17H4z"/>
      <path d="M8 4v17"/>
      <path d="M12 9h5"/>
      <path d="M12 13h5"/>
    </svg>
    <span>Library</span>
  </button>

</nav>

<!-- FULL PLAYER -->

<section class="player" id="player">

  <div class="player-bg" id="playerBg"></div>
  <div class="player-shade"></div>

  <div class="player-top-bar">

    <button class="collapse-btn" id="minimizePlayer" type="button">
      <svg viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="2.5"
           stroke-linecap="round">
        <path d="m6 9 6 6 6-6"/>
      </svg>
    </button>

    <span>NOW PLAYING</span>

  </div>

  <div class="player-content-center">

    <div class="big-artwork-wrap">
      <img id="playingThumb" alt="Album Artwork">
    </div>

    <div class="song-meta-box">

      <div class="song-info-text">
        <h3 id="playingTitle">Song Title</h3>
        <p id="playingArtist">Artist Name</p>
      </div>

      <button class="like-btn" id="likeBtn" type="button">
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.8"
             stroke-linecap="round"
             stroke-linejoin="round">
          <path d="M20.8 8.7c0 5.5-8.8 10.2-8.8 10.2S3.2 14.2 3.2 8.7A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.8 2.3Z"/>
        </svg>
      </button>

    </div>

    <div class="progress-container">

      <input
        type="range"
        id="seekSlider"
        class="seek-slider"
        min="0"
        max="100"
        value="0"
      >

      <div class="time-row">
        <span id="currentTime">0:00</span>

<script>

/* ELEMENTS */

const $ = id => document.getElementById(id);

const playerScreen = $('player');
const miniPlayer = $('miniPlayer');
const seekSlider = $('seekSlider');

/* STATE */

let ytPlayer = null;
let apiReady = false;

let playerMode = 'closed';

let playQueue = [];
let currentIndex = -1;

let isPlaying = false;

let updateTimer = null;
let pendingVideoId = null;

let activeTab = 'home';

/* PLAYER TINT (status bar / Dynamic Island রং) */

const FALLBACK_TINT = '#2a2a2c';
const tintCache = {};
let currentTint = FALLBACK_TINT;

function syncTint() {

  // Full player এর পেছনের রং
  document.documentElement.style.setProperty(
    '--player-tint',
    currentTint
  );

  // Safari-র status bar tint:
  // full player খোলা থাকলে album রং, নইলে আগের মতো কালো
  const meta = $('themeColor');

  if (meta) {
    meta.setAttribute(
      'content',
      playerMode === 'full' ? currentTint : '#000000'
    );
  }

}

function loadTint(video) {

  const id = video.videoId;

  if (!id) return;

  if (tintCache[id]) {
    currentTint = tintCache[id];
    syncTint();
    return;
  }

  currentTint = FALLBACK_TINT;
  syncTint();

  const img = new Image();

  img.crossOrigin = 'anonymous';

  img.onload = () => {

    try {

      const canvas = document.createElement('canvas');

      canvas.width = 16;
      canvas.height = 16;

      const ctx = canvas.getContext('2d',{
        willReadFrequently:true
      });

      // মাঝের অংশের উপরের অর্ধেক (blur background এর উপরের দিকের রং)
      const sx = img.naturalWidth * 0.3;
      const sw = img.naturalWidth * 0.4;
      const sh = img.naturalHeight * 0.5;

      ctx.drawImage(img,sx,0,sw,sh,0,0,16,16);

      const data = ctx.getImageData(0,0,16,16).data;

      let r = 0, g = 0, b = 0, n = 0;

      for (let i = 0; i < data.length; i += 4) {
        r += data[i];
        g += data[i + 1];
        b += data[i + 2];
        n++;
      }

      if (!n) return;

      const color =
        `rgb(${Math.round(r / n)},${Math.round(g / n)},${Math.round(b / n)})`;

      tintCache[id] = color;

      const playing = playQueue[currentIndex];

      if (playing && playing.videoId === id) {
        currentTint = color;
        syncTint();
      }

    } catch(e) {
      // CORS block করলে fallback রং-ই থাকবে
    }

  };

  img.src = `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;

}

/* SCROLL LOCK */

let savedScrollY = 0;

/* HOME STORAGE */

const HOME_SEEN_KEY = 'soundflow_home_seen_v1';
const HOME_CACHE_KEY = 'soundflow_home_cache_v2';

let homeSeenIds = new Set();

try {
  const saved = JSON.parse(
    localStorage.getItem(HOME_SEEN_KEY) || '[]'
  );

  if (Array.isArray(saved)) {
    homeSeenIds = new Set(saved);
  }
} catch(e) {}

function saveHomeSeen() {
  try {
    localStorage.setItem(
      HOME_SEEN_KEY,
      JSON.stringify(Array.from(homeSeenIds).slice(-5000))
    );
  } catch(e) {}
}

function markHomeSeen(videoId) {
  if (!videoId) return;
  homeSeenIds.add(videoId);
}

function saveHomeCache() {
  try {
    localStorage.setItem(HOME_CACHE_KEY,JSON.stringify({
      videos:pageData.home.videos.slice(-200),
      page:pageData.home.page,
      savedAt:Date.now()
    }));
  } catch(e) {}
}

/* PAGE DATA */

const pageData = {

  home:{
    videos:[],
    page:0,
    query:'Top Bangla Hindi songs',
    busy:false,
    controller:null
  },

  search:{
    videos:[],
    page:1,
    query:'',
    busy:false,
    controller:null
  }

};

/* RESTORE HOME CACHE */

function restoreHomeCache() {

  try {

    const cache = JSON.parse(
      localStorage.getItem(HOME_CACHE_KEY) || 'null'
    );

    if (!cache || !Array.isArray(cache.videos)) return false;

    if (
      cache.savedAt &&
      Date.now() - cache.savedAt > 7 * 24 * 60 * 60 * 1000
    ) {
      return false;
    }

    const valid = cache.videos.filter(v =>
      v && v.videoId
    );

    if (!valid.length) return false;

    pageData.home.videos = valid;
    pageData.home.page = Number(cache.page) || 0;

    const grid = $('homeResults');

    grid.innerHTML = '';

    valid.forEach((video,index) => {
      grid.appendChild(
        makeCard(video,index,pageData.home.videos)
      );
    });

    $('homeStatus').textContent =
      valid.length + ' Songs';

    return true;

  } catch(e) {
    return false;
  }

}

/* HOME AUTO LOAD */

const HOME_BATCH_SIZE = 20;
const HOME_MAX_PAGE_ATTEMPTS = 12;

let homeHasMore = true;
let homeAutoLoading = false;
let homeObserver = null;

function setupHomeObserver() {

  if (!('IntersectionObserver' in window)) return;

  const sentinel = $('homeSentinel');

  if (!sentinel || homeObserver) return;

  homeObserver = new IntersectionObserver(entries => {

    for (const entry of entries) {

      if (!entry.isIntersecting) continue;
      if (activeTab !== 'home') continue;
      if (playerMode === 'full') continue;
      if (homeAutoLoading) continue;
      if (!homeHasMore) continue;

      if (pageData.home.busy) continue;

      if (!pageData.home.videos.length) continue;

      loadNextHomeBatch();

    }

  },{
    root:null,
    rootMargin:'700px 0px',
    threshold:0
  });

  homeObserver.observe(sentinel);

}

function refreshHomeObserver() {

  if (!homeObserver) {
    setupHomeObserver();
    return;
  }

  const sentinel = $('homeSentinel');

  if (!sentinel) return;

  homeObserver.unobserve(sentinel);

  requestAnimationFrame(() => {
    if (homeObserver && homeHasMore) {
      homeObserver.observe(sentinel);
    }
  });

}

async function loadNextHomeBatch() {

  if (homeAutoLoading || !homeHasMore) return;

  const state = pageData.home;

  if (state.busy) return;

  homeAutoLoading = true;

  try {

    await loadSongs(
      'home',
      state.query,
      state.page + 1,
      true
    );

  } finally {

    homeAutoLoading = false;

    if (homeHasMore && activeTab === 'home') {
      refreshHomeObserver();
    }

  }

}

/* SERVERS */

const instances = [
  'https://invidious.privacyredirect.com',
  'https://inv.nadeko.net',
  'https://invidious.nerdvpn.de',
  'https://yt.chocolatemoo53.com',
  'https://invidious.tiekoetter.com'
];

/* PAGE NAVIGATION */

function setActiveTab(tab) {

  if (!['home','search','library'].includes(tab)) return;

  if (activeTab === tab) return;

  activeTab = tab;

  $('homePage').classList.toggle('active',tab === 'home');
  $('searchPage').classList.toggle('active',tab === 'search');
  $('libraryPage').classList.toggle('active',tab === 'library');

  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.toggle('active',btn.dataset.tab === tab);
  });

  if (tab === 'library') {
    renderLibrary();
  }

  if (tab === 'home') {

    if (!pageData.home.videos.length) {
      loadHome();
    } else {
      refreshHomeObserver();
    }

  }

}

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click',() => {
    setActiveTab(btn.dataset.tab);
  });
});

/* YOUTUBE API */

window.onYouTubeIframeAPIReady = function() {

  ytPlayer = new YT.Player('ytPlayer', {

    height:'200',
    width:'200',

    playerVars:{
      autoplay:0,
      controls:0,
      disablekb:1,
      playsinline:1,
      rel:0
    },

    events:{

      onReady:() => {

        apiReady = true;

        if (pendingVideoId) {
          const id = pendingVideoId;
          pendingVideoId = null;
          ytPlayer.loadVideoById(id);
        }

      },

      onStateChange:onPlayerStateChange,

      onError:event => {

        console.log('YouTube Error:',event.data);

        isPlaying = false;
        updateIcons();
        stopTimer();

      }

    }

  });

};

/* PLAYER STATE */

function onPlayerStateChange(event) {

  if (event.data === YT.PlayerState.PLAYING) {

    isPlaying = true;
    updateIcons();
    startTimer();

  }

  else if (event.data === YT.PlayerState.PAUSED) {

    isPlaying = false;
    updateIcons();
    stopTimer();

  }

  else if (event.data === YT.PlayerState.ENDED) {

    isPlaying = false;
    updateIcons();
    stopTimer();

    nextSong();

  }

}

/* ICONS */

const playSVG = '<path d="M7 4v16l13-8z"/>';
const pauseSVG = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';

function updateIcons() {

  $('mainPlayIcon').innerHTML =
    isPlaying ? pauseSVG : playSVG;

  $('miniPlayIcon').innerHTML =
    isPlaying ? pauseSVG : playSVG;

}

/* TIME */

function formatTime(sec) {

  if (!Number.isFinite(sec) || sec < 0) return '0:00';

  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);

  return m + ':' + String(s).padStart(2,'0');

}

/* PROGRESS */

function setProgressColor(percent) {

  const value = Math.max(0,Math.min(100,percent));

  seekSlider.style.background = `
    linear-gradient(
      to right,
      #fff 0%,
      #fff ${value}%,
      rgba(255,255,255,.3) ${value}%,
      rgba(255,255,255,.3) 100%
    )
  `;

}

function updateProgress() {

  if (!ytPlayer || !apiReady) return;

  try {

    const current = ytPlayer.getCurrentTime() || 0;
    const duration = ytPlayer.getDuration() || 0;

    $('currentTime').textContent = formatTime(current);
    $('durationTime').textContent = formatTime(duration);

    if (duration > 0) {

      const percent = Math.min(100,(current / duration) * 100);

      if (!seekSlider.matches(':active')) {
        seekSlider.value = percent;
        setProgressColor(percent);
      }

    }

  } catch(e) {}

}

function startTimer() {
  stopTimer();
  updateProgress();
  updateTimer = setInterval(updateProgress,400);
}

function stopTimer() {
  if (updateTimer) {
    clearInterval(updateTimer);
    updateTimer = null;
  }
}

/* SEEK */

seekSlider.addEventListener('input',() => {

  const percent = Number(seekSlider.value);

  setProgressColor(percent);

  if (ytPlayer && apiReady) {

    const duration = ytPlayer.getDuration() || 0;

    $('currentTime').textContent =
      formatTime(duration * percent / 100);

  }

});

seekSlider.addEventListener('change',() => {

  if (!ytPlayer || !apiReady) return;

  const duration = ytPlayer.getDuration() || 0;

  if (duration > 0) {
    ytPlayer.seekTo(duration * Number(seekSlider.value) / 100,true);
  }

  updateProgress();

});

function resetProgress() {

  seekSlider.value = 0;
  setProgressColor(0);

  $('currentTime').textContent = '0:00';
  $('durationTime').textContent = '0:00';

}

/* PLAY PAUSE */

function togglePlay() {

  if (!ytPlayer || !apiReady) return;

  if (isPlaying) {
    ytPlayer.pauseVideo();
  } else {
    ytPlayer.playVideo();
  }

}

$('mainPlayBtn').addEventListener('click',e => {
  e.preventDefault();
  e.stopPropagation();
  togglePlay();
});

$('miniPlayBtn').addEventListener('click',e => {
  e.preventDefault();
  e.stopPropagation();
  togglePlay();
});

/* THUMBNAIL */

function bestThumb(video) {

  const thumbnails = video.videoThumbnails || [];

  return (
    thumbnails.find(x => x.quality === 'maxres') ||
    thumbnails.find(x => x.quality === 'high') ||
    thumbnails.find(x => x.quality === 'medium') ||
    thumbnails[0] ||
    {}
  ).url || `https://i.ytimg.com/vi/${video.videoId}/hqdefault.jpg`;

}

/* FAVOURITES */

function getLikes() {

  try {
    return JSON.parse(localStorage.getItem('soundflow_likes') || '[]');
  } catch(e) {
    return [];
  }

}

function getLikedSongs() {

  try {
    return JSON.parse(localStorage.getItem('soundflow_liked_songs') || '[]');
  } catch(e) {
    return [];
  }

}

function saveLikedSongs(songs) {

  try {

    localStorage.setItem(
      'soundflow_liked_songs',
      JSON.stringify(songs)
    );

    localStorage.setItem(
      'soundflow_likes',
      JSON.stringify(songs.map(v => v.videoId))
    );

  } catch(e) {}

}

/* SONG INFO */

function setSongInfo(video) {

  const thumbnail = bestThumb(video);

  $('playingThumb').src = thumbnail;

  $('playingTitle').textContent =
    video.title || 'Unknown Song';

  $('playingArtist').textContent =
    video.author || 'YouTube';

  $('miniThumb').src = thumbnail;

  $('miniTitle').textContent =
    video.title || 'Unknown Song';

  $('miniArtist').textContent =
    video.author || 'YouTube';

  $('playerBg').style.backgroundImage =
    `url("${thumbnail}")`;

  $('likeBtn').classList.toggle(
    'liked',
    getLikes().includes(video.videoId)
  );

  loadTint(video);

}

/* SCROLL LOCK
   body কে position:fixed করা হয় না, কারণ তাতে Safari page কে
   status bar এর নিচে extend করা বন্ধ করে দিতে পারে। */

/* status bar যদি page এর layout এর বাইরে থাকে (safe-area = 0),
   তাহলে player কে একটু উপরে "lift" করে scroll করে রাখি,
   যাতে উপরের অংশ status bar এর নিচে blur হয়ে দেখায়। */

function getTopLift() {

  const probe = document.createElement('div');

  probe.style.cssText =
    'position:absolute;visibility:hidden;pointer-events:none;' +
    'padding-top:env(safe-area-inset-top);';

  document.body.appendChild(probe);

  const safeTop = probe.offsetHeight;

  probe.remove();

  return safeTop > 0 ? 0 : 70;

}

function lockPageScroll() {

  if (document.body.classList.contains('full-player-open')) return;

  savedScrollY = window.scrollY || window.pageYOffset || 0;

  document.documentElement.style.setProperty(
    '--player-lift',
    getTopLift() + 'px'
  );

  document.documentElement.classList.add('full-player-open');
  document.body.classList.add('full-player-open');

}

function applyPlayerScroll() {

  const lift = parseFloat(
    getComputedStyle(document.documentElement)
      .getPropertyValue('--player-lift')
  ) || 0;

  window.scrollTo(0,lift);

  requestAnimationFrame(() => {
    if (playerMode === 'full') window.scrollTo(0,lift);
  });

}

function unlockPageScroll() {

  if (!document.body.classList.contains('full-player-open')) return;

  document.documentElement.classList.remove('full-player-open');
  document.body.classList.remove('full-player-open');

  document.documentElement.style.setProperty('--player-lift','0px');

  window.scrollTo(0,savedScrollY);

}

/* PLAYER MODES */

function showFullPlayer() {

  playerMode = 'full';

  lockPageScroll();
  syncTint();

  miniPlayer.classList.remove('visible');
  playerScreen.classList.add('active');

  applyPlayerScroll();

}

function minimizePlayer() {

  if (playerMode !== 'full') return;

  playerMode = 'mini';

  unlockPageScroll();
  syncTint();

  playerScreen.classList.remove('active');
  miniPlayer.classList.add('visible');

}

function expandPlayer() {

  if (playerMode !== 'mini') return;

  playerMode = 'full';

  lockPageScroll();
  syncTint();

  miniPlayer.classList.remove('visible');
  playerScreen.classList.add('active');

  applyPlayerScroll();

}

function closePlayer() {

  playerMode = 'closed';

  unlockPageScroll();
  syncTint();

  playerScreen.classList.remove('active');
  miniPlayer.classList.remove('visible');

  stopTimer();

  if (ytPlayer && apiReady) {
    ytPlayer.stopVideo();
  }

  pendingVideoId = null;
  isPlaying = false;

  currentIndex = -1;
  playQueue = [];

  updateIcons();
  resetProgress();

}

/* PLAY SONG */

function playSongAt(index,list) {

  if (list) {
    playQueue = list.slice();
  }

  if (index < 0 || index >= playQueue.length) return;

  const video = playQueue[index];

  if (!video || !video.videoId) return;

  currentIndex = index;

  if (playerMode === 'closed') {
    showFullPlayer();
  }

  setSongInfo(video);
  resetProgress();

  if (apiReady && ytPlayer) {

    ytPlayer.loadVideoById({
      videoId:video.videoId,
      startSeconds:0
    });

  } else {

    pendingVideoId = video.videoId;

  }

}

/* NEXT / PREVIOUS */

function nextSong() {

  if (!playQueue.length || currentIndex < 0) return;

  let next = currentIndex + 1;

  if (next >= playQueue.length) next = 0;

  playSongAt(next);

}

function previousSong() {

  if (!playQueue.length || currentIndex < 0) return;

  let previous = currentIndex - 1;

  if (previous < 0) previous = playQueue.length - 1;

  playSongAt(previous);

}

$('nextBtn').addEventListener('click',e => {
  e.preventDefault();
  e.stopPropagation();
  nextSong();
});

$('prevBtn').addEventListener('click',e => {
  e.preventDefault();
  e.stopPropagation();
  previousSong();
});

/* MINIMIZE */

$('minimizePlayer').addEventListener('click',e => {
  e.preventDefault();
  e.stopPropagation();
  minimizePlayer();
});

/* EXPAND MINI */

$('expandPlayer').addEventListener('click',e => {
  e.preventDefault();
  e.stopPropagation();
  expandPlayer();
});

/* CLOSE MINI */

$('miniCloseBtn').addEventListener('click',e => {
  e.preventDefault();
  e.stopPropagation();
  closePlayer();
});

/* PLAYER TOUCH HANDLING */

let touchStartX = 0;
let touchStartY = 0;
let touchStarted = false;

playerScreen.addEventListener('touchstart',e => {

  touchStarted = false;

  if (playerMode !== 'full') return;
  if (e.target.closest('button,input')) return;

  const touch = e.touches[0];

  touchStartX = touch.clientX;
  touchStartY = touch.clientY;

  touchStarted = true;

},{passive:true});

playerScreen.addEventListener('touchmove',e => {

  if (playerMode !== 'full') return;
  if (e.target.closest('button,input')) return;

  if (e.cancelable) e.preventDefault();

},{passive:false});

playerScreen.addEventListener('touchend',e => {

  if (!touchStarted) return;

  touchStarted = false;

  if (playerMode !== 'full') return;

  const touch = e.changedTouches[0];

  const deltaY = touch.clientY - touchStartY;
  const deltaX = Math.abs(touch.clientX - touchStartX);

  if (deltaY > 90 && deltaY > deltaX * 1.5) {
    minimizePlayer();
  }

},{passive:true});

playerScreen.addEventListener('touchcancel',() => {
  touchStarted = false;
});

/* LIKE BUTTON */

$('likeBtn').addEventListener('click',e => {

  e.preventDefault();
  e.stopPropagation();

  if (currentIndex < 0) return;

  const video = playQueue[currentIndex];

  if (!video) return;

  const id = video.videoId;

  let songs = getLikedSongs();
  let likes = getLikes();

  if (likes.includes(id)) {

    likes = likes.filter(x => x !== id);
    songs = songs.filter(x => x.videoId !== id);

  } else {

    likes.push(id);

    if (!songs.some(x => x.videoId === id)) {
      songs.unshift(video);
    }

  }

  saveLikedSongs(songs);

  $('likeBtn').classList.toggle(
    'liked',
    likes.includes(id)
  );

  if (activeTab === 'library') {
    renderLibrary();
  }

});

/* SONG CARDS */

function makeCard(video,index,list) {

  const card = document.createElement('article');

  card.className = 'card';
  card.tabIndex = 0;

  const img = document.createElement('img');

  img.className = 'thumb';
  img.loading = 'lazy';
  img.src = bestThumb(video);

  const title = document.createElement('div');

  title.className = 'title';
  title.textContent = video.title || 'Untitled';

  const artist = document.createElement('div');

  artist.className = 'artist';
  artist.textContent = video.author || 'YouTube';

  card.append(img,title,artist);

  const play = () => playSongAt(index,list);

  card.addEventListener('click',play);

  card.addEventListener('keydown',e => {

    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      play();
    }

  });

  return card;

}

/* FAST API FETCH */

async function fetchSongs(query,pageNumber,controller) {

  const controllers = [];

  const requests = instances.map(base => {

    const child = new AbortController();

    controllers.push(child);

    const abortParent = () => child.abort();

    controller.signal.addEventListener(
      'abort',
      abortParent,
      {once:true}
    );

    return fetch(
      `${base}/api/v1/search?q=${encodeURIComponent(query)}&type=video&page=${pageNumber}`,
      {
        signal:child.signal
      }
    )
    .then(response => {

      if (!response.ok) {
        throw new Error('Server error');
      }

      return response.json();

    })
    .then(json => {

      if (!Array.isArray(json)) {
        throw new Error('Invalid response');
      }

      return json;

    });

  });

  try {

    const result = await Promise.any(requests);

    controllers.forEach(c => c.abort());

    return result;

  } catch(e) {

    controllers.forEach(c => c.abort());

    return null;

  }

}

/* LOAD SONGS */

async function loadSongs(type,query,pageNumber=1,append=false) {

  const state = pageData[type];

  if (!state || state.busy) return;

  state.busy = true;

  if (state.controller) {
    state.controller.abort();
  }

  const controller = new AbortController();

  state.controller = controller;

  const grid = type === 'home'
    ? $('homeResults')
    : $('searchResults');

  const status = type === 'home'
    ? $('homeStatus')
    : $('searchStatus');

  const more = type === 'home'
    ? null
    : $('searchMore');

  if (more) {
    more.hidden = true;
    more.disabled = true;
  }

  if (!append && type === 'search') {
    grid.innerHTML = '';
    state.videos = [];
    state.page = 0;
  }

  let collected = [];

  let lastCheckedPage = pageNumber;
  let reachedEnd = false;
  let failed = false;

  const existing = new Set(
    state.videos.map(v => v.videoId)
  );

  const maxAttempts = type === 'home'
    ? HOME_MAX_PAGE_ATTEMPTS
    : 1;

  for (let attempt = 0; attempt < maxAttempts; attempt++) {

    if (controller.signal.aborted) break;

    const currentPage = pageNumber + attempt;

    lastCheckedPage = currentPage;

    const data = await fetchSongs(
      query,
      currentPage,
      controller
    );

    if (state.controller !== controller) return;

    if (controller.signal.aborted) {
      state.busy = false;
      return;
    }

    if (!data) {

      if (attempt === 0) failed = true;

      break;

    }

    const found = data.filter(v =>
      v.type === 'video' && v.videoId
    );

    if (!found.length) {
      reachedEnd = true;
      break;
    }

    for (const video of found) {

      const id = video.videoId;

      if (existing.has(id)) continue;

      if (type === 'home' && homeSeenIds.has(id)) {
        continue;
      }

      existing.add(id);
      collected.push(video);

      if (
        type === 'home' &&
        collected.length >= HOME_BATCH_SIZE
      ) {
        break;
      }

    }

    if (
      type === 'home' &&
      collected.length >= HOME_BATCH_SIZE
    ) {
      break;
    }

    if (type !== 'home') break;

  }

  if (state.controller !== controller) return;

  if (controller.signal.aborted) {
    state.busy = false;
    return;
  }

  if (failed && !append) {

    if (type === 'home') {
      status.textContent = 'Connection unavailable';
    } else {

      grid.innerHTML =
        '<div class="empty">সার্ভার সংযোগে ব্যর্থ। পরে আবার চেষ্টা করুন।</div>';

      status.textContent = 'Server Error';

    }

    state.busy = false;

    return;

  }

  if (collected.length) {

    collected.forEach(video => {

      state.videos.push(video);

      if (type === 'home') {
        markHomeSeen(video.videoId);
      }

      const index = state.videos.length - 1;

      grid.appendChild(
        makeCard(video,index,state.videos)
      );

    });

  }

  if (!state.videos.length && type === 'search') {

    grid.innerHTML =
      '<div class="empty">কোনো গান পাওয়া যায়নি।</div>';

  }

  state.page = lastCheckedPage;
  state.query = query;

  status.textContent = state.videos.length + ' Songs';

  if (type === 'search') {

    more.hidden =
      reachedEnd || collected.length === 0;

    more.disabled = false;

  }

  if (type === 'home') {

    if (reachedEnd) {

      homeHasMore = false;

    } else if (
      collected.length === 0 &&
      lastCheckedPage >= pageNumber + maxAttempts - 1
    ) {

      homeHasMore = false;

    } else if (collected.length > 0) {

      homeHasMore = true;

    }

    saveHomeCache();
    saveHomeSeen();

  }

  state.busy = false;

  if (type === 'home') {
    refreshHomeObserver();
  }

}

/* HOME */

function loadHome() {

  const state = pageData.home;

  if (state.busy || homeAutoLoading) return;

  if (!state.videos.length) {

    homeHasMore = true;

    loadSongs(
      'home',
      state.query,
      1,
      false
    );

  } else {

    refreshHomeObserver();

  }

}

/* SEARCH */

$('searchForm').addEventListener('submit',e => {

  e.preventDefault();

  const query = $('query').value.trim();

  if (!query) return;

  loadSongs(
    'search',
    query,
    1,
    false
  );

});

$('searchMore').addEventListener('click',() => {

  const state = pageData.search;

  if (!state.query) return;

  loadSongs(
    'search',
    state.query,
    state.page + 1,
    true
  );

});

/* LIBRARY */

function renderLibrary() {

  const grid = $('libraryResults');

  const songs = getLikedSongs();

  $('libraryStatus').textContent =
    songs.length + ' Songs';

  grid.innerHTML = '';

  if (!songs.length) {

    grid.innerHTML = `
      <div class="empty">
        এখনো কোনো গান Favourite করা হয়নি।
        <br><br>
        গান শুনতে গিয়ে ❤️ বাটনে চাপ দাও।
      </div>
    `;

    return;

  }

  songs.forEach((video,index) => {

    grid.appendChild(
      makeCard(video,index,songs)
    );

  });

}

/* INITIALIZE */

updateIcons();
setProgressColor(0);

restoreHomeCache();

setupHomeObserver();

loadHome();

renderLibrary();

</script>
