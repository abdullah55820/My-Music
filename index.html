<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>My Music Player</title>

<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">

<link
rel="preload"
as="image"
href="background.jpg"
>

<link
rel="apple-touch-icon"
sizes="180x180"
href="logo.png"
>

<link
rel="icon"
type="image/png"
href="logo.png"
>

<style>

/* =================================================
   RESET
   ================================================= */

*{
box-sizing:border-box;
}

html,
body{

margin:0;

width:100%;
height:100%;

overflow:hidden;

background:#050505;

color:#fff;

font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
"Segoe UI",
sans-serif;
}

body{

position:relative;

overflow-x:hidden!important;
}


/* =================================================
   BACKGROUND
   ================================================= */

.bg{

position:fixed;

inset:0;

background-image:url("background.jpg");

background-position:center center;

background-size:cover;

background-repeat:no-repeat;

z-index:0;

transition:
filter .25s ease,
transform .25s ease;
}


/*
   শুধু background.jpg blur হবে
   অন্য কোনো UI blur হবে না
*/

.bg.video-blur{

filter:blur(13px);

transform:scale(1.045);
}


.bg:after{

content:"";

position:absolute;

inset:0;

background:rgba(0,0,0,.15);
}


/* =================================================
   TOP WIDGETS
   ================================================= */

.top-widgets{

position:fixed;

top:14px;

left:50%;

transform:translateX(-50%);

z-index:250;

display:flex;

flex-direction:column;

align-items:center;

gap:8px;
}


/* =================================================
   BD TIME
   ================================================= */

.bd-time{

padding:5px 11px;

border-radius:20px;

background:rgba(0,0,0,.45);

border:
1px solid rgba(255,255,255,.18);

color:rgba(255,255,255,.9);

font-size:11px;

font-weight:600;

letter-spacing:.3px;

backdrop-filter:blur(12px);

-webkit-backdrop-filter:blur(12px);

display:flex;

align-items:center;

gap:6px;
}


.live-dot{

width:7px;

height:7px;

background:#ff3b30;

border-radius:50%;

display:inline-block;

box-shadow:
0 0 8px #ff3b30;

animation:pulse 1.5s infinite;
}


@keyframes pulse{

0%{
opacity:1;
transform:scale(1);
}

50%{
opacity:.3;
transform:scale(.8);
}

100%{
opacity:1;
transform:scale(1);
}

}


/* =================================================
   PLAYLIST BUTTON
   ================================================= */

.playlist-toggle-btn{

padding:5px 12px;

border-radius:20px;

background:rgba(0,0,0,.45);

border:
1px solid rgba(255,255,255,.18);

color:rgba(255,255,255,.9);

font-size:11px;

font-weight:600;

backdrop-filter:blur(12px);

-webkit-backdrop-filter:blur(12px);

display:flex;

align-items:center;

gap:6px;

cursor:pointer;

transition:
transform .2s,
background .2s;
}


.playlist-toggle-btn:active{

transform:scale(.95);
}


.playlist-toggle-btn svg{

width:14px;

height:14px;

fill:#fff;
}


/* =================================================
   YOUTUBE HIDDEN PLAYER
   ================================================= */

#yt{

position:fixed;

width:2px;

height:2px;

left:-10px;

bottom:-10px;

opacity:.01;

pointer-events:none;

z-index:-1;
}


/* =================================================
   APP
   ================================================= */

.app{

position:relative;

z-index:2;

height:100dvh;

width:100%;

display:flex;

align-items:flex-end;

justify-content:center;

padding:
0 16px 65px;
}


/* =================================================
   MUSIC PLAYER
   ================================================= */

.player{

width:min(440px,94%);

height:120px;

padding:14px 18px;

border:
1px solid rgba(255,255,255,.18);

border-radius:60px;

background:rgba(255,255,255,.06);

backdrop-filter:
blur(25px)
saturate(115%);

-webkit-backdrop-filter:
blur(25px)
saturate(115%);

box-shadow:
0 20px 50px rgba(0,0,0,.45);

display:flex;

align-items:center;

gap:12px;

position:relative;

overflow:hidden;

touch-action:pan-y;
}


/* =================================================
   COVER
   ================================================= */

.cover-wrapper{

position:relative;

width:84px;

height:84px;

flex-shrink:0;

display:flex;

align-items:center;

justify-content:center;

border-radius:50%;

overflow:hidden;

border:
1px solid rgba(255,255,255,.3);
}


.cover{

width:137%;

height:137%;

margin:-18.5%;

border-radius:50%;

object-fit:cover;

object-position:center;

background:#222;

animation:
spin 8s linear infinite;

animation-play-state:paused;
}


.cover-wrapper::after{

content:"";

position:absolute;

width:16px;

height:16px;

background:rgba(20,20,20,.85);

border:
2px solid rgba(255,255,255,.3);

border-radius:50%;

left:50%;

top:50%;

transform:
translate(-50%,-50%);

z-index:2;
}


.cover.spinning{

animation-play-state:running;
}


@keyframes spin{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}


/* =================================================
   SONG INFO
   ================================================= */

.middle{

flex:1;

min-width:0;

display:flex;

flex-direction:column;

justify-content:center;
}


.title{

font-size:16px;

font-weight:700;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

color:#fff;

letter-spacing:.2px;
}


.artist{

font-size:12px;

color:rgba(255,255,255,.65);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-top:2px;

margin-bottom:8px;
}


/* =================================================
   SEEK
   ================================================= */

.seek{

position:relative;

width:100%;

height:5px;

border-radius:10px;

background:rgba(255,255,255,.2);

cursor:pointer;

margin-bottom:6px;

touch-action:none;

user-select:none;

-webkit-user-select:none;
}


.seek::before{

content:"";

position:absolute;

top:-12px;

bottom:-12px;

left:-10px;

right:-10px;

z-index:1;
}


.fill{

position:absolute;

left:0;

top:0;

height:100%;

width:0;

background:#fff;

border-radius:10px;

pointer-events:none;

z-index:2;
}


.time-display{

font-size:11px;

color:rgba(255,255,255,.65);

font-variant-numeric:tabular-nums;
}


/* =================================================
   CONTROLS
   ================================================= */

.controls{

display:flex;

align-items:center;

gap:7px;

flex-shrink:0;
}


.btn{

width:28px;

height:28px;

border:0;

background:transparent;

color:rgba(255,255,255,.9);

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

padding:0;
}


.btn svg{

width:20px;

height:20px;

fill:#fff;
}


/* =================================================
   VIDEO BUTTON
   ================================================= */

.video-btn{

width:40px;

height:40px;

border-radius:50%;

border:
1px solid rgba(255,255,255,.25);

background:
rgba(255,255,255,.10);

color:#fff;

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

flex-shrink:0;

backdrop-filter:blur(10px);

-webkit-backdrop-filter:blur(10px);

box-shadow:
0 4px 15px rgba(0,0,0,.25);

transition:
transform .18s ease,
background .18s ease;
}


.video-btn:active{

transform:scale(.88);
}


.video-btn svg{

width:20px;

height:20px;

fill:#fff;
}


/* =================================================
   VOLUME
   ================================================= */

.vol-container{

display:flex;

align-items:center;

gap:4px;

background:rgba(0,0,0,.25);

border:
1px solid rgba(255,255,255,.15);

padding:4px 6px;

border-radius:20px;

backdrop-filter:blur(10px);

-webkit-backdrop-filter:blur(10px);
}


.vol-slider-wrapper{

width:0;

overflow:hidden;

opacity:0;

display:flex;

align-items:center;

transition:
width .28s cubic-bezier(.2,.8,.2,1),
opacity .2s ease;
}


.vol-slider-wrapper.active{

width:55px;

opacity:1;

margin-left:2px;
}


.vol-slider{

-webkit-appearance:none;

appearance:none;

width:55px;

height:3.5px;

background:rgba(255,255,255,.3);

border-radius:10px;

outline:none;

cursor:pointer;
}


.vol-slider::-webkit-slider-thumb{

-webkit-appearance:none;

appearance:none;

width:10px;

height:10px;

border-radius:50%;

background:#fff;

cursor:pointer;

box-shadow:
0 0 5px rgba(0,0,0,.5);
}


/* HIDE VOLUME ON IOS */

@supports (-webkit-touch-callout:none){

.vol-container{
display:none!important;
}

}


/* =================================================
   PLAY BUTTON
   ================================================= */

.play{

width:44px;

height:44px;

border-radius:50%;

border:0;

background:#fff;

color:#000;

display:flex;

align-items:center;

justify-content:center;

box-shadow:
0 4px 15px rgba(0,0,0,.3);

cursor:pointer;

flex-shrink:0;
}


.play svg{

width:20px;

height:20px;

fill:#000;

margin-left:2px;
}


.play.playing svg{

margin-left:0;
}


.btn:active,
.play:active{

transform:scale(.90);
}


/* =================================================
   VIDEO POPUP
   ================================================= */

.video-popup{

position:fixed;

left:50%;

top:50%;

transform:
translate(-50%,-50%)
scale(.96);

width:min(92vw,665px);

aspect-ratio:16 / 9;

z-index:150;

opacity:0;

visibility:hidden;

pointer-events:none;

transition:
opacity .22s ease,
transform .22s ease,
visibility .22s ease;
}


.video-popup.open{

opacity:1;

visibility:visible;

transform:
translate(-50%,-50%)
scale(1);
}


/*
   Slim glass border
*/

.video-frame{

position:relative;

width:100%;

height:100%;

overflow:hidden;

border-radius:25px;

border:
1px solid rgba(255,255,255,.42);

background:#000;

box-shadow:
0 0 0 1px rgba(255,255,255,.08),
0 20px 60px rgba(0,0,0,.55);

backdrop-filter:
blur(14px);

-webkit-backdrop-filter:
blur(14px);
}


/*
   YouTube iframe
*/

.video-frame iframe{

position:absolute;

left:0;

top:0;

width:100%;

height:100%;

border:0;

pointer-events:none;

display:block;
}


/*
   Transparent shield.
   Video touch korleo YouTube control
   popup-er upor ashbe na.
*/

.video-touch-shield{

position:absolute;

inset:0;

z-index:5;

background:transparent;

pointer-events:auto;

touch-action:none;
}


/* =================================================
   DRAWER OVERLAY
   ================================================= */

.drawer-overlay{

position:fixed;

inset:0;

z-index:299;

background:transparent!important;

backdrop-filter:none!important;

-webkit-backdrop-filter:none!important;

pointer-events:none;

display:none;
}


.drawer-overlay.active{

display:block;

pointer-events:auto;
}


/* =================================================
   PLAYLIST DRAWER
   ================================================= */

.playlist-drawer{

position:fixed;

top:0;

right:-100%;

width:270px;

height:100dvh;

background:
rgba(20,20,20,.35)!important;

backdrop-filter:
blur(25px)
saturate(150%)!important;

-webkit-backdrop-filter:
blur(25px)
saturate(150%)!important;

border-left:
1px solid rgba(255,255,255,.15)!important;

z-index:300;

transition:
right .35s cubic-bezier(.2,.8,.2,1);

display:flex;

flex-direction:column;

padding:12px 6px;

box-shadow:
-10px 0 30px rgba(0,0,0,.3)!important;

visibility:hidden;

pointer-events:none;
}


.playlist-drawer.open{

right:0;

visibility:visible;

pointer-events:auto;
}


/* =================================================
   DRAWER HEADER
   ================================================= */

.drawer-header{

display:flex;

align-items:center;

justify-content:space-between;

padding:8px 10px;

border-bottom:
1px solid rgba(255,255,255,.15);

margin-bottom:8px;

background:
rgba(255,255,255,.10);

border-radius:10px;
}


.drawer-title{

font-size:12px;

font-weight:700;

color:#fff;
}


.close-btn{

background:transparent;

border:0;

color:rgba(255,255,255,.9);

font-size:20px;

cursor:pointer;

padding:0 2px;

line-height:1;
}


/* =================================================
   SONG LIST
   ================================================= */

.song-list{

flex:1;

overflow-y:auto;

display:flex;

flex-direction:column;

gap:4px;

padding-right:2px;
}


.song-list::-webkit-scrollbar{

width:2px;
}


.song-list::-webkit-scrollbar-thumb{

background:
rgba(255,255,255,.3);

border-radius:3px;
}


/* =================================================
   SONG ITEM
   ================================================= */

.song-item{

display:flex;

align-items:center;

gap:8px;

padding:6px;

border-radius:9px;

background:
rgba(255,255,255,.08);

border:
1px solid rgba(255,255,255,.1);

cursor:pointer;
}


.song-item:active{

transform:scale(.96);
}


.song-item:hover,
.song-item.active{

background:
rgba(255,255,255,.22);

border-color:
rgba(255,255,255,.35);
}


.song-item img{

width:34px;

height:34px;

border-radius:6px;

object-fit:cover;

flex-shrink:0;

box-shadow:
0 2px 5px rgba(0,0,0,.3);
}


.song-item-info{

flex:1;

min-width:0;
}


.song-item-title{

font-size:10px;

font-weight:700;

color:#fff;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

letter-spacing:.2px;
}


.song-item-artist{

font-size:8.5px;

font-weight:400;

color:rgba(255,255,255,.55);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-top:.5px;
}


/* =================================================
   MOBILE
   ================================================= */

@media(max-width:480px){

.app{

padding-bottom:60px;
}


.player{

height:116px;

padding:12px 14px;

border-radius:58px;

gap:8px;
}


.cover-wrapper{

width:78px;

height:78px;
}


.title{

font-size:15px;
}


.artist{

font-size:11px;
}


.play{

width:42px;

height:42px;
}


.video-btn{

width:40px;

height:40px;
}


.top-widgets{

top:10px;
}


.bd-time{

font-size:10px;

padding:4px 9px;
}


.playlist-toggle-btn{

font-size:10px;

padding:4px 9px;
}


.playlist-drawer{

width:270px;
}


.video-popup{

width:92vw;

border-radius:22px;
}


.video-frame{

border-radius:22px;
}

}

</style>

</head>

<body>


<!-- =================================================
     BACKGROUND
     ================================================= -->

<div
class="bg"
id="background"
></div>


<!-- =================================================
     TOP WIDGETS
     ================================================= -->

<div class="top-widgets">


<div class="bd-time">

<span>BD</span>

<span class="live-dot"></span>

<span id="bdTimeVal">
--:--:-- --
</span>

</div>


<button
class="playlist-toggle-btn"
onclick="toggleDrawer()"
>

<svg viewBox="0 0 24 24">

<path d="
M3 10h11v2H3zm0-4h11v2H3zm0 8h7v2H3zm13-1v8l6-4z
"/>

<span>Playlist</span>

</button>


</div>


<!-- =================================================

<div id="yt"></div>

     ================================================= -->

<div

id="videoPopup"
>

<div class="video-frame">

<!--
     Same YouTube iframe ekhanei move hobe.
     Tai audio/video alada player hobe na.

<div

></div>

</div>

</div>

></div>

>

"
>

</div>

</div>


<!-- =================================================

<div class="app">


<section

id="playerCard"
>


<!-- COVER -->

id="cover"

>

</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

/* =================================================
   PART 2 STARTS HERE
   ================================================= */


/* =========================
   PLAYLIST
   ========================= */

const PLAYLIST_ID="PLbvY05KVYwoo";

let player=null;

let playing=false;

let playlistItems=[];

let videoOpen=false;


/* =========================
   BD TIME
   ========================= */

function updateBDTime(){

const options={

timeZone:"Asia/Dhaka",

hour:"2-digit",

minute:"2-digit",

second:"2-digit",

hour12:true

};


document.getElementById("bdTimeVal").textContent=

new Intl.DateTimeFormat(
"en-US",
options
).format(new Date());

}


updateBDTime();

setInterval(
updateBDTime,
1000
);


/* =================================================
   YOUTUBE API
   ================================================= */

function onYouTubeIframeAPIReady(){

player=new YT.Player(
"yt",
{

width:"2",

height:"2",

playerVars:{

autoplay:0,

controls:0,

disablekb:1,

fs:0,

modestbranding:1,

playsinline:1,

rel:0,

iv_load_policy:3,

cc_load_policy:0,

listType:"playlist",

list:PLAYLIST_ID

},

events:{

onReady:ready,

onStateChange:state

}

});

}


/* =========================
   READY
   ========================= */

function ready(){

loadPlaylistItems();

setInterval(
updateProgress,
250
);

}


/* =================================================
   STATE
   ================================================= */

function state(e){

const cover=
document.getElementById("cover");

const playBtn=
document.getElementById("play");

const playIcon=
document.getElementById("play-icon");


highlightActiveTrack();


if(
e.data===YT.PlayerState.PLAYING
){

playing=true;

playBtn.classList.add("playing");

playIcon.innerHTML=
'<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

cover.classList.add("spinning");

updateInfo();

}


else if(

e.data===YT.PlayerState.PAUSED ||

e.data===YT.PlayerState.ENDED

){

playing=false;

playBtn.classList.remove("playing");

playIcon.innerHTML=
'<path d="M8 5v14l11-7z"/>';

cover.classList.remove("spinning");

}

}


/* =================================================
   PLAY / PAUSE
   ================================================= */

function togglePlay(){

if(!player)
return;


if(playing){

player.pauseVideo();

}

else{

player.playVideo();

}

}


/* =================================================
   VIDEO POPUP
   ================================================= */

function toggleVideo(){

if(!player)
return;


if(videoOpen){

closeVideo();

}

else{

openVideo();

}

}


/* =========================
   OPEN VIDEO
   ========================= */

function openVideo(){

if(

/* =================================================
   NEXT / PREVIOUS
   ================================================= */

function nextSong(){

if(
!player ||
playlistItems.length===0
)
return;


const current=
player.getPlaylistIndex();


const next=
(current+1)%
playlistItems.length;


forceUpdateUI(next);

player.nextVideo();

}


function previousSong(){

if(
!player ||
playlistItems.length===0
)
return;


const current=
player.getPlaylistIndex();


const previous=
(current-1+
playlistItems.length)%
playlistItems.length;


forceUpdateUI(previous);

player.previousVideo();

}


function forceUpdateUI(index){

)

playlistItems[index];

);

/* =================================================
   UNIVERSAL SWIPE
   ================================================= */

let swipeStartX=0;

let swipeStartY=0;

let swipeActive=false;

let swipeFromSeek=false;


const playerCard=
document.getElementById("playerCard");


const seekElement=
document.getElementById("seek");


/* POINTER DOWN */

playerCard.addEventListener(
"pointerdown",
e=>{

swipeStartX=e.clientX;

swipeStartY=e.clientY;


swipeFromSeek=
!!e.target.closest("#seek");


swipeActive=true;


if(swipeFromSeek){

e.stopPropagation();

}

});


/* POINTER MOVE */

playerCard.addEventListener(
"pointermove",
e=>{

if(!swipeActive)
return;


if(swipeFromSeek){

e.stopPropagation();

}

});


/* POINTER UP */

playerCard.addEventListener(
"pointerup",
e=>{

if(!swipeActive)
return;


const endX=e.clientX;

const endY=e.clientY;


const dx=
endX-swipeStartX;


const dy=
endY-swipeStartY;


if(swipeFromSeek){

swipeActive=false;

return;

}


if(
Math.abs(dx)<50
){

swipeActive=false;

return;

}


if(
Math.abs(dy)>
Math.abs(dx)
){

swipeActive=false;

return;

}


if(dx<-50){

nextSong();

}

else if(dx>50){

previousSong();

}


swipeActive=false;

});


/* CANCEL */

playerCard.addEventListener(
"pointercancel",
()=>{

swipeActive=false;

}
);


/* =================================================
   SEEK BAR
   ================================================= */

let isDragging=false;

let seekPointerId=null;


/* POSITION */

function getSeekPosition(clientX){

const rect=
seekElement.getBoundingClientRect();


if(!rect.width)
return 0;


return Math.max(
0,
Math.min(
1,
(clientX-rect.left)/
rect.width
)
);

}


/* VISUAL */

function updateSeekVisual(pos){

document.getElementById("fill")
.style.width=
(pos*100)+"%";


if(
player &&
typeof player.getDuration==="function"
){

const duration=
player.getDuration();


if(duration){

document.getElementById("current")
.textContent=
format(pos*duration);


document.getElementById("duration")
.textContent=
format(duration);

}

}

}


/* SEEK START */

seekElement.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

e.stopPropagation();


isDragging=true;

seekPointerId=e.pointerId;


try{

seekElement.setPointerCapture(
e.pointerId
);

}catch(err){}


const pos=
getSeekPosition(e.clientX);


updateSeekVisual(pos);

},
{
passive:false
}
);


/* SEEK MOVE */

seekElement.addEventListener(
"pointermove",
e=>{

if(!isDragging)
return;


e.preventDefault();

e.stopPropagation();


const pos=
getSeekPosition(e.clientX);


updateSeekVisual(pos);

},
{
passive:false
}
);


/* SEEK END */

seekElement.addEventListener(
"pointerup",
e=>{

if(!isDragging)
return;


e.preventDefault();

e.stopPropagation();


const pos=
getSeekPosition(e.clientX);


updateSeekVisual(pos);


if(
player &&
typeof player.getDuration==="function"
){

const duration=
player.getDuration();


if(duration){

player.seekTo(
pos*duration,
true
);

}

}


isDragging=false;

seekPointerId=null;


try{

seekElement.releasePointerCapture(
e.pointerId
);

}catch(err){}

},
{
passive:false
}
);


/* SEEK CANCEL */

seekElement.addEventListener(
"pointercancel",
e=>{

isDragging=false;

seekPointerId=null;

}
);


/* SEEK CLICK */

seekElement.addEventListener(
"click",
e=>{

if(isDragging)
return;


const pos=
getSeekPosition(e.clientX);


if(player){

const duration=
player.getDuration();


if(duration){

player.seekTo(
pos*duration,
true
);

}

}

});


/* =================================================
   PROGRESS
   ================================================= */

function updateProgress(){

if(isDragging)
return;


if(
!player ||
typeof player.getCurrentTime!=="function"
)
return;


try{

const current=
player.getCurrentTime();


const duration=
player.getDuration();


if(!duration)
return;


const pos=
Math.max(
0,
Math.min(
1,
current/duration
)
);


document.getElementById("fill")
.style.width=
(pos*100)+"%";


document.getElementById("current")
.textContent=
format(current);


document.getElementById("duration")
.textContent=
format(duration);


}catch(e){}

}


/* =================================================
   FORMAT
   ================================================= */

function format(s){

if(
!s ||
isNaN(s)
)
return "0:00";


s=Math.floor(s);


return Math.floor(s/60)
+
":"
+
String(
s%60
).padStart(2,"0");

}


/* =================================================
   PLAYLIST
   ================================================= */

function loadPlaylistItems(){

if(
!player ||
typeof player.getPlaylist!=="function"
)
return;


playlistItems=

id="artist-${index}"
>
YouTube Music
</div>

</div>

`;


list.appendChild(item);

);

});

/* =================================================
   DETAILS
   ================================================= */

function fetchSongDetails(
id,
index
){

fetch(
`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`
)

.then(
r=>r.json()
)

.then(
data=>{

return;

document.getElementById(
`title-${index}`
);


const artist=
document.getElementById(
`artist-${index}`
);


if(
title &&
data.title
){

data.title;

}


if(
artist &&
data.author_name
){

artist.textContent=
data.author_name;

}

})

.catch(
()=>{}
);

}


/* =================================================
   PLAY SPECIFIC
   ================================================= */

function playSpecificTrack(index){

if(!player)
return;


forceUpdateUI(index);


player.playVideoAt(index);


toggleDrawer();

}


/* =================================================
   ACTIVE TRACK
   ================================================= */

function highlightActiveTrack(){

if(
!player ||
typeof player.getPlaylistIndex!=="function"
)
return;


const current=
player.getPlaylistIndex();


document
.querySelectorAll(".song-item")
.forEach(
(item,index)=>{

item.classList.toggle(
"active",
index===current
);

});

}


/* =================================================
   SONG INFO
   ================================================= */

function updateInfo(){

if(
!player ||
typeof player.getVideoData!=="function"
)
return;


try{

const d=
player.getVideoData();


if(
!d ||
!d.video_id
)
return;


document.getElementById("cover").src=
`https://i.ytimg.com/vi/${d.video_id}/hqdefault.jpg`;


if(d.title){

document.getElementById("title")
.textContent=d.title;

}


if(d.author){

document.getElementById("artist")
.textContent=d.author;

}

}catch(e){}

}


/* =================================================
   DRAWER
   ================================================= */

function toggleDrawer(){

const drawer=
document.getElementById("drawer");


const overlay=
document.getElementById("overlay");


drawer.classList.toggle("open");

overlay.classList.toggle("active");

}

<script>

/* =========================================================
   PART 2 — PLAYER + PLAYLIST + VIDEO POPUP
   ========================================================= */

/* =========================
   GLOBAL
   ========================= */

const PLAYLIST_ID = "PLbvY05KVYwoo";

let player = null;
let videoPlayer = null;

let playing = false;
let videoOpen = false;

let playlistItems = [];

let isDragging = false;
let swipeStartX = 0;
let swipeStartY = 0;
let swipeActive = false;
let swipeFromSeek = false;

let volTimer = null;


/* =========================
   BD TIME
   ========================= */

function updateBDTime(){

    const options = {
        timeZone:"Asia/Dhaka",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:true
    };

    const el = document.getElementById("bdTimeVal");

    if(el){
        el.textContent =
            new Intl.DateTimeFormat(
                "en-US",
                options
            ).format(new Date());
    }
}

updateBDTime();

setInterval(updateBDTime,1000);


/* =========================================================
   YOUTUBE API
   ========================================================= */

function onYouTubeIframeAPIReady(){

    player = new YT.Player(
        "yt",
        {
            width:"2",
            height:"2",

            playerVars:{
                autoplay:0,
                controls:0,
                disablekb:1,
                fs:0,
                modestbranding:1,
                playsinline:1,
                rel:0,
                listType:"playlist",
                list:PLAYLIST_ID
            },

            events:{
                onReady:ready,
                onStateChange:state
            }
        }
    );
}


/* =========================
   READY
   ========================= */

function ready(){

    loadPlaylistItems();

    setInterval(updateProgress,250);

    /*
       Video player আলাদা করে এখানে তৈরি হবে না।
       Button চাপলে current song-এর জন্য তৈরি হবে।
    */
}


/* =========================================================
   PLAYER STATE
   ========================================================= */

function state(e){

    const cover =
        document.getElementById("cover");

    const playBtn =
        document.getElementById("play");

    const playIcon =
        document.getElementById("play-icon");


    highlightActiveTrack();


    if(e.data === YT.PlayerState.PLAYING){

        playing = true;

        if(playBtn)
            playBtn.classList.add("playing");


        if(playIcon){

            playIcon.innerHTML =
                '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        }


        if(cover)
            cover.classList.add("spinning");


        updateInfo();


        /*
           Video popup খোলা থাকলে
           audio-এর current time-এর সাথে video sync
        */
        if(videoOpen){
            syncVideoToAudio(false);
        }

    }

    else if(
        e.data === YT.PlayerState.PAUSED ||
        e.data === YT.PlayerState.ENDED
    ){

        playing = false;

        if(playBtn)
            playBtn.classList.remove("playing");


        if(playIcon){

            playIcon.innerHTML =
                '<path d="M8 5v14l11-7z"/>';
        }


        if(cover)
            cover.classList.remove("spinning");


        if(videoPlayer){

            try{
                videoPlayer.pauseVideo();
            }catch(err){}

        }
    }
}


/* =========================================================
   PLAY / PAUSE
   ========================================================= */

function togglePlay(){

    if(!player)
        return;


    if(playing){

        player.pauseVideo();

    }else{

        player.playVideo();

        /*
           Video open থাকলে video-ও চালু
        */
        if(videoOpen && videoPlayer){

            try{
                videoPlayer.playVideo();
            }catch(err){}

        }
    }
}


/* =========================================================
   VOLUME
   ========================================================= */

function resetVolTimer(){

    if(volTimer)
        clearTimeout(volTimer);


    volTimer =
        setTimeout(()=>{

            const wrapper =
                document.getElementById("volWrapper");

            if(wrapper)
                wrapper.classList.remove("active");

        },3000);
}


function toggleVolume(){

    const wrapper =
        document.getElementById("volWrapper");

    if(!wrapper)
        return;


    if(wrapper.classList.contains("active")){

        wrapper.classList.remove("active");

        if(volTimer)
            clearTimeout(volTimer);

    }else{

        wrapper.classList.add("active");

        resetVolTimer();

    }
}


function changeVolume(val){

    if(
        player &&
        typeof player.setVolume === "function"
    ){

        player.setVolume(Number(val));
    }

    resetVolTimer();
}


/* =========================================================
   NEXT / PREVIOUS
   ========================================================= */

function nextSong(){

    if(
        !player ||
        playlistItems.length === 0
    )
        return;


    const current =
        player.getPlaylistIndex();


    const next =
        (current + 1) %
        playlistItems.length;


    player.nextVideo();


    /*
       Video popup খোলা থাকলে
       next song-এর video load হবে
    */
    if(videoOpen){

        setTimeout(()=>{

            const id =
                playlistItems[next];

            if(id)
                loadVideoForTrack(id,true);

        },500);
    }
}


function previousSong(){

    if(
        !player ||
        playlistItems.length === 0
    )
        return;


    const current =
        player.getPlaylistIndex();


    const previous =
        (
            current - 1 +
            playlistItems.length
        ) %
        playlistItems.length;


    player.previousVideo();


    if(videoOpen){

        setTimeout(()=>{

            const id =
                playlistItems[previous];

            if(id)
                loadVideoForTrack(id,true);

        },500);
    }
}


/* =========================================================
   SWIPE
   ========================================================= */

const playerCard =
    document.getElementById("playerCard");

const seekElement =
    document.getElementById("seek");


if(playerCard){

    playerCard.addEventListener(
        "pointerdown",
        e=>{

            swipeStartX = e.clientX;
            swipeStartY = e.clientY;

            swipeFromSeek =
                !!e.target.closest("#seek");

            swipeActive = true;

        }
    );


    playerCard.addEventListener(
        "pointerup",
        e=>{

            if(!swipeActive)
                return;


            const dx =
                e.clientX - swipeStartX;

            const dy =
                e.clientY - swipeStartY;


            swipeActive = false;


            if(swipeFromSeek)
                return;


            if(Math.abs(dx) < 50)
                return;


            if(Math.abs(dy) > Math.abs(dx))
                return;


            if(dx < -50){

                nextSong();

            }else if(dx > 50){

                previousSong();

            }

        }
    );


    playerCard.addEventListener(
        "pointercancel",
        ()=>{
            swipeActive = false;
        }
    );
}


/* =========================================================
   SEEK
   ========================================================= */

function getSeekPosition(clientX){

    if(!seekElement)
        return 0;


    const rect =
        seekElement.getBoundingClientRect();


    if(!rect.width)
        return 0;


    return Math.max(
        0,
        Math.min(
            1,
            (clientX - rect.left) /
            rect.width
        )
    );
}


function updateSeekVisual(pos){

    const fill =
        document.getElementById("fill");

    if(fill){

        fill.style.width =
            (pos * 100) + "%";
    }


    if(
        player &&
        typeof player.getDuration === "function"
    ){

        const duration =
            player.getDuration();


        if(duration){

            const current =
                document.getElementById("current");

            const durationEl =
                document.getElementById("duration");


            if(current)
                current.textContent =
                    format(pos * duration);


            if(durationEl)
                durationEl.textContent =
                    format(duration);
        }
    }
}


if(seekElement){

    seekElement.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();
            e.stopPropagation();

            isDragging = true;

            const pos =
                getSeekPosition(e.clientX);

            updateSeekVisual(pos);

            try{
                seekElement.setPointerCapture(
                    e.pointerId
                );
            }catch(err){}

        },
        {passive:false}
    );


    seekElement.addEventListener(
        "pointermove",
        e=>{

            if(!isDragging)
                return;


            e.preventDefault();
            e.stopPropagation();


            const pos =
                getSeekPosition(e.clientX);


            updateSeekVisual(pos);

        },
        {passive:false}
    );


    seekElement.addEventListener(
        "pointerup",
        e=>{

            if(!isDragging)
                return;


            e.preventDefault();
            e.stopPropagation();


            const pos =
                getSeekPosition(e.clientX);


            updateSeekVisual(pos);


            if(
                player &&
                typeof player.getDuration === "function"
            ){

                const duration =
                    player.getDuration();


                if(duration){

                    player.seekTo(
                        pos * duration,
                        true
                    );


                    /*
                       Audio যেখানে গেল
                       video-ও সেখানে যাবে
                    */
                    if(videoOpen){
                        syncVideoToAudio(false);
                    }
                }
            }


            isDragging = false;


            try{
                seekElement.releasePointerCapture(
                    e.pointerId
                );
            }catch(err){}

        },
        {passive:false}
    );
}


/* =========================================================
   PROGRESS
   ========================================================= */

function updateProgress(){

    if(isDragging)
        return;


    if(
        !player ||
        typeof player.getCurrentTime !== "function"
    )
        return;


    try{

        const current =
            player.getCurrentTime();

        const duration =
            player.getDuration();


        if(!duration)
            return;


        const pos =
            Math.max(
                0,
                Math.min(
                    1,
                    current / duration
                )
            );


        const fill =
            document.getElementById("fill");


        if(fill){

            fill.style.width =
                (pos * 100) + "%";
        }


        const currentEl =
            document.getElementById("current");

        const durationEl =
            document.getElementById("duration");


        if(currentEl)
            currentEl.textContent =
                format(current);


        if(durationEl)
            durationEl.textContent =
                format(duration);


        /*
           Video এবং audio sync
        */
        if(
            videoOpen &&
            videoPlayer &&
            typeof videoPlayer.getCurrentTime === "function"
        ){

            const vt =
                videoPlayer.getCurrentTime();


            if(Math.abs(vt - current) > 0.7){

                try{

                    videoPlayer.seekTo(
                        current,
                        true
                    );

                }catch(err){}
            }
        }

    }catch(err){}
}


/* =========================================================
   FORMAT TIME
   ========================================================= */

function format(s){

    if(
        !s ||
        isNaN(s)
    )
        return "0:00";


    s = Math.floor(s);


    return (
        Math.floor(s / 60)
        +
        ":"
        +
        String(
            s % 60
        ).padStart(2,"0")
    );
}


/* =========================================================
   PLAYLIST
   ========================================================= */

function loadPlaylistItems(){

    if(
        !player ||
        typeof player.getPlaylist !== "function"
    )
        return;


    playlistItems =
        player.getPlaylist();


    const list =
        document.getElementById("songList");


    if(!list)
        return;


    if(
        !playlistItems ||
        playlistItems.length === 0
    ){

        list.innerHTML = `
            <div style="
                text-align:center;
                color:rgba(255,255,255,.7);
                font-size:10px;
                margin-top:15px;
            ">
                No tracks found
            </div>
        `;

        return;
    }


    list.innerHTML = "";


    playlistItems.forEach(
        (id,index)=>{

            const item =
                document.createElement("div");


            item.className =
                "song-item";


            item.id =
                `track-${index}`;


            item.onclick = ()=>{
                playSpecificTrack(index);
            };


            item.innerHTML = `

                <img
                    src="https://i.ytimg.com/vi/${id}/hqdefault.jpg"
                    alt="thumb"
                >

                <div class="song-item-info">

                    <div
                        class="song-item-title"
                        id="title-${index}"
                    >
                        Track #${index + 1}
                    </div>

                    <div
                        class="song-item-artist"
                        id="artist-${index}"
                    >
                        YouTube Music
                    </div>

                </div>
            `;


            list.appendChild(item);


            fetchSongDetails(
                id,
                index
            );

        }
    );


    highlightActiveTrack();

    updateInfo();
}


/* =========================================================
   SONG DETAILS
   ========================================================= */

function fetchSongDetails(
    id,
    index
){

    fetch(
        `https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`
    )
    .then(r=>r.json())
    .then(data=>{

        if(!data)
            return;


        const title =
            document.getElementById(
                `title-${index}`
            );


        const artist =
            document.getElementById(
                `artist-${index}`
            );


        if(
            title &&
            data.title
        ){

            title.textContent =
                data.title;
        }


        if(
            artist &&
            data.author_name
        ){

            artist.textContent =
                data.author_name;
        }

    })
    .catch(()=>{});
}


/* =========================================================
   PLAY SPECIFIC TRACK
   ========================================================= */

function playSpecificTrack(index){

    if(!player)
        return;


    player.playVideoAt(index);


    toggleDrawer();


    /*
       Video open থাকলে নতুন song-এর
       video একই position থেকে শুরু হবে
    */

    if(videoOpen){

        setTimeout(()=>{

            const id =
                playlistItems[index];

            if(id)
                loadVideoForTrack(
                    id,
                    true
                );

        },400);
    }
}


/* =========================================================
   ACTIVE TRACK
   ========================================================= */

function highlightActiveTrack(){

    if(
        !player ||
        typeof player.getPlaylistIndex !== "function"
    )
        return;


    const current =
        player.getPlaylistIndex();


    document
        .querySelectorAll(".song-item")
        .forEach(
            (item,index)=>{

                item.classList.toggle(
                    "active",
                    index === current
                );

            }
        );
}


/* =========================================================
   SONG INFO
   ========================================================= */

function updateInfo(){

    if(
        !player ||
        typeof player.getVideoData !== "function"
    )
        return;


    try{

        const d =
            player.getVideoData();


        if(
            !d ||
            !d.video_id
        )
            return;


        const cover =
            document.getElementById("cover");


        if(cover){

            cover.src =
                `https://i.ytimg.com/vi/${d.video_id}/hqdefault.jpg`;
        }


        const title =
            document.getElementById("title");


        const artist =
            document.getElementById("artist");


        if(
            title &&
            d.title
        ){

            title.textContent =
                d.title;
        }


        if(
            artist &&
            d.author
        ){

            artist.textContent =
                d.author;
        }


    }catch(err){}
}


/* =========================================================
   DRAWER
   ========================================================= */

function toggleDrawer(){

    const drawer =
        document.getElementById("drawer");


    const overlay =
        document.getElementById("overlay");


    if(!drawer)
        return;


    drawer.classList.toggle("open");


    if(overlay)
        overlay.classList.toggle("active");
}


/* =========================================================
   VIDEO POPUP
   =========================================================
   
   IMPORTANT:
   ভিডিও popup-এর ভিতরে কোনো custom control নেই।
   শুধু YouTube video থাকবে।
   
   Video button Part 1-এ:
   id="videoToggleBtn"
   
   থাকলে এই function কাজ করবে।
   ========================================================= */


/* VIDEO PLAYER CREATE */

function createVideoPlayer(videoId,startTime){

    const container =
        document.getElementById(
            "videoPlayer"
        );


    if(!container)
        return;


    container.innerHTML = "";


    const holder =
        document.createElement("div");


    holder.id =
        "ytVideoInner";


    holder.style.width =
        "100%";


    holder.style.height =
        "100%";


    container.appendChild(holder);


    videoPlayer =
        new YT.Player(
            "ytVideoInner",
            {

                width:"100%",
                height:"100%",

                videoId:videoId,

                playerVars:{

                    autoplay:1,

                    controls:0,

                    disablekb:1,

                    fs:0,

                    modestbranding:1,

                    playsinline:1,

                    rel:0,

                    iv_load_policy:3,

                    start:Math.max(
                        0,
                        Math.floor(startTime || 0)
                    )

                },

                events:{

                    onReady:function(){

                        try{

                            /*
                               Video-এর audio mute রাখা হচ্ছে,
                               কারণ main audio player-ই sound দেবে।
                            */

                            videoPlayer.mute();

                            videoPlayer.setVolume(0);

                            videoPlayer.playVideo();

                        }catch(err){}


                        /*
                           exact sync
                        */

                        setTimeout(
                            ()=>{
                                syncVideoToAudio(true);
                            },
                            150
                        );
                    },

                    onStateChange:function(e){

                        /*
                           Video নিজে pause হলে
                           আবার audio-এর সাথে sync করা হবে।
                        */

                        if(
                            e.data ===
                            YT.PlayerState.PLAYING
                        ){

                            setTimeout(
                                ()=>{
                                    syncVideoToAudio(false);
                                },
                                150
                            );
                        }
                    }
                }
            }
        );
}


/* =========================================================
   LOAD VIDEO
   ========================================================= */

function loadVideoForTrack(
    videoId,
    autoplay
){

    if(!videoId)
        return;


    const currentTime =
        player &&
        typeof player.getCurrentTime === "function"
            ? player.getCurrentTime()
            : 0;


    const container =
        document.getElementById(
            "videoPopup"
        );


    if(container)
        container.classList.add("show");


    document.body.classList.add(
        "video-open"
    );


    videoOpen = true;


    /*
       Existing player থাকলে নতুন player বানানো লাগবে না।
    */

    if(videoPlayer){

        try{

            videoPlayer.loadVideoById({
                videoId:videoId,
                startSeconds:Math.max(
                    0,
                    currentTime
                )
            });


            videoPlayer.mute();

            videoPlayer.setVolume(0);


            if(autoplay){

                videoPlayer.playVideo();

            }

        }catch(err){}

        return;
    }


    createVideoPlayer(
        videoId,
        currentTime
    );
}


/* =========================================================
   SYNC VIDEO → AUDIO
   ========================================================= */

function syncVideoToAudio(
    playAfter
){

    if(
        !videoOpen ||
        !player ||
        !videoPlayer
    )
        return;


    try{

        const audioTime =
            player.getCurrentTime();


        const videoTime =
            videoPlayer.getCurrentTime();


        /*
           0.5 second-এর বেশি difference হলে
           video correct position-এ যাবে।
        */

        if(
            Math.abs(
                videoTime - audioTime
            ) > 0.5
        ){

            videoPlayer.seekTo(
                audioTime,
                true
            );
        }


        /*
           Audio চলছে → video চলবে
        */

        if(
            playing ||
            playAfter
        ){

            videoPlayer.playVideo();

        }else{

            videoPlayer.pauseVideo();

        }

    }catch(err){}
}


/* =========================================================
   VIDEO TOGGLE
   ========================================================= */

function toggleVideo(){

    if(!player)
        return;


    /*
       Video already open
       → close
    */

    if(videoOpen){

        closeVideo();

        return;
    }


    let videoId = null;


    try{

        const data =
            player.getVideoData();


        if(
            data &&
            data.video_id
        ){

            videoId =
                data.video_id;
        }

    }catch(err){}


    if(!videoId)
        return;


    loadVideoForTrack(
        videoId,
        true
    );


    updateVideoButton();
}


/* =========================================================
   CLOSE VIDEO
   ========================================================= */

function closeVideo(){

    videoOpen = false;


    const popup =
        document.getElementById(
            "videoPopup"
        );


    if(popup)
        popup.classList.remove("show");


    document.body.classList.remove(
        "video-open"
    );


    if(videoPlayer){

        try{

            videoPlayer.pauseVideo();

        }catch(err){}

    }


    updateVideoButton();
}


/* =========================================================
   VIDEO BUTTON
   ========================================================= */

function updateVideoButton(){

    const btn =
        document.getElementById(
            "videoToggleBtn"
        );


    if(!btn)
        return;


    /*
       Button-এর ভিতরের icon + text
       শুধু button-এ থাকবে।
       Video popup-এর ভিতরে কিছু থাকবে না।
    */

    if(videoOpen){

        btn.classList.add("video-active");


        btn.innerHTML = `
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="
                    M18.3 5.71
                    12 12
                    5.7 18.3
                    4.29 16.89
                    10.59 10.59
                    4.29 4.29
                    5.7 2.88
                    12 9.18
                    18.3 2.88
                    19.71 4.29
                    13.41 10.59
                    19.71 16.89
                    18.3 18.3
                    12 12
                    18.3 5.71
                "/>
            </svg>
            <span>Video</span>
        `;

    }else{

        btn.classList.remove(
            "video-active"
        );


        btn.innerHTML = `
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="
                    M8 5v14l11-7z
                "/>
            </svg>
            <span>Video</span>
        `;
    }
}


/* =========================================================
   KEEP VIDEO SYNCED
   ========================================================= */

setInterval(()=>{

    if(
        !videoOpen ||
        !player ||
        !videoPlayer
    )
        return;


    try{

        const audioTime =
            player.getCurrentTime();


        const videoTime =
            videoPlayer.getCurrentTime();


        if(
            Math.abs(
                audioTime - videoTime
            ) > 0.7
        ){

            videoPlayer.seekTo(
                audioTime,
                true
            );
        }


        if(playing){

            const state =
                videoPlayer.getPlayerState();


            if(
                state !==
                YT.PlayerState.PLAYING
            ){

                videoPlayer.playVideo();
            }

        }

    }catch(err){}

},500);


/* =========================================================
   VIDEO BUTTON AUTO CONNECT
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    ()=>{

        const btn =
            document.getElementById(
                "videoToggleBtn"
            );


        if(btn){

            btn.addEventListener(
                "click",
                function(e){

                    e.preventDefault();
                    e.stopPropagation();

                    toggleVideo();

                }
            );


            updateVideoButton();
        }
    }
);


/* =========================================================
   PREVENT VIDEO POPUP TOUCH
   ========================================================= */

const videoPopup =
    document.getElementById(
        "videoPopup"
    );


if(videoPopup){

    /*
       Popup-এর video অংশ কোনো touch
       control হিসেবে কাজ করবে না।
       কোনো custom button নেই।
    */

    videoPopup.addEventListener(
        "click",
        e=>{
            e.stopPropagation();
        }
    );


    videoPopup.addEventListener(
        "touchstart",
        e=>{
            e.stopPropagation();
        },
        {passive:true}
    );
}


/* =========================================================
   CLOSE VIDEO WHEN TRACK CHANGES
   ========================================================= */

function refreshVideoAfterTrackChange(){

    if(
        !videoOpen ||
        !player
    )
        return;


    try{

        const data =
            player.getVideoData();


        if(
            data &&
            data.video_id
        ){

            loadVideoForTrack(
                data.video_id,
                true
            );
        }

    }catch(err){}
}


/* =========================================================
   SAFETY SYNC
   ========================================================= */

setInterval(()=>{

    if(
        !videoOpen ||
        !playing ||
        !videoPlayer ||
        !player
    )
        return;


    try{

        const a =
            player.getCurrentTime();


        const v =
            videoPlayer.getCurrentTime();


        if(Math.abs(a-v) > 0.5){

            videoPlayer.seekTo(
                a,
                true
            );
        }

    }catch(err){}

},1000);


/* =========================================================
   INITIAL VIDEO BUTTON STATE
   ========================================================= */

setTimeout(
    ()=>{
        updateVideoButton();
    },
    1000
);

</script>
