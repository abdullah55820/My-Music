<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Custom Web Music Player</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom styles for glassmorphism and mobile optimization */
        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .slider {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 9999px;
            height: 6px;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="relative flex items-center justify-center h-screen w-screen bg-black">

    <!-- Video Background -->
    <video autoplay muted loop playsinline class="absolute inset-0 w-full h-full object-cover z-0 opacity-60">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-background-1610-large.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Dark Overlay Gradient -->
    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-black/60 z-10"></div>

    <!-- Main Player Container -->
    <div class="relative z-20 w-full max-w-sm mx-4 p-6 rounded-3xl glass-card text-white shadow-2xl flex flex-col justify-between">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <button class="text-white/70 hover:text-white transition">
                <i class="fa-solid fa-chevron-down text-lg"></i>
            </button>
            <span class="text-xs uppercase tracking-widest font-semibold text-white/80">Now Playing</span>
            <button class="text-white/70 hover:text-white transition">
                <i class="fa-solid fa-ellipsis-vertical text-lg"></i>
            </button>
        </div>

        <!-- Album Art / Visualizer -->
        <div class="relative w-48 h-48 mx-auto mb-6 rounded-2xl overflow-hidden shadow-xl border border-white/20">
            <img id="album-art" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500&auto=format&fit=crop&q=60" alt="Album Art" class="w-full h-full object-cover">
        </div>

        <!-- Track Info -->
        <div class="text-center mb-6">
            <h2 id="track-title" class="text-xl font-bold truncate mb-1">Starlight Journey</h2>
            <p id="track-artist" class="text-sm text-white/60 truncate">Cosmic Dreamer</p>
        </div>

        <!-- Progress Bar -->
        <div class="mb-6">
            <input type="range" id="progress-bar" value="0" max="100" class="w-full slider cursor-pointer">
            <div class="flex justify-between text-xs text-white/60 mt-2">
                <span id="current-time">0:00</span>
                <span id="total-duration">3:45</span>
            </div>
        </div>

        <!-- Control Buttons -->
        <div class="flex items-center justify-between px-4 mb-4">
            <button id="shuffle-btn" class="text-white/60 hover:text-white text-lg transition">
                <i class="fa-solid fa-shuffle"></i>
            </button>
            <button id="prev-btn" class="text-white text-2xl hover:scale-110 transition">
                <i class="fa-solid fa-backward-step"></i>
            </button>
            <button id="play-pause-btn" class="w-16 h-16 bg-white text-black rounded-full flex items-center justify-center text-xl shadow-lg hover:scale-105 transition">
                <i id="play-icon" class="fa-solid fa-play ml-1"></i>
            </button>
            <button id="next-btn" class="text-white text-2xl hover:scale-110 transition">
                <i class="fa-solid fa-forward-step"></i>
            </button>
            <button id="loop-btn" class="text-white/60 hover:text-white text-lg transition">
                <i class="fa-solid fa-repeat"></i>
            </button>
        </div>

        <!-- Audio Element (Sample Track) -->
        <audio id="audio-element" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const audioElement = document.getElementById('audio-element');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playIcon = document.getElementById('play-icon');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');

        let isPlaying = false;

        // Play / Pause Toggle
        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) {
                audioElement.pause();
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
                playIcon.classList.add('ml-1');
            } else {
                audioElement.play();
                playIcon.classList.remove('fa-play');
                playIcon.classList.remove('ml-1');
                playIcon.classList.add('fa-pause');
            }
            isPlaying = !isPlaying;
        });

        // Update progress bar as audio plays
        audioElement.addEventListener('timeupdate', () => {
            if (audioElement.duration) {
                const progressPercent = (audioElement.currentTime / audioElement.duration) * 100;
                progressBar.value = progressPercent;
                currentTimeEl.textContent = formatTime(audioElement.currentTime);
            }
        });

        // Load duration when metadata is ready
        audioElement.addEventListener('loadedmetadata', () => {
            totalDurationEl.textContent = formatTime(audioElement.duration);
        });

        // Seek track using progress bar
        progressBar.addEventListener('input', () => {
            const seekTime = (progressBar.value / 100) * audioElement.duration;
            audioElement.currentTime = seekTime;
        });

        // Format seconds to mm:ss
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds < 10 ? '0' : ''}${remainingSeconds}`;
        }
    </script>
</body>
</html>
