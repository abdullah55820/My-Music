<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My Music</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{position:relative}

.bg{
  position:fixed;inset:-35px;
  background:#111 center/cover no-repeat;
  filter:blur(34px);
  transform:scale(1.12);
  transition:background-image .7s ease;
}
.bg:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.75));
}

#yt{
  position:fixed;width:2px;height:2px;left:-10px;bottom:-10px;opacity:.01;
  pointer-events:none;
}

.app{
  position:relative;z-index:2;height:100dvh;width:100%;
  display:flex;align-items:flex-end;justify-content:center;
  padding:0 14px 40px;
}

/* স্ক্রিনশটের মতো নিখুঁত ক্যাপসুল বার */
.player{
  width:min(520px,100%);
  height:92px;
  padding:12px 18px 12px 14px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:46px; /* Pill Shape */
  background:rgba(45, 30, 25, 0.65); /* কালচে ব্রাউনিশ ওয়ার্ম গ্লাস */
  box-shadow:0 20px 50px rgba(0,0,0,.6);
  backdrop-filter:blur(30px) saturate(140%);
  -webkit-backdrop-filter:blur(30px) saturate(140%);
  display:flex;
  align-items:center;
  gap:14px;
}

/* রেকর্ড ডিস্ক থাম্বনেইল */
.cover-wrapper{
  position:relative;
  width:66px;
  height:66px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.cover{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  background:#222;
  box-shadow:0 4px 15px rgba(0,0,0,.4);
  animation: spin 8s linear infinite;
  animation-play-state: paused;
}

/* মাঝখানের ভিনাইল রেকর্ড হোল */
.cover-wrapper::after {
  content: "";
  position: absolute;
  width: 14px;
  height: 14px;
  background: rgba(20, 20, 20, 0.85);
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
}

.cover.spinning {
  animation-play-state: running;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* টাইটেল, আর্টিস্ট, সিকবার ও টাইম */
.middle{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.title{
  font-size:16px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#fff;
  letter-spacing:-0.2px;
}

.artist{
  font-size:13px;
  color:rgba(255,255,255,.65);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:1px;
  margin-bottom:6px;
}

.seek{
  position:relative;
  width:100%;
  height:4px;
  border-radius:10px;
  background:rgba(255,255,255,.2);
  cursor:pointer;
  margin-bottom:6px;
}

.fill{
  position:absolute;
  left:0;top:0;
  height:100%;
  width:0;
  background:#fff;
  border-radius:10px;
}

.time-display{
  font-size:11px;
  color:rgba(255,255,255,.6);
  font-variant-numeric: tabular-nums;
  letter-spacing:0.3px;
}

/* বাটনসমূহ */
.controls{
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}

.btn{
  width:28px;height:28px;
  border:0;background:transparent;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:13px;
  opacity:.85;
  padding:0;
  cursor:pointer;
}

.play{
  width:48px;height:48px;
  border-radius:50%;
  border:0;
  background:#fff;
  color:#000;
  display:grid;
  place-items:center;
  font-size:16px;
  box-shadow:0 4px 15px rgba(0,0,0,.3);
  cursor:pointer;
}

.btn:active,.play:active{transform:scale(.92)}

@media(max-width:480px){
  .player{height:84px;padding:10px 14px;border-radius:42px;gap:10px}
  .cover-wrapper{width:58px;height:58px}
  .title{font-size:14px}
  .artist{font-size:12px}
  .play{width:42px;height:42px;font-size:14px}
  .btn{width:24px;height:24px;font-size:12px}
}
</style>
</head>
<body>

<div class="bg" id="bg"></div>
<div id="yt"></div>

<div class="app">
  <section class="player">
    <!-- স্পিনিং ভিনাইল থাম্বনেইল -->
    <div class="cover-wrapper">
      <img id="cover" class="cover" alt="Album art">
    </div>
    
    <!-- তথ্য ও সিকবার -->
    <div class="middle">
      <div id="title" class="title">Loading…</div>
      <div id="artist" class="artist">YouTube Playlist</div>
      <div class="seek" id="seek" onclick="seek(event)">
        <div class="fill" id="fill"></div>
      </div>
      <div class="time-display">
        <span id="current">0:00</span> / <span id="duration">0:00</span>
      </div>
    </div>

    <!-- বাটনসমূহ -->
    <div class="controls">
      <button class="btn" onclick="previousSong()" aria-label="Previous">◀❚</button>
      <button class="play" id="play" onclick="togglePlay()" aria-label="Play">▶</button>
      <button class="btn" onclick="nextSong()" aria-label="Next">❚▶</button>
    </div>
  </section>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const PLAYLIST_ID="PLQHkh385IaNU";
let player=null, playing=false;

function onYouTubeIframeAPIReady(){
  player=new YT.Player("yt",{
    width:"2",height:"2",
    playerVars:{
      autoplay:0,controls:0,disablekb:1,fs:0,
      modestbranding:1,playsinline:1,
      rel:0,listType:"playlist",list:PLAYLIST_ID
    },
    events:{onReady:ready,onStateChange:state}
  });
}

function ready(){
  setTimeout(updateInfo,700);
  setInterval(updateProgress,400);
}

function state(e){
  const cover = document.getElementById("cover");
  if(e.data===YT.PlayerState.PLAYING){
    playing=true;
    document.getElementById("play").textContent="❚❚";
    cover.classList.add("spinning");
    updateInfo();
  }else if(e.data===YT.PlayerState.PAUSED || e.data===YT.PlayerState.ENDED){
    playing=false;
    document.getElementById("play").textContent="▶";
    cover.classList.remove("spinning");
  }
}

function togglePlay(){
  if(!player)return;
  playing?player.pauseVideo():player.playVideo();
}
function nextSong(){
  if(!player)return;
  player.nextVideo();
}
function previousSong(){
  if(!player)return;
  player.previousVideo();
}
function updateInfo(){
  if(!player)return;
  try{
    const d=player.getVideoData();
    if(!d||!d.video_id)return;
    const id=d.video_id;
    const thumb="https://i.ytimg.com/vi/"+id+"/hqdefault.jpg";
    document.getElementById("cover").src=thumb;
    document.getElementById("bg").style.backgroundImage=
      'linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.60)),url("'+thumb+'")';
    document.getElementById("title").textContent=d.title||"Unknown";
    if(d.author) document.getElementById("artist").textContent=d.author;
  }catch(e){}
}
function updateProgress(){
  if(!player)return;
  try{
    const c=player.getCurrentTime(),d=player.getDuration();
    if(!d)return;
    const p=Math.max(0,Math.min(100,c/d*100));
    document.getElementById("fill").style.width=p+"%";
    document.getElementById("current").textContent=format(c);
    document.getElementById("duration").textContent=format(d);
    if(playing)updateInfo();
  }catch(e){}
}
function seek(e){
  if(!player)return;
  const r=document.getElementById("seek").getBoundingClientRect();
  const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  player.seekTo(p*player.getDuration(),true);
}
function format(s){
  if(!s||isNaN(s))return"0:00";
  s=Math.floor(s);
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}
</script>
</body>
</html>
