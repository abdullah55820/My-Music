<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: rgba(255, 255, 255, 0.05);
      --accent-color: #fa2d48; /* Apple Music Red */
      --text-main: #ffffff;
      --text-sub: #a1a1a6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 240px;
      background: rgba(20, 20, 20, 0.8);
      backdrop-filter: blur(20px);
      padding: 24px 16px;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      padding: 10px 14px;
      border-radius: 8px;
      color: var(--text-sub);
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }

    .nav-item.active, .nav-item:hover {
      background: var(--card-bg);
      color: var(--text-main);
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      padding: 24px 40px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .search-bar {
      display: flex;
      gap: 12px;
    }

    .search-bar input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--card-bg);
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .search-bar button {
      padding: 12px 24px;
      background: var(--accent-color);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .section-title {
      font-size: 22px;
      font-weight: 600;
    }

    /* Track Lists */
    .track-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .track-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-radius: 10px;
      background: var(--card-bg);
      cursor: pointer;
      transition: 0.2s;
    }

    .track-card:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .track-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .track-info img {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      object-fit: cover;
    }

    .track-details .title {
      font-size: 15px;
      font-weight: 600;
    }

    .track-details .artist {
      font-size: 13px;
      color: var(--text-sub);
    }

    /* Footer Player Bar (Apple Music Bottom Bar) */
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background: rgba(25, 25, 25, 0.95);
      backdrop-filter: blur(25px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      z-index: 100;
    }

    .current-track {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 30%;
    }

    .current-track img {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      object-fit: cover;
    }

    .player-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 40%;
    }

    .control-buttons {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .btn-ctrl {
      background: none;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    .btn-play {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Hidden YouTube Player */
    #yt-player-container {
      position: absolute;
      top: -9999px;
      left: -9999px;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="brand">🎵 Apple Music</div>
    <ul class="nav-menu">
      <li class="nav-item active">Listen Now</li>
      <li class="nav-item">Browse</li>
      <li class="nav-item">Radio</li>
      <li class="nav-item">Library</li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search songs or artists from YouTube...">
      <button onclick="searchMusic()">Search</button>
    </div>

    <h2 class="section-title">Results / Playlist</h2>
    <div class="track-list" id="trackList">
      <!-- Dynamic Track Cards will load here -->
    </div>
  </div>

  <!-- Bottom Player Bar -->
  <div class="player-bar">
    <div class="current-track">
      <img id="nowPlayingImg" src="https://via.placeholder.com/52" alt="Album Cover">
      <div class="track-details">
        <div class="title" id="nowPlayingTitle">Select a Song</div>
        <div class="artist" id="nowPlayingArtist">YouTube Stream</div>
      </div>
    </div>

    <div class="player-controls">
      <div class="control-buttons">
        <button class="btn-ctrl">⏮</button>
        <button class="btn-ctrl btn-play" id="playBtn" onclick="togglePlay()">▶</button>
        <button class="btn-ctrl">⏭</button>
      </div>
    </div>

    <div style="width: 30%;"></div>
  </div>

  <!-- Hidden YouTube Player IFrame -->
  <div id="yt-player-container">
    <div id="player"></div>
  </div>

  <script>
    // 1. Load YouTube Iframe API
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    var isPlaying = false;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '200',
        width: '200',
        videoId: '',
        playerVars: {
          'autoplay': 1,
          'controls': 0
        },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data == YT.PlayerState.PLAYING) {
        isPlaying = true;
        document.getElementById('playBtn').innerText = '⏸';
      } else {
        isPlaying = false;
        document.getElementById('playBtn').innerText = '▶';
      }
    }

    // Demo Data (You can connect YouTube Search API here)
    const demoSongs = [
      { id: "kJQP7kiw5Fk", title: "Despacito", artist: "Luis Fonsi", img: "https://img.youtube.com/vi/kJQP7kiw5Fk/hqdefault.jpg" },
      { id: "JGwWNGJdvx8", title: "Shape of You", artist: "Ed Sheeran", img: "https://img.youtube.com/vi/JGwWNGJdvx8/hqdefault.jpg" },
      { id: "OPf0YbXqDM0", title: "Uptown Funk", artist: "Mark Ronson", img: "https://img.youtube.com/vi/OPf0YbXqDM0/hqdefault.jpg" }
    ];

    // Render Initial List
    function renderTracks(songs) {
      const trackList = document.getElementById('trackList');
      trackList.innerHTML = '';
      songs.forEach(song => {
        const card = document.createElement('div');
        card.className = 'track-card';
        card.onclick = () => playSong(song.id, song.title, song.artist, song.img);
        card.innerHTML = `
          <div class="track-info">
            <img src="${song.img}" alt="Cover">
            <div class="track-details">
              <div class="title">${song.title}</div>
              <div class="artist">${song.artist}</div>
            </div>
          </div>
          <span style="color: var(--text-sub);">▶ Play</span>
        `;
        trackList.appendChild(card);
      });
    }

    function playSong(videoId, title, artist, img) {
      document.getElementById('nowPlayingTitle').innerText = title;
      document.getElementById('nowPlayingArtist').innerText = artist;
      document.getElementById('nowPlayingImg').src = img;
      
      if(player && player.loadVideoById) {
        player.loadVideoById(videoId);
      }
    }

    function togglePlay() {
      if(!player) return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    function searchMusic() {
      const query = document.getElementById('searchInput').value;
      if (!query) return;
      alert("YouTube Data API কী যুক্ত করলে সরাসরি " + query + "-এর গান ইউটিউব থেকে লাইভ চলে আসবে!");
    }

    // Initialize with demo items
    renderTracks(demoSongs);
  </script>
</body>
</html>
