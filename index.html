<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>My Music Player</title>

<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">

<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#050505;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

body{
position:relative;
}

/* =========================================================
BACKGROUND
========================================================= */

.bg{
position:fixed;
inset:-20px;

background-image:url("background.jpg");
background-position:center center;
background-size:cover;
background-repeat:no-repeat;

z-index:0;
pointer-events:none;
}

/* NO DARK OVERLAY — ORIGINAL BRIGHTNESS */

body.popup-active .bg{
filter:none;
transform:none;
}

/* =========================================================
TOP
========================================================= */

.top-widgets{
position:fixed;
top:16px;
left:50%;
transform:translateX(-50%);

z-index:5000;

display:flex;
flex-direction:column;
align-items:center;
gap:7px;
}

.bd-time,
.playlist-toggle-btn{
background:rgba(245,248,250,.72);

border:1px solid rgba(255,255,255,.8);

color:#7b1424;

box-shadow:
0 6px 15px rgba(0,0,0,.08),
inset 0 1px 2px rgba(255,255,255,.9);

backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);

border-radius:30px;
}

.bd-time{
padding:6px 13px;

font-size:11px;
font-weight:700;

display:flex;
align-items:center;
gap:6px;
}

.live-dot{
width:7px;
height:7px;

background:#9b1728;
border-radius:50%;

box-shadow:0 0 6px rgba(155,23,40,.5);
}

.playlist-toggle-btn{
padding:6px 13px;

font-size:11px;
font-weight:700;

display:flex;
align-items:center;
gap:6px;

border:0;

cursor:pointer;
}

.playlist-toggle-btn svg{
width:14px;
height:14px;
fill:#7b1424;
}

.playlist-toggle-btn:active{
transform:scale(.94);
}

/* =========================================================
MAIN APP
========================================================= */

.app{
position:relative;
z-index:100;

width:100%;
height:100dvh;

display:flex;
align-items:flex-start;
justify-content:center;

padding-top:136px;
}

/* =========================================================
MAIN CONTAINER
========================================================= */

.player-area{
width:min(680px,94vw);

display:flex;
flex-direction:column;
align-items:center;

gap:16px;
}

/* =========================================================
MUSIC ROUND BOARD
========================================================= */

.album-board{
width:min(430px,76vw);
aspect-ratio:1/1;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

background:rgba(232,238,242,.65);

border:1px solid rgba(255,255,255,.9);

box-shadow:
0 18px 35px rgba(0,0,0,.12),
inset 7px 7px 18px rgba(255,255,255,.85),
inset -7px -7px 18px rgba(150,160,170,.18);

backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);

position:relative;

flex-shrink:0;
}

/* inner circular area */

.album-inner{
position:absolute;
inset:6%;

border-radius:50%;

overflow:hidden;

background:#111;

border:2px solid rgba(255,255,255,.75);

box-shadow:
0 8px 20px rgba(0,0,0,.18),
inset 0 0 20px rgba(0,0,0,.2);

display:flex;
align-items:center;
justify-content:center;
}

/* =========================================================
COVER
========================================================= */

.cover{
width:145%;
height:145%;

max-width:none;

object-fit:cover;

border-radius:50%;

background:#111;

animation:spin 8s linear infinite;
animation-play-state:paused;

display:block;
}

.cover.spinning{
animation-play-state:running;
}

@keyframes spin{
from{
transform:rotate(0deg);
}
to{
transform:rotate(360deg);
}
}

/* =========================================================
VIDEO
========================================================= */

.video-holder{
position:absolute;
inset:0;

border-radius:50%;

overflow:hidden;

background:#000;

opacity:0;
visibility:hidden;

pointer-events:none;

z-index:20;

transition:
opacity .25s ease,
visibility .25s ease;
}

.video-holder.active{
opacity:1;
visibility:visible;
pointer-events:auto;
}

#yt{
position:absolute;

top:50%;
left:50%;

width:100%;
height:100%;

transform:translate(-50%,-50%);

border:0;

z-index:21;
}

#yt iframe{
width:100%!important;
height:100%!important;

border:0!important;
}

/* video button */

.video-floating{
position:absolute;

right:6%;
bottom:6%;

width:42px;
height:42px;

border-radius:50%;

border:1px solid rgba(255,255,255,.8);

background:rgba(238,242,244,.78);

color:#7b1424;

display:flex;
align-items:center;
justify-content:center;

z-index:40;

box-shadow:
0 8px 18px rgba(0,0,0,.12),
inset 3px 3px 7px rgba(255,255,255,.9),
inset -3px -3px 7px rgba(150,160,170,.2);

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);

cursor:pointer;

-webkit-tap-highlight-color:transparent;
}

.video-floating svg{
width:20px;
height:20px;

fill:#7b1424;
}

/* =========================================================
CONTROL BOARD
========================================================= */

.control-board{
width:min(620px,92vw);

padding:20px 22px 23px;

border-radius:34px;

background:rgba(232,238,242,.67);

border:1px solid rgba(255,255,255,.82);

box-shadow:
0 18px 35px rgba(0,0,0,.12),
inset 6px 6px 16px rgba(255,255,255,.75),
inset -6px -6px 16px rgba(150,160,170,.16);

backdrop-filter:blur(22px);
-webkit-backdrop-filter:blur(22px);

display:flex;
flex-direction:column;
align-items:center;

position:relative;
}

/* =========================================================
TITLE
========================================================= */

.song-title{
width:100%;

font-size:19px;
font-weight:750;

text-align:center;

color:#101010;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

letter-spacing:-.2px;
}

.song-artist{
width:100%;

margin-top:4px;

font-size:13px;

text-align:center;

color:rgba(50,50,50,.62);

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

/* =========================================================
TIME
========================================================= */

.time-main{
margin-top:5px;

font-size:19px;
font-weight:800;

color:#8c1728;

font-variant-numeric:tabular-nums;
}

/* =========================================================
SEEK
========================================================= */

.seek{
position:relative;

width:88%;
height:8px;

margin-top:12px;

border-radius:20px;

background:rgba(100,110,115,.20);

cursor:pointer;

touch-action:none;
}

.seek::before{
content:"";

position:absolute;

top:-12px;
bottom:-12px;

left:-8px;
right:-8px;
}

.fill{
position:absolute;

left:0;
top:0;

height:100%;
width:0;

border-radius:20px;

background:#8d1728;

pointer-events:none;
}

/* =========================================================
CONTROLS
========================================================= */

.controls{
width:100%;

margin-top:20px;

display:flex;
align-items:center;
justify-content:center;

gap:28px;
}

/* generic */

.btn,
.play{
border:0;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

-webkit-tap-highlight-color:transparent;

color:#8d1728;

background:rgba(231,237,240,.72);

box-shadow:
8px 8px 16px rgba(130,140,150,.20),
-7px -7px 15px rgba(255,255,255,.85);

}

.btn{
width:68px;
height:68px;

border-radius:50%;
}

.btn svg{
width:24px;
height:24px;

fill:#8d1728;
}

.play{
width:92px;
height:92px;

border-radius:50%;
}

.play svg{
width:35px;
height:35px;

fill:#8d1728;
}

.play.playing svg{
margin-left:0;
}

.btn:active,
.play:active{
transform:scale(.91);

box-shadow:
inset 4px 4px 10px rgba(130,140,150,.18),
inset -4px -4px 10px rgba(255,255,255,.7);
}

/* =========================================================
VOLUME
========================================================= */

.vol-container{
display:flex;
align-items:center;
}

.vol-container .btn{
width:52px;
height:52px;
}

.vol-slider-wrapper{
display:none;
}

/* =========================================================
DRAWER
========================================================= */

.drawer-overlay{
position:fixed;
inset:0;

z-index:9000;

display:none;

background:transparent;
}

.drawer-overlay.active{
display:block;
}

.playlist-drawer{
position:fixed;

top:0;
right:-300px;

width:270px;
height:100dvh;

z-index:9100;

padding:15px;

background:rgba(235,240,243,.88);

border-left:1px solid rgba(255,255,255,.8);

box-shadow:-15px 0 35px rgba(0,0,0,.15);

backdrop-filter:blur(30px);
-webkit-backdrop-filter:blur(30px);

transition:right .3s ease;
}

.playlist-drawer.open{
right:0;
}

.drawer-header{
display:flex;
align-items:center;
justify-content:space-between;

padding:8px 4px 12px;

border-bottom:1px solid rgba(100,100,100,.15);
}

.drawer-title{
font-size:14px;
font-weight:750;

color:#711524;
}

.close-btn{
border:0;
background:none;

font-size:24px;

color:#711524;
}

.song-list{
height:calc(100% - 55px);

overflow-y:auto;

display:flex;
flex-direction:column;

gap:8px;

padding-top:10px;
}

.song-item{
display:flex;
align-items:center;

gap:9px;

padding:8px;

border-radius:13px;

background:rgba(255,255,255,.4);

border:1px solid rgba(255,255,255,.7);

cursor:pointer;
}

.song-item.active{
background:rgba(141,23,40,.13);

border-color:rgba(141,23,40,.35);
}

.song-item img{
width:43px;
height:43px;

border-radius:9px;

object-fit:cover;
}

.song-item-info{
min-width:0;
flex:1;
}

.song-item-title{
font-size:11px;
font-weight:700;

color:#111;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.song-item-artist{
font-size:9px;

color:#777;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

margin-top:2px;
}

/* =========================================================
MOBILE
========================================================= */

@media(max-width:480px){

.app{
padding-top:136px;
}

.player-area{
width:100%;

gap:15px;
}

/* round board */

.album-board{
width:78vw;
max-width:360px;

box-shadow:
0 15px 30px rgba(0,0,0,.12),
inset 5px 5px 14px rgba(255,255,255,.85),
inset -5px -5px 14px rgba(150,160,170,.18);
}

.album-inner{
inset:5%;
}

/* controls board */

.control-board{
width:92vw;

padding:16px 13px 20px;

border-radius:30px;
}

.song-title{
font-size:16px;
font-weight:750;
}

.song-artist{
font-size:12px;
}

.time-main{
font-size:18px;
}

.seek{
width:88%;

height:7px;

margin-top:10px;
}

.controls{
gap:17px;

margin-top:17px;
}

.btn{
width:64px;
height:64px;
}

.btn svg{
width:22px;
height:22px;
}

.play{
width:82px;
height:82px;
}

.play svg{
width:32px;
height:32px;
}

.video-floating{
width:42px;
height:42px;

right:4%;
bottom:4%;
}

}

/* =========================================================
SMALL PHONES
========================================================= */

@media(max-width:380px){

.app{
padding-top:132px;
}

.album-board{
width:75vw;
}

.control-board{
padding:14px 10px 17px;
}

.song-title{
font-size:15px;
}

.controls{
gap:12px;
}

.btn{
width:57px;
height:57px;
}

.play{
width:74px;
height:74px;
}

.play svg{
width:29px;
height:29px;
}

.video-floating{
width:38px;
height:38px;
}

}

/* =========================================================
DESKTOP
========================================================= */

@media(min-width:769px){

.app{
padding-top:125px;
}

.player-area{
gap:18px;
}

.album-board{
width:400px;
}

.control-board{
width:600px;
}

}

/* =========================================================
NO DARKENING WHEN VIDEO ON
========================================================= */

body.popup-active .album-board{
box-shadow:
0 18px 35px rgba(0,0,0,.15),
inset 7px 7px 18px rgba(255,255,255,.8),
inset -7px -7px 18px rgba(150,160,170,.18);
}

</style>

<body>

--:--:-- --

>

"/>

APP

"/>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

const PLAYLIST_ID="PLbvY05KVYwoo";

let player=null;

let playing=false;

let playlistItems=[];
let sortedPlaylistItems=[];
let sortedPlaylistData=[];

let currentSortedIndex=0;

let sortingReady=false;

let isDragging=false;

let volTimer=null;


/* =========================================================
BD TIME
========================================================= */

function updateBDTime(){

const options={
timeZone:"Asia/Dhaka",
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:true
};

document.getElementById("bdTimeVal").textContent=
new Intl.DateTimeFormat(
"en-US",
options
).format(new Date());

}

updateBDTime();

setInterval(updateBDTime,1000);


/* =========================================================
YOUTUBE
========================================================= */

function onYouTubeIframeAPIReady(){

player=new YT.Player(
"yt",
{

width:"100%",
height:"100%",

playerVars:{
autoplay:0,
controls:1,
disablekb:0,
fs:0,
modestbranding:1,
playsinline:1,
rel:0,
iv_load_policy:3,
},

events:{
onReady:onReady,
onStateChange:onStateChange
}

});

}


/* =========================================================
READY
========================================================= */

function onReady(){

loadPlaylistItems();

setInterval(updateProgress,250);

}


/* =========================================================
STATE
========================================================= */

function onStateChange(e){

if(!player)
return;

const cover=document.getElementById("cover");

const playIcon=document.getElementById("play-icon");

if(e.data===YT.PlayerState.PLAYING){

playing=true;

playIcon.innerHTML=
'<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

cover.classList.add("spinning");

updateInfo();

highlightActiveTrack();

}

else if(e.data===YT.PlayerState.PAUSED){

playing=false;

playIcon.innerHTML=
'<path d="M8 5v14l11-7z"/>';

cover.classList.remove("spinning");

}

else if(e.data===YT.PlayerState.ENDED){

playing=false;

playIcon.innerHTML=
'<path d="M8 5v14l11-7z"/>';

cover.classList.remove("spinning");

/* automatic next */

setTimeout(()=>{

nextSong();

},80);

}

}


/* =========================================================
PLAY / PAUSE
========================================================= */

function togglePlay(){

if(!player)
return;

try{

if(playing){

player.pauseVideo();

}
else{

player.playVideo();

}

}
catch(e){}

}


/* =========================================================
VIDEO TOGGLE
========================================================= */

function toggleVideo(){

const holder=
document.getElementById("videoHolder");

const icon=
document.getElementById("videoIcon");

const opening=
!holder.classList.contains("active");

if(opening){

holder.classList.add("active");

document.body.classList.add("popup-active");

icon.innerHTML=
'<path d="M5 5l14 14M19 5L5 19"/>';

/*
Force iframe visible.
This prevents the black empty box problem.
*/

setTimeout(()=>{

if(player){

try{

const iframe=player.getIframe();

if(iframe){

iframe.style.display="block";
iframe.style.visibility="visible";
iframe.style.opacity="1";

}

}
catch(e){}

}

},50);

}
else{

holder.classList.remove("active");

document.body.classList.remove("popup-active");

icon.innerHTML=
'<path d="
M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10
c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z
"/>';

}

}


/* =========================================================
NEXT
========================================================= */

function nextSong(){

if(
!player ||
sortedPlaylistItems.length===0
)
return;

const currentId=
getCurrentVideoId();

let index=
sortedPlaylistItems.indexOf(currentId);

if(index===-1){

index=currentSortedIndex;

}

const nextIndex=
(index+1)%
sortedPlaylistItems.length;

currentSortedIndex=nextIndex;

playSpecificTrack(nextIndex);

}


/* =========================================================
PREVIOUS
========================================================= */

function previousSong(){

if(
!player ||
sortedPlaylistItems.length===0
)
return;

const currentId=
getCurrentVideoId();

let index=
sortedPlaylistItems.indexOf(currentId);

if(index===-1){

index=currentSortedIndex;

}

const previousIndex=
(index-1+
sortedPlaylistItems.length)%
sortedPlaylistItems.length;

currentSortedIndex=previousIndex;

playSpecificTrack(previousIndex);

}


/* =========================================================
CURRENT ID
========================================================= */

function getCurrentVideoId(){

try{

const data=player.getVideoData();

return data && data.video_id
?data.video_id
:"";

}
catch(e){

return "";

}

}


/* =========================================================
PLAY SPECIFIC
========================================================= */

function playSpecificTrack(index){

if(
!player ||
!sortedPlaylistData[index]
)
return;

const data=
sortedPlaylistData[index];

currentSortedIndex=index;


/*
Update UI BEFORE loading.
*/

forceUpdateUI(index);


/*
Direct load + play.
No changingTrack lock.
*/

try{

player.loadVideoById({
videoId:data.id,
startSeconds:0
});

setTimeout(()=>{

try{

player.playVideo();

}
catch(e){}

},80);

}
catch(e){}


/*
Close drawer.
*/

document
.getElementById("drawer")
.classList.remove("open");

document
.getElementById("overlay")
.classList.remove("active");

}


/* =========================================================
FORCE UI
========================================================= */

function forceUpdateUI(index){

const data=
sortedPlaylistData[index];

if(!data)
return;

document.getElementById("cover").src=
`https://i.ytimg.com/vi/${data.id}/hqdefault.jpg`;

document.getElementById("title").textContent=
data.title || "YouTube Music";

document.getElementById("artist").textContent=
data.artist || "YouTube Music";

document.getElementById("timeMain").textContent=
"0:00 / 0:00";

document.getElementById("fill").style.width="0%";

highlightActiveTrack();

}


/* =========================================================
LOAD PLAYLIST
========================================================= */

function loadPlaylistItems(){

if(
!player ||
typeof player.getPlaylist!=="function"
)
return;

const ids=player.getPlaylist();

if(
!ids ||
!ids.length
){

setTimeout(loadPlaylistItems,600);

return;

}

playlistItems=ids;

const requests=
playlistItems.map((id,index)=>{

return fetch(
`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`
)

.then(r=>r.json())

.then(data=>({

id:id,

title:
data && data.title
?data.title
:`Track ${index+1}`,

artist:
data && data.author_name
?data.author_name
:"YouTube Music",

originalIndex:index

}))

.catch(()=>({

id:id,

title:`Track ${index+1}`,

artist:"YouTube Music",

originalIndex:index

}));

});

Promise.all(requests)
.then(results=>{

results.sort((a,b)=>
a.title.localeCompare(
b.title,
undefined,
{
numeric:true,
sensitivity:"base"
}
)
);

sortedPlaylistData=results;

sortedPlaylistItems=
results.map(x=>x.id);

sortingReady=true;

const currentId=getCurrentVideoId();

const currentIndex=
sortedPlaylistItems.indexOf(currentId);

if(currentIndex!==-1){

currentSortedIndex=currentIndex;

}

renderMainPlaylist();

updateInfo();

});

}


/* =========================================================
MAIN PLAYLIST
========================================================= */

function renderMainPlaylist(){

const list=
document.getElementById("songList");

list.innerHTML="";

sortedPlaylistData.forEach((data,index)=>{

const item=
document.createElement("div");

item.className="song-item";

item.onclick=()=>{

playSpecificTrack(index);

};

item.innerHTML=`

<img
src="https://i.ytimg.com/vi/${data.id}/hqdefault.jpg"
>

<div class="song-item-info">

<div class="song-item-title">
${escapeHtml(data.title)}
</div>

<div class="song-item-artist">
${escapeHtml(data.artist)}
</div>

</div>

`;

list.appendChild(item);

});

highlightActiveTrack();

}


/* =========================================================
ACTIVE
========================================================= */

function highlightActiveTrack(){

const currentId=
getCurrentVideoId();

document
.querySelectorAll(".song-item")
.forEach((item,index)=>{

item.classList.toggle(
"active",
sortedPlaylistItems[index]===currentId
);

});

}


/* =========================================================
UPDATE INFO
========================================================= */

function updateInfo(){

if(
!player ||
typeof player.getVideoData!=="function"
)
return;

try{

const d=player.getVideoData();

if(
!d ||
!d.video_id
)
return;

document.getElementById("cover").src=
`https://i.ytimg.com/vi/${d.video_id}/hqdefault.jpg`;

if(d.title){

document.getElementById("title").textContent=
d.title;

}

if(d.author){

document.getElementById("artist").textContent=
d.author;

}

const index=
sortedPlaylistItems.indexOf(d.video_id);

if(index!==-1){

currentSortedIndex=index;

}

highlightActiveTrack();

}
catch(e){}

}


/* =========================================================
PROGRESS
========================================================= */

function updateProgress(){

if(isDragging)
return;

if(
!player ||
typeof player.getCurrentTime!=="function"
)
return;

try{

const current=
player.getCurrentTime();

const duration=
player.getDuration();

if(!duration)
return;

const pos=
Math.max(
0,
Math.min(
1,
current/duration
)
);

document.getElementById("fill").style.width=
(pos*100)+"%";

document.getElementById("timeMain").textContent=
`${format(current)} / ${format(duration)}`;

}
catch(e){}

}


/* =========================================================
FORMAT
========================================================= */

function format(s){

if(
!s ||
isNaN(s)
)
return "0:00";

s=Math.floor(s);

return Math.floor(s/60)+":"+
String(s%60).padStart(2,"0");

}


/* =========================================================
SEEK
========================================================= */

const seek=
document.getElementById("seek");

function seekPosition(x){

const rect=
seek.getBoundingClientRect();

return Math.max(
0,
Math.min(
1,
(x-rect.left)/rect.width
)
);

}

seek.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

isDragging=true;

try{
seek.setPointerCapture(e.pointerId);
}
catch(err){}

const pos=
seekPosition(e.clientX);

document.getElementById("fill").style.width=
(pos*100)+"%";

}
);

seek.addEventListener(
"pointermove",
e=>{

if(!isDragging)
return;

e.preventDefault();

const pos=
seekPosition(e.clientX);

document.getElementById("fill").style.width=
(pos*100)+"%";

}
);

seek.addEventListener(
"pointerup",
e=>{

if(!isDragging)
return;

const pos=
seekPosition(e.clientX);

if(player){

try{

const duration=
player.getDuration();

player.seekTo(
pos*duration,
true
);

}
catch(err){}

}

isDragging=false;

try{
seek.releasePointerCapture(e.pointerId);
}
catch(err){}

}
);


/* =========================================================
VOLUME
========================================================= */

function toggleVolume(){

if(!player)
return;

try{

const current=
player.isMuted();

if(current){

player.unMute();

}
else{

player.mute();

}

}
catch(e){}

}


/* =========================================================
DRAWER
========================================================= */

function toggleDrawer(){

const drawer=
document.getElementById("drawer");

const overlay=
document.getElementById("overlay");

const open=
!drawer.classList.contains("open");

drawer.classList.toggle("open",open);

overlay.classList.toggle("active",open);

if(
open &&
!sortingReady
){

loadPlaylistItems();

}

}


/* =========================================================
ESCAPE
========================================================= */

function escapeHtml(text){

if(!text)
return "";

const div=
document.createElement("div");

div.textContent=text;

return div.innerHTML;

}

</script>

</body>
</html>
