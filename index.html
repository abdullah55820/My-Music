<script>

const PLAYLIST_ID="PLbvY05KVYwoo";

let player=null;
let playing=false;

let playlistItems=[];

/*
=========================================================
IMPORTANT

playlistItems = YouTube-এর ORIGINAL order
sortedPlaylistItems = website-এর A-Z order

তাই UI A-Z হবে, কিন্তু click করলে সঠিক গানই বাজবে।
=========================================================
*/

let sortedPlaylistItems=[];

let playlistMeta=[];

let volTimer=null;

let isDragging=false;

let swipeStartX=0;
let swipeStartY=0;
let swipeActive=false;
let swipeFromSeek=false;

let playlistLoaded=false;


/* =========================================================
   ANDROID
========================================================= */

const isAndroidDevice=
/Android/i.test(navigator.userAgent);

if(isAndroidDevice){

document.body.classList.add(
"android-device"
);

}


/* =========================================================
   BD TIME
========================================================= */

function updateBDTime(){

const options={

timeZone:"Asia/Dhaka",

hour:"2-digit",

minute:"2-digit",

second:"2-digit",

hour12:true

};

document.getElementById(
"bdTimeVal"
).textContent=

new Intl.DateTimeFormat(
"en-US",
options
).format(new Date());

}

updateBDTime();

setInterval(
updateBDTime,
1000
);


/* =========================================================
   YOUTUBE API
========================================================= */

function onYouTubeIframeAPIReady(){

player=new YT.Player(
"yt",
{

width:"100%",
height:"100%",

playerVars:{

autoplay:0,

controls:1,

disablekb:0,

fs:1,

modestbranding:1,

playsinline:1,

rel:0,

iv_load_policy:3,

listType:"playlist",

list:PLAYLIST_ID

},

events:{

onReady:ready,

onStateChange:state

}

});

}


/* =========================================================
   READY
========================================================= */

function ready(){

loadPlaylistItems();

setInterval(
updateProgress,
250
);

}


/* =========================================================
   PLAYER STATE
========================================================= */

function state(e){

const cover=
document.getElementById("cover");

const playBtn=
document.getElementById("play");

const playIcon=
document.getElementById("play-icon");


highlightActiveTrack();

highlightVideoActiveTrack();


if(
e.data===YT.PlayerState.PLAYING
){

playing=true;

playBtn.classList.add(
"playing"
);

playIcon.innerHTML=
'<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

cover.classList.add(
"spinning"
);

updateInfo();

if(
playlistItems.length===0
){

loadPlaylistItems();

}

}

else if(

e.data===YT.PlayerState.PAUSED ||

e.data===YT.PlayerState.ENDED

){

playing=false;

playBtn.classList.remove(
"playing"
);

playIcon.innerHTML=
'<path d="M8 5v14l11-7z"/>';

cover.classList.remove(
"spinning"
);

}

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePlay(){

if(!player)return;

try{

if(playing){

player.pauseVideo();

}
else{

player.playVideo();

}

}
catch(e){}

}


/* =========================================================
   VIDEO POPUP
========================================================= */

function toggleVideoPopup(){

const popup=
document.getElementById(
"videoPopup"
);

const overlay=
document.getElementById(
"videoOverlay"
);

const videoPlaylist=
document.getElementById(
"videoPlaylist"
);

const iconSvg=
document.getElementById(
"videoToggleIcon"
);

const opening=
!popup.classList.contains(
"active"
);


if(opening){

popup.classList.add(
"active"
);

overlay.classList.add(
"active"
);

videoPlaylist.classList.add(
"active"
);

document.body.classList.add(
"popup-active"
);

iconSvg.innerHTML=
'<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>';


loadVideoPlaylist();

setTimeout(
adjustVideoPlaylistHeight,
50
);

}
else{

popup.classList.remove(
"active"
);

overlay.classList.remove(
"active"
);

videoPlaylist.classList.remove(
"active"
);

document.body.classList.remove(
"popup-active"
);

iconSvg.innerHTML=
'<path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55-.45 1-1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>';

}

}


/* =========================================================
   VIDEO PLAYLIST HEIGHT
========================================================= */

function adjustVideoPlaylistHeight(){

const popup=
document.getElementById(
"videoPopup"
);

const playlist=
document.getElementById(
"videoPlaylist"
);

const playerCard=
document.getElementById(
"playerCard"
);

if(
!popup ||
!playlist ||
!playerCard
)return;

if(
!popup.classList.contains("active")
)
return;


const popupRect=
popup.getBoundingClientRect();

const playerRect=
playerCard.getBoundingClientRect();


const top=
popupRect.bottom+1;

const bottom=
playerRect.top-20;

const available=
bottom-top;


if(available>70){

playlist.style.height=
available+"px";

playlist.style.maxHeight=
available+"px";

}
else{

playlist.style.height=
"80px";

playlist.style.maxHeight=
"80px";

}

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
"resize",
()=>{

handleDeviceOrientation();

setTimeout(
adjustVideoPlaylistHeight,
100
);

}
);


window.addEventListener(
"orientationchange",
()=>{

setTimeout(
handleDeviceOrientation,
150
);

setTimeout(
adjustVideoPlaylistHeight,
300
);

}
);


/* =========================================================
   ORIENTATION
========================================================= */

function handleDeviceOrientation(){

const isLandscape=
window.innerWidth>
window.innerHeight;


const popup=
document.getElementById(
"videoPopup"
);

const overlay=
document.getElementById(
"videoOverlay"
);

const videoPlaylist=
document.getElementById(
"videoPlaylist"
);

const iconSvg=
document.getElementById(
"videoToggleIcon"
);


if(isLandscape){

if(
popup &&
!popup.classList.contains(
"active"
)
){

popup.classList.add(
"active"
);

overlay.classList.add(
"active"
);

document.body.classList.add(
"popup-active"
);

}

if(videoPlaylist){

videoPlaylist.classList.remove(
"active"
);

}

document.body.classList.add(
"landscape-mode"
);


if(iconSvg){

iconSvg.innerHTML=
'<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>';

}

}
else{

document.body.classList.remove(
"landscape-mode"
);


if(
popup &&
popup.classList.contains(
"active"
)
){

videoPlaylist.classList.add(
"active"
);

setTimeout(
adjustVideoPlaylistHeight,
100
);

}

}

}


/* =========================================================
   VOLUME
========================================================= */

function resetVolTimer(){

if(volTimer){

clearTimeout(
volTimer
);

}

volTimer=setTimeout(
()=>{

document
.getElementById(
"volWrapper"
)
.classList.remove(
"active"
);

},
3000
);

}


function toggleVolume(){

const wrapper=
document.getElementById(
"volWrapper"
);

if(
wrapper.classList.contains(
"active"
)
){

wrapper.classList.remove(
"active"
);

if(volTimer){

clearTimeout(
volTimer
);

}

}
else{

wrapper.classList.add(
"active"
);

resetVolTimer();

}

}


function changeVolume(val){

if(
player &&
typeof player.setVolume===
"function"
){

player.setVolume(val);

}

resetVolTimer();

}


/* =========================================================
   NEXT
   এখন A-Z ORDER অনুসারে next হবে
========================================================= */

function nextSong(){

if(
!player ||
sortedPlaylistItems.length===0
)
return;


const currentOriginal=
player.getPlaylistIndex();


let sortedIndex=
sortedPlaylistItems.findIndex(
item=>
item.originalIndex===currentOriginal
);


if(sortedIndex<0){

sortedIndex=0;

}


const nextSorted=
(sortedIndex+1)%
sortedPlaylistItems.length;


const nextItem=
sortedPlaylistItems[nextSorted];


if(!nextItem)
return;


forceUpdateUI(
nextItem.originalIndex
);

player.playVideoAt(
nextItem.originalIndex
);

}


/* =========================================================
   PREVIOUS
   এখন A-Z ORDER অনুসারে previous হবে
========================================================= */

function previousSong(){

if(
!player ||
sortedPlaylistItems.length===0
)
return;


const currentOriginal=
player.getPlaylistIndex();


let sortedIndex=
sortedPlaylistItems.findIndex(
item=>
item.originalIndex===currentOriginal
);


if(sortedIndex<0){

sortedIndex=0;

}


const previousSorted=
(sortedIndex-1+
sortedPlaylistItems.length)%
sortedPlaylistItems.length;


const previousItem=
sortedPlaylistItems[previousSorted];


if(!previousItem)
return;


forceUpdateUI(
previousItem.originalIndex
);

player.playVideoAt(
previousItem.originalIndex
);

}


/* =========================================================
   FORCE UPDATE UI
========================================================= */

function forceUpdateUI(originalIndex){

const meta=
playlistMeta.find(
item=>
item.originalIndex===originalIndex
);

const id=
playlistItems[originalIndex];


if(!id)
return;


document.getElementById(
"cover"
).src=
`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;


if(meta){

document.getElementById(
"title"
).textContent=
meta.title ||
"Unknown Title";


document.getElementById(
"artist"
).textContent=
meta.author ||
"YouTube Music";

}
else{

document.getElementById(
"title"
).textContent=
"Loading...";

document.getElementById(
"artist"
).textContent=
"YouTube Music";

}


highlightActiveTrack();

highlightVideoActiveTrack();

}


/* =========================================================
   SWIPE
========================================================= */

const playerCard=
document.getElementById(
"playerCard"
);

const seekElement=
document.getElementById(
"seek"
);


playerCard.addEventListener(
"pointerdown",
e=>{

swipeStartX=
e.clientX;

swipeStartY=
e.clientY;

swipeFromSeek=
!!e.target.closest(
"#seek"
);

swipeActive=true;

}
);


playerCard.addEventListener(
"pointerup",
e=>{

if(!swipeActive)
return;


const endX=e.clientX;

const endY=e.clientY;


const dx=
endX-swipeStartX;

const dy=
endY-swipeStartY;


if(swipeFromSeek){

swipeActive=false;

return;

}


if(Math.abs(dx)<50){

swipeActive=false;

return;

}


if(
Math.abs(dy)>
Math.abs(dx)
){

swipeActive=false;

return;

}


if(dx<-50){

nextSong();

}
else if(dx>50){

previousSong();

}


swipeActive=false;

}
);


playerCard.addEventListener(
"pointercancel",
()=>{

swipeActive=false;

}
);


/* =========================================================
   SEEK
========================================================= */

function getSeekPosition(
clientX,
el
){

const rect=
el.getBoundingClientRect();


if(!rect.width)
return 0;


return Math.max(
0,
Math.min(
1,
(clientX-rect.left)/
rect.width
)
);

}


function updateSeekVisual(pos){

document.getElementById(
"fill"
).style.width=
(pos*100)+"%";


if(
player &&
typeof player.getDuration===
"function"
){

const duration=
player.getDuration();


if(duration){

document.getElementById(
"current"
).textContent=
format(
pos*duration
);

document.getElementById(
"duration"
).textContent=
format(
duration
);

}

}

}


seekElement.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

e.stopPropagation();

isDragging=true;


try{

seekElement.setPointerCapture(
e.pointerId
);

}
catch(err){}


updateSeekVisual(
getSeekPosition(
e.clientX,
seekElement
)
);

},
{
passive:false
}
);


seekElement.addEventListener(
"pointermove",
e=>{

if(!isDragging)
return;


e.preventDefault();

e.stopPropagation();


updateSeekVisual(
getSeekPosition(
e.clientX,
seekElement
)
);

},
{
passive:false
}
);


seekElement.addEventListener(
"pointerup",
e=>{

if(!isDragging)
return;


e.preventDefault();

e.stopPropagation();


const pos=
getSeekPosition(
e.clientX,
seekElement
);


updateSeekVisual(pos);


if(
player &&
typeof player.getDuration===
"function"
){

const duration=
player.getDuration();


if(duration){

player.seekTo(
pos*duration,
true
);

}

}


isDragging=false;


try{

seekElement.releasePointerCapture(
e.pointerId
);

}
catch(err){}

},
{
passive:false
}
);


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(){

if(isDragging)
return;


if(
!player ||
typeof player.getCurrentTime!==
"function"
)
return;


try{

const current=
player.getCurrentTime();

const duration=
player.getDuration();


if(!duration)
return;


const pos=
Math.max(
0,
Math.min(
1,
current/duration
)
);


document.getElementById(
"fill"
).style.width=
(pos*100)+"%";


document.getElementById(
"current"
).textContent=
format(current);


document.getElementById(
"duration"
).textContent=
format(duration);

}
catch(e){}

}


/* =========================================================
   FORMAT
========================================================= */

function format(s){

if(
!s ||
isNaN(s)
){

return "0:00";

}


s=Math.floor(s);


return Math.floor(s/60)+":"+
String(
s%60
).padStart(
2,"0"
);

}


/* =========================================================
   GET SONG DETAILS
========================================================= */

function getSongDetails(id){

return fetch(
`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`
)

.then(
r=>{

if(!r.ok)
throw new Error("Metadata error");

return r.json();

}
)

.then(
data=>{

return{

title:
data && data.title
?
data.title.trim()
:
"Unknown Title",

author:
data && data.author_name
?
data.author_name.trim()
:
"YouTube Music"

};

}
)

.catch(
()=>{

return{

title:"Unknown Title",

author:"YouTube Music"

};

}
);

}


/* =========================================================
   A-Z SORT KEY
========================================================= */

function getSortTitle(title){

return String(
title || ""
)

.trim()

.toLocaleLowerCase(
"en"
)

.replace(
/^[^a-z0-9]+/i,
""
);

}


/* =========================================================
   LOAD PLAYLIST
========================================================= */

async function loadPlaylistItems(){

if(
!player ||
typeof player.getPlaylist!==
"function"
)
return;


let ids=[];

try{

ids=
player.getPlaylist() || [];

}
catch(e){

setTimeout(
loadPlaylistItems,
600
);

return;

}


if(
!ids ||
ids.length===0
){

setTimeout(
loadPlaylistItems,
600
);

return;

}


/*
Prevent unnecessary reload
*/

if(
playlistLoaded &&
playlistItems.length===
ids.length
){

return;

}


playlistItems=
ids.slice();


playlistMeta=[];

playlistLoaded=false;


/* =========================================================
   CREATE METADATA REQUESTS
========================================================= */

const requests=
playlistItems.map(
(id,index)=>{

return getSongDetails(id)

.then(
data=>({

id:id,

originalIndex:index,

title:data.title,

author:data.author

})
);

}
);


/*
Wait until all titles are available.
Then sort A-Z.
*/

const results=
await Promise.all(requests);


/* =========================================================
   SAVE ORIGINAL METADATA
========================================================= */

playlistMeta=
results.slice();


/* =========================================================
   SORT A-Z
========================================================= */

sortedPlaylistItems=
results
.slice()
.sort(
(a,b)=>{

const titleA=
getSortTitle(a.title);

const titleB=
getSortTitle(b.title);


/*
Alphabetical A-Z.
If same title, original playlist position
is used as tie breaker.
*/

const result=
titleA.localeCompare(
titleB,
"en",
{
numeric:true,
sensitivity:"base"
}
);

if(result!==0){

return result;

}

return(
a.originalIndex-
b.originalIndex
);

}
);


playlistLoaded=true;


/* =========================================================
   RENDER BOTH PLAYLISTS
========================================================= */

renderSortedPlaylist();


/* =========================================================
   UPDATE CURRENT SONG
========================================================= */

updateInfo();

highlightActiveTrack();

highlightVideoActiveTrack();

}


/* =========================================================
   RENDER SORTED PLAYLIST
========================================================= */

function renderSortedPlaylist(){

renderOldDrawer();

renderVideoPlaylist();

}


/* =========================================================
   OLD DRAWER
========================================================= */

function renderOldDrawer(){

const list=
document.getElementById(
"songList"
);


if(!list)
return;


if(
sortedPlaylistItems.length===0
){

list.innerHTML=`

<div style="
text-align:center;
color:rgba(255,255,255,.7);
font-size:10px;
margin-top:15px;
">
Loading...
</div>

`;

return;

}


list.innerHTML="";


sortedPlaylistItems.forEach(
(item,sortedIndex)=>{

const div=
document.createElement(
"div"
);


div.className=
"song-item";


div.dataset.originalIndex=
item.originalIndex;


div.onclick=
()=>{

playSpecificTrack(
sortedIndex
);

};


div.innerHTML=`

<img
src="https://i.ytimg.com/vi/${item.id}/hqdefault.jpg"
alt="thumb"
>

<div class="song-item-info">

<div
class="song-item-title"
>
${escapeHTML(item.title)}
</div>

<div
class="song-item-artist"
>
${escapeHTML(item.author)}
</div>

</div>

`;


list.appendChild(div);

});


highlightActiveTrack();

}


/* =========================================================
   VIDEO PLAYLIST
========================================================= */

function renderVideoPlaylist(){

const list=
document.getElementById(
"videoSongList"
);


if(!list)
return;


if(
sortedPlaylistItems.length===0
){

list.innerHTML=`

<div style="
text-align:center;
color:rgba(255,255,255,.7);
font-size:9px;
padding:10px;
">
Loading...
</div>

`;

return;

}


list.innerHTML="";


sortedPlaylistItems.forEach(
(item,sortedIndex)=>{

const div=
document.createElement(
"div"
);


div.className=
"video-song-item";


div.dataset.originalIndex=
item.originalIndex;


div.addEventListener(
"click",
function(e){

e.preventDefault();

e.stopPropagation();

playSpecificTrack(
sortedIndex
);

},
{
passive:false
}
);


div.innerHTML=`

<img
src="https://i.ytimg.com/vi/${item.id}/hqdefault.jpg"
alt="thumb"
draggable="false"
>

<div class="video-song-info">

<div
class="video-song-title"
>
${escapeHTML(item.title)}
</div>

<div
class="video-song-artist"
>
${escapeHTML(item.author)}
</div>

</div>

`;


list.appendChild(div);

});


highlightVideoActiveTrack();

setTimeout(
adjustVideoPlaylistHeight,
50
);

}


/* =========================================================
   ESCAPE HTML
   Title/artist যেন HTML ভেঙে না দেয়
========================================================= */

function escapeHTML(value){

return String(
value || ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =========================================================
   PLAY SPECIFIC SORTED TRACK
========================================================= */

function playSpecificTrack(
sortedIndex
){

if(!player)
return;


const item=
sortedPlaylistItems[
sortedIndex
];


if(!item)
return;


const originalIndex=
item.originalIndex;


/*
Update UI using ORIGINAL YouTube index
*/

forceUpdateUI(
originalIndex
);


try{

/*
YouTube player keeps its own original playlist.
So we use the original index here.
*/

player.playVideoAt(
originalIndex
);

}
catch(e){

return;

}


/* =========================================================
   OLD DRAWER CLOSE
========================================================= */

const drawer=
document.getElementById(
"drawer"
);

const drawerOverlay=
document.getElementById(
"overlay"
);


drawer.classList.remove(
"open"
);

drawerOverlay.classList.remove(
"active"
);


/* =========================================================
   VIDEO PLAYLIST STAYS OPEN
========================================================= */

const popup=
document.getElementById(
"videoPopup"
);


if(
popup.classList.contains(
"active"
)
){

document
.getElementById(
"videoPlaylist"
)
.classList.add(
"active"
);

setTimeout(
adjustVideoPlaylistHeight,
80
);

}


highlightActiveTrack();

highlightVideoActiveTrack();

}


/* =========================================================
   OLD DRAWER ACTIVE
========================================================= */

function highlightActiveTrack(){

if(
!player ||
typeof player.getPlaylistIndex!==
"function"
)
return;


const current=
player.getPlaylistIndex();


document
.querySelectorAll(
".song-item"
)
.forEach(
item=>{

const originalIndex=
Number(
item.dataset.originalIndex
);


item.classList.toggle(
"active",
originalIndex===current
);

});

}


/* =========================================================
   VIDEO ACTIVE SONG
========================================================= */

function highlightVideoActiveTrack(){

if(
!player ||
typeof player.getPlaylistIndex!==
"function"
)
return;


const current=
player.getPlaylistIndex();


document
.querySelectorAll(
".video-song-item"
)
.forEach(
item=>{

const originalIndex=
Number(
item.dataset.originalIndex
);


item.classList.toggle(
"active",
originalIndex===current
);

});

}


/* =========================================================
   UPDATE MAIN INFO
========================================================= */

function updateInfo(){

if(
!player ||
typeof player.getVideoData!==
"function"
)
return;


try{

const d=
player.getVideoData();


if(
!d ||
!d.video_id
)
return;


document.getElementById(
"cover"
).src=
`https://i.ytimg.com/vi/${d.video_id}/hqdefault.jpg`;


if(d.title){

document.getElementById(
"title"
).textContent=
d.title;

}


if(d.author){

document.getElementById(
"artist"
).textContent=
d.author;

}


highlightActiveTrack();

highlightVideoActiveTrack();

}
catch(e){}

}


/* =========================================================
   OLD DRAWER
========================================================= */

function toggleDrawer(){

const popup=
document.getElementById(
"videoPopup"
);


if(
popup &&
popup.classList.contains(
"active"
)
){

return;

}


const drawer=
document.getElementById(
"drawer"
);

const overlay=
document.getElementById(
"overlay"
);


const opening=
!drawer.classList.contains(
"open"
);


drawer.classList.toggle(
"open",
opening
);

overlay.classList.toggle(
"active",
opening
);


if(
opening &&
playlistItems.length===0
){

loadPlaylistItems();

}

}


/* =========================================================
