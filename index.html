<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shanti Music</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    html, body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000;
    }
    
    /* ব্যাকগ্রাউন্ড ব্লার পিকচার */
    .blur-bg {
      position: fixed;
      top: -20px;
      left: -20px;
      width: calc(100% + 40px);
      height: calc(100% + 40px);
      background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      filter: blur(10px);
      -webkit-filter: blur(10px);
      z-index: -1;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 50px;
    }
    
    /* সুন্দর গ্লাস মিউজিক কার্ড */
    .player-card {
      width: 90%;
      max-width: 360px;
      height: 200px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 24px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #player {
      width: 100%;
      height: 100%;
      border-radius: 16px;
    }
  </style>
</head>
<body>

  <!-- ব্লার ব্যাকগ্রাউন্ড -->
  <div class="blur-bg"></div>

  <!-- মিউজিক প্লেয়ার -->
  <div class="player-card">
    <div id="player"></div>
  </div>

  <!-- ইউটিউব আইফ্রেম এপিআই -->
  <script>
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        playerVars: {
          'listType': 'playlist',
          'list': 'PLbvY05KVYwoo',
          'controls': 1,
          'autoplay': 0,
          'modestbranding': 1,
          'rel': 0,
          'playsinline': 1
        }
      });
    }
  </script>
</body>
</html>
