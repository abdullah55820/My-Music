<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>My Music Player</title>

<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#050505;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

body{
position:relative;
overflow-x:hidden!important;
}

/* BACKGROUND */

.bg{
position:fixed;
inset:0;
background-image:url("background.jpg");
background-position:center center;
background-size:cover;
background-repeat:no-repeat;
z-index:0;
}

.bg:after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,.15);
}

/* TOP */

.top-widgets{
position:fixed;
top:10px;
left:50%;
transform:translateX(-50%);
z-index:10;
display:flex;
flex-direction:column;
align-items:center;
gap:8px;
}

.bd-time{
padding:5px 11px;
border-radius:20px;
background:rgba(0,0,0,.45);
border:1px solid rgba(255,255,255,.18);
color:rgba(255,255,255,.9);
font-size:11px;
font-weight:600;
letter-spacing:.3px;
backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
display:flex;
align-items:center;
gap:6px;
}

.live-dot{
width:7px;
height:7px;
background:#ff3b30;
border-radius:50%;
display:inline-block;
box-shadow:0 0 8px #ff3b30;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%{opacity:1;transform:scale(1)}
50%{opacity:.3;transform:scale(.8)}
100%{opacity:1;transform:scale(1)}
}

.playlist-toggle-btn{
padding:5px 12px;
border-radius:20px;
background:rgba(0,0,0,.45);
border:1px solid rgba(255,255,255,.18);
color:rgba(255,255,255,.9);
font-size:11px;
font-weight:600;
backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
display:flex;
align-items:center;
gap:6px;
cursor:pointer;
}

.playlist-toggle-btn:active{
transform:scale(.95);
}

.playlist-toggle-btn svg{
width:14px;
height:14px;
fill:#fff;
}

/* APP */

.app{
position:relative;
z-index:2;
height:100dvh;
width:100%;
display:flex;
align-items:flex-end;
justify-content:center;
padding:0 16px 60px;
}

/* PLAYER */

.player{
width:min(400px,92%);
height:116px;
padding:14px 16px;
border:1px solid rgba(255,255,255,.18);
border-radius:58px;
background:rgba(55,30,25,.75);
box-shadow:0 20px 50px rgba(0,0,0,.6);
backdrop-filter:blur(30px) saturate(140%);
-webkit-backdrop-filter:blur(30px) saturate(140%);
display:flex;
align-items:center;
gap:12px;
}

/* COVER */

.cover-wrapper{
position:relative;
width:82px;
height:82px;
flex-shrink:0;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
overflow:hidden;
border:1px solid rgba(255,255,255,.3);
}

.cover{
width:137%;
height:137%;
margin:-18.5%;
border-radius:50%;
object-fit:cover;
object-position:center;
background:#222;
animation:spin 8s linear infinite;
animation-play-state:paused;
}

.cover.spinning{
animation-play-state:running;
}

@keyframes spin{
from{transform:rotate(0deg)}
to{transform:rotate(360deg)}
}

.cover-wrapper:after{
content:"";
position:absolute;
width:16px;
height:16px;
background:rgba(20,20,20,.85);
border:2px solid rgba(255,255,255,.3);
border-radius:50%;
left:50%;
top:50%;
transform:translate(-50%,-50%);
z-index:2;
}

/* INFO */

.middle{
flex:1;
min-width:0;
display:flex;
flex-direction:column;
justify-content:center;
}

.title{
font-size:15px;
font-weight:700;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
color:#fff;
}

.artist{
font-size:12.5px;
color:rgba(255,255,255,.65);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-top:2px;
margin-bottom:8px;
}

/* SEEK */

.seek{
position:relative;
width:100%;
height:4px;
border-radius:10px;
background:rgba(255,255,255,.2);
cursor:pointer;
margin-bottom:6px;
}

.fill{
position:absolute;
left:0;
top:0;
height:100%;
width:0;
background:#fff;
border-radius:10px;
}

.time-display{
font-size:12px;
color:rgba(255,255,255,.65);
font-variant-numeric:tabular-nums;
}

/* CONTROLS */

.controls{
display:flex;
align-items:center;
gap:10px;
flex-shrink:0;
}

.btn{
width:26px;
height:26px;
border:0;
background:transparent;
color:rgba(255,255,255,.9);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
padding:0;
}

.btn svg{
width:22px;
height:22px;
fill:#fff;
}

.play{
width:48px;
height:48px;
border-radius:50%;
border:0;
background:#fff;
color:#000;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 4px 15px rgba(0,0,0,.3);
cursor:pointer;
}

.play svg{
width:22px;
height:22px;
fill:#000;
}

.btn:active,
.play:active{
transform:scale(.90);
}

/* OVERLAY */

.drawer-overlay{
position:fixed;
inset:0;
z-index:99;
background:transparent;
pointer-events:none;
display:none;
}

.drawer-overlay.active{
display:block;
pointer-events:auto;
}

/* PLAYLIST */

.playlist-drawer{
position:fixed;
top:0;
right:-100%;
width:170px;
height:100dvh;

background:rgba(20,20,20,.35);

backdrop-filter:blur(25px) saturate(150%);
-webkit-backdrop-filter:blur(25px) saturate(150%);

border-left:1px solid rgba(255,255,255,.15);

z-index:100;

transition:right .35s cubic-bezier(.2,.8,.2,1);

display:flex;
flex-direction:column;

padding:12px 6px;

box-shadow:-10px 0 30px rgba(0,0,0,.3);

visibility:hidden;
pointer-events:none;
}

.playlist-drawer.open{
right:0;
visibility:visible;
pointer-events:auto;
}

/* HEADER */

.drawer-header{
display:flex;
align-items:center;
justify-content:space-between;
padding:6px 8px;
border-bottom:1px solid rgba(255,255,255,.15);
margin-bottom:8px;
background:rgba(255,255,255,.1);
border-radius:8px;
}

.drawer-title{
font-size:11px;
font-weight:700;
color:#fff;
}

.close-btn{
background:transparent;
border:0;
color:rgba(255,255,255,.9);
font-size:16px;
cursor:pointer;
padding:0 2px;
line-height:1;
}

/* SONG LIST */

.song-list{
flex:1;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:4px;
padding-right:2px;
}

.song-list::-webkit-scrollbar{
width:2px;
}

.song-list::-webkit-scrollbar-thumb{
background:rgba(255,255,255,.3);
border-radius:3px;
}

/* SONG CARD */

.song-item{
display:flex;
align-items:center;
gap:6px;
padding:4px 5px;
border-radius:7px;

background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.1);

cursor:pointer;

transition:background .2s,border-color .2s,transform .1s;
}

.song-item:active{
transform:scale(.96);
}

.song-item:hover,
.song-item.active{
background:rgba(255,255,255,.22);
border-color:rgba(255,255,255,.35);
}

.song-item img{
width:26px;
height:26px;
border-radius:5px;
object-fit:cover;
flex-shrink:0;
box-shadow:0 2px 5px rgba(0,0,0,.3);
}

.song-item-info{
flex:1;
min-width:0;
}

.song-item-title{
font-size:9.5px;
font-weight:700;
color:#fff;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
letter-spacing:.2px;
}

.song-item-artist{
font-size:8px;
font-weight:400;
color:rgba(255,255,255,.55);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-top:.5px;
}

/* STATUS */

.loading{
text-align:center;
color:rgba(255,255,255,.7);
font-size:10px;
margin-top:15px;
padding:10px;
}

.error{
text-align:center;
color:rgba(255,255,255,.8);
font-size:10px;
margin-top:15px;
padding:10px;
line-height:1.5;
}

/* MOBILE */

@media(max-width:480px){

.app{
padding-bottom:60px;
}

.player{
height:116px;
padding:14px 16px;
border-radius:58px;
gap:12px;
}

.cover-wrapper{
width:82px;
height:82px;
}

.title{
font-size:15px;
}

.artist{
font-size:12.5px;
}

.play{
width:48px;
height:48px;
}

.btn{
width:26px;
height:26px;
}

.top-widgets{
top:10px;
}

.bd-time{
font-size:10px;
padding:4px 9px;
}

.playlist-toggle-btn{
font-size:10px;
padding:4px 9px;
}

.playlist-drawer{
width:170px;
}

}

</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="bg"></div>


<!-- TOP WIDGETS -->

<div class="top-widgets">

<div class="bd-time">

<span>BD</span>

<span class="live-dot"></span>

<span id="bdTimeVal">
--:--:-- --
</span>

</div>


<button
class="playlist-toggle-btn"
onclick="toggleDrawer()"
>

<svg viewBox="0 0 24 24">

<path d="
M3 10h11v2H3zm0-4h11v2H3zm0 8h7v2H3zm13-1v8l6-4z
"/>

</svg>

<span>Playlist</span>

</button>

</div>


<!-- PLAYLIST OVERLAY -->

<div
class="drawer-overlay"
id="overlay"
onclick="toggleDrawer()"
></div>


<!-- PLAYLIST DRAWER -->

<div
class="playlist-drawer"
id="drawer"
>

<div class="drawer-header">

<div class="drawer-title">
Open.Audio
</div>

<button
class="close-btn"
onclick="toggleDrawer()"
>
&times;
</button>

</div>


<div
class="song-list"
id="songList"
>

<div class="loading">
Loading music...
</div>

</div>

</div>


<!-- PLAYER -->

<div class="app">

<section class="player">


<!-- COVER -->

<div class="cover-wrapper">

<img
id="cover"
class="cover"
src="logo.png"
alt="Album art"
>

</div>


<!-- SONG INFO -->

<div class="middle">

<div
id="title"
class="title"
>
Open.Audio
</div>


<div
id="artist"
class="artist"
>
Loading music...
</div>


<!-- SEEK -->

<div
class="seek"
id="seek"
>

<div
class="fill"
id="fill"
></div>

</div>


<!-- TIME -->

<div class="time-display">

<span id="current">
0:00
</span>

/

<span id="duration">
0:00
</span>

</div>

</div>


<!-- CONTROLS -->

<div class="controls">


<button
class="btn"
onclick="previousSong()"
aria-label="Previous"
>

<svg viewBox="0 0 24 24">

<path d="
M6 6h2v12H6zm3.5 6l8.5 6V6z
"/>

</svg>

</button>


<button
class="play"
id="play"
onclick="togglePlay()"
aria-label="Play"
>

<svg
id="play-icon"
viewBox="0 0 24 24"
>

<path d="
M8 5v14l11-7z
"/>

</svg>

</button>


<button
class="btn"
onclick="nextSong()"
aria-label="Next"
>

<svg viewBox="0 0 24 24">

<path d="
M6 18l8.5-6L6 6v12z
M16 6v12h-2V6h2z
"/>

</svg>

</button>


</div>

</section>

</div>


<!-- AUDIO -->

<audio
id="audio"
preload="metadata"
playsinline
></audio>


<script>

/* =========================================
   OPEN.AUDIO / FUNKWHALE
========================================= */

const API =
"https://open.audio/api/v1";


let playlist = [];

let currentIndex = 0;

const audio =
document.getElementById("audio");


/* =========================================
   BANGLADESH TIME
========================================= */

function updateBDTime(){

const options = {

timeZone:"Asia/Dhaka",

hour:"2-digit",

minute:"2-digit",

second:"2-digit",

hour12:true

};


const timeString =
new Intl.DateTimeFormat(
"en-US",
options
).format(new Date());


document.getElementById(
"bdTimeVal"
).textContent =
timeString;

}


updateBDTime();

setInterval(
updateBDTime,
1000
);


/* =========================================
   LOAD MUSIC
========================================= */

async function loadMusic(){

const list =
document.getElementById(
"songList"
);


list.innerHTML = `
<div class="loading">
Loading music...
</div>
`;


try{

/*
Funkwhale public API.

We request tracks from Open.Audio.
*/

const url =
API +
"/tracks/?page_size=20&ordering=-creation_date";


const response =
await fetch(url);


if(!response.ok){

throw new Error(
"Open.Audio API error"
);

}


const data =
await response.json();


console.log(
"Open.Audio response:",
data
);


const tracks =
(data.results || [])
.filter(track =>
track.listen_url
);


if(!tracks.length){

throw new Error(
"No playable tracks found"
);

}


/* BUILD PLAYLIST */

playlist =
tracks.map(track => {


let cover =
"logo.png";


try{

if(
track.album &&
track.album.cover &&
track.album.cover.urls
){

cover =
track.album.cover.urls
.medium_square_crop
||
track.album.cover.urls.original
||
"logo.png";

}

}
catch(e){}


let stream =
track.listen_url;


if(
stream &&
stream.startsWith("/")
){

stream =
"https://open.audio" +
stream;

}


return {

id:track.id,

title:
track.title ||
"Unknown Song",

artist:
(
track.artist &&
track.artist.name
)
||
(
track.album &&
track.album.artist &&
track.album.artist.name
)
||
"Unknown Artist",

cover:cover,

audio:stream,

duration:
Number(
track.duration || 0
)

};

});


/* RENDER */

renderPlaylist();


/* FIRST SONG */

if(playlist.length){

loadSong(
0,
false
);

}

}
catch(error){

console.error(
"Open.Audio error:",
error
);


list.innerHTML = `

<div class="error">

Music load করা যায়নি।

<br><br>

${escapeHTML(
error.message
)}

<br><br>

Open browser console
for details.

</div>

`;

}

}


/* =========================================
   RENDER PLAYLIST
========================================= */

function renderPlaylist(){

const list =
document.getElementById(
"songList"
);


list.innerHTML = "";


playlist.forEach(
(song,index)=>{


const item =
document.createElement(
"div"
);


item.className =
"song-item";


item.id =
"track-" +
index;


item.innerHTML = `

<img
src="${escapeHTML(song.cover)}"
alt="cover"
>

<div class="song-item-info">

<div class="song-item-title">

${escapeHTML(
song.title
)}

</div>

<div class="song-item-artist">

${escapeHTML(
song.artist
)}

</div>

</div>

`;


item.onclick = () => {

loadSong(
index,
true
);

toggleDrawer();

};


list.appendChild(item);

});


highlightActiveTrack();

}


/* =========================================
   LOAD SONG
========================================= */

function loadSong(
index,
autoplay
){

if(!playlist[index])
return;


currentIndex =
index;


const song =
playlist[index];


/* AUDIO SOURCE */

audio.src =
song.audio;

audio.load();


/* INFO */

document.getElementById(
"title"
).textContent =
song.title;


document.getElementById(
"artist"
).textContent =
song.artist;


/* COVER */

document.getElementById(
"cover"
).src =
song.cover;


/* PROGRESS RESET */

document.getElementById(
"fill"
).style.width =
"0%";


document.getElementById(
"current"
).textContent =
"0:00";


document.getElementById(
"duration"
).textContent =
format(song.duration);


/* ACTIVE */

highlightActiveTrack();


/* LOCK SCREEN INFO */

setupMediaSession(
song
);


/* PLAY */

if(autoplay){

audio.play()
.catch(error => {

console.log(
"Playback error:",
error
);

});

}

}


/* =========================================
   PLAY / PAUSE
========================================= */

function togglePlay(){

if(!audio.src){

if(playlist.length){

loadSong(
currentIndex,
true
);

}

return;

}


if(audio.paused){

audio.play();

}
else{

audio.pause();

}

}


/* =========================================
   NEXT
========================================= */

function nextSong(){

if(!playlist.length)
return;


let next =
currentIndex + 1;


if(
next >= playlist.length
){

next = 0;

}


loadSong(
next,
true
);

}


/* =========================================
   PREVIOUS
========================================= */

function previousSong(){

if(!playlist.length)
return;


let previous =
currentIndex - 1;


if(previous < 0){

previous =
playlist.length - 1;

}


loadSong(
previous,
true
);

}


/* =========================================
   AUDIO PLAY
========================================= */

audio.addEventListener(
"play",
()=>{


document.getElementById(
"cover"
).classList.add(
"spinning"
);


document.getElementById(
"play"
).classList.add(
"playing"
);


document.getElementById(
"play-icon"
).innerHTML = `

<path d="
M6 19h4V5H6v14zm8-14v14h4V5h-4z
"/>

`;

});


/* =========================================
   AUDIO PAUSE
========================================= */

audio.addEventListener(
"pause",
()=>{


document.getElementById(
"cover"
).classList.remove(
"spinning"
);


document.getElementById(
"play"
).classList.remove(
"playing"
);


document.getElementById(
"play-icon"
).innerHTML = `

<path d="
M8 5v14l11-7z
"/>

`;

});


/* =========================================
   SONG ENDED
========================================= */

audio.addEventListener(
"ended",
()=>{

nextSong();

});


/* =========================================
   LOADED METADATA
========================================= */

audio.addEventListener(
"loadedmetadata",
()=>{


if(
audio.duration &&
!isNaN(
audio.duration
)
){

document.getElementById(
"duration"
).textContent =
format(
audio.duration
);

}

});


/* =========================================
   PROGRESS
========================================= */

audio.addEventListener(
"timeupdate",
()=>{


if(
!audio.duration ||
isNaN(
audio.duration
)
)
return;


const percentage =
(
audio.currentTime /
audio.duration
) * 100;


document.getElementById(
"fill"
).style.width =
percentage +
"%";


document.getElementById(
"current"
).textContent =
format(
audio.currentTime
);


document.getElementById(
"duration"
).textContent =
format(
audio.duration
);


updateMediaPosition();

});


/* =========================================
   SEEK
========================================= */

document.getElementById(
"seek"
).addEventListener(
"click",
function(e){


if(
!audio.duration ||
isNaN(
audio.duration
)
)
return;


const rect =
this.getBoundingClientRect();


let percentage =
(
e.clientX -
rect.left
) /
rect.width;


percentage =
Math.max(
0,
Math.min(
1,
percentage
)
);


audio.currentTime =
percentage *
audio.duration;

});


/* =========================================
   MEDIA SESSION
   iPhone LOCK SCREEN
========================================= */

function setupMediaSession(
song
){

if(
!("mediaSession" in navigator)
)
return;


try{


navigator.mediaSession.metadata =
new MediaMetadata({

title:
song.title,

artist:
song.artist,

album:
"Open.Audio",

artwork:[
{

src:
song.cover,

sizes:
"300x300",

type:
"image/jpeg"

}

]

});


navigator.mediaSession.setActionHandler(
"play",
()=>{
audio.play();
}
);


navigator.mediaSession.setActionHandler(
"pause",
()=>{
audio.pause();
}
);


navigator.mediaSession.setActionHandler(
"nexttrack",
()=>{
nextSong();
}
);


navigator.mediaSession.setActionHandler(
"previoustrack",
()=>{
previousSong();
}
);


}
catch(error){

console.log(
"Media Session:",
error
);

}

}


/* =========================================
   MEDIA POSITION
========================================= */

function updateMediaPosition(){

if(
!("mediaSession" in navigator)
)
return;


if(
!audio.duration ||
isNaN(
audio.duration
)
)
return;


try{

navigator.mediaSession.setPositionState({

duration:
audio.duration,

playbackRate:
audio.playbackRate,

position:
Math.min(
audio.currentTime,
audio.duration
)

});

}
catch(e){}

}


/* =========================================
   HIGHLIGHT ACTIVE SONG
========================================= */

function highlightActiveTrack(){

document
.querySelectorAll(
".song-item"
)
.forEach(
(item,index)=>{


if(
index === currentIndex
){

item.classList.add(
"active"
);

}
else{

item.classList.remove(
"active"
);

}

});

}


/* =========================================
   DRAWER
========================================= */

function toggleDrawer(){

const drawer =
document.getElementById(
"drawer"
);

const overlay =
document.getElementById(
"overlay"
);


if(
drawer.classList.contains(
"open"
)
){

drawer.classList.remove(
"open"
);

overlay.classList.remove(
"active"
);

}
else{

drawer.classList.add(
"open"
);

overlay.classList.add(
"active"
);

}

}


/* =========================================
   FORMAT TIME
========================================= */

function format(
seconds
){

if(
!seconds ||
isNaN(
seconds
)
){

return "0:00";

}


seconds =
Math.floor(
seconds
);


return (

Math.floor(
seconds / 60
)

+

":"

+

String(
seconds % 60
).padStart(
2,
"0"
)

);

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
value
){

return String(
value
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}
