<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shanti Music</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    html, body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: url('https://files.catbox.moe/a4x5ls.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 50px;
    }
    
    /* Saloon.wtf এর মতো মিনিমাল কার্ড */
    .player-container {
      width: 90%;
      max-width: 380px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 16px 20px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
    }

    .song-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .song-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .song-sub {
      font-size: 12px;
      opacity: 0.7;
    }

    .player-wrapper {
      width: 120px;
      height: 40px;
      overflow: hidden;
      border-radius: 10px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <div class="song-info">
      <span class="song-title">Chill & Peace Vibes</span>
      <span class="song-sub">YouTube Music Playlist</span>
    </div>
    
    <div class="player-wrapper">
      <iframe src="https://www.youtube.com/embed/videoseries?list=PLbvY05KVYwoo" allow="autoplay; encrypted-media"></iframe>
    </div>
  </div>

</body>
</html>
