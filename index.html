<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My Music Player</title>

<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preload" as="image" href="background.jpg">
<link rel="apple-touch-icon" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{position:relative;overflow-x:hidden!important}

.bg{position:fixed;inset:0;background:url("background.jpg") center/cover no-repeat;z-index:0}
.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.15)}

.top-widgets{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;gap:8px}
.bd-time,.playlist-toggle-btn{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center}
.bd-time{padding:5px 11px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px;gap:6px}
.live-dot{width:7px;height:7px;background:#ff3b30;border-radius:50%;box-shadow:0 0 8px #ff3b30;animation:pulse 1.5s infinite}
@keyframes pulse{50%{opacity:.3;transform:scale(.8)}}

.playlist-toggle-btn{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;gap:6px;cursor:pointer;transition:.2s}
.playlist-toggle-btn:active{transform:scale(.95)}
.playlist-toggle-btn svg{width:14px;height:14px;fill:#fff}

#yt{position:fixed;width:2px;height:2px;left:-10px;bottom:-10px;opacity:.01;pointer-events:none}

.app{position:relative;z-index:2;height:100dvh;width:100%;display:flex;align-items:flex-end;justify-content:center;padding:0 16px 65px}

.player{width:min(400px,92%);height:120px;padding:16px 20px;border:1px solid rgba(255,255,255,.18);border-radius:60px;background:rgba(55,30,25,.75);box-shadow:0 20px 50px rgba(0,0,0,.6);backdrop-filter:blur(30px) saturate(140%);-webkit-backdrop-filter:blur(30px) saturate(140%);display:flex;align-items:center;gap:14px}

.cover-wrapper{position:relative;width:88px;height:88px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;border:1px solid rgba(255,255,255,.3)}
.cover{width:137%;height:137%;margin:-18.5%;border-radius:50%;object-fit:cover;background:#222;animation:spin 8s linear infinite;animation-play-state:paused}
.cover-wrapper:after{content:"";position:absolute;width:16px;height:16px;background:rgba(20,20,20,.85);border:2px solid rgba(255,255,255,.3);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.cover.spinning{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}

.middle{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.title{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:13.5px;color:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 8px}

.seek{position:relative;width:100%;height:4px;border-radius:10px;background:rgba(255,255,255,.2);margin-bottom:6px;touch-action:none;user-select:none}
.fill{position:absolute;left:0;top:0;height:100%;width:0;background:#fff;border-radius:10px;pointer-events:none}
.time-display{font-size:12px;color:rgba(255,255,255,.65);font-variant-numeric:tabular-nums}

.controls{display:flex;align-items:center;gap:10px;flex-shrink:0}
.btn{width:28px;height:28px;border:0;background:transparent;color:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.btn svg{width:22px;height:22px;fill:#fff}
.play{width:52px;height:52px;border:0;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 15px rgba(0,0,0,.3);cursor:pointer}
.play svg{width:22px;height:22px;fill:#000;margin-left:2px}
.play.playing svg{margin-left:0}
.btn:active,.play:active{transform:scale(.9)}

.drawer-overlay{position:fixed;inset:0;z-index:99;background:transparent;display:none}
.drawer-overlay.active{display:block}

.playlist-drawer{position:fixed;top:0;right:-100%;width:170px;height:100dvh;background:rgba(20,20,20,.35);backdrop-filter:blur(25px) saturate(150%);-webkit-backdrop-filter:blur(25px) saturate(150%);border-left:1px solid rgba(255,255,255,.15);z-index:100;transition:right .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:12px 6px;box-shadow:-10px 0 30px rgba(0,0,0,.3);visibility:hidden;pointer-events:none}
.playlist-drawer.open{right:0;visibility:visible;pointer-events:auto}

.drawer-header{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:8px;background:rgba(255,255,255,.1);border-radius:8px}
.drawer-title{font-size:11px;font-weight:700}
.close-btn{background:transparent;border:0;color:#fff;font-size:16px;padding:0 2px;cursor:pointer}

.song-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding-right:2px}
.song-list::-webkit-scrollbar{width:2px}
.song-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:3px}

.song-item{display:flex;align-items:center;gap:6px;padding:4px 5px;border-radius:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:.2s}
.song-item:active{transform:scale(.96)}
.song-item:hover,.song-item.active{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.35)}
.song-item img{width:26px;height:26px;border-radius:5px;object-fit:cover;flex-shrink:0}
.song-item-info{flex:1;min-width:0}
.song-item-title{font-size:9.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-item-artist{font-size:8px;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media(max-width:480px){
.app{padding-bottom:60px}
.player{height:116px;padding:14px 16px;border-radius:58px;gap:12px}
.cover-wrapper{width:82px;height:82px}
.title{font-size:15px}.artist{font-size:12.5px}
.play{width:48px;height:48px}.btn{width:26px;height:26px}
.top-widgets{top:10px}
.bd-time{font-size:10px;padding:4px 9px}
.playlist-toggle-btn{font-size:10px;padding:4px 9px}
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="top-widgets">
<div class="bd-time"><span>BD</span><span class="live-dot"></span><span id="bdTimeVal">--:--:-- --</span></div>
<button class="playlist-toggle-btn" onclick="toggleDrawer()">
<svg viewBox="0 0 24 24"><path d="M3 10h11v2H3zm0-4h11v2H3zm0 8h7v2H3zm13-1v8l6-4z"/></svg>
<span>Playlist</span>
</button>
</div>

<div id="yt"></div>

<div class="drawer-overlay" id="overlay" onclick="toggleDrawer()"></div>

<div class="playlist-drawer" id="drawer">
<div class="drawer-header">
<div class="drawer-title">Playlist Songs</div>
<button class="close-btn" onclick="toggleDrawer()">&times;</button>
</div>
<div class="song-list" id="songList">Loading...</div>
</div>

<div class="app">
<section class="player">

<div class="cover-wrapper">
<img id="cover" class="cover" src="logo.png" alt="Album art">
</div>

<div class="middle">
<div id="title" class="title">My Playlist</div>
<div id="artist" class="artist">YouTube Music</div>

<div class="seek" id="seek">
<div class="fill" id="fill"></div>
</div>

<div class="time-display">
<span id="current">0:00</span> / <span id="duration">0:00</span>
</div>
</div>

<div class="controls">

<button class="btn" onclick="previousSong()">
<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
</button>

<button class="play" id="play" onclick="togglePlay()">
<svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
</button>

<button class="btn" onclick="nextSong()">
<svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h-2V6h2z"/></svg>
</button>

</div>
</section>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

const PLAYLIST_ID="PLbvY05KVYwoo";
let player=null,playing=false,playlistItems=[],isSeeking=false,seekPercent=0;

function updateBDTime(){
document.getElementById("bdTimeVal").textContent=
new Intl.DateTimeFormat("en-US",{
timeZone:"Asia/Dhaka",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true
}).format(new Date());
}
updateBDTime();
setInterval(updateBDTime,1000);

function onYouTubeIframeAPIReady(){
player=new YT.Player("yt",{
width:"2",height:"2",
playerVars:{
autoplay:0,controls:0,disablekb:1,fs:0,
modestbranding:1,playsinline:1,rel:0,
listType:"playlist",list:PLAYLIST_ID
},
events:{onReady:ready,onStateChange:state}
});
}

function ready(){
updateInfo();
loadPlaylistItems();
setInterval(updateProgress,250);
}

function state(e){
const cover=document.getElementById("cover"),
play=document.getElementById("play"),
icon=document.getElementById("play-icon");

if(e.data===YT.PlayerState.PLAYING){
playing=true;
play.classList.add("playing");
icon.innerHTML='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
cover.classList.add("spinning");
highlightActiveTrack();
}
else if(e.data===YT.PlayerState.PAUSED||e.data===YT.PlayerState.ENDED){
playing=false;
play.classList.remove("playing");
icon.innerHTML='<path d="M8 5v14l11-7z"/>';
cover.classList.remove("spinning");
}
else if(e.data===YT.PlayerState.CUED||e.data===-1)updateInfo();
}

function togglePlay(){
if(!player)return;
playing?player.pauseVideo():player.playVideo();
}

function nextSong(){
if(!player)return;
let list=player.getPlaylist();
if(!list?.length)return;
let i=player.getPlaylistIndex()+1;
if(i>=list.length)i=0;
showTrackPreview(i);
player.playVideoAt(i);
}

function previousSong(){
if(!player)return;
let list=player.getPlaylist();
if(!list?.length)return;
let i=player.getPlaylistIndex()-1;
if(i<0)i=list.length-1;
showTrackPreview(i);
player.playVideoAt(i);
}

function toggleDrawer(){
const d=document.getElementById("drawer"),
o=document.getElementById("overlay");
d.classList.toggle("open");
o.classList.toggle("active");
}

function loadPlaylistItems(){
if(!player?.getPlaylist)return;

playlistItems=player.getPlaylist();
const box=document.getElementById("songList");

if(!playlistItems?.length){
box.innerHTML="No tracks found";
return;
}

box.innerHTML="";

playlistItems.forEach((id,i)=>{
const item=document.createElement("div");
item.className="song-item";
item.id=`track-${i}`;
item.onclick=()=>playSpecificTrack(i);

item.innerHTML=`
<img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg">
<div class="song-item-info">
<div class="song-item-title" id="title-${i}">Track #${i+1}</div>
<div class="song-item-artist" id="artist-${i}">YouTube Music</div>
</div>`;

box.appendChild(item);
fetchSongDetails(id,i);
});

highlightActiveTrack();
}

function fetchSongDetails(id,i){
fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`)
.then(r=>r.json())
.then(d=>{
if(!d?.title)return;
const t=document.getElementById(`title-${i}`),
a=document.getElementById(`artist-${i}`);
if(t)t.textContent=d.title;
if(a&&d.author_name)a.textContent=d.author_name;
}).catch(()=>{});
}

function showTrackPreview(i){
if(!playlistItems?.[i])return;

const id=playlistItems[i];
document.getElementById("cover").src=
`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;

document.querySelectorAll(".song-item").forEach((x,n)=>
x.classList.toggle("active",n===i));

const t=document.getElementById(`title-${i}`),
a=document.getElementById(`artist-${i}`);

if(t&&!t.textContent.startsWith("Track #"))
document.getElementById("title").textContent=t.textContent;

if(a&&a.textContent!=="YouTube Music")
document.getElementById("artist").textContent=a.textContent;

document.getElementById("fill").style.width="0%";
document.getElementById("current").textContent="0:00";
document.getElementById("duration").textContent="0:00";
}

function playSpecificTrack(i){
if(!player)return;
showTrackPreview(i);
toggleDrawer();
player.playVideoAt(i);
}

function highlightActiveTrack(){
if(!player?.getPlaylistIndex)return;
const i=player.getPlaylistIndex();
document.querySelectorAll(".song-item").forEach((x,n)=>
x.classList.toggle("active",n===i));
}

function updateInfo(){
if(!player?.getVideoData)return;
try{
const d=player.getVideoData();
if(!d?.video_id)return;

document.getElementById("cover").src=
`https://i.ytimg.com/vi/${d.video_id}/hqdefault.jpg`;

if(d.title)document.getElementById("title").textContent=d.title;
if(d.author)document.getElementById("artist").textContent=d.author;
}catch(e){}
}

function updateProgress(){
if(!player?.getCurrentTime)return;
try{
const c=player.getCurrentTime(),d=player.getDuration();
if(!d)return;

if(!isSeeking){
document.getElementById("fill").style.width=
Math.max(0,Math.min(100,c/d*100))+"%";
document.getElementById("current").textContent=format(c);
}

document.getElementById("duration").textContent=format(d);
}catch(e){}
}

const seek=document.getElementById("seek");

function seekPos(x){
const r=seek.getBoundingClientRect();
return Math.max(0,Math.min(1,(x-r.left)/r.width));
}

function seekPreview(p){
seekPercent=p;
const d=player.getDuration();
if(!d)return;

document.getElementById("fill").style.width=p*100+"%";
document.getElementById("current").textContent=format(p*d);
}

seek.addEventListener("touchstart",e=>{
if(!player)return;
e.preventDefault();
isSeeking=true;
seekPreview(seekPos(e.touches[0].clientX));
},{passive:false});

seek.addEventListener("touchmove",e=>{
if(!isSeeking)return;
e.preventDefault();
seekPreview(seekPos(e.touches[0].clientX));
},{passive:false});

seek.addEventListener("touchend",()=>{
if(!isSeeking)return;
isSeeking=false;
player.seekTo(seekPercent*player.getDuration(),true);
});

seek.addEventListener("click",e=>{
if(!player)return;
player.seekTo(seekPos(e.clientX)*player.getDuration(),true);
});

function format(s){
if(!s||isNaN(s))return"0:00";
s=Math.floor(s);
return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}

</script>
</body>
</html>
