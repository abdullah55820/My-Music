<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>SoundFlow — Music</title>

<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --muted: #98989f;
  --accent: #ff2d55;
  --line: rgba(255,255,255,.12);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont,
  "SF Pro Display", "Segoe UI", sans-serif;
  min-height: 100vh;
}

button {
  font-family: inherit;
  border: 0;
  cursor: pointer;
}

/* ================= HOME ================= */

.wrap {
  max-width: 1050px;
  margin: auto;
  padding: 20px 16px 120px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: -1px;
}

.brand span {
  color: var(--accent);
}

.tag {
  color: var(--muted);
  font-size: 12px;
}

.search {
  display: flex;
  gap: 9px;
  margin: 25px 0 12px;
}

.search input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  background: #1c1c1e;
  color: white;
  border: 1px solid var(--line);
  border-radius: 14px;
  font-size: 16px;
  outline: none;
}

.search button {
  padding: 0 19px;
  border-radius: 14px;
  color: white;
  background: linear-gradient(135deg,#ff2d55,#ff5e3a);
  font-weight: 700;
}

.hint {
  color: var(--muted);
  font-size: 12px;
}

.section {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 25px 0 14px;
}

.section h2 {
  font-size: 18px;
  margin: 0;
}

.status {
  color: var(--muted);
  font-size: 12px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(155px,1fr));
  gap: 14px;
}

.card {
  background: #1c1c1e;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 10px;
  cursor: pointer;
  min-width: 0;
  transition: transform .2s;
}

.card:active {
  transform: scale(.97);
}

.thumb {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 12px;
  background: #292929;
}

.title {
  font-size: 13px;
  font-weight: 650;
  line-height: 1.4;
  margin: 10px 2px 5px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.artist {
  font-size: 11px;
  color: var(--muted);
  margin: 0 2px 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.empty {
  grid-column: 1/-1;
  text-align: center;
  padding: 30px 15px;
  border: 1px dashed var(--line);
  border-radius: 16px;
  color: var(--muted);
}

.load {
  display: block;
  margin: 22px auto;
  padding: 13px 22px;
  border-radius: 14px;
  background: #1c1c1e;
  border: 1px solid var(--line);
  color: white;
}

.load[hidden] {
  display: none;
}

/* ================= FULL PLAYER ================= */

.player {
  position: fixed;
  inset: 0;
  z-index: 9999;

  display: flex;
  flex-direction: column;

  padding:
    calc(env(safe-area-inset-top) + 12px)
    24px
    calc(env(safe-area-inset-bottom) + 24px);

  overflow: hidden;

  background: #080808;

  visibility: hidden;
  opacity: 0;
  pointer-events: none;

  transform: translateY(25px);

  transition:
    opacity .3s ease,
    transform .35s ease,
    visibility .35s;

  /* Essential: correct background layering */
  isolation: isolate;
}

.player.active {
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

/* BLURRED BACKGROUND */

.player-bg {
  position: absolute;
  inset: -45px;

  z-index: 0;

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  filter: blur(42px);
  transform: scale(1.18);

  opacity: .8;

  transition: background-image .35s;
  pointer-events: none;
}

.player-shade {
  position: absolute;
  inset: 0;
  z-index: 1;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.53),
      rgba(0,0,0,.35) 40%,
      rgba(0,0,0,.78) 100%
    );

  backdrop-filter: saturate(125%);
  -webkit-backdrop-filter: saturate(125%);

  pointer-events: none;
}

/* PLAYER CONTENT LAYER */

.player-top-bar,
.player-content-center,
.player-bottom-space {
  position: relative;
  z-index: 2;
}

.player-top-bar {
  width: 100%;
  min-height: 46px;

  display: flex;
  align-items: center;
  justify-content: center;

  flex-shrink: 0;
}

.player-top-bar span {
  font-size: 13px;
  font-weight: 750;
  letter-spacing: 1.5px;
  color: rgba(255,255,255,.85);
}

.collapse-btn {
  position: absolute;
  left: 0;

  width: 42px;
  height: 42px;

  display: grid;
  place-items: center;

  border-radius: 50%;

  color: white;
  background: rgba(255,255,255,.14);

  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
}

.collapse-btn svg {
  width: 22px;
  height: 22px;
}

/* CENTER PLAYER */

.player-content-center {
  width: 100%;
  max-width: 390px;

  margin: auto;

  display: flex;
  flex-direction: column;

  flex-shrink: 1;
  min-height: 0;
}

/* ARTWORK */

.big-artwork-wrap {
  width: 100%;

  aspect-ratio: 1 / 1;
  max-height: min(40vh, 390px);

  flex-shrink: 1;

  overflow: hidden;

  border-radius: 22px;

  background: #222;

  box-shadow:
    0 20px 55px rgba(0,0,0,.5);

  margin-bottom: 25px;
}

.big-artwork-wrap img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* SONG INFO */

.song-meta-box {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;

  margin-bottom: 25px;

  flex-shrink: 0;
}

.song-info-text {
  flex: 1;
  min-width: 0;
}

.song-info-text h3 {
  margin: 0 0 7px;

  font-size: 21px;
  font-weight: 750;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.song-info-text p {
  margin: 0;

  font-size: 14px;
  color: rgba(255,255,255,.65);

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.like-btn {
  width: 42px;
  height: 42px;

  display: grid;
  place-items: center;

  background: transparent;
  color: rgba(255,255,255,.75);

  flex-shrink: 0;
}

.like-btn svg {
  width: 27px;
  height: 27px;
}

.like-btn.liked {
  color: #ff2d55;
}

/* PROGRESS */

.progress-container {
  width: 100%;
  margin-bottom: 28px;
  flex-shrink: 0;
}

.seek-slider {
  width: 100%;
  height: 5px;

  display: block;

  appearance: none;
  -webkit-appearance: none;

  outline: none;
  border-radius: 10px;

  background: linear-gradient(
    to right,
    white 0%,
    white 0%,
    rgba(255,255,255,.3) 0%,
    rgba(255,255,255,.3) 100%
  );
}

.seek-slider::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;

  width: 13px;
  height: 13px;

  border-radius: 50%;
  background: white;

  box-shadow: 0 1px 7px rgba(0,0,0,.4);
}

.seek-slider::-moz-range-thumb {
  width: 13px;
  height: 13px;
  border: 0;
  border-radius: 50%;
  background: white;
}

.time-row {
  display: flex;
  justify-content: space-between;

  margin-top: 10px;

  font-size: 11px;
  color: rgba(255,255,255,.65);

  font-variant-numeric: tabular-nums;
}

/* CONTROLS */

.controls-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: clamp(35px,12vw,55px);

  flex-shrink: 0;
}

.ctrl-btn {
  width: 48px;
  height: 48px;

  display: grid;
  place-items: center;

  background: transparent;
  color: white;

  transition: transform .15s;
}

.ctrl-btn svg {
  width: 32px;
  height: 32px;
}

.ctrl-btn:active {
  transform: scale(.85);
}

.play-pause-circle {
  width: 72px;
  height: 72px;

  display: grid;
  place-items: center;

  border-radius: 50%;

  background: white;
  color: #000;

  box-shadow: 0 8px 25px rgba(0,0,0,.3);

  transition: transform .15s;
}

.play-pause-circle:active {
  transform: scale(.91);
}

.play-pause-circle svg {
  width: 31px;
  height: 31px;
}

/* ================= MINI PLAYER ================= */

.mini-player {
  position: fixed;

  z-index: 9998;

  left: 12px;
  right: 12px;

  bottom: calc(9px + env(safe-area-inset-bottom));

  min-height: 68px;

  padding: 9px 11px;

  display: flex;
  align-items: center;
  gap: 11px;

  background: rgba(40,40,42,.94);

  border: 1px solid rgba(255,255,255,.13);
  border-radius: 17px;

  backdrop-filter: blur(25px) saturate(160%);
  -webkit-backdrop-filter: blur(25px) saturate(160%);

  box-shadow: 0 8px 30px rgba(0,0,0,.4);

  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transform: translateY(25px);

  transition: .3s ease;
}

.mini-player.visible {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translateY(0);
}

.mini-thumb {
  width: 47px;
  height: 47px;

  border-radius: 9px;
  object-fit: cover;

  flex-shrink: 0;
}

.mini-info {
  flex: 1;
  min-width: 0;
}

.mini-title {
  font-size: 13px;
  font-weight: 700;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mini-artist {
  font-size: 11px;
  color: rgba(255,255,255,.6);
  margin-top: 4px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mini-control {
  width: 38px;
  height: 42px;

  display: grid;
  place-items: center;

  background: transparent;
  color: white;
  flex-shrink: 0;
}

.mini-control svg {
  width: 24px;
  height: 24px;
}

/* YOUTUBE FRAME */

#ytPlayerContainer {
  position: fixed;
  left: -1000px;
  top: 0;

  width: 200px;
  height: 200px;

  opacity: .01;
  pointer-events: none;
}

/* ================= RESPONSIVE ================= */

@media(max-width:480px) {

  .wrap {
    padding: 17px 13px 110px;
  }

  .grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 11px;
  }

  .brand {
    font-size: 22px;
  }

  .player {
    padding-left: 22px;
    padding-right: 22px;
  }

  .player-content-center {
    max-width: 370px;
  }

}

/* SHORT SCREENS */

@media(max-height:720px) {

  .big-artwork-wrap {
    max-height: min(34vh, 280px);
    margin-bottom: 16px;
  }

  .song-meta-box {
    margin-bottom: 17px;
  }

  .progress-container {
    margin-bottom: 18px;
  }

  .play-pause-circle {
    width: 64px;
    height: 64px;
  }

}

@media(max-height:600px) {

  .big-artwork-wrap {
    max-height: 29vh;
    margin-bottom: 12px;
  }

  .song-meta-box {
    margin-bottom: 12px;
  }

  .progress-container {
    margin-bottom: 12px;
  }

}

</style>
</head>

<body>

<!-- HOME -->

<main class="wrap">

<header class="top">
  <div>
    <div class="brand">SOUND<span>FLOW</span></div>
    <div class="tag">Discover • Search • Listen</div>
  </div>
  <div class="tag">Music Player</div>
</header>

<form class="search" id="searchForm">
  <input
    id="query"
    type="search"
    placeholder="গানের নাম বা শিল্পীর নাম লিখো…"
    autocomplete="off"
  >
  <button type="submit">Search</button>
</form>

<p class="hint">যেমন: Arijit Singh, Atif Aslam, বাংলা গান…</p>

<div class="section">
  <h2 id="heading">Trending All Songs</h2>
  <span class="status" id="status">Ready</span>
</div>

<div class="grid" id="results">
  <div class="empty">গান লোড হচ্ছে...</div>
</div>

<button class="load" id="loadMore" hidden>
  আরও গান দেখাও
</button>

</main>


<!-- FULL SCREEN PLAYER -->

<section class="player" id="player">

  <div class="player-bg" id="playerBg"></div>
  <div class="player-shade"></div>

  <div class="player-top-bar">

    <button class="collapse-btn" id="minimizePlayer">
      <svg viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round">
        <path d="m6 9 6 6 6-6"/>
      </svg>
    </button>

    <span>NOW PLAYING</span>

  </div>


  <div class="player-content-center">

    <div class="big-artwork-wrap">
      <img id="playingThumb" alt="Album Artwork">
    </div>


    <div class="song-meta-box">

      <div class="song-info-text">
        <h3 id="playingTitle">Song Title</h3>
        <p id="playingArtist">Artist Name</p>
      </div>

      <button class="like-btn" id="likeBtn">
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.8 8.7c0 5.5-8.8 10.2-8.8 10.2S3.2 14.2 3.2 8.7A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.8 2.3Z"/>
        </svg>
      </button>

    </div>


    <div class="progress-container">

      <input
        type="range"
        id="seekSlider"
        class="seek-slider"
        min="0"
        max="100"
        value="0"
      >

      <div class="time-row">
        <span id="currentTime">0:00</span>
        <span id="durationTime">0:00</span>
      </div>

    </div>


    <div class="controls-row">

      <button class="ctrl-btn" id="prevBtn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 5h2v14H6zM19 6v12L9 12z"/>
        </svg>
      </button>

      <button class="play-pause-circle" id="mainPlayBtn">
        <svg id="mainPlayIcon" viewBox="0 0 24 24"
             fill="currentColor">
          <path d="M7 4v16l13-8z"/>
        </svg>
      </button>

      <button class="ctrl-btn" id="nextBtn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 5h2v14h-2zM5 6v12l10-6z"/>
        </svg>
      </button>

    </div>

  </div>

  <div class="player-bottom-space"></div>

</section>


<!-- MINI PLAYER -->

<div class="mini-player" id="miniPlayer">

  <img class="mini-thumb" id="miniThumb" alt="">

  <div class="mini-info" id="expandPlayer">
    <div class="mini-title" id="miniTitle">Song Title</div>
    <div class="mini-artist" id="miniArtist">Artist</div>
  </div>

  <button class="mini-control" id="miniPlayBtn">
    <svg id="miniPlayIcon" viewBox="0 0 24 24" fill="currentColor">
      <path d="M7 4v16l13-8z"/>
    </svg>
  </button>

  <button class="mini-control" id="miniCloseBtn">
    <svg viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2"
         stroke-linecap="round">
      <path d="M6 6l12 12M18 6 6 18"/>
    </svg>
  </button>

</div>


<!-- YOUTUBE PLAYER -->

<div id="ytPlayerContainer">
  <div id="ytPlayer"></div>
</div>


<script src="https://www.youtube.com/iframe_api"></script>

<script>

/* ================= ELEMENTS ================= */

const $ = id => document.getElementById(id);

const form = $('searchForm');
const input = $('query');
const results = $('results');
const statusEl = $('status');
const heading = $('heading');
const more = $('loadMore');

const playerScreen = $('player');
const miniPlayer = $('miniPlayer');

const seekSlider = $('seekSlider');


/* ================= STATE ================= */

let ytPlayer = null;
let apiReady = false;

let videos = [];
let currentIndex = -1;

let page = 1;
let currentQuery = 'Top Bangla and Hindi hits';

let busy = false;
let isPlaying = false;
let seeking = false;

let updateTimer = null;
let pendingVideoId = null;

let searchController = null;
let searchToken = 0;


/* ================= SEARCH SERVERS ================= */

const instances = [
  'https://invidious.privacyredirect.com',
  'https://inv.nadeko.net',
  'https://invidious.nerdvpn.de',
  'https://yt.chocolatemoo53.com',
  'https://invidious.tiekoetter.com'
];


/* ================= YOUTUBE API ================= */

window.onYouTubeIframeAPIReady = function() {

  ytPlayer = new YT.Player('ytPlayer', {

    height: '200',
    width: '200',

    playerVars: {
      autoplay: 0,
      controls: 0,
      disablekb: 1,
      playsinline: 1,
      rel: 0
    },

    events: {

      onReady: () => {

        apiReady = true;

        if (pendingVideoId) {

          const id = pendingVideoId;
          pendingVideoId = null;

          ytPlayer.loadVideoById(id);

        }

      },

      onStateChange: onPlayerStateChange,

      onError: event => {

        console.log('YouTube Error:', event.data);
        statusEl.textContent = 'Playback Error';

        isPlaying = false;
        updateIcons();

        stopTimer();

      }

    }

  });

};


/* ================= PLAYER STATE ================= */

function onPlayerStateChange(event) {

  if (event.data === YT.PlayerState.PLAYING) {

    isPlaying = true;

    updateIcons();
    startTimer();

    statusEl.textContent = 'Playing';

  }

  else if (event.data === YT.PlayerState.PAUSED) {

    isPlaying = false;

    updateIcons();
    stopTimer();

  }

  else if (event.data === YT.PlayerState.ENDED) {

    isPlaying = false;

    updateIcons();
    stopTimer();

    nextSong();

  }

  else if (event.data === YT.PlayerState.BUFFERING) {

    statusEl.textContent = 'Buffering…';

  }

}


/* ================= ICONS ================= */

const playSVG = '<path d="M7 4v16l13-8z"/>';

const pauseSVG = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';

function updateIcons() {

  $('mainPlayIcon').innerHTML = isPlaying ? pauseSVG : playSVG;
  $('miniPlayIcon').innerHTML = isPlaying ? pauseSVG : playSVG;

}


/* ================= TIME ================= */

function formatTime(sec) {

  if (!Number.isFinite(sec) || sec < 0) return '0:00';

  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);

  return m + ':' + String(s).padStart(2,'0');

}


/* ================= PROGRESS ================= */

function updateProgress() {

  if (!ytPlayer || !apiReady) return;

  try {

    const current = ytPlayer.getCurrentTime() || 0;
    const duration = ytPlayer.getDuration() || 0;

    $('currentTime').textContent = formatTime(current);
    $('durationTime').textContent = formatTime(duration);

    if (duration > 0 && !seeking) {

      const percent = Math.min(100, (current / duration) * 100);

      seekSlider.value = percent;

      setProgressColor(percent);

    }

  } catch(e) {}

}


function setProgressColor(percent) {

  seekSlider.style.background = `
    linear-gradient(
      to right,
      #fff 0%,
      #fff ${percent}%,
      rgba(255,255,255,.3) ${percent}%,
      rgba(255,255,255,.3) 100%
    )
  `;

}


function startTimer() {

  stopTimer();

  updateProgress();

  updateTimer = setInterval(updateProgress,400);

}


function stopTimer() {

  if (updateTimer) {
    clearInterval(updateTimer);
    updateTimer = null;
  }

}


/* ================= SEEK ================= */

seekSlider.addEventListener('input', () => {

  seeking = true;

  const percent = Number(seekSlider.value);

  setProgressColor(percent);

  if (ytPlayer && apiReady) {

    const duration = ytPlayer.getDuration() || 0;

    $('currentTime').textContent =
      formatTime(duration * percent / 100);

  }

});


function finishSeek() {

  if (!seeking) return;

  seeking = false;

  if (ytPlayer && apiReady) {

    const duration = ytPlayer.getDuration() || 0;

    if (duration > 0) {

      ytPlayer.seekTo(
        duration * Number(seekSlider.value) / 100,
        true
      );

    }

  }

  updateProgress();

}


seekSlider.addEventListener('change',finishSeek);
seekSlider.addEventListener('pointerup',finishSeek);
seekSlider.addEventListener('touchend',finishSeek);


/* ================= PLAY PAUSE ================= */

function togglePlay() {

  if (!ytPlayer || !apiReady) return;

  if (isPlaying) {

    ytPlayer.pauseVideo();

  } else {

    ytPlayer.playVideo();

  }

}


$('mainPlayBtn').addEventListener('click',togglePlay);
$('miniPlayBtn').addEventListener('click',togglePlay);


/* ================= THUMBNAIL ================= */

function bestThumb(video) {

  const thumbnails = video.videoThumbnails || [];

  return (

    thumbnails.find(x => x.quality === 'maxres') ||

    thumbnails.find(x => x.quality === 'high') ||

    thumbnails.find(x => x.quality === 'medium') ||

    thumbnails[0] ||

    {}

  ).url || `https://i.ytimg.com/vi/${video.videoId}/hqdefault.jpg`;

}


/* ================= SONG INFORMATION ================= */

function getLikes() {

  try {

    return JSON.parse(
      localStorage.getItem('soundflow_likes') || '[]'
    );

  } catch(e) {

    return [];

  }

}


function setSongInfo(video) {

  const thumbnail = bestThumb(video);

  $('playingThumb').src = thumbnail;

  $('playingTitle').textContent =
    video.title || 'Unknown Song';

  $('playingArtist').textContent =
    video.author || 'YouTube';

  $('miniThumb').src = thumbnail;

  $('miniTitle').textContent =
    video.title || 'Unknown Song';

  $('miniArtist').textContent =
    video.author || 'YouTube';

  $('playerBg').style.backgroundImage =
    `url("${thumbnail}")`;

  $('likeBtn').classList.toggle(
    'liked',
    getLikes().includes(video.videoId)
  );

}


/* ================= RESET ================= */

function resetProgress() {

  seekSlider.value = 0;

  setProgressColor(0);

  $('currentTime').textContent = '0:00';
  $('durationTime').textContent = '0:00';

}


/* ================= SONG PLAY ================= */

function playSongAt(index) {

  if (index < 0 || index >= videos.length) return;

  const video = videos[index];

  if (!video || !video.videoId) return;

  currentIndex = index;

  setSongInfo(video);

  resetProgress();

  showFullPlayer();

  if (apiReady && ytPlayer) {

    ytPlayer.loadVideoById({
      videoId: video.videoId,
      startSeconds: 0
    });

  } else {

    pendingVideoId = video.videoId;

  }

}


/* ================= NEXT / PREVIOUS ================= */

function nextSong() {

  if (!videos.length || currentIndex < 0) return;

  let next = currentIndex + 1;

  if (next >= videos.length) {
    next = 0;
  }

  playSongAt(next);

}


function previousSong() {

  if (!videos.length || currentIndex < 0) return;

  let previous = currentIndex - 1;

  if (previous < 0) {
    previous = videos.length - 1;
  }

  playSongAt(previous);

}


$('nextBtn').addEventListener('click',nextSong);
$('prevBtn').addEventListener('click',previousSong);


/* ================= FULL PLAYER ================= */

function showFullPlayer() {

  playerScreen.classList.add('active');

  miniPlayer.classList.remove('visible');

  document.body.style.overflow = 'hidden';

}


function minimizePlayer() {

  if (currentIndex < 0) return;

  playerScreen.classList.remove('active');

  miniPlayer.classList.add('visible');

  document.body.style.overflow = '';

}


function expandPlayer() {

  if (currentIndex < 0) return;

  showFullPlayer();

}


$('minimizePlayer').addEventListener('click',minimizePlayer);

$('expandPlayer').addEventListener('click',expandPlayer);


/* ================= SWIPE DOWN ================= */

let startX = 0;
let startY = 0;

playerScreen.addEventListener('touchstart', e => {

  if (
    e.target.closest('button') ||
    e.target.closest('input')
  ) return;

  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;

},{passive:true});


playerScreen.addEventListener('touchend', e => {

  const endX = e.changedTouches[0].clientX;
  const endY = e.changedTouches[0].clientY;

  const dy = endY - startY;
  const dx = Math.abs(endX - startX);

  if (dy > 75 && dy > dx * 1.3) {

    minimizePlayer();

  }

},{passive:true});


/* ================= MINI CLOSE ================= */

$('miniCloseBtn').addEventListener('click',() => {

  if (ytPlayer && apiReady) {
    ytPlayer.stopVideo();
  }

  stopTimer();

  pendingVideoId = null;

  isPlaying = false;
  currentIndex = -1;

  playerScreen.classList.remove('active');
  miniPlayer.classList.remove('visible');

  document.body.style.overflow = '';

  updateIcons();

});


/* ================= FAVOURITE ================= */

$('likeBtn').addEventListener('click',() => {

  if (currentIndex < 0) return;

  const id = videos[currentIndex].videoId;

  let likes = getLikes();

  if (likes.includes(id)) {

    likes = likes.filter(x => x !== id);

  } else {

    likes.push(id);

  }

  localStorage.setItem(
    'soundflow_likes',
    JSON.stringify(likes)
  );

  $('likeBtn').classList.toggle(
    'liked',
    likes.includes(id)
  );

});


/* ================= SEARCH CARDS ================= */

function makeCard(video,index) {

  const card = document.createElement('article');

  card.className = 'card';
  card.tabIndex = 0;

  const img = document.createElement('img');

  img.className = 'thumb';
  img.loading = 'lazy';
  img.src = bestThumb(video);

  const title = document.createElement('div');

  title.className = 'title';
  title.textContent = video.title || 'Untitled';

  const artist = document.createElement('div');

  artist.className = 'artist';
  artist.textContent = video.author || 'YouTube';

  card.append(img,title,artist);

  const play = () => playSongAt(index);

  card.addEventListener('click',play);

  card.addEventListener('keydown',e => {

    if (e.key === 'Enter' || e.key === ' ') {

      e.preventDefault();
      play();

    }

  });

  return card;

}


/* ================= SEARCH SYSTEM ================= */

async function search(query,pageNumber=1,append=false) {

  if (busy) return;

  busy = true;

  const token = ++searchToken;

  if (searchController) {
    searchController.abort();
  }

  searchController = new AbortController();

  statusEl.textContent = 'গান লোড হচ্ছে…';

  more.hidden = true;

  if (!append) {

    results.innerHTML =
      '<div class="empty">গান খোঁজা হচ্ছে…</div>';

  }

  let data = null;

  for (const base of instances) {

    if (token !== searchToken) return;

    try {

      const timeout = setTimeout(
        () => searchController.abort(),
        7000
      );

      const response = await fetch(
        `${base}/api/v1/search?q=${encodeURIComponent(query)}&type=video&page=${pageNumber}`,
        {signal:searchController.signal}
      );

      clearTimeout(timeout);

      if (!response.ok) continue;

      const json = await response.json();

      if (Array.isArray(json)) {

        data = json;
        break;

      }

    } catch(e) {

      continue;

    }

  }

  if (token !== searchToken) return;

  if (!data) {

    if (!append) {

      results.innerHTML =
        '<div class="empty">সার্ভার সংযোগে ব্যর্থ। পরে আবার চেষ্টা করুন।</div>';

    }

    statusEl.textContent = 'Server Error';

    busy = false;

    return;

  }

  const found = data.filter(
    v => v.type === 'video' && v.videoId
  );

  if (!append) {

    videos = [];
    results.innerHTML = '';

  }

  const existing = new Set(
    videos.map(v => v.videoId)
  );

  const newVideos = found.filter(
    v => !existing.has(v.videoId)
  );

  newVideos.forEach(video => {

    videos.push(video);

    const index = videos.length - 1;

    results.appendChild(
      makeCard(video,index)
    );

  });

  if (!videos.length) {

    results.innerHTML =
      '<div class="empty">কোনো গান পাওয়া যায়নি।</div>';

  }

  page = pageNumber;
  currentQuery = query;

  heading.textContent =
    append ? 'Search Results' : 'Trending All Songs';

  statusEl.textContent =
    videos.length + 'টি গান';

  more.hidden = newVideos.length === 0;

  busy = false;

}


/* ================= SEARCH EVENTS ================= */

form.addEventListener('submit',e => {

  e.preventDefault();

  const q = input.value.trim();

  if (q) {
    search(q,1,false);
  }

});


more.addEventListener('click',() => {

  if (currentQuery) {
    search(currentQuery,page+1,true);
  }

});


/* ================= INITIALIZE ================= */

updateIcons();

window.addEventListener('DOMContentLoaded',() => {

  search(currentQuery,1,false);

});

</script>
