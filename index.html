<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>My Music Player</title>

<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#cfd7dc;
color:#111;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

body{
position:relative;
overflow-x:hidden!important;
}

/* ================= BACKGROUND ================= */

.bg{
position:fixed;
inset:-20px;
background-image:url("background.jpg");
background-position:center;
background-size:cover;
background-repeat:no-repeat;
z-index:0;
pointer-events:none;
-webkit-backface-visibility:hidden;
backface-visibility:hidden;
}

.bg::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,0);
pointer-events:none;
}

body.popup-active .bg{
filter:blur(12px);
-webkit-filter:blur(12px);
transform:scale(1.04);
}

/* ================= BOTTOM WIDGETS ================= */

.bottom-widgets{
width:100%;
display:flex;
flex-direction:row;
align-items:center;
justify-content:center;
gap:14px;
margin-top:14px;
padding-top:10px;
z-index:2500;
pointer-events:auto;
}

.bd-time,
.playlist-toggle-btn{
padding:8px 14px;
border-radius:20px;

background:rgba(255,255,255,.62);
border:1px solid rgba(255,255,255,.75);

color:#68151d;

font-size:11px;
font-weight:700;

backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);

box-shadow:
6px 6px 14px rgba(90,100,105,.16),
-5px -5px 12px rgba(255,255,255,.7);
}

.bd-time{
display:flex;
align-items:center;
gap:6px;
}

.live-dot{
width:7px;
height:7px;

background:#8c1820;
border-radius:50%;

box-shadow:0 0 7px rgba(140,24,32,.55);

animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%,100%{opacity:1}
50%{opacity:.35}
}

.playlist-toggle-btn{
display:flex;
align-items:center;
gap:6px;

cursor:pointer;
touch-action:manipulation;

-webkit-tap-highlight-color:transparent;
}

.playlist-toggle-btn svg{
width:14px;
height:14px;
fill:#68151d;
}

.playlist-toggle-btn:active{
transform:scale(.96);
}

/* ================= APP ================= */

.app{
position:relative;
z-index:1600;

height:100dvh;
width:100%;

display:flex;
align-items:center;
justify-content:center;

padding:25px 16px 20px;

pointer-events:auto;
}

/* ================= PLAYER ================= */

.player{
width:min(520px,94vw);

min-height:720px;
max-height:calc(100dvh - 40px);

padding:22px 20px 18px;

display:flex;
flex-direction:column;
align-items:center;
justify-content:space-between;

position:relative;
overflow:hidden;

background:rgba(220,227,231,.62);

border:1px solid rgba(255,255,255,.75);

border-radius:34px;

backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);

box-shadow:
14px 14px 30px rgba(75,85,90,.22),
-14px -14px 30px rgba(255,255,255,.72);
}

/* ================= COVER ================= */

.cover-wrapper{
width:min(350px,72vw);
height:min(350px,72vw);

max-width:350px;
max-height:350px;

flex-shrink:0;

display:flex;
align-items:center;
justify-content:center;

border-radius:50%;
overflow:hidden;

background:rgba(215,222,226,.8);

border:1px solid rgba(255,255,255,.8);

box-shadow:
13px 13px 25px rgba(80,90,95,.23),
-13px -13px 25px rgba(255,255,255,.78);

transition:
width .35s ease,
height .35s ease,
border-radius .35s ease;
}

.cover{
width:91%;
height:91%;

border-radius:50%;

object-fit:cover;
object-position:center;

background:#222;

animation:spin 8s linear infinite;
animation-play-state:paused;

box-shadow:
0 10px 20px rgba(50,55,60,.22);
}

.cover.spinning{
animation-play-state:running;
}

@keyframes spin{
from{transform:rotate(0)}
to{transform:rotate(360deg)}
}

/* ================= VIDEO INSIDE COVER ================= */

.cover-wrapper.video-active{
width:min(350px,72vw);
height:auto;
aspect-ratio:16/9;
border-radius:20px;
background:#000;
box-shadow:
10px 10px 20px rgba(80,90,95,.23),
-10px -10px 20px rgba(255,255,255,.78);
}

.cover-wrapper.video-active .cover{
display:none;
}

.cover-wrapper.video-active #videoPopup{
display:block;
}

#videoPopup{
display:none;
position:relative;
width:100%;
height:100%;
min-height:100%;
background:#000;
overflow:hidden;
border-radius:inherit;
}

#yt{
position:absolute;
inset:0;
width:100%;
height:100%;
border:0;
display:block;
}

#yt iframe{
width:100%!important;
height:100%!important;
border:0;
display:block;
pointer-events:auto!important;
}

/* ================= INFO ================= */

.middle{
width:100%;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

min-width:0;

margin-top:8px;
}

.time-display{
order:-2;

font-size:21px;
font-weight:800;

color:#7a1820;

letter-spacing:.3px;

font-variant-numeric:tabular-nums;

margin-bottom:4px;
}

.title{
width:100%;

text-align:center;

font-size:16px;
font-weight:700;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

color:#111;

letter-spacing:.1px;
}

.artist{
width:100%;

text-align:center;

font-size:12px;

color:#70777b;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

margin-top:2px;
}

/* ================= SEEK ================= */

.seek{
width:86%;

height:6px;

margin-top:10px;
margin-bottom:0;

border-radius:10px;

background:rgba(90,100,105,.16);

cursor:pointer;

touch-action:none;

user-select:none;

position:relative;
}

.seek::before{
content:"";

position:absolute;

top:-14px;
bottom:-14px;

left:-10px;
right:-10px;

z-index:1;
}

.fill{
position:absolute;

left:0;
top:0;

height:100%;
width:0;

background:#781821;

border-radius:10px;

pointer-events:none;

z-index:2;
}

.current,
.duration{
display:none;
}

/* ================= CONTROLS ================= */

.controls{
width:100%;

display:flex;
align-items:center;
justify-content:center;

gap:28px;

margin-top:10px;
padding:10px;
background:rgba(255,255,255,.25);
border:1px solid rgba(255,255,255,.45);
border-radius:24px;

position:relative;

z-index:1610;

box-shadow:
8px 8px 20px rgba(75,85,90,.12),
-8px -8px 20px rgba(255,255,255,.5);
}

.controls #videoToggleBtn{
position:static;
transform:none;
width:48px;
height:48px;
z-index:1620;
}

.controls #videoToggleBtn:active{
transform:scale(.93);
}

.controls #videoToggleBtn svg{
width:20px;
height:20px;
}

.btn,
.play{
border:0;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

touch-action:manipulation;

-webkit-tap-highlight-color:transparent;
}

.btn{
width:52px;
height:52px;

border-radius:50%;

background:rgba(220,227,231,.7);

color:#68151d;

box-shadow:
8px 8px 16px rgba(75,85,90,.18),
-8px -8px 16px rgba(255,255,255,.78);
}

.btn svg{
width:22px;
height:22px;

fill:#68151d;
}

.play{
width:66px;
height:66px;

border-radius:50%;

background:rgba(220,227,231,.78);

color:#68151d;

box-shadow:
10px 10px 20px rgba(75,85,90,.2),
-10px -10px 20px rgba(255,255,255,.8);
}

.play svg{
width:28px;
height:28px;

fill:#68151d;

margin-left:3px;
}

.play.playing svg{
margin-left:0;
}

.btn:active,
.play:active{
transform:scale(.93);
}

/* ================= DRAWER ================= */

.drawer-overlay{
position:fixed;
inset:0;
z-index:9999;
background:transparent;
pointer-events:none;
display:none;
}

.drawer-overlay.active{
display:block;
pointer-events:auto;
}

.playlist-drawer{
position:fixed;
top:0;
right:-100%;
width:260px;
height:100dvh;
background:rgba(220,227,231,.88);
backdrop-filter:blur(30px);
-webkit-backdrop-filter:blur(30px);
border-left:1px solid rgba(255,255,255,.7);
z-index:10000;
transition:right .35s cubic-bezier(.2,.8,.2,1);
display:flex;
flex-direction:column;
padding:14px 9px;
box-shadow:-15px 0 40px rgba(0,0,0,.22);
visibility:hidden;
pointer-events:none;
}

.playlist-drawer.open{
right:0;
visibility:visible;
pointer-events:auto;
}

.drawer-header{
display:flex;
align-items:center;
justify-content:space-between;
padding:8px;
border-bottom:1px solid rgba(80,90,95,.15);
margin-bottom:8px;
}

.drawer-title{
font-size:13px;
font-weight:800;
color:#111;
}

.close-btn{
background:transparent;
border:0;
color:#68151d;
font-size:20px;
cursor:pointer;
padding:0 3px;
}

.song-list{
flex:1;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:6px;
}

.song-item{
display:flex;
align-items:center;
gap:8px;
padding:7px;
border-radius:11px;
background:rgba(255,255,255,.38);
border:1px solid rgba(255,255,255,.55);
cursor:pointer;
}

.song-item.active{
background:rgba(255,255,255,.72);
border-color:rgba(120,24,33,.25);
}

.song-item img{
width:38px;
height:38px;
border-radius:7px;
object-fit:cover;
}

.song-item-info{
flex:1;
min-width:0;
}

.song-item-title{
font-size:10px;
font-weight:800;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.song-item-artist{
font-size:8px;
color:#747a7d;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-top:2px;
}

/* ================= DESKTOP ================= */

@media(min-width:769px){
.player{
min-height:760px;
width:min(560px,62vw);
}
}

/* ================= MOBILE ================= */

@media(max-width:600px){
.app{
padding:20px 10px 10px;
}
.player{
width:96vw;
min-height:0;
height:calc(100dvh - 20px);
max-height:none;
padding:16px 12px 10px;
border-radius:30px;
}
.cover-wrapper{
width:min(70vw,280px);
height:min(70vw,280px);
max-width:280px;
max-height:280px;
}
.cover-wrapper.video-active{
width:min(70vw,280px);
}
.middle{
margin-top:6px;
}
.time-display{
font-size:19px;
margin-bottom:2px;
}
.title{
font-size:15px;
}
.artist{
font-size:11px;
}
.seek{
width:90%;
margin-top:8px;
}
.controls{
gap:12px;
margin-top:8px;
padding:8px;
}
.btn{
width:46px;
height:46px;
}
.btn svg{
width:20px;
height:20px;
}
.play{
width:58px;
height:58px;
}
.play svg{
width:24px;
height:24px;
}
.controls #videoToggleBtn{
width:42px;
height:42px;
}
.controls #videoToggleBtn svg{
width:18px;
height:18px;
}
.bottom-widgets{
margin-top:8px;
padding-top:6px;
}
}
</style>
</head>

<body>

<div class="bg"></div>

<!-- DRAWER -->
<div class="drawer-overlay" id="overlay" onclick="toggleDrawer()"></div>
<div class="playlist-drawer" id="drawer">
<div class="drawer-header">
<div class="drawer-title">Playlist Songs</div>
<button class="close-btn" onclick="toggleDrawer()">&times;</button>
</div>
<div class="song-list" id="songList">
<div style="text-align:center;color:#777;font-size:10px;margin-top:15px;">Loading...</div>
</div>
</div>

<!-- APP -->
<div class="app">
<section class="player" id="playerCard">

<div class="cover-wrapper" id="coverWrapper">
<img id="cover" class="cover" src="logo.png" alt="Album art">
<div id="videoPopup">
<div id="yt"></div>
</div>
</div>

<div class="middle">
<div id="current" class="time-display">0:00 / 0:00</div>
<div id="title" class="title">My Playlist</div>
<div id="artist" class="artist">YouTube Music</div>

<div class="seek" id="seek">
<div class="fill" id="fill"></div>
</div>

<div class="current-duration-hidden">
<span id="duration">0:00</span>
</div>
</div>

<div class="controls">
<button class="btn" onclick="previousSong()" title="Previous">
<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6z M18 6l-8.5 6L18 18V6z"/></svg>
</button>

<button class="play" id="play" onclick="togglePlay()">
<svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
</button>

<button class="btn" onclick="nextSong()" title="Next">
<svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2z M6 6l8.5 6L6 18V6z"/></svg>
</button>

<button class="btn" id="videoToggleBtn" onclick="toggleVideoPopup()" title="Video">
<svg id="videoToggleIcon" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
</button>
</div>

<!-- BOTTOM WIDGETS -->
<div class="bottom-widgets">
<div class="bd-time">
<span>BD</span>
<span class="live-dot"></span>
<span id="bdTimeVal">--:--:-- --</span>
</div>
<button class="playlist-toggle-btn" onclick="toggleDrawer()">
<svg viewBox="0 0 24 24"><path d="M3 10h11v2H3zm0-4h11v2H3zm0 8h7v2H3zm13-1v8l6-4z"/></svg>
<span>Playlist</span>
</button>
</div>

</section>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const PLAYLIST_ID="PLbvY05KVYwoo";

let player=null;
let playing=false;
let playlistItems=[];
let sortedPlaylistItems=[];
let sortedPlaylistData=[];
let currentSortedIndex=0;
let sortingReady=false;
let isDragging=false;
let changingTrack=false;

function updateBDTime(){
const options={timeZone:"Asia/Dhaka",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true};
document.getElementById("bdTimeVal").textContent=new Intl.DateTimeFormat("en-US",options).format(new Date());
}
updateBDTime();
setInterval(updateBDTime,1000);

function onYouTubeIframeAPIReady(){
player=new YT.Player("yt",{
width:"100%",
height:"100%",
playerVars:{
autoplay:0,
controls:1,
disablekb:0,
fs:1,
modestbranding:1,
playsinline:1,
rel:0,
iv_load_policy:3,
listType:"playlist",
list:PLAYLIST_ID,
enablejsapi:1,
origin:window.location.origin
},
events:{onReady:ready,onStateChange:state}
});
}

function ready(){
loadPlaylistItems();
setInterval(updateProgress,250);
}

function state(e){
const cover=document.getElementById("cover");
const playBtn=document.getElementById("play");
const playIcon=document.getElementById("play-icon");

highlightActiveTrack();

if(e.data===YT.PlayerState.PLAYING){
playing=true;
playBtn.classList.add("playing");
playIcon.innerHTML='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
cover.classList.add("spinning");
updateInfo();
}
else if(e.data===YT.PlayerState.PAUSED){
playing=false;
playBtn.classList.remove("playing");
playIcon.innerHTML='<path d="M8 5v14l11-7z"/>';
cover.classList.remove("spinning");
}
else if(e.data===YT.PlayerState.ENDED){
playing=false;
playBtn.classList.remove("playing");
playIcon.innerHTML='<path d="M8 5v14l11-7z"/>';
cover.classList.remove("spinning");
if(!changingTrack){
setTimeout(nextSong,100);
}
}
}

function togglePlay(){
if(!player)return;
try{
if(playing){
player.pauseVideo();
}else{
const currentId=player.getVideoData() && player.getVideoData().video_id;
if(sortedPlaylistItems.length && sortingReady && !currentId){
player.loadVideoById(sortedPlaylistItems[currentSortedIndex]);
}else{
player.playVideo();
}
}
}catch(e){}
}

function toggleVideoPopup(){
const coverWrapper=document.getElementById("coverWrapper");
const icon=document.getElementById("videoToggleIcon");
if(!coverWrapper)return;

const opening=!coverWrapper.classList.contains("video-active");

if(opening){
coverWrapper.classList.add("video-active");
icon.innerHTML='<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>';
}else{
coverWrapper.classList.remove("video-active");
icon.innerHTML='<path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>';
}
}

function nextSong(){
if(!player || !sortedPlaylistItems.length)return;
const id=player.getVideoData() && player.getVideoData().video_id;
const found=sortedPlaylistItems.indexOf(id);
if(found!==-1){currentSortedIndex=found;}
currentSortedIndex=(currentSortedIndex+1)%sortedPlaylistItems.length;
playSpecificTrack(currentSortedIndex);
}

function previousSong(){
if(!player || !sortedPlaylistItems.length)return;
const id=player.getVideoData() && player.getVideoData().video_id;
const found=sortedPlaylistItems.indexOf(id);
if(found!==-1){currentSortedIndex=found;}
currentSortedIndex=(currentSortedIndex-1+sortedPlaylistItems.length)%sortedPlaylistItems.length;
playSpecificTrack(currentSortedIndex);
}

function forceUpdateUI(index){
if(!sortedPlaylistData[index])return;
const data=sortedPlaylistData[index];
document.getElementById("cover").src=`https://i.ytimg.com/vi/${data.id}/hqdefault.jpg`;
document.getElementById("title").textContent=data.title || "YouTube Music";
document.getElementById("artist").textContent=data.artist || "YouTube Music";
currentSortedIndex=index;
highlightActiveTrack();
}

function getSeekPosition(clientX,el){
const rect=el.getBoundingClientRect();
if(!rect.width)return 0;
return Math.max(0,Math.min(1,(clientX-rect.left)/rect.width));
}

const seekElement=document.getElementById("seek");

seekElement.addEventListener("pointerdown",e=>{
e.preventDefault();
e.stopPropagation();
isDragging=true;
try{seekElement.setPointerCapture(e.pointerId);}catch(err){}
updateSeekVisual(getSeekPosition(e.clientX,seekElement));
},{passive:false});

seekElement.addEventListener("pointermove",e=>{
if(!isDragging)return;
e.preventDefault();
e.stopPropagation();
updateSeekVisual(getSeekPosition(e.clientX,seekElement));
},{passive:false});

seekElement.addEventListener("pointerup",e=>{
if(!isDragging)return;
e.preventDefault();
e.stopPropagation();
const pos=getSeekPosition(e.clientX,seekElement);
updateSeekVisual(pos);
if(player){
const duration=player.getDuration();
if(duration){player.seekTo(pos*duration,true);}
}
isDragging=false;
try{seekElement.releasePointerCapture(e.pointerId);}catch(err){}
},{passive:false});

function updateSeekVisual(pos){
document.getElementById("fill").style.width=(pos*100)+"%";
if(player){
const duration=player.getDuration();
if(duration){
document.getElementById("current").textContent=format(pos*duration)+" / "+format(duration);
document.getElementById("duration").textContent=format(duration);
}
}
}

function updateProgress(){
if(isDragging || !player)return;
try{
const current=player.getCurrentTime();
const duration=player.getDuration();
if(!duration)return;
const pos=Math.max(0,Math.min(1,current/duration));
document.getElementById("fill").style.width=(pos*100)+"%";
document.getElementById("current").textContent=format(current)+" / "+format(duration);
document.getElementById("duration").textContent=format(duration);
}catch(e){}
}

function format(s){
if(!s || isNaN(s))return "0:00";
s=Math.floor(s);
return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}

function loadPlaylistItems(){
if(!player || typeof player.getPlaylist!=="function")return;
const ids=player.getPlaylist();
if(!ids || !ids.length){
setTimeout(loadPlaylistItems,600);
return;
}
playlistItems=ids;
sortedPlaylistItems=[];
sortedPlaylistData=[];
sortingReady=false;

Promise.all(
ids.map((id,index)=>
fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`)
.then(r=>r.json())
.then(data=>({
id:id,
title:data && data.title ? data.title : `Track #${index+1}`,
artist:data && data.author_name ? data.author_name : "YouTube Music",
originalIndex:index
}))
.catch(()=>({
id:id,
title:`Track #${index+1}`,
artist:"YouTube Music",
originalIndex:index
}))
)
)
.then(results=>{
results.sort((a,b)=>a.title.localeCompare(b.title,undefined,{numeric:true,sensitivity:"base"}));
sortedPlaylistData=results;
sortedPlaylistItems=results.map(x=>x.id);
sortingReady=true;

const currentId=player.getVideoData() && player.getVideoData().video_id;
const idx=sortedPlaylistItems.indexOf(currentId);
if(idx!==-1){currentSortedIndex=idx;}
renderSortedPlaylists();
highlightActiveTrack();
updateInfo();
});
}

function renderSortedPlaylists(){
const list=document.getElementById("songList");
list.innerHTML="";
sortedPlaylistData.forEach((data,index)=>{
const item=document.createElement("div");
item.className="song-item";
item.id=`track-${index}`;
item.onclick=()=>playSpecificTrack(index);
item.innerHTML=`
<img src="https://i.ytimg.com/vi/${data.id}/hqdefault.jpg" alt="thumb">
<div class="song-item-info">
<div class="song-item-title">${escapeHtml(data.title)}</div>
<div class="song-item-artist">${escapeHtml(data.artist)}</div>
</div>
`;
list.appendChild(item);
});
}

function escapeHtml(text){
if(!text)return "";
const div=document.createElement("div");
div.textContent=text;
return div.innerHTML;
}

function playSpecificTrack(index){
if(!player || !sortedPlaylistData[index])return;
currentSortedIndex=index;
forceUpdateUI(index);
changingTrack=true;

try{
player.loadVideoById(sortedPlaylistData[index].id);
}catch(e){
changingTrack=false;
return;
}

setTimeout(()=>{
changingTrack=false;
},700);

document.getElementById("drawer").classList.remove("open");
document.getElementById("overlay").classList.remove("active");
highlightActiveTrack();
}

function highlightActiveTrack(){
if(!sortedPlaylistItems.length || !player)return;
let id="";
try{
id=player.getVideoData() && player.getVideoData().video_id;
}catch(e){}

document.querySelectorAll(".song-item").forEach((item,index)=>{
item.classList.toggle("active",sortedPlaylistItems[index]===id);
});
}

function updateInfo(){
if(!player)return;
try{
const d=player.getVideoData();
if(!d || !d.video_id)return;
document.getElementById("cover").src=`https://i.ytimg.com/vi/${d.video_id}/hqdefault.jpg`;
if(d.title){document.getElementById("title").textContent=d.title;}
if(d.author){document.getElementById("artist").textContent=d.author;}
const idx=sortedPlaylistItems.indexOf(d.video_id);
if(idx!==-1){currentSortedIndex=idx;}
highlightActiveTrack();
}catch(e){}
}

function toggleDrawer(){
const drawer=document.getElementById("drawer");
const overlay=document.getElementById("overlay");
const opening=!drawer.classList.contains("open");

drawer.classList.toggle("open",opening);
overlay.classList.toggle("active",opening);

if(opening && !sortingReady){
loadPlaylistItems();
}
}
</script>

</body>
</html>
