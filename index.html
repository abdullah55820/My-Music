<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>My Music Player</title>

<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">

<link rel="apple-touch-icon"
sizes="180x180"
href="logo.png">

<link rel="icon"
type="image/png"
href="logo.png">

<style>

/* =========================================================
   RESET
========================================================= */

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
}

body{
font-family:
-apple-system,
BlinkMacSystemFont,
"Helvetica Neue",
Arial,
sans-serif;

background:#d8d8d8;
color:#111;
}


/* =========================================================
   BACKGROUND
========================================================= */

.bg{
position:fixed;
inset:0;

background-image:url("background.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;

filter:saturate(.7);

z-index:-5;
}

.bg::after{
content:"";

position:absolute;
inset:0;

background:rgba(0,0,0,.28);
}


/* =========================================================
   CLOCK
========================================================= */

.digital-clock{
position:fixed;

top:6%;
left:50%;

transform:translateX(-50%);

text-align:center;

z-index:10;

color:white;

text-shadow:
0 2px 8px rgba(0,0,0,.8);
}

.clock-time{
font-size:clamp(28px,7vw,48px);

font-weight:700;

letter-spacing:1px;
}

.clock-date{
margin-top:4px;

font-size:11px;

font-weight:600;

letter-spacing:1.5px;
}

body.popup-active .digital-clock{
display:none;
}


/* =========================================================
   MAIN AREA
========================================================= */

.app{
position:relative;

height:100dvh;
width:100%;

display:flex;

align-items:flex-end;
justify-content:center;

padding:0 15px 35px;

z-index:5;
}


/* =========================================================
   IPOD BODY
========================================================= */

.player{
position:relative;

width:min(390px,94vw);

height:430px;

padding:18px;

border-radius:27px;

background:
linear-gradient(
135deg,
#fafafa 0%,
#e9e9e9 45%,
#cfcfcf 100%
);

border:1px solid #999;

box-shadow:
0 25px 55px rgba(0,0,0,.55),
inset 0 1px 1px white,
inset 0 -2px 4px rgba(0,0,0,.15);

display:flex;

flex-direction:column;

align-items:center;

touch-action:none;

overflow:hidden;
}


/* =========================================================
   IPOD TOP TEXT
========================================================= */

.ipod-brand{
width:100%;

display:flex;

align-items:center;
justify-content:center;

font-size:11px;

font-weight:700;

letter-spacing:3px;

color:#555;

margin-bottom:10px;
}


/* =========================================================
   SCREEN
========================================================= */

.screen{
position:relative;

width:100%;

height:215px;

background:
linear-gradient(
180deg,
#fafafa,
#e1e1e1
);

border:2px solid #777;

border-radius:6px;

overflow:hidden;

box-shadow:
inset 0 2px 8px rgba(0,0,0,.18),
0 2px 3px rgba(0,0,0,.25);
}


/* =========================================================
   SCREEN HEADER
========================================================= */

.screen-header{
height:28px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 8px;

font-size:10px;

font-weight:700;

background:
linear-gradient(
180deg,
#777,
#333
);

color:white;

text-shadow:
0 1px 1px #000;
}

.screen-header-title{
white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

max-width:75%;
}

.screen-header-icon{
font-size:9px;
}


/* =========================================================
   NOW PLAYING
========================================================= */

.now-playing{
height:187px;

padding:9px;

display:flex;

gap:10px;
}


/* =========================================================
   ALBUM ART
========================================================= */

.album-area{
width:118px;

flex-shrink:0;

display:flex;

align-items:center;
justify-content:center;
}

.cover-wrapper{
width:108px;
height:108px;

border-radius:4px;

overflow:hidden;

background:#222;

border:1px solid #555;

box-shadow:
0 3px 7px rgba(0,0,0,.35);
}

.cover{
width:100%;
height:100%;

display:block;

object-fit:cover;

animation:none!important;
}


/* =========================================================
   SONG INFORMATION
========================================================= */

.song-area{
flex:1;

min-width:0;

display:flex;

flex-direction:column;

justify-content:center;
}

.title{
font-size:14px;

font-weight:700;

line-height:1.15;

color:#111;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;
}

.artist{
font-size:10px;

color:#555;

margin-top:4px;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;
}


/* =========================================================
   PROGRESS
========================================================= */

.seek{
position:relative;

width:100%;

height:7px;

margin-top:16px;

background:#aaa;

border:1px solid #777;

border-radius:1px;

cursor:pointer;

touch-action:none;
}

.fill{
position:absolute;

left:0;
top:0;

height:100%;

width:0;

background:
linear-gradient(
180deg,
#777,
#222
);

border-radius:0;

pointer-events:none;
}

.time-info{
display:flex;

justify-content:space-between;

font-size:9px;

color:#555;

margin-top:4px;

font-variant-numeric:tabular-nums;
}


/* =========================================================
   CLICK WHEEL
========================================================= */

.click-wheel{
position:relative;

width:165px;
height:165px;

margin-top:18px;

border-radius:50%;

background:
radial-gradient(
circle at 35% 30%,
#fafafa,
#e3e3e3 48%,
#c3c3c3 100%
);

border:1px solid #999;

box-shadow:
0 5px 12px rgba(0,0,0,.28),
inset 0 1px 2px white,
inset 0 -2px 5px rgba(0,0,0,.15);

flex-shrink:0;
}


/* =========================================================
   WHEEL CENTER
========================================================= */

.wheel-center{
position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%);

width:65px;
height:65px;

border-radius:50%;

background:
linear-gradient(
180deg,
#f7f7f7,
#d1d1d1
);

border:1px solid #aaa;

box-shadow:
inset 0 1px 2px white,
0 2px 4px rgba(0,0,0,.2);

display:flex;

align-items:center;
justify-content:center;

font-size:10px;

font-weight:700;

color:#555;
}


/* =========================================================
   WHEEL BUTTONS
========================================================= */

.wheel-btn{
position:absolute;

border:0;

background:transparent;

color:#555;

font-weight:800;

font-size:12px;

cursor:pointer;

display:flex;

align-items:center;
justify-content:center;

width:40px;
height:35px;
}

.wheel-btn:active{
transform:scale(.88);
color:#111;
}

.wheel-menu{
top:10px;
left:50%;

transform:translateX(-50%);
}

.wheel-menu:active{
transform:translateX(-50%) scale(.88);
}

.wheel-prev{
left:12px;
top:50%;

transform:translateY(-50%);
}

.wheel-prev:active{
transform:translateY(-50%) scale(.88);
}

.wheel-next{
right:12px;
top:50%;

transform:translateY(-50%);
}

.wheel-next:active{
transform:translateY(-50%) scale(.88);
}

.wheel-play{
bottom:9px;
left:50%;

transform:translateX(-50%);
}

.wheel-play:active{
transform:translateX(-50%) scale(.88);
}


/* =========================================================
   VIDEO BUTTON
========================================================= */

.video-button{
position:absolute;

right:8px;
bottom:8px;

width:25px;
height:25px;

border-radius:50%;

border:1px solid #999;

background:#eee;

color:#444;

font-size:10px;

cursor:pointer;
}


/* =========================================================
   DRAWER
========================================================= */

.drawer-overlay{
position:fixed;

inset:0;

background:rgba(0,0,0,.35);

z-index:90;

display:none;
}

.drawer-overlay.active{
display:block;
}

.playlist-drawer{
position:fixed;

top:50%;
right:-310px;

transform:translateY(-50%);

width:290px;

height:85vh;

background:
linear-gradient(
180deg,
#f5f5f5,
#d7d7d7
);

border:1px solid #888;

border-radius:12px 0 0 12px;

box-shadow:
-10px 15px 35px rgba(0,0,0,.45);

z-index:100;

transition:right .35s cubic-bezier(.2,.8,.2,1);

display:flex;

flex-direction:column;

overflow:hidden;
}

.playlist-drawer.open{
right:0;
}


/* =========================================================
   DRAWER HEADER
========================================================= */

.drawer-header{
height:48px;

display:flex;

align-items:center;

gap:6px;

padding:6px 8px;

background:
linear-gradient(
180deg,
#777,
#333
);

color:white;
}

.drawer-title{
font-size:12px;

font-weight:700;

padding:5px;

white-space:nowrap;

cursor:pointer;
}

.drawer-search-container{
position:relative;

flex:1;
}

.drawer-search-box{
width:100%;

height:28px;

padding:0 22px 0 8px;

border-radius:5px;

border:1px solid #555;

background:#f5f5f5;

font-size:10px;

outline:none;
}

.search-clear-btn{
position:absolute;

right:2px;
top:2px;

width:24px;
height:24px;

border:0;

background:transparent;

font-size:18px;

color:#555;

display:none;
}


/* =========================================================
   SONG LIST
========================================================= */

.song-list{
flex:1;

overflow-y:auto;

padding:8px;

display:flex;

flex-direction:column;

gap:3px;
}

.song-list::-webkit-scrollbar{
width:5px;
}

.song-list::-webkit-scrollbar-thumb{
background:#999;

border-radius:5px;
}

.song-item{
display:flex;

align-items:center;

gap:7px;

padding:5px;

min-height:40px;

background:#eee;

border:1px solid #aaa;

border-radius:4px;

cursor:pointer;
}

.song-item:hover,
.song-item.active{
background:
linear-gradient(
180deg,
#777,
#444
);

color:white;
}

.song-item img{
width:32px;
height:32px;

object-fit:cover;

border-radius:2px;

flex-shrink:0;
}

.song-item-info{
min-width:0;

flex:1;
}

.song-item-title{
font-size:10px;

font-weight:700;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;
}

.song-item-artist{
font-size:8px;

margin-top:2px;

opacity:.7;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;
}


/* =========================================================
   VIDEO POPUP
========================================================= */

.video-overlay{
position:fixed;

inset:0;

background:rgba(0,0,0,.55);

z-index:200;

display:none;
}

.video-overlay.active{
display:block;
}

.video-section{
position:fixed;

top:50%;
left:50%;

transform:translate(-50%,-50%);

width:min(760px,92vw);

z-index:210;

display:none;
}

body.popup-active .video-section{
display:block;
}

.video-popup{
width:100%;

aspect-ratio:16/9;

background:#000;

border:5px solid #d5d5d5;

border-radius:7px;

box-shadow:
0 20px 60px rgba(0,0,0,.8);

overflow:hidden;
}

#yt{
width:100%;
height:100%;
}

#yt iframe{
width:100%!important;
height:100%!important;

border:0;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:480px){

.app{
padding-bottom:25px;
}

.player{
width:94vw;

height:410px;

padding:15px;

border-radius:24px;
}

.screen{
height:200px;
}

.now-playing{
height:172px;
}

.album-area{
width:100px;
}

.cover-wrapper{
width:92px;
height:92px;
}

.title{
font-size:12px;
}

.artist{
font-size:9px;
}

.seek{
margin-top:12px;
}

.click-wheel{
width:155px;
height:155px;

margin-top:17px;
}

.wheel-center{
width:61px;
height:61px;
}

.playlist-drawer{
width:88vw;

height:88vh;
}

}


/* =========================================================
   SMALL HEIGHT
========================================================= */

@media(max-height:700px){

.player{
height:365px;
}

.screen{
height:175px;
}

.now-playing{
height:147px;
}

.album-area{
width:90px;
}

.cover-wrapper{
width:80px;
height:80px;
}

.click-wheel{
width:135px;
height:135px;

margin-top:10px;
}

.wheel-center{
width:53px;
height:53px;
}

}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:769px){

.bg{
background-image:url("desktop.jpg");
}

.app{
padding-bottom:45px;
}

.player{
width:390px;
height:430px;
}

}


/* =========================================================
   POPUP DESKTOP
========================================================= */

@media(min-width:769px){

.video-section{
width:min(720px,70vw);
}

}


/* =========================================================
   HIDE OLD VIDEO PLAYLIST
========================================================= */

.video-playlist,
.video-song-list,
.video-song-item{
display:none!important;
}

</style>
</head>


<body>

<div class="app">

id="playerCard"
class="player">

iPod
</div>

     SCREEN
===================================================== -->

<div class="screen-header">

id="screenTitle"
class="screen-header-title">
Now Playing

</div>

</div>

class="cover"

alt="Album">

<script src="https://www.youtube.com/iframe_api"></script>

<script>

/* =========================================================
CLOCK
========================================================= */

function updateDigitalClock(){

const now=new Date();

const time=
new Intl.DateTimeFormat(
"en-US",
{
timeZone:"Asia/Dhaka",
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:true
}
).format(now);

const date=
new Intl.DateTimeFormat(
"en-US",
{
timeZone:"Asia/Dhaka",
day:"2-digit",
month:"long",
year:"numeric"
}
).format(now);

document.getElementById(
"clockTime"
).textContent=time;

document.getElementById(
"clockDate"
).textContent=
date.toUpperCase();

}

updateDigitalClock();

setInterval(
updateDigitalClock,
1000
);


/* =========================================================
YOUTUBE
========================================================= */

const PLAYLIST_ID="PLbvY05KVYwoo";

let player=null;

let playing=false;

let playlistItems=[];

let sortedPlaylistItems=[];

let sortedPlaylistData=[];

let currentSortedIndex=0;

let sortingReady=false;

let isDragging=false;

let changingTrack=false;


/* =========================================================
YOUTUBE READY
========================================================= */

function onYouTubeIframeAPIReady(){

player=new YT.Player(
"yt",
{

width:"100%",
height:"100%",

playerVars:{
autoplay:0,
controls:1,
disablekb:0,
fs:1,
modestbranding:1,
playsinline:1,
rel:0,
iv_load_policy:3,
listType:"playlist",
list:PLAYLIST_ID
},

events:{
onReady:ready,
onStateChange:state
}

});

}


/* =========================================================
READY
========================================================= */

function ready(){

loadPlaylistItems();

setInterval(
updateProgress,
250
);

}


/* =========================================================
STATE
========================================================= */

function state(e){

const playIcon=
document.getElementById(
"wheelPlayIcon"
);

if(
e.data===YT.PlayerState.PLAYING
){

playing=true;

playIcon.textContent="Ⅱ";

updateInfo();

}

else if(
e.data===YT.PlayerState.PAUSED
){

playing=false;

playIcon.textContent="▶";

}

else if(
e.data===YT.PlayerState.ENDED
){

playing=false;

playIcon.textContent="▶";

if(!changingTrack){

setTimeout(
nextSong,
100
);

}

}

highlightActiveTrack();

}


/* =========================================================
PLAY / PAUSE
========================================================= */

function togglePlay(){

if(!player)
return;

try{

if(playing){

player.pauseVideo();

}

else{

player.playVideo();

}

}
catch(e){}

}


/* =========================================================
NEXT
========================================================= */

function nextSong(){

if(
!player ||
sortedPlaylistItems.length===0
)
return;

let currentId="";

try{

currentId=
player.getVideoData().video_id;

}
catch(e){}

const found=
sortedPlaylistItems.indexOf(
currentId
);

if(found!==-1){

currentSortedIndex=found;

}

currentSortedIndex=
(
currentSortedIndex+1
)%
sortedPlaylistItems.length;

playSpecificTrack(
currentSortedIndex
);

}


/* =========================================================
PREVIOUS
========================================================= */

function previousSong(){

if(
!player ||
sortedPlaylistItems.length===0
)
return;

let currentId="";

try{

currentId=
player.getVideoData().video_id;

}
catch(e){}

const found=
sortedPlaylistItems.indexOf(
currentId
);

if(found!==-1){

currentSortedIndex=found;

}

currentSortedIndex=
(
currentSortedIndex-1+
sortedPlaylistItems.length
)%
sortedPlaylistItems.length;

playSpecificTrack(
currentSortedIndex
);

}


/* =========================================================
UPDATE INFO
========================================================= */

function updateInfo(){

if(
!player ||
typeof player.getVideoData!=="function"
)
return;

try{

const data=
player.getVideoData();

if(
!data ||
!data.video_id
)
return;

document.getElementById(
"cover"
).src=
`https://i.ytimg.com/vi/${data.video_id}/hqdefault.jpg`;

document.getElementById(
"title"
).textContent=
data.title ||
"YouTube Music";

document.getElementById(
"artist"
).textContent=
data.author ||
"YouTube Music";

document.getElementById(
"screenTitle"
).textContent=
"Now Playing";

}
catch(e){}

}


/* =========================================================
FORCE UI
========================================================= */

function forceUpdateUI(index){

if(
!sortedPlaylistData[index]
)
return;

const data=
sortedPlaylistData[index];

document.getElementById(
"cover"
).src=
`https://i.ytimg.com/vi/${data.id}/hqdefault.jpg`;

document.getElementById(
"title"
).textContent=
data.title;

document.getElementById(
"artist"
).textContent=
data.artist;

}


/* =========================================================
PLAY SPECIFIC
========================================================= */

function playSpecificTrack(index){

if(
!player ||
!sortedPlaylistData[index]
)
return;

currentSortedIndex=index;

forceUpdateUI(index);

changingTrack=true;

try{

player.loadVideoById(
sortedPlaylistData[index].id
);

}
catch(e){

changingTrack=false;

}

setTimeout(
()=>{
changingTrack=false;
},
700
);

toggleDrawer(false);

}


/* =========================================================
PROGRESS
========================================================= */

function updateProgress(){

if(isDragging)
return;

if(
!player ||
typeof player.getCurrentTime!=="function"
)
return;

try{

const current=
player.getCurrentTime();

const duration=
player.getDuration();

if(!duration)
return;

const pos=
Math.max(
0,
Math.min(
1,
current/duration
)
);

document.getElementById(
"fill"
).style.width=
(pos*100)+"%";

document.getElementById(
"current"
).textContent=
format(current);

document.getElementById(
"duration"
).textContent=
format(duration);

}
catch(e){}

}


/* =========================================================
SEEK
========================================================= */

const seek=
document.getElementById("seek");

function seekPosition(x){

const rect=
seek.getBoundingClientRect();

return Math.max(
0,
Math.min(
1,
(x-rect.left)/rect.width
)
);

}

function seekUpdate(x){

const pos=
seekPosition(x);

document.getElementById(
"fill"
).style.width=
(pos*100)+"%";

return pos;

}


seek.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

isDragging=true;

try{
seek.setPointerCapture(
e.pointerId
);
}
catch(err){}

seekUpdate(e.clientX);

}
);


seek.addEventListener(
"pointermove",
e=>{

if(!isDragging)
return;

e.preventDefault();

seekUpdate(e.clientX);

}
);


seek.addEventListener(
"pointerup",
e=>{

if(!isDragging)
return;

e.preventDefault();

const pos=
seekUpdate(e.clientX);

if(
player &&
player.getDuration()
){

player.seekTo(
pos*player.getDuration(),
true
);

}

isDragging=false;

}
);


/* =========================================================
FORMAT
========================================================= */

function format(seconds){

if(
!seconds ||
isNaN(seconds)
)
return "0:00";

seconds=Math.floor(seconds);

return Math.floor(seconds/60)+":"+
String(
seconds%60
).padStart(2,"0");

}


/* =========================================================
LOAD PLAYLIST
========================================================= */

function loadPlaylistItems(){

if(
!player ||
typeof player.getPlaylist!=="function"
)
return;

const ids=
player.getPlaylist();

if(
!ids ||
ids.length===0
){

setTimeout(
loadPlaylistItems,
600
);

return;

}

playlistItems=ids;

const requests=
ids.map(
(id,index)=>{

return fetch(
`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`
)

.then(
r=>r.json()
)

.then(
data=>({

id:id,

title:
data.title ||
`Track ${index+1}`,

artist:
data.author_name ||
"YouTube Music"

})
)

.catch(
()=>({

id:id,

title:`Track ${index+1}`,

artist:"YouTube Music"

})
);

});


Promise.all(requests)
.then(
results=>{

results.sort(
(a,b)=>
a.title.localeCompare(
b.title,
undefined,
{
numeric:true,
sensitivity:"base"
}
)
);

sortedPlaylistData=results;

sortedPlaylistItems=
results.map(
item=>item.id
);

sortingReady=true;

renderPlaylist();

updateInfo();

});

}


/* =========================================================
RENDER PLAYLIST
========================================================= */

function renderPlaylist(){

const list=
document.getElementById(
"songList"
);

list.innerHTML="";

sortedPlaylistData.forEach(
(data,index)=>{

const item=
document.createElement("div");

item.className="song-item";

item.id=
`track-${index}`;

item.onclick=
()=>playSpecificTrack(index);

item.innerHTML=`

<img
src="https://i.ytimg.com/vi/${data.id}/hqdefault.jpg"
>

<div class="song-item-info">

<div class="song-item-title">
${escapeHtml(data.title)}
</div>

<div class="song-item-artist">
${escapeHtml(data.artist)}
</div>

</div>

`;

list.appendChild(item);

});

highlightActiveTrack();

}


/* =========================================================
ACTIVE TRACK
========================================================= */

function highlightActiveTrack(){

if(
!player ||
sortedPlaylistItems.length===0
)
return;

let currentId="";

try{

currentId=
player.getVideoData().video_id;

}
catch(e){}

document
.querySelectorAll(".song-item")
.forEach(
(item,index)=>{

item.classList.toggle(
"active",
sortedPlaylistItems[index]===currentId
);

});

}


/* =========================================================
SEARCH
========================================================= */

function filterPlaylist(query){

const q=
query.toLowerCase();

const items=
document.querySelectorAll(
".song-item"
);

const clear=
document.getElementById(
"searchClearBtn"
);

clear.style.display=
q ? "block" : "none";

items.forEach(
item=>{

const title=
item
.querySelector(".song-item-title")
.textContent
.toLowerCase();

const artist=
item
.querySelector(".song-item-artist")
.textContent
.toLowerCase();

item.style.display=
(
title.includes(q) ||
artist.includes(q)
)
?
"flex"
:
"none";

});

}


/* =========================================================
CLEAR SEARCH
========================================================= */

function clearSearch(){

const input=
document.getElementById(
"drawerSearch"
);

input.value="";

filterPlaylist("");

}


/* =========================================================
DRAWER
========================================================= */

function toggleDrawer(force){

const drawer=
document.getElementById(
"drawer"
);

const overlay=
document.getElementById(
"overlay"
);

let opening;

if(typeof force==="boolean"){

opening=force;

}
else{

opening=
!drawer.classList.contains("open");

}

drawer.classList.toggle(
"open",
opening
);

overlay.classList.toggle(
"active",
opening
);

if(
opening &&
!sortingReady
){

loadPlaylistItems();

}

}


/* =========================================================
VIDEO POPUP
========================================================= */

function toggleVideoPopup(){

const popup=
document.getElementById(
"videoPopup"
);

const overlay=
document.getElementById(
"videoOverlay"
);

const opening=
!popup.classList.contains(
"active"
);

if(opening){

popup.classList.add("active");

overlay.classList.add("active");

document.body.classList.add(
"popup-active"
);

}
else{

popup.classList.remove("active");

overlay.classList.remove("active");

document.body.classList.remove(
"popup-active"
);

}

}


/* =========================================================
ESCAPE HTML
========================================================= */

function escapeHtml(text){

const div=
document.createElement("div");

div.textContent=text || "";

return div.innerHTML;

}


/* =========================================================
SWIPE PLAYER
========================================================= */

let swipeStartX=0;
let swipeStartY=0;
let swipeActive=false;

const playerCard=
document.getElementById(
"playerCard"
);

playerCard.addEventListener(
"pointerdown",
e=>{

if(
e.target.closest(".click-wheel") ||
e.target.closest(".video-button") ||
e.target.closest(".seek")
)
return;

swipeStartX=e.clientX;

swipeStartY=e.clientY;

swipeActive=true;

}
);

playerCard.addEventListener(
"pointerup",
e=>{

if(!swipeActive)
return;

const dx=
e.clientX-swipeStartX;

const dy=
e.clientY-swipeStartY;

swipeActive=false;

if(
Math.abs(dx)<55 ||
Math.abs(dy)>Math.abs(dx)
)
return;

if(dx<0){

nextSong();

}
else{

previousSong();

}

});


/* =========================================================
KEYBOARD
========================================================= */

document.addEventListener(
"keydown",
e=>{

if(e.code==="Space"){

e.preventDefault();

togglePlay();

}

if(e.key==="ArrowRight"){

nextSong();

}

if(e.key==="ArrowLeft"){

previousSong();

}

if(e.key==="Escape"){

toggleDrawer(false);

const popup=
document.getElementById(
"videoPopup"
);

if(popup.classList.contains("active")){

toggleVideoPopup();

}

}

});


</script>

</body>
</html>
