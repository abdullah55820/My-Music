<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shanti Music</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    html, body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000;
    }
    body {
      /* একটি দারুণ এবং নির্ভরযোগ্য প্রকৃতির ছবি */
      background: url('https://images.unsplash.com/photo-1540206395-68808572332f?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 50px;
    }
    
    /* Saloon.wtf স্টাইল স্বচ্ছ গ্লাস কার্ড */
    .player-container {
      width: 88%;
      max-width: 380px;
      background: rgba(18, 18, 18, 0.4); /* আরও স্বচ্ছ কালো */
      backdrop-filter: blur(15px); /* ব্লার ইফেক্ট */
      -webkit-backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 14px 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
    }

    .song-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .song-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .song-sub {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    /* ইউটিউব ভিডিওর থাম্বনেইল লুকানোর কভার */
    .player-wrapper {
      width: 140px;
      height: 42px;
      overflow: hidden;
      border-radius: 12px;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <div class="song-info">
      <span class="song-title">Chill & Peace Vibes</span>
      <span class="song-sub">YouTube Playlist</span>
    </div>
    
    <div class="player-wrapper">
      <iframe src="https://www.youtube.com/embed/videoseries?list=PLbvY05KVYwoo" allow="autoplay; encrypted-media"></iframe>
    </div>
  </div>

</body>
</html>
