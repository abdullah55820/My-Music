<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #fff;
        }

        .player-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            width: 350px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .cover-art {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            border: 4px solid rgba(255, 255, 255, 0.3);
            animation: rotate 20s linear infinite;
            animation-play-state: paused;
        }

        .cover-art.playing {
            animation-play-state: running;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .track-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist-name {
            font-size: 0.9rem;
            color: #ddd;
            margin-bottom: 20px;
        }

        .progress-container {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            cursor: pointer;
            margin: 15px 0 10px 0;
            height: 6px;
            width: 100%;
        }

        .progress-bar {
            background: #ff4757;
            border-radius: 5px;
            height: 100%;
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #ccc;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
        }

        .btn:hover {
            transform: scale(1.15);
            color: #ff4757;
        }

        .btn-play {
            width: 50px;
            height: 50px;
            background: #ff4757;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
        }

        .btn-play:hover {
            color: #fff;
            background: #ff6b81;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="cover-art" id="cover"></div>
        <div class="track-title" id="title">Song Title</div>
        <div class="artist-name" id="artist">Artist Name</div>

        <audio id="audio" src="song.mp3"></audio>

        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress"></div>
        </div>
        
        <div class="time-stamps">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <button class="btn" id="prev">⏮</button>
            <button class="btn btn-play" id="play">▶</button>
            <button class="btn" id="next">⏭</button>
        </div>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const progress = document.getElementById('progress');
        const progressContainer = document.getElementById('progress-container');
        const title = document.getElementById('title');
        const artist = document.getElementById('artist');
        const cover = document.getElementById('cover');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');

        let isPlaying = false;

        function playSong() {
            isPlaying = true;
            playBtn.innerText = '⏸';
            cover.classList.add('playing');
            audio.play();
        }

        function pauseSong() {
            isPlaying = false;
            playBtn.innerText = '▶';
            cover.classList.remove('playing');
            audio.pause();
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                pauseSong();
            } else {
                playSong();
            }
        });

        audio.addEventListener('timeupdate', (e) => {
            const { duration, currentTime } = e.srcElement;
            if (duration) {
                const progressPercent = (currentTime / duration) * 100;
                progress.style.width = `${progressPercent}%`;

                // Format time
                const formatTime = (time) => Math.floor(time / 60) + ':' + ('0' + Math.floor(time % 60)).slice(-2);
                document.getElementById('current-time').innerText = formatTime(currentTime);
                document.getElementById('duration').innerText = formatTime(duration);
            }
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        });
    </script>
</body>
</html>
