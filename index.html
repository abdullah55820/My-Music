<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>My Music Player</title>

<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preload" as="image" href="background.jpg">

<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">

<style>

*{
box-sizing:border-box;
}

html,
body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#050505;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

body{
position:relative;
overflow-x:hidden!important;
}

/* =========================================================
BACKGROUND
========================================================= */

.bg{
position:fixed;
inset:-20px;

background-image:url("background.jpg");
background-position:center center;
background-size:cover;
background-repeat:no-repeat;

z-index:0;
pointer-events:none;

-webkit-backface-visibility:hidden;
backface-visibility:hidden;
}

.bg::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,.35);
pointer-events:none;
}

body.popup-active .bg{
filter:blur(20px);
-webkit-filter:blur(20px);
transform:scale(1.1);
}

/* =========================================================
TOP WIDGETS
========================================================= */

.top-widgets{
position:fixed;
top:14px;
left:50%;
transform:translateX(-50%);

z-index:2500;

display:flex;
flex-direction:column;
align-items:center;
gap:8px;

pointer-events:auto;
}

.bd-time{
padding:5px 11px;
border-radius:20px;

background:rgba(0,0,0,.45);
border:1px solid rgba(255,255,255,.18);

color:rgba(255,255,255,.9);

font-size:11px;
font-weight:600;
letter-spacing:.3px;

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);

display:flex;
align-items:center;
gap:6px;
}

.live-dot{
width:7px;
height:7px;

background:#ff3b30;
border-radius:50%;

box-shadow:0 0 8px #ff3b30;

animation:pulse 1.5s infinite;
}

@keyframes pulse{

0%{
opacity:1;
transform:scale(1);
}

50%{
opacity:.3;
transform:scale(.8);
}

100%{
opacity:1;
transform:scale(1);
}

}

.playlist-toggle-btn{
padding:5px 12px;

border-radius:20px;

background:rgba(0,0,0,.45);
border:1px solid rgba(255,255,255,.18);

color:rgba(255,255,255,.9);

font-size:11px;
font-weight:600;

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);

display:flex;
align-items:center;
gap:6px;

cursor:pointer;
touch-action:manipulation;

-webkit-tap-highlight-color:transparent;

transition:
transform .2s,
background .2s;
}

.playlist-toggle-btn:active{
transform:scale(.95);
}

.playlist-toggle-btn svg{
width:14px;
height:14px;
fill:#fff;
}

body.popup-active .playlist-toggle-btn{
display:none;
}

/* =========================================================
VIDEO OVERLAY
========================================================= */

.video-overlay{
position:fixed;
inset:0;

z-index:1499;

display:none;

background:transparent;

pointer-events:none!important;
}

.video-overlay.active{
display:block;
pointer-events:none!important;
}

/* =========================================================
VIDEO SECTION
========================================================= */

.video-section{
position:fixed;

top:6%;
left:50%;

transform:translateX(-50%);

width:min(420px,94%);

z-index:1700;

display:flex;
flex-direction:column;
align-items:center;

pointer-events:none;
}

/* =========================================================
VIDEO POPUP
========================================================= */

.video-popup{
position:relative;

width:100%;
aspect-ratio:16 / 9;
height:auto;

background:#000;

border-radius:18px;

overflow:hidden;

z-index:1701;

border:1px solid rgba(255,255,255,.25);

box-shadow:
0 25px 50px rgba(0,0,0,.7);

opacity:0;
visibility:hidden;

pointer-events:none;

transform:scale(.92);

transition:
opacity .3s ease,
transform .3s cubic-bezier(.2,.8,.2,1),
visibility .3s ease;
}

.video-popup.active{
opacity:1;
visibility:visible;

pointer-events:auto;

transform:scale(1);
}

/* =========================================================
YOUTUBE IFRAME
========================================================= */

#yt{
position:absolute;

inset:0;

width:100%;
height:100%;

border:0;
display:block;

pointer-events:auto!important;

touch-action:auto!important;

z-index:1702;
}

#yt iframe{
width:100%!important;
height:100%!important;

border:0;

pointer-events:auto!important;

touch-action:auto!important;
}

/* =========================================================
VIDEO PLAYLIST
========================================================= */

.video-playlist{
width:100%;

margin-top:1px;

max-height:calc(100dvh - 410px);
min-height:80px;

padding:7px;

border-radius:15px;

background:rgba(20,20,20,.52);

border:1px solid rgba(255,255,255,.18);

backdrop-filter:blur(25px) saturate(150%);
-webkit-backdrop-filter:blur(25px) saturate(150%);

box-shadow:
0 15px 40px rgba(0,0,0,.55);

opacity:0;
visibility:hidden;

pointer-events:none;

position:relative;

z-index:1705;

touch-action:pan-y;

-webkit-overflow-scrolling:touch;

overscroll-behavior:contain;

overflow:hidden;

flex-shrink:0;
}

.video-playlist.active{
opacity:1;
visibility:visible;

pointer-events:auto;

touch-action:pan-y;

z-index:1705;
}

/* =========================================================
VIDEO PLAYLIST TITLE
========================================================= */

.video-playlist-title{
font-size:10px;
font-weight:700;

color:rgba(255,255,255,.9);

padding:4px 7px 6px;

border-bottom:1px solid rgba(255,255,255,.13);

margin-bottom:5px;

flex-shrink:0;

pointer-events:none;
}

/* =========================================================
VIDEO SONG LIST
========================================================= */

.video-song-list{
width:100%;

height:calc(100% - 27px);

overflow-y:auto;
overflow-x:hidden;

display:flex;
flex-direction:column;

gap:5px;

touch-action:pan-y;

-webkit-overflow-scrolling:touch;

overscroll-behavior:contain;

scrollbar-width:thin;

pointer-events:auto;

position:relative;

z-index:1706;

-webkit-user-select:none;
user-select:none;
}

.video-song-list::-webkit-scrollbar{
width:3px;
}

.video-song-list::-webkit-scrollbar-thumb{
background:rgba(255,255,255,.35);
border-radius:5px;
}

/* =========================================================
VIDEO SONG ITEM
========================================================= */

.video-song-item{
display:flex;
align-items:center;
gap:9px;

width:100%;
min-height:54px;

padding:7px 8px;

border-radius:10px;

background:rgba(255,255,255,.07);
border:1px solid rgba(255,255,255,.08);

cursor:pointer;

touch-action:manipulation;

-webkit-tap-highlight-color:transparent;

transition:
background .2s ease,
transform .15s ease,
border-color .2s ease;

flex-shrink:0;

pointer-events:auto;

position:relative;
z-index:1707;
}

.video-song-item:active{
transform:scale(.98);
background:rgba(255,255,255,.18);
}

.video-song-item.active{
background:rgba(255,255,255,.20);
border-color:rgba(255,255,255,.30);
}

.video-song-item img{
width:44px;
height:44px;

border-radius:8px;

object-fit:cover;

flex-shrink:0;

pointer-events:none;

-webkit-user-drag:none;
}

.video-song-info{
flex:1;
min-width:0;
pointer-events:none;
}

.video-song-title{
font-size:11.5px;
font-weight:700;

color:#fff;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.video-song-artist{
font-size:9.5px;

color:rgba(255,255,255,.55);

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

margin-top:2px;
}

/* =========================================================
APP
========================================================= */

.app{
position:relative;

z-index:1600;

height:100dvh;
width:100%;

display:flex;

align-items:flex-end;
justify-content:center;

padding:0 16px 20px;

pointer-events:auto;
}

/* =========================================================
MUSIC PLAYER
========================================================= */

.player{
width:min(440px,94%);

height:110px;

padding:12px 18px;

border:1px solid rgba(255,255,255,.18);

border-radius:60px;

background:rgba(20,20,20,.35);

backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);

box-shadow:
0 20px 50px rgba(0,0,0,.45);

display:flex;
align-items:center;

gap:12px;

position:relative;

overflow:hidden;

touch-action:pan-y;

z-index:1601;

transition:
transform .35s cubic-bezier(.2,.8,.2,1),
width .35s ease;
}

/* =========================================================
COVER
========================================================= */

.cover-wrapper{
position:relative;

width:76px;
height:76px;

flex-shrink:0;

display:flex;
align-items:center;
justify-content:center;

border-radius:50%;

overflow:hidden;

border:1px solid rgba(255,255,255,.3);
}

.cover{
width:137%;
height:137%;

margin:-18.5%;

border-radius:50%;

object-fit:cover;
object-position:center;

background:#222;

animation:spin 8s linear infinite;
animation-play-state:paused;
}

.cover-wrapper::after{
content:"";

position:absolute;

width:14px;
height:14px;

background:rgba(20,20,20,.85);

border:2px solid rgba(255,255,255,.3);

border-radius:50%;

left:50%;
top:50%;

transform:translate(-50%,-50%);

z-index:2;
}

.cover.spinning{
animation-play-state:running;
}

@keyframes spin{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}

/* =========================================================
SONG INFO
========================================================= */

.middle{
flex:1;
min-width:0;

display:flex;
flex-direction:column;
justify-content:center;
}

.title{
font-size:15px;

font-weight:700;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

color:#fff;

letter-spacing:.2px;
}

.artist{
font-size:11px;

color:rgba(255,255,255,.65);

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

margin-top:2px;
margin-bottom:6px;
}

/* =========================================================
SEEK
========================================================= */

.seek{
position:relative;

width:100%;
height:4px;

border-radius:10px;

background:rgba(255,255,255,.2);

cursor:pointer;

margin-bottom:4px;

touch-action:none;

user-select:none;
-webkit-user-select:none;
}

.seek::before{
content:"";

position:absolute;

top:-12px;
bottom:-12px;

left:-10px;
right:-10px;

z-index:1;
}

.fill{
position:absolute;

left:0;
top:0;

height:100%;
width:0;

background:#fff;

border-radius:10px;

pointer-events:none;

z-index:2;
}

.time-display{
font-size:10.5px;

color:rgba(255,255,255,.65);

font-variant-numeric:tabular-nums;
}

/* =========================================================
CONTROLS
========================================================= */

.controls{
display:flex;

align-items:center;

gap:8px;

flex-shrink:0;

position:relative;

z-index:1610;
}

.btn{
width:26px;
height:26px;

border:0;

background:transparent;

color:rgba(255,255,255,.9);

display:flex;

align-items:center;
justify-content:center;

cursor:pointer;

padding:0;

touch-action:manipulation;

-webkit-tap-highlight-color:transparent;

position:relative;

z-index:1611;
}

.btn svg{
width:18px;
height:18px;

fill:#fff;
}

/* =========================================================
VOLUME
========================================================= */

.vol-container{
display:flex;

align-items:center;
gap:4px;

background:rgba(0,0,0,.25);

border:1px solid rgba(255,255,255,.15);

padding:4px 6px;

border-radius:20px;

backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);
}

.vol-slider-wrapper{
width:0;

overflow:hidden;

opacity:0;

display:flex;
align-items:center;

transition:
width .28s cubic-bezier(.2,.8,.2,1),
opacity .2s ease;
}

.vol-slider-wrapper.active{
width:55px;

opacity:1;

margin-left:2px;
}

.vol-slider{
-webkit-appearance:none;
appearance:none;

width:55px;
height:3.5px;

background:rgba(255,255,255,.3);

border-radius:10px;

outline:none;

cursor:pointer;
}

.vol-slider::-webkit-slider-thumb{
-webkit-appearance:none;
appearance:none;

width:10px;
height:10px;

border-radius:50%;

background:#fff;

cursor:pointer;

box-shadow:0 0 5px rgba(0,0,0,.5);
}

@supports (-webkit-touch-callout:none){

.vol-container{
display:none!important;
}

}

/* =========================================================
PLAY
========================================================= */

.play{
width:40px;
height:40px;

border-radius:50%;

border:0;

background:#fff;

color:#000;

display:flex;

align-items:center;
justify-content:center;

box-shadow:
0 4px 15px rgba(0,0,0,.3);

cursor:pointer;

flex-shrink:0;

touch-action:manipulation;

-webkit-tap-highlight-color:transparent;

position:relative;

z-index:1611;
}

.play svg{
width:18px;
height:18px;

fill:#000;

margin-left:2px;
}

.play.playing svg{
margin-left:0;
}

.btn:active,
.play:active{
transform:scale(.90);
}

/* =========================================================
3D COVERFLOW SECTION (DESKTOP & SWIPE CARDS - MORE COMPACT)
========================================================= */
.coverflow-wrapper{
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100vw;
    height: 48vh; 
    display: none; 
    justify-content: center;
    align-items: center;
    perspective: 1200px;
    z-index: 1500;
    pointer-events: none; /* যাতে অন্য লেয়ারের টাচ ব্লক না করে */
}

body.desktop-coverflow .coverflow-wrapper {
    display: flex;
}

.coverflow-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: auto;
}

.song-card {
    position: absolute;
    width: 150px;  
    height: 220px; 
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    padding: 8px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    transition: all 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
    cursor: pointer;
    text-align: center;
    opacity: 0;
    pointer-events: none; /* ডিফল্টভাবে অফ থাকবে */
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}

.song-card.active,
.song-card.prev-1,
.song-card.prev-2,
.song-card.next-1,
.song-card.next-2 {
    pointer-events: auto !important; /* দৃশ্যমান কার্ডগুলোতে টাচ অন রাখা হলো */
}

.song-card img {
    width: 100%;
    height: 130px; 
    object-fit: cover;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    pointer-events: none;
}

.song-card .card-info {
    margin-top: 8px;
    pointer-events: none;
}

.song-card .card-title {
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #fff;
}

.song-card .card-artist {
    font-size: 9px;
    color: rgba(255, 255, 255, 0.65);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.song-card.active {
    transform: translateX(0) scale(1.05) translateZ(0);
    z-index: 10;
    opacity: 1;
    border-color: rgba(255, 255, 255, 0.4);
}

.song-card.prev-1 {
    transform: translateX(-110px) scale(0.82) rotateY(20deg);
    z-index: 8;
    opacity: 0.7;
}

.song-card.prev-2 {
    transform: translateX(-200px) scale(0.68) rotateY(30deg);
    z-index: 6;
    opacity: 0.3;
}

.song-card.next-1 {
    transform: translateX(110px) scale(0.82) rotateY(-20deg);
    z-index: 8;
    opacity: 0.7;
}

.song-card.next-2 {
    transform: translateX(200px) scale(0.68) rotateY(-30deg);
    z-index: 6;
    opacity: 0.3;
}


/* =========================================================
DESKTOP
========================================================= */

.app{
height:100dvh;
width:100%;

display:flex;

align-items:flex-end;
justify-content:center;

padding:0 40px 20px;
}

.player{
width:min(540px,70vw);

height:115px;

margin:0;

transform:none;
transform-origin:left bottom;
}

.video-section{
display:none;

position:fixed;

top:4vh;
right:4vw;
left:auto;

transform:none;

width:min(620px,42vw);

height:92dvh;

z-index:1700;

pointer-events:none;
}

.top-widgets{
display:flex;

top:14px;
left:50%;

transform:translateX(-50%);

z-index:2500;
}

body.popup-active .app{

display:flex;

align-items:flex-end;
justify-content:flex-start;

padding:0 40px 20px;
}

body.popup-active .player{

width:min(760px,52vw);

margin:0;

transform:translateX(-5px) scale(.92);

transform-origin:left bottom;

z-index:1601;
}

body.popup-active .video-section{

display:flex;

flex-direction:column;

align-items:stretch;

position:fixed;

top:4vh;
right:4vw;
left:auto;

transform:none;

width:min(620px,42vw);

height:92dvh;

opacity:1;

pointer-events:none;

z-index:1700;
}

body.popup-active .video-popup{

position:relative;

width:100%;

aspect-ratio:16 / 9;

height:auto;

flex-shrink:0;

margin:0;

}

body.popup-active .video-playlist{

}

body.popup-active .video-song-list{

overflow-x:hidden;

}

body.popup-active .top-widgets{

top:14px;

left:calc(
35px + min(349.6px, 23.92vw)
);

}

body.popup-active .playlist-toggle-btn{

}

body.popup-active .controls{

}

body.popup-active .video-song-item{

}

@media(max-height:800px){

body.popup-active .video-section{

top:3vh;

height:94dvh;
}

body.popup-active .video-popup{

}

body.popup-active .video-playlist{

}

}

}

MOBILE
========================================================= */

}

}

height:72px;
}

.title{

}

.artist{

}

height:38px;
}

}

.bd-time{

}

}

}

}

.video-popup{

}

}

}

/* =========================================================
SMALL HEIGHT
========================================================= */

@media(max-height:700px){

.video-section{
top:3%;
}

.video-popup{

height:auto;
}

.video-playlist{
max-height:calc(100dvh - 300px);

min-height:70px;

margin-top:1px;
}

.video-song-item{
min-height:48px;
}

.video-song-item img{
width:40px;
height:40px;
}

}


/* =========================================================
VERY SMALL WIDTH
========================================================= */

@media(max-width:360px){

.video-section{
width:96%;
}

.video-playlist{
margin-top:1px;

padding:6px;

max-height:calc(100dvh - 300px);
}

.video-song-item{
min-height:48px;

padding:5px 6px;

<script>

const PLAYLIST_ID="PLbvY05KVYwoo";

let player=null;
let playing=false;

let playlistItems=[];
let sortedPlaylistItems=[];
let sortedPlaylistData=[];

let currentSortedIndex=0;
let sortingReady=false;

let volTimer=null;
let isDragging=false;

let swipeStartX=0;
let swipeStartY=0;
let swipeActive=false;
let swipeFromSeek=false;

let changingTrack=false;


/* =========================================================
BD TIME
========================================================= */

function updateBDTime(){

const options={

timeZone:"Asia/Dhaka",

hour:"2-digit",
minute:"2-digit",
second:"2-digit",

hour12:true

};

document.getElementById(
"bdTimeVal"
).textContent=

new Intl.DateTimeFormat(
"en-US",
options
).format(new Date());

}

updateBDTime();

setInterval(
updateBDTime,
1000
);


/* =========================================================
YOUTUBE API
========================================================= */

function onYouTubeIframeAPIReady(){

player=new YT.Player(
"yt",
{

width:"100%",
height:"100%",

playerVars:{

autoplay:0,

controls:1,

disablekb:0,

fs:1,

modestbranding:1,

playsinline:1,

rel:0,

iv_load_policy:3,

listType:"playlist",

list:PLAYLIST_ID

},

events:{

onReady:ready,
onStateChange:state

}

});

}


/* =========================================================
READY
========================================================= */

function ready(){

loadPlaylistItems();

setInterval(
updateProgress,
250
);

updateDesktopCoverflowState();

}


/* =========================================================
PLAYER STATE
========================================================= */

function state(e){

const cover=
document.getElementById("cover");

const playBtn=
document.getElementById("play");

const playIcon=
document.getElementById("play-icon");

highlightActiveTrack();
highlightVideoActiveTrack();
renderCoverflow();

if(
e.data===YT.PlayerState.PLAYING
){

playing=true;

playBtn.classList.add(
"playing"
);

playIcon.innerHTML=
'<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

cover.classList.add(
"spinning"
);

updateInfo();

}

else if(
e.data===YT.PlayerState.PAUSED
){

playing=false;

playBtn.classList.remove(
"playing"
);

playIcon.innerHTML=
'<path d="M8 5v14l11-7z"/>';

cover.classList.remove(
"spinning"
);

}

else if(
e.data===YT.PlayerState.ENDED
){

playing=false;

playBtn.classList.remove(
"playing"
);

playIcon.innerHTML=
'<path d="M8 5v14l11-7z"/>';

cover.classList.remove(
"spinning"
);

if(!changingTrack){

setTimeout(
nextSong,
100
);

}

}

}


/* =========================================================
PLAY / PAUSE
========================================================= */

function togglePlay(){

if(!player)return;

try{

if(playing){

player.pauseVideo();

}

else{

const currentId=
player.getVideoData() &&
player.getVideoData().video_id;

if(
sortedPlaylistItems.length>0 &&
sortingReady &&
!currentId
){

player.loadVideoById(
sortedPlaylistItems[currentSortedIndex]
);

}

else{

player.playVideo();

}

}

}
catch(e){}

}


/* =========================================================
VIDEO POPUP & DESKTOP COVERFLOW TOGGLE LOGIC
========================================================= */

function updateDesktopCoverflowState() {
    const popup = document.getElementById("videoPopup");
    const isPopupActive = popup.classList.contains("active");
    
    if (window.innerWidth >= 769 && !isPopupActive) {
        document.body.classList.add("desktop-coverflow");
        renderCoverflow();
    } else {
        document.body.classList.remove("desktop-coverflow");
    }
}

function toggleVideoPopup(){

const popup=
document.getElementById(
"videoPopup"
);

const overlay=
document.getElementById(
"videoOverlay"
);

const videoPlaylist=
document.getElementById(
"videoPlaylist"
);

const iconSvg=
document.getElementById(
"videoToggleIcon"
);

const opening=
!popup.classList.contains(
"active"
);

if(opening){

popup.classList.add(
"active"
);

overlay.classList.add(
"active"
);

videoPlaylist.classList.add(
"active"
);

document.body.classList.add(
"popup-active"
);

iconSvg.innerHTML=
'<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>';

if(
sortingReady &&
sortedPlaylistData.length>0
){

renderVideoPlaylist();

}

else{

loadPlaylistItems();

}

requestAnimationFrame(()=>{

requestAnimationFrame(()=>{

adjustVideoPlaylistHeight();

});

});

setTimeout(
adjustVideoPlaylistHeight,
100
);

setTimeout(
adjustVideoPlaylistHeight,
300
);

}

else{

popup.classList.remove(
"active"
);

overlay.classList.remove(
"active"
);

videoPlaylist.classList.remove(
"active"
);

document.body.classList.remove(
"popup-active"
);

iconSvg.innerHTML=
'<path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>';

}

updateDesktopCoverflowState();

}


/* =========================================================
VIDEO PLAYLIST HEIGHT
========================================================= */

function adjustVideoPlaylistHeight(){

const popup=
document.getElementById(
"videoPopup"
);

const playlist=
document.getElementById(
"videoPlaylist"
);

const playerCard=
document.getElementById(
"playerCard"
);

const videoSection=
document.getElementById(
"videoSection"
);

if(
!popup ||
!playlist ||
!playerCard
)
return;

if(
!popup.classList.contains("active")
)
return;

if(window.innerWidth>=769){

if(!videoSection)
return;

const sectionRect=
videoSection.getBoundingClientRect();

const popupRect=
popup.getBoundingClientRect();

const available=
sectionRect.bottom -
popupRect.bottom -
10;

const safeHeight=
Math.max(
100,
available
);

playlist.style.height=
safeHeight+"px";

playlist.style.maxHeight=
safeHeight+"px";

return;

}

const popupRect=
popup.getBoundingClientRect();

const playerRect=
playerCard.getBoundingClientRect();

const top=
popupRect.bottom+1;

const bottom=
playerRect.top-20;

let available=
bottom-top;

if(available>70){

let safeHeight=
Math.min(
available,
playerRect.top-top-2
);

safeHeight=
Math.max(
70,
safeHeight
);

playlist.style.height=
safeHeight+"px";

playlist.style.maxHeight=
safeHeight+"px";

}

else{

playlist.style.height="70px";
playlist.style.maxHeight="70px";

}

requestAnimationFrame(()=>{

const finalRect=
playlist.getBoundingClientRect();

const finalPlayerRect=
playerCard.getBoundingClientRect();

if(
finalRect.bottom >
finalPlayerRect.top
){

const correctedHeight=
Math.max(
70,
finalPlayerRect.top-top-2
);

playlist.style.height=
correctedHeight+"px";

playlist.style.maxHeight=
correctedHeight+"px";

}

});

}


/* =========================================================
RESIZE
========================================================= */

window.addEventListener(
"resize",
()=>{

setTimeout(
adjustVideoPlaylistHeight,
50
);

setTimeout(
adjustVideoPlaylistHeight,
150
);

updateDesktopCoverflowState();

}
);


/* =========================================================
VOLUME
========================================================= */

function resetVolTimer(){

if(volTimer){

clearTimeout(
volTimer
);

}

volTimer=setTimeout(
()=>{

document
.getElementById(
"volWrapper"
)
.classList.remove(
"active"
);

},
3000
);

}

function toggleVolume(){

const wrapper=
document.getElementById(
"volWrapper"
);

if(
wrapper.classList.contains(
"active"
)
){

wrapper.classList.remove(
"active"
);

if(volTimer){

clearTimeout(
volTimer
);

}

}

else{

wrapper.classList.add(
"active"
);

resetVolTimer();

}

}

function changeVolume(val){

if(
player &&
typeof player.setVolume===
"function"
){

player.setVolume(val);

}

resetVolTimer();

}


/* =========================================================
NEXT SONG
========================================================= */

function nextSong(){

if(
!player ||
sortedPlaylistItems.length===0
)
return;

let currentId="";

try{

currentId=
player.getVideoData() &&
player.getVideoData().video_id;

}
catch(e){}

if(currentId){

const found=
sortedPlaylistItems.indexOf(
currentId
);

if(found!==-1){

currentSortedIndex=found;

}

}

const nextIndex=
(currentSortedIndex+1)%
sortedPlaylistItems.length;

currentSortedIndex=
nextIndex;

playSpecificTrack(
nextIndex
);

}


/* =========================================================
PREVIOUS SONG
========================================================= */

function previousSong(){

if(
!player ||
sortedPlaylistItems.length===0
)
return;

let currentId="";

try{

currentId=
player.getVideoData() &&
player.getVideoData().video_id;

}
catch(e){}

if(currentId){

const found=
sortedPlaylistItems.indexOf(
currentId
);

if(found!==-1){

currentSortedIndex=found;

}

}

const previousIndex=
(currentSortedIndex-1+
sortedPlaylistItems.length)%
sortedPlaylistItems.length;

currentSortedIndex=
previousIndex;

playSpecificTrack(
previousIndex
);

}


/* =========================================================
FORCE UPDATE UI
========================================================= */

function forceUpdateUI(index){

if(
!sortedPlaylistData[index]
)
return;

const data=
sortedPlaylistData[index];

document.getElementById(
"cover"
).src=
`https://i.ytimg.com/vi/${data.id}/hqdefault.jpg`;

document.getElementById(
"title"
).textContent=
data.title || "YouTube Music";

document.getElementById(
"artist"
).textContent=
data.artist || "YouTube Music";

currentSortedIndex=index;

highlightActiveTrack();
highlightVideoActiveTrack();
renderCoverflow();

}


/* =========================================================
SWIPE
========================================================= */

const playerCard=
document.getElementById(
"playerCard"
);

const seekElement=
document.getElementById(
"seek"
);

playerCard.addEventListener(
"pointerdown",
e=>{

if(
e.target.closest(".controls") ||
e.target.closest(".btn") ||
e.target.closest(".play")
){

swipeActive=false;
return;

}

swipeStartX=e.clientX;
swipeStartY=e.clientY;

swipeFromSeek=
!!e.target.closest("#seek");

swipeActive=true;

}
);

playerCard.addEventListener(
"pointerup",
e=>{

if(!swipeActive)
return;

const endX=e.clientX;
const endY=e.clientY;

const dx=endX-swipeStartX;
const dy=endY-swipeStartY;

if(swipeFromSeek){

swipeActive=false;
return;

}

if(Math.abs(dx)<50){

swipeActive=false;
return;

}

if(
Math.abs(dy)>
Math.abs(dx)
){

swipeActive=false;
return;

}

if(dx<-50){

nextSong();

}

else if(dx>50){

previousSong();

}

swipeActive=false;

}
);

playerCard.addEventListener(
"pointercancel",
()=>{

swipeActive=false;

}
);


/* =========================================================
COVERFLOW SWIPE & TOUCH SUPPORT
========================================================= */
let coverflowSwipeStartX = 0;
let coverflowSwipeStartY = 0;
let coverflowSwipeActive = false;

const coverflowWrapperEl = document.getElementById("coverflowWrapper");

coverflowWrapperEl.addEventListener("pointerdown", e => {
    coverflowSwipeStartX = e.clientX;
    coverflowSwipeStartY = e.clientY;
    coverflowSwipeActive = true;
});

coverflowWrapperEl.addEventListener("pointerup", e => {
    if (!coverflowSwipeActive) return;

    const dx = e.clientX - coverflowSwipeStartX;
    const dy = e.clientY - coverflowSwipeStartY;

    if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) {
            nextSong(); 
        } else {
            previousSong(); 
        }
    }
    coverflowSwipeActive = false;
});

coverflowWrapperEl.addEventListener("pointercancel", () => {
    coverflowSwipeActive = false;
});


/* =========================================================
SEEK
========================================================= */

function getSeekPosition(
clientX,
el
){

const rect=
el.getBoundingClientRect();

if(!rect.width)
return 0;

return Math.max(
0,
Math.min(
1,
(clientX-rect.left)/
rect.width
)
);

}

function updateSeekVisual(pos){

document.getElementById(
"fill"
).style.width=
(pos*100)+"%";

if(
player &&
typeof player.getDuration===
"function"
){

const duration=
player.getDuration();

if(duration){

document.getElementById(
"current"
).textContent=
format(pos*duration);

document.getElementById(
"duration"
).textContent=
format(duration);

}

}

}

seekElement.addEventListener(
"pointerdown",
e=>{

e.preventDefault();
e.stopPropagation();

isDragging=true;

try{

seekElement.setPointerCapture(
e.pointerId
);

}
catch(err){}

updateSeekVisual(
getSeekPosition(
e.clientX,
seekElement
)
);

},
{
passive:false
}
);

seekElement.addEventListener(
"pointermove",
e=>{

if(!isDragging)
return;

e.preventDefault();
e.stopPropagation();

updateSeekVisual(
getSeekPosition(
e.clientX,
seekElement
)
);

},
{
passive:false
}
);

seekElement.addEventListener(
"pointerup",
e=>{

if(!isDragging)
return;

e.preventDefault();
e.stopPropagation();

const pos=
getSeekPosition(
e.clientX,
seekElement
);

updateSeekVisual(pos);

if(
player &&
typeof player.getDuration===
"function"
){

const duration=
player.getDuration();

if(duration){

player.seekTo(
pos*duration,
true
);

}

}

isDragging=false;

try{

seekElement.releasePointerCapture(
e.pointerId
);

}
catch(err){}

},
{
passive:false
}
);


/* =========================================================
PROGRESS
========================================================= */

function updateProgress(){

if(isDragging)
return;

if(
!player ||
typeof player.getCurrentTime!==
"function"
)
return;

try{

const current=
player.getCurrentTime();

const duration=
player.getDuration();

if(!duration)
return;

const pos=
Math.max(
0,
Math.min(
1,
current/duration
)
);

document.getElementById(
"fill"
).style.width=
(pos*100)+"%";

document.getElementById(
"current"
).textContent=
format(current);

document.getElementById(
"duration"
).textContent=
format(duration);

}
catch(e){}

}


/* =========================================================
FORMAT
========================================================= */

function format(s){

if(
!s ||
isNaN(s)
){

return "0:00";

}

s=Math.floor(s);

return Math.floor(s/60)+":"+
String(
s%60
).padStart(
2,"0"
);

}


/* =========================================================
LOAD PLAYLIST
========================================================= */

function loadPlaylistItems(){

if(
!player ||
typeof player.getPlaylist!==
"function"
)
return;

const ids=
player.getPlaylist();

if(
!ids ||
ids.length===0
){

setTimeout(
loadPlaylistItems,
600
);

return;

}

playlistItems=ids;

sortedPlaylistItems=[];
sortedPlaylistData=[];

sortingReady=false;

const requests=
playlistItems.map(
(id,index)=>{

return fetch(
`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`
)

.then(
r=>r.json()
)

.then(
data=>{

return{

id:id,

title:
(data && data.title)
?
data.title
:
`Track #${index+1}`,

artist:
(data && data.author_name)
?
data.author_name
:
"YouTube Music",

originalIndex:index

};

}
)

.catch(
()=>{

return{

id:id,

title:`Track #${index+1}`,

artist:"YouTube Music",

originalIndex:index

};

}
);

});

Promise.all(requests)
.then(
results=>{

results.sort(
(a,b)=>{

return a.title.localeCompare(
b.title,
undefined,
{
numeric:true,
sensitivity:"base"
}
);

});

sortedPlaylistData=results;

sortedPlaylistItems=
results.map(
item=>item.id
);

sortingReady=true;

let currentId="";

try{

currentId=
player.getVideoData() &&
player.getVideoData().video_id;

}
catch(e){}

if(currentId){

const currentIndex=
sortedPlaylistItems.indexOf(
currentId
);

if(currentIndex!==-1){

currentSortedIndex=
currentIndex;

}

}

renderSortedPlaylists();
renderCoverflow();

highlightActiveTrack();
highlightVideoActiveTrack();

updateInfo();

}
);

}


/* =========================================================
RENDER PLAYLISTS & COVERFLOW
========================================================= */

function renderSortedPlaylists(){

renderMainPlaylist();
renderVideoPlaylist();
renderCoverflow();

}


/* =========================================================
MAIN PLAYLIST
========================================================= */

function renderMainPlaylist(){

const list=
document.getElementById(
"songList"
);

list.innerHTML="";

sortedPlaylistData.forEach(
(data,index)=>{

const item=
document.createElement(
"div"
);

item.className=
"song-item";

item.id=
`track-${index}`;

item.onclick=()=>{

playSpecificTrack(
index
);

};

item.innerHTML=`

<img
src="https://i.ytimg.com/vi/${data.id}/hqdefault.jpg"
alt="thumb"
>

<div class="song-item-info">

<div class="song-item-title">
${escapeHtml(data.title)}
</div>

<div class="song-item-artist">
${escapeHtml(data.artist)}
</div>

</div>

`;

list.appendChild(item);

});

}


/* =========================================================
VIDEO PLAYLIST
========================================================= */

function renderVideoPlaylist(){

const list=
document.getElementById(
"videoSongList"
);

if(
!sortedPlaylistData ||
sortedPlaylistData.length===0
){

list.innerHTML=`

<div style="
text-align:center;
color:rgba(255,255,255,.7);
font-size:9px;
padding:10px;
">
Loading...
</div>

`;

return;

}

list.innerHTML="";

sortedPlaylistData.forEach(
(data,index)=>{

const item=
document.createElement(
"div"
);

item.className=
"video-song-item";

item.id=
`video-track-${index}`;

item.addEventListener(
"click",
function(e){

e.preventDefault();
e.stopPropagation();

playSpecificTrack(
index
);

},
{
passive:false
}
);

item.innerHTML=`

<img
src="https://i.ytimg.com/vi/${data.id}/hqdefault.jpg"
alt="thumb"
draggable="false"
>

<div class="video-song-info">

<div class="video-song-title">
${escapeHtml(data.title)}
</div>

<div class="video-song-artist">
${escapeHtml(data.artist)}
</div>

</div>

`;

list.appendChild(item);

});

highlightVideoActiveTrack();

setTimeout(
adjustVideoPlaylistHeight,
20
);

}


/* =========================================================
3D COVERFLOW RENDER (COMPACT CARDS & INTERACTIVE)
========================================================= */

function renderCoverflow(){
    const container = document.getElementById("coverflowContainer");
    if(!container || sortedPlaylistData.length === 0) return;

    container.innerHTML = "";

    sortedPlaylistData.forEach((song, index) => {
        const card = document.createElement("div");
        card.className = "song-card";

        let diff = index - currentSortedIndex;
        const total = sortedPlaylistData.length;

        if (diff > total / 2) diff -= total;
        if (diff < -total / 2) diff += total;

        if (diff === 0) {
            card.classList.add("active");
        } else if (diff === 1) {
            card.classList.add("next-1");
        } else if (diff === 2) {
            card.classList.add("next-2");
        } else if (diff === -1) {
            card.classList.add("prev-1");
        } else if (diff === -2) {
            card.classList.add("prev-2");
        }

        card.innerHTML = `
            <img src="https://i.ytimg.com/vi/${song.id}/hqdefault.jpg" alt="${escapeHtml(song.title)}" draggable="false">
            <div class="card-info">
                <div class="card-title">${escapeHtml(song.title)}</div>
                <div class="card-artist">${escapeHtml(song.artist)}</div>
            </div>
        `;

        card.addEventListener("click", (e) => {
            e.stopPropagation();
            playSpecificTrack(index);
        });

        container.appendChild(card);
    });
}


/* =========================================================
ESCAPE HTML
========================================================= */

function escapeHtml(text){

if(!text)
return "";

const div=
document.createElement(
"div"
);

div.textContent=text;

return div.innerHTML;

}


/* =========================================================
PLAY SPECIFIC TRACK
========================================================= */

function playSpecificTrack(index){

if(
!player ||
!sortedPlaylistData[index]
)
return;

const data=
sortedPlaylistData[index];

const id=data.id;

currentSortedIndex=index;

forceUpdateUI(index);

changingTrack=true;

try{

player.loadVideoById(id);

}
catch(e){

changingTrack=false;

return;

}

setTimeout(
()=>{

changingTrack=false;

},
700
);

const drawer=
document.getElementById(
"drawer"
);

const drawerOverlay=
document.getElementById(
"overlay"
);

drawer.classList.remove(
"open"
);

drawerOverlay.classList.remove(
"active"
);

const popup=
document.getElementById(
"videoPopup"
);

if(
popup.classList.contains(
"active"
)
){

document
.getElementById(
"videoPlaylist"
)
.classList.add(
"active"
);

setTimeout(
adjustVideoPlaylistHeight,
50
);

setTimeout(
adjustVideoPlaylistHeight,
150
);

}

highlightActiveTrack();

highlightVideoActiveTrack();
renderCoverflow();

}


/* =========================================================
ACTIVE MAIN TRACK
========================================================= */

function highlightActiveTrack(){

if(
!player ||
sortedPlaylistItems.length===0
)
return;

let currentId="";

try{

currentId=
player.getVideoData() &&
player.getVideoData().video_id;

}
catch(e){}

document
.querySelectorAll(
".song-item"
)
.forEach(
(item,index)=>{

item.classList.toggle(
"active",
sortedPlaylistItems[index]===currentId
);

});

}


/* =========================================================
ACTIVE VIDEO TRACK
========================================================= */

function highlightVideoActiveTrack(){

if(
!player ||
sortedPlaylistItems.length===0
)
return;

let currentId="";

try{

currentId=
player.getVideoData() &&
player.getVideoData().video_id;

}
catch(e){}

document
.querySelectorAll(
".video-song-item"
)
.forEach(
(item,index)=>{

item.classList.toggle(
"active",
sortedPlaylistItems[index]===currentId
);

});

}


/* =========================================================
UPDATE INFO
========================================================= */

function updateInfo(){

if(
!player ||
typeof player.getVideoData!==
"function"
)
return;

try{

const d=
player.getVideoData();

if(
!d ||
!d.video_id
)
return;

document.getElementById(
"cover"
).src=
`https://i.ytimg.com/vi/${d.video_id}/hqdefault.jpg`;

if(d.title){

document.getElementById(
"title"
).textContent=d.title;

}

if(d.author){

document.getElementById(
"artist"
).textContent=d.author;

}

const sortedIndex=
sortedPlaylistItems.indexOf(
d.video_id
);

if(sortedIndex!==-1){

currentSortedIndex=sortedIndex;

}

highlightActiveTrack();
highlightVideoActiveTrack();
renderCoverflow();

}
catch(e){}

}


/* =========================================================
DRAWER
========================================================= */

function toggleDrawer(){

const popup=
document.getElementById(
"videoPopup"
);

if(
popup &&
popup.classList.contains(
"active"
)
){

return;

}

const drawer=
document.getElementById(
"drawer"
);

const overlay=
destination=
document.getElementById(
"overlay"
);

const opening=
!drawer.classList.contains(
"open"
);

drawer.classList.toggle(
"open",
opening
);

document.getElementById("overlay").classList.toggle(
"active",
opening
);

if(
opening &&
!sortingReady
){

loadPlaylistItems();

}

}


/* =========================================================
INITIAL
========================================================= */

setTimeout(
adjustVideoPlaylistHeight,
600
);

</script>

</body>
</html>
