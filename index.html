<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>My Music Player</title>

<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preload" as="image" href="background.jpg">

<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">

<style>

*{
box-sizing:border-box;
}

html,
body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#050505;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

body{
position:relative;
overflow-x:hidden!important;
}


/* =========================================================
   BACKGROUND
========================================================= */

.bg{
position:fixed;
inset:-20px;

background-image:url("background.jpg");
background-position:center center;
background-size:cover;
background-repeat:no-repeat;

filter:none;
-webkit-filter:none;

transform:scale(1);

z-index:0;

pointer-events:none;

-webkit-backface-visibility:hidden;
backface-visibility:hidden;
}

.bg::after{
content:"";

position:absolute;
inset:0;

background:rgba(0,0,0,.35);

pointer-events:none;
}

body.popup-active .bg{
filter:blur(20px);
-webkit-filter:blur(20px);

transform:scale(1.1);
}


/* =========================================================
   TOP WIDGETS
========================================================= */

.top-widgets{
position:fixed;

top:14px;
left:50%;

transform:translateX(-50%);

z-index:2500;

display:flex;
flex-direction:column;
align-items:center;

gap:8px;

pointer-events:auto;
}


/* =========================================================
   BD TIME
========================================================= */

.bd-time{
padding:5px 11px;

border-radius:20px;

background:rgba(0,0,0,.45);

border:1px solid rgba(255,255,255,.18);

color:rgba(255,255,255,.9);

font-size:11px;
font-weight:600;

letter-spacing:.3px;

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);

display:flex;
align-items:center;

gap:6px;
}

.live-dot{
width:7px;
height:7px;

background:#ff3b30;

border-radius:50%;

display:inline-block;

box-shadow:0 0 8px #ff3b30;

animation:pulse 1.5s infinite;
}

@keyframes pulse{

0%{
opacity:1;
transform:scale(1);
}

50%{
opacity:.3;
transform:scale(.8);
}

100%{
opacity:1;
transform:scale(1);
}

}


/* =========================================================
   PLAYLIST BUTTON
========================================================= */

.playlist-toggle-btn{
padding:5px 12px;

border-radius:20px;

background:rgba(0,0,0,.45);

border:1px solid rgba(255,255,255,.18);

color:rgba(255,255,255,.9);

font-size:11px;
font-weight:600;

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);

display:flex;
align-items:center;

gap:6px;

cursor:pointer;

touch-action:manipulation;

-webkit-tap-highlight-color:transparent;

transition:
transform .2s,
background .2s;
}

.playlist-toggle-btn:active{
transform:scale(.95);
}

.playlist-toggle-btn svg{
width:14px;
height:14px;
fill:#fff;
}

body.popup-active .playlist-toggle-btn{
display:none;
}


/* =========================================================
   VIDEO OVERLAY
========================================================= */

.video-overlay{
position:fixed;
inset:0;

z-index:1499;

display:none;

background:transparent;

pointer-events:none!important;
}

.video-overlay.active{
display:block;

pointer-events:none!important;
}


/* =========================================================
   VIDEO SECTION
========================================================= */

.video-section{
position:fixed;

top:6%;
left:50%;

transform:translateX(-50%);

width:min(420px,94%);

z-index:1700;

display:flex;
flex-direction:column;
align-items:center;

pointer-events:none!important;
}


/* =========================================================
   VIDEO POPUP
========================================================= */

.video-popup{
position:relative;

width:100%;

aspect-ratio:16 / 9;

height:auto;

background:#000;

border-radius:18px;

overflow:hidden;

z-index:1701;

border:1px solid rgba(255,255,255,.25);

box-shadow:
0 25px 50px rgba(0,0,0,.7);

opacity:0;
visibility:hidden;

pointer-events:none!important;

transform:scale(.92);

transition:
opacity .3s ease,
transform .3s cubic-bezier(.2,.8,.2,1),
visibility .3s ease;

-webkit-backface-visibility:hidden;
backface-visibility:hidden;
}

.video-popup.active{
opacity:1;
visibility:visible;

pointer-events:none!important;

transform:scale(1);
}


/* =========================================================
   YOUTUBE IFRAME
========================================================= */

#yt{
position:absolute;

inset:0;

width:100%;
height:100%;

border:0;

display:block;

pointer-events:none!important;

touch-action:none!important;

z-index:1702;
}


/* =========================================================
   VIDEO PLAYLIST
========================================================= */

.video-playlist{
width:100%;

margin-top:1px;

max-height:calc(100dvh - 410px);

min-height:80px;

padding:7px;

border-radius:15px;

background:rgba(20,20,20,.52);

border:1px solid rgba(255,255,255,.18);

backdrop-filter:blur(25px) saturate(150%);
-webkit-backdrop-filter:blur(25px) saturate(150%);

box-shadow:
0 15px 40px rgba(0,0,0,.55);

opacity:0;
visibility:hidden;

pointer-events:none;

position:relative;

z-index:1705;

touch-action:pan-y;

-webkit-overflow-scrolling:touch;

overscroll-behavior:contain;

overflow:hidden;

flex-shrink:0;
}

.video-playlist.active{
opacity:1;

visibility:visible;

pointer-events:auto;

touch-action:pan-y;
}


/* =========================================================
   VIDEO PLAYLIST TITLE
========================================================= */

.video-playlist-title{
font-size:10px;

font-weight:700;

color:rgba(255,255,255,.9);

padding:4px 7px 6px;

border-bottom:1px solid rgba(255,255,255,.13);

margin-bottom:5px;

flex-shrink:0;

pointer-events:none;
}


/* =========================================================
   VIDEO SONG LIST
========================================================= */

.video-song-list{
width:100%;

height:calc(100% - 27px);

overflow-y:auto;
overflow-x:hidden;

display:flex;
flex-direction:column;

gap:5px;

touch-action:pan-y;

-webkit-overflow-scrolling:touch;

overscroll-behavior:contain;

scrollbar-width:thin;

pointer-events:auto;

position:relative;

z-index:1706;

-webkit-user-select:none;
user-select:none;
}

.video-song-list::-webkit-scrollbar{
width:3px;
}

.video-song-list::-webkit-scrollbar-thumb{
background:rgba(255,255,255,.35);
border-radius:5px;
}


/* =========================================================
   VIDEO SONG ITEM
========================================================= */

.video-song-item{
display:flex;

align-items:center;

gap:9px;

width:100%;

min-height:54px;

padding:7px 8px;

border-radius:10px;

background:rgba(255,255,255,.07);

border:1px solid rgba(255,255,255,.08);

cursor:pointer;

touch-action:manipulation;

-webkit-tap-highlight-color:transparent;

transition:
background .2s ease,
transform .15s ease,
border-color .2s ease;

flex-shrink:0;

pointer-events:auto;

position:relative;

z-index:1707;
}

.video-song-item:active{
transform:scale(.98);

background:rgba(255,255,255,.18);
}

.video-song-item.active{
background:rgba(255,255,255,.20);

border-color:rgba(255,255,255,.30);
}

.video-song-item img{
width:44px;
height:44px;

border-radius:8px;

object-fit:cover;

flex-shrink:0;

pointer-events:none;

-webkit-user-drag:none;
}

.video-song-info{
flex:1;

min-width:0;

pointer-events:none;
}

.video-song-title{
font-size:11.5px;

font-weight:700;

color:#fff;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;
}

.video-song-artist{
font-size:9.5px;

color:rgba(255,255,255,.55);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-top:2px;
}


/* =========================================================
   APP
========================================================= */

.app{
position:relative;

z-index:1600;

height:100dvh;

width:100%;

display:flex;

align-items:flex-end;

justify-content:center;

padding:0 16px 65px;

pointer-events:auto;
}


/* =========================================================
   MUSIC PLAYER
========================================================= */

.player{
width:min(440px,94%);

height:120px;

padding:14px 18px;

border:1px solid rgba(255,255,255,.18);

border-radius:60px;

background:rgba(20,20,20,.35);

backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);

box-shadow:
0 20px 50px rgba(0,0,0,.45);

display:flex;
align-items:center;

gap:12px;

position:relative;

overflow:hidden;

touch-action:pan-y;

z-index:1601;
}


/* =========================================================
   COVER
========================================================= */

.cover-wrapper{
position:relative;

width:84px;
height:84px;

flex-shrink:0;

display:flex;
align-items:center;
justify-content:center;

border-radius:50%;

overflow:hidden;

border:1px solid rgba(255,255,255,.3);
}

.cover{
width:137%;
height:137%;

margin:-18.5%;

border-radius:50%;

object-fit:cover;

object-position:center;

background:#222;

animation:spin 8s linear infinite;

animation-play-state:paused;
}

.cover-wrapper::after{
content:"";

position:absolute;

width:16px;
height:16px;

background:rgba(20,20,20,.85);

border:2px solid rgba(255,255,255,.3);

border-radius:50%;

left:50%;
top:50%;

transform:translate(-50%,-50%);

z-index:2;
}

.cover.spinning{
animation-play-state:running;
}

@keyframes spin{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}


/* =========================================================
   SONG INFO
========================================================= */

.middle{
flex:1;

min-width:0;

display:flex;

flex-direction:column;

justify-content:center;
}

.title{
font-size:16px;

font-weight:700;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

color:#fff;

letter-spacing:.2px;
}

.artist{
font-size:12px;

color:rgba(255,255,255,.65);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-top:2px;

margin-bottom:8px;
}


/* =========================================================
   SEEK
========================================================= */

.seek{
position:relative;

width:100%;

height:5px;

border-radius:10px;

background:rgba(255,255,255,.2);

cursor:pointer;

margin-bottom:6px;

touch-action:none;

user-select:none;

-webkit-user-select:none;
}

.seek::before{
content:"";

position:absolute;

top:-12px;
bottom:-12px;

left:-10px;
right:-10px;

z-index:1;
}

.fill{
position:absolute;

left:0;
top:0;

height:100%;

width:0;

background:#fff;

border-radius:10px;

pointer-events:none;

z-index:2;
}

.time-display{
font-size:11px;

color:rgba(255,255,255,.65);

font-variant-numeric:tabular-nums;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls{
display:flex;

align-items:center;

gap:8px;

flex-shrink:0;

position:relative;

z-index:1610;
}

.btn{
width:28px;
height:28px;

border:0;

background:transparent;

color:rgba(255,255,255,.9);

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

padding:0;

touch-action:manipulation;

-webkit-tap-highlight-color:transparent;
}

.btn svg{
width:20px;
height:20px;

fill:#fff;
}


/* =========================================================
   VOLUME
========================================================= */

.vol-container{
display:flex;

align-items:center;

gap:4px;

background:rgba(0,0,0,.25);

border:1px solid rgba(255,255,255,.15);

padding:4px 6px;

border-radius:20px;

backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);
}

.vol-slider-wrapper{
width:0;

overflow:hidden;

opacity:0;

display:flex;

align-items:center;

transition:
width .28s cubic-bezier(.2,.8,.2,1),
opacity .2s ease;
}

.vol-slider-wrapper.active{
width:55px;

opacity:1;

margin-left:2px;
}

.vol-slider{
-webkit-appearance:none;
appearance:none;

width:55px;

height:3.5px;

background:rgba(255,255,255,.3);

border-radius:10px;

outline:none;

cursor:pointer;
}

.vol-slider::-webkit-slider-thumb{
-webkit-appearance:none;
appearance:none;

width:10px;
height:10px;

border-radius:50%;

background:#fff;

cursor:pointer;

box-shadow:0 0 5px rgba(0,0,0,.5);
}

@supports (-webkit-touch-callout:none){

.vol-container{
display:none!important;
}

}


/* =========================================================
   PLAY
========================================================= */

.play{
width:44px;
height:44px;

border-radius:50%;

border:0;

background:#fff;

color:#000;

display:flex;

align-items:center;

justify-content:center;

box-shadow:
0 4px 15px rgba(0,0,0,.3);

cursor:pointer;

flex-shrink:0;

touch-action:manipulation;

-webkit-tap-highlight-color:transparent;
}

.play svg{
width:20px;
height:20px;

fill:#000;

margin-left:2px;
}

.play.playing svg{
margin-left:0;
}

.btn:active,
.play:active{
transform:scale(.90);
}


/* =========================================================
   DRAWER
========================================================= */

.drawer-overlay{
position:fixed;

inset:0;

z-index:9999;

background:transparent!important;

backdrop-filter:none!important;
-webkit-backdrop-filter:none!important;

pointer-events:none;

display:none;
}

.drawer-overlay.active{
display:block;

pointer-events:auto;
}

.playlist-drawer{
position:fixed;

top:0;

right:-100%;

width:180px;

height:100dvh;

background:rgba(20,20,20,.45)!important;

backdrop-filter:blur(30px) saturate(150%)!important;
-webkit-backdrop-filter:blur(30px) saturate(150%)!important;

border-left:1px solid rgba(255,255,255,.18)!important;

z-index:10000;

transition:
right .35s cubic-bezier(.2,.8,.2,1);

display:flex;

flex-direction:column;

padding:12px 6px;

box-shadow:
-15px 0 40px rgba(0,0,0,.5)!important;

visibility:hidden;

pointer-events:none;
}

.playlist-drawer.open{
right:0;

visibility:visible;

pointer-events:auto;
}

.drawer-header{
display:flex;

align-items:center;

justify-content:space-between;

padding:6px 8px;

border-bottom:1px solid rgba(255,255,255,.15);

margin-bottom:8px;

background:rgba(255,255,255,.1);

border-radius:8px;
}

.drawer-title{
font-size:11px;

font-weight:700;

color:#fff;
}

.close-btn{
background:transparent;

border:0;

color:rgba(255,255,255,.9);

font-size:16px;

cursor:pointer;

padding:0 2px;

line-height:1;

touch-action:manipulation;
}

.song-list{
flex:1;

overflow-y:auto;

display:flex;

flex-direction:column;

gap:4px;

padding-right:2px;

touch-action:pan-y;

-webkit-overflow-scrolling:touch;
}

.song-list::-webkit-scrollbar{
width:2px;
}

.song-list::-webkit-scrollbar-thumb{
background:rgba(255,255,255,.3);

border-radius:3px;
}

.song-item{
display:flex;

align-items:center;

gap:6px;

padding:4px 5px;

border-radius:7px;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.1);

cursor:pointer;

touch-action:manipulation;

-webkit-tap-highlight-color:transparent;
}

.song-item:active{
transform:scale(.96);
}

.song-item:hover,
.song-item.active{
background:rgba(255,255,255,.22);

border-color:rgba(255,255,255,.35);
}

.song-item img{
width:26px;
height:26px;

border-radius:5px;

object-fit:cover;

flex-shrink:0;

box-shadow:
0 2px 5px rgba(0,0,0,.3);

pointer-events:none;
}

.song-item-info{
flex:1;

min-width:0;

pointer-events:none;
}

.song-item-title{
font-size:9.5px;

font-weight:700;

color:#fff;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

letter-spacing:.2px;
}

.song-item-artist{
font-size:8px;

font-weight:400;

color:rgba(255,255,255,.55);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-top:.5px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:480px){

.app{
padding-bottom:60px;
}

.player{
height:116px;

padding:12px 14px;

border-radius:58px;

gap:10px;
}

.cover-wrapper{
width:78px;
height:78px;
}

.title{
font-size:15px;
}

.artist{
font-size:11px;
}

.play{
width:42px;
height:42px;
}

.top-widgets{
top:10px;
}

.bd-time{
font-size:10px;

padding:4px 9px;
}

.playlist-toggle-btn{
font-size:10px;

padding:4px 9px;
}

.playlist-drawer{
width:180px;
}


/* VIDEO */

.video-section{
top:6%;

width:94%;

z-index:1700;
}

.video-popup{
width:100%;

aspect-ratio:16 / 9;

height:auto;

border-radius:16px;

pointer-events:none!important;
}

.video-playlist{
margin-top:1px;

max-height:calc(100dvh - 350px);

min-height:80px;

padding:7px;

border-radius:14px;

pointer-events:auto;

touch-action:pan-y;
}

.video-song-list{
height:calc(100% - 27px);

pointer-events:auto;

touch-action:pan-y;

overflow-y:auto;

-webkit-overflow-scrolling:touch;
}

.video-song-item{
min-height:52px;

padding:6px 7px;

gap:8px;

pointer-events:auto;

touch-action:manipulation;
}

.video-song-item img{
width:42px;
height:42px;
}

.video-song-title{
font-size:11px;
}

.video-song-artist{
font-size:9px;
}

}


/* =========================================================
   SMALL HEIGHT
========================================================= */

@media(max-height:700px) and (orientation:portrait){

.video-section{
top:3%;
}

.video-popup{
aspect-ratio:16 / 9;

height:auto;

pointer-events:none!important;
}

.video-playlist{
max-height:calc(100dvh - 300px);

min-height:70px;

margin-top:1px;
}

.video-song-item{
min-height:48px;
}

.video-song-item img{
width:40px;
height:40px;
}

}


/* =========================================================
   VERY SMALL WIDTH
========================================================= */

@media(max-width:360px){

.video-section{
width:96%;
}

.video-playlist{
margin-top:1px;

padding:6px;

max-height:calc(100dvh - 300px);
}

.video-song-item{
min-height:48px;

padding:5px 6px;

gap:7px;
}

.video-song-item img{
width:39px;
height:39px;
}

.video-song-title{
font-size:10px;
}

.video-song-artist{
font-size:8.5px;
}

}


/* =========================================================
   LANDSCAPE
========================================================= */

@media(orientation:landscape){

.video-section{
top:0!important;
left:0!important;

transform:none!important;

width:100vw!important;
height:100vh!important;

display:block!important;

pointer-events:none!important;

z-index:1700!important;
}

.video-popup.active{
position:absolute!important;

top:0!important;
left:0!important;

width:100vw!important;
height:100vh!important;

aspect-ratio:auto!important;

transform:none!important;

border-radius:0!important;

border:none!important;

box-shadow:none!important;

pointer-events:auto!important;

z-index:1701!important;
}

#yt{
position:absolute!important;

top:0!important;
left:0!important;

width:100%!important;
height:100%!important;

pointer-events:auto!important;

touch-action:auto!important;

z-index:1702!important;
}

.video-playlist{
display:none!important;
}

.app{
display:none!important;
}

.top-widgets{
display:none!important;
}

}


/* =========================================================
   ANDROID LANDSCAPE
========================================================= */

body.android-device.landscape-mode .video-section{
top:0!important;
left:0!important;

transform:none!important;

width:100vw!important;
height:100vh!important;

pointer-events:none!important;

z-index:1700!important;
}

body.android-device.landscape-mode .video-popup.active{
position:absolute!important;

top:0!important;
left:0!important;

width:100vw!important;
height:100vh!important;

aspect-ratio:auto!important;

transform:none!important;

border-radius:0!important;

border:none!important;

box-shadow:none!important;

pointer-events:auto!important;

z-index:1701!important;
}

body.android-device.landscape-mode #yt{
position:absolute!important;

inset:0!important;

width:100%!important;
height:100%!important;

pointer-events:auto!important;

touch-action:auto!important;

z-index:1702!important;
}

body.android-device.landscape-mode .video-playlist,
body.android-device.landscape-mode .app,
body.android-device.landscape-mode .top-widgets{
display:none!important;
}

</style>
</head>

<body>

<div class="bg"></div>


<!-- =====================================================
     TOP WIDGETS
===================================================== -->

<div class="top-widgets">

<div class="bd-time">

<span>BD</span>

<span class="live-dot"></span>

<span id="bdTimeVal">
--:--:-- --
</span>

</div>


<button
class="playlist-toggle-btn"
onclick="toggleDrawer()"
>

<svg viewBox="0 0 24 24">

<path d="
M3 10h11v2H3zm0-4h11v2H3zm0 8h7v2H3zm13-1v8l6-4z
"/>

</svg>

<span>Playlist</span>

</button>

</div>


<!-- =====================================================

<script>

const PLAYLIST_ID="PLbvY05KVYwoo";

let player=null;

let playing=false;

let playlistItems=[];

let volTimer=null;

let isDragging=false;

let swipeStartX=0;

let swipeStartY=0;

let swipeActive=false;

let swipeFromSeek=false;

/*
=========================================================
PLAYLIST ORDER FIX
=========================================================

YouTube playlist-এর original/manual order রাখতে
shuffle সম্পূর্ণ OFF রাখা হচ্ছে।

এছাড়া playlist একবার successful ভাবে load হলে
আর বারবার reload করে order overwrite করা হবে না।
*/

let playlistLoaded=false;

const isAndroidDevice=
/Android/i.test(navigator.userAgent);

if(isAndroidDevice){

document.body.classList.add(
"android-device"
);
}


/* =========================================================
   BD TIME
========================================================= */

function updateBDTime(){

const options={

timeZone:"Asia/Dhaka",

hour:"2-digit",

minute:"2-digit",

second:"2-digit",

hour12:true

};

document.getElementById(
"bdTimeVal"
).textContent=

new Intl.DateTimeFormat(
"en-US",
options
).format(new Date());

}

updateBDTime();

setInterval(
updateBDTime,
1000
);


/* =========================================================
   YOUTUBE API
========================================================= */

function onYouTubeIframeAPIReady(){

player=new YT.Player(
"yt",
{

width:"100%",
height:"100%",

playerVars:{

autoplay:0,

controls:1,

disablekb:0,

fs:1,

modestbranding:1,

playsinline:1,

rel:0,

iv_load_policy:3,

listType:"playlist",

list:PLAYLIST_ID

},

events:{

onReady:ready,

onStateChange:state

}

});

}


/* =========================================================
   READY
========================================================= */

function ready(){

/*
IMPORTANT:
YouTube playlist-এর manual order যেন
shuffle হয়ে না যায়।
*/

try{

if(
player &&
typeof player.setShuffle==="function"
){

player.setShuffle(false);

}

}
catch(e){}


/*
একটু সময় দিয়ে YouTube playlist-এর
current/original order নেওয়া হচ্ছে।
*/

setTimeout(
()=>{

loadPlaylistItems();

},
250
);


setInterval(
updateProgress,
250
);

}


/* =========================================================
   PLAYER STATE
========================================================= */

function state(e){

const cover=
document.getElementById("cover");

const playBtn=
document.getElementById("play");

const playIcon=
document.getElementById("play-icon");


highlightActiveTrack();

highlightVideoActiveTrack();


if(
e.data===YT.PlayerState.PLAYING
){

playing=true;

playBtn.classList.add(
"playing"
);

playIcon.innerHTML=
'<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

cover.classList.add(
"spinning"
);

updateInfo();


if(
playlistItems.length===0 &&
!playlistLoaded
){

loadPlaylistItems();

}

}

else if(

e.data===YT.PlayerState.PAUSED ||

e.data===YT.PlayerState.ENDED

){

playing=false;

playBtn.classList.remove(
"playing"
);

playIcon.innerHTML=
'<path d="M8 5v14l11-7z"/>';

cover.classList.remove(
"spinning"
);

}

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePlay(){

if(!player)return;

try{

if(playing){

player.pauseVideo();

}
else{

player.playVideo();

}

}
catch(e){}

}


/* =========================================================
   VIDEO POPUP
========================================================= */

function toggleVideoPopup(){

const popup=
document.getElementById(
"videoPopup"
);

const overlay=
document.getElementById(
"videoOverlay"
);

const videoPlaylist=
document.getElementById(
"videoPlaylist"
);

const iconSvg=
document.getElementById(
"videoToggleIcon"
);

const opening=
!popup.classList.contains(
"active"
);


if(opening){

popup.classList.add(
"active"
);

overlay.classList.add(
"active"
);

videoPlaylist.classList.add(
"active"
);

document.body.classList.add(
"popup-active"
);

iconSvg.innerHTML=
'<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>';


loadVideoPlaylist();

setTimeout(
adjustVideoPlaylistHeight,
50
);

}
else{

popup.classList.remove(
"active"
);

overlay.classList.remove(
"active"
);

videoPlaylist.classList.remove(
"active"
);

document.body.classList.remove(
"popup-active"
);

iconSvg.innerHTML=
'<path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>';

}

}


/* =========================================================
   VIDEO PLAYLIST HEIGHT
========================================================= */

function adjustVideoPlaylistHeight(){

const popup=
document.getElementById(
"videoPopup"
);

const playlist=
document.getElementById(
"videoPlaylist"
);

const playerCard=
document.getElementById(
"playerCard"
);

if(
!popup ||
!playlist ||
!playerCard
)return;

if(
!popup.classList.contains("active")
)
return;


const popupRect=
popup.getBoundingClientRect();

const playerRect=
playerCard.getBoundingClientRect();


const top=
popupRect.bottom+1;

const bottom=
playerRect.top-20;

const available=
bottom-top;


if(available>70){

playlist.style.height=
available+"px";

playlist.style.maxHeight=
available+"px";

}
else{

playlist.style.height=
"80px";

playlist.style.maxHeight=
"80px";

}

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
"resize",
()=>{

handleDeviceOrientation();

setTimeout(
adjustVideoPlaylistHeight,
100
);

}
);


window.addEventListener(
"orientationchange",
()=>{

setTimeout(
handleDeviceOrientation,
150
);

setTimeout(
adjustVideoPlaylistHeight,
300
);

}
);


/* =========================================================
   ORIENTATION
========================================================= */

function handleDeviceOrientation(){

const isLandscape=
window.innerWidth>
window.innerHeight;


const popup=
document.getElementById(
"videoPopup"
);

const overlay=
document.getElementById(
"videoOverlay"
);

const videoPlaylist=
document.getElementById(
"videoPlaylist"
);

const iconSvg=
document.getElementById(
"videoToggleIcon"
);


if(isLandscape){

if(
popup &&
!popup.classList.contains(
"active"
)
){

popup.classList.add(
"active"
);

overlay.classList.add(
"active"
);

document.body.classList.add(
"popup-active"
);

}

if(videoPlaylist){

videoPlaylist.classList.remove(
"active"
);

}

document.body.classList.add(
"landscape-mode"
);


if(iconSvg){

iconSvg.innerHTML=
'<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>';

}

}
else{

document.body.classList.remove(
"landscape-mode"
);


if(
popup &&
popup.classList.contains(
"active"
)
){

videoPlaylist.classList.add(
"active"
);

setTimeout(
adjustVideoPlaylistHeight,
100
);

}

}

}


/* =========================================================
   VOLUME
========================================================= */

function resetVolTimer(){

if(volTimer){

clearTimeout(
volTimer
);

}

volTimer=setTimeout(
()=>{

document
.getElementById(
"volWrapper"
)
.classList.remove(
"active"
);

},
3000
);

}


function toggleVolume(){

const wrapper=
document.getElementById(
"volWrapper"
);

if(
wrapper.classList.contains(
"active"
)
){

wrapper.classList.remove(
"active"
);

if(volTimer){

clearTimeout(
volTimer
);

}

}
else{

wrapper.classList.add(
"active"
);

resetVolTimer();

}

}


function changeVolume(val){

if(
player &&
typeof player.setVolume===
"function"
){

player.setVolume(val);

}

resetVolTimer();

}


/* =========================================================
   NEXT
========================================================= */

function nextSong(){

if(
!player ||
playlistItems.length===0
)
return;


const current=
player.getPlaylistIndex();

const next=
(current+1)%
playlistItems.length;


forceUpdateUI(next);

player.nextVideo();

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousSong(){

if(
!player ||
playlistItems.length===0
)
return;


const current=
player.getPlaylistIndex();

const previous=
(current-1+
playlistItems.length)%
playlistItems.length;


forceUpdateUI(previous);

player.previousVideo();

}


/* =========================================================
   FORCE UPDATE
========================================================= */

function forceUpdateUI(index){

if(!playlistItems[index])
return;


const id=
playlistItems[index];


document.getElementById(
"cover"
).src=
`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;


const title=
document.getElementById(
`title-${index}`
);

const artist=
document.getElementById(
`artist-${index}`
);


if(title){

document.getElementById(
"title"
).textContent=
title.textContent;

}


if(artist){

document.getElementById(
"artist"
).textContent=
artist.textContent;

}


highlightActiveTrack();

highlightVideoActiveTrack();

}


/* =========================================================
   SWIPE
========================================================= */

const playerCard=
document.getElementById(
"playerCard"
);

const seekElement=
document.getElementById(
"seek"
);


playerCard.addEventListener(
"pointerdown",
e=>{

swipeStartX=
e.clientX;

swipeStartY=
e.clientY;

swipeFromSeek=
!!e.target.closest(
"#seek"
);

swipeActive=true;

}
);


playerCard.addEventListener(
"pointerup",
e=>{

if(!swipeActive)
return;


const endX=e.clientX;

const endY=e.clientY;


const dx=
endX-swipeStartX;

const dy=
endY-swipeStartY;


if(swipeFromSeek){

swipeActive=false;

return;

}


if(Math.abs(dx)<50){

swipeActive=false;

return;

}


if(
Math.abs(dy)>
Math.abs(dx)
){

swipeActive=false;

return;

}


if(dx<-50){

nextSong();

}
else if(dx>50){

previousSong();

}


swipeActive=false;

}
);


playerCard.addEventListener(
"pointercancel",
()=>{

swipeActive=false;

}
);


/* =========================================================
   SEEK
========================================================= */

function getSeekPosition(
clientX,
el
){

const rect=
el.getBoundingClientRect();


if(!rect.width)
return 0;


return Math.max(
0,
Math.min(
1,
(clientX-rect.left)/
rect.width
)
);

}


function updateSeekVisual(pos){

document.getElementById(
"fill"
).style.width=
(pos*100)+"%";


if(
player &&
typeof player.getDuration===
"function"
){

const duration=
player.getDuration();


if(duration){

document.getElementById(
"current"
).textContent=
format(
pos*duration
);

document.getElementById(
"duration"
).textContent=
format(
duration
);

}

}

}


seekElement.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

e.stopPropagation();

isDragging=true;


try{

seekElement.setPointerCapture(
e.pointerId
);

}
catch(err){}


updateSeekVisual(
getSeekPosition(
e.clientX,
seekElement
)
);

},
{
passive:false
}
);


seekElement.addEventListener(
"pointermove",
e=>{

if(!isDragging)
return;


e.preventDefault();

e.stopPropagation();


updateSeekVisual(
getSeekPosition(
e.clientX,
seekElement
)
);

},
{
passive:false
}
);


seekElement.addEventListener(
"pointerup",
e=>{

if(!isDragging)
return;


e.preventDefault();

e.stopPropagation();


const pos=
getSeekPosition(
e.clientX,
seekElement
);


updateSeekVisual(pos);


if(
player &&
typeof player.getDuration===
"function"
){

const duration=
player.getDuration();


if(duration){

player.seekTo(
pos*duration,
true
);

}

}


isDragging=false;


try{

seekElement.releasePointerCapture(
e.pointerId
);

}
catch(err){}

},
{
passive:false
}
);


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(){

if(isDragging)
return;


if(
!player ||
typeof player.getCurrentTime!==
"function"
)
return;


try{

const current=
player.getCurrentTime();

const duration=
player.getDuration();


if(!duration)
return;


const pos=
Math.max(
0,
Math.min(
1,
current/duration
)
);


document.getElementById(
"fill"
).style.width=
(pos*100)+"%";


document.getElementById(
"current"
).textContent=
format(current);


document.getElementById(
"duration"
).textContent=
format(duration);

}
catch(e){}

}


/* =========================================================
   FORMAT
========================================================= */

function format(s){

if(
!s ||
isNaN(s)
){

return "0:00";

}


s=Math.floor(s);


return Math.floor(s/60)+":"+
String(
s%60
).padStart(
2,"0"
);

}


/* =========================================================
   LOAD PLAYLIST
========================================================= */

function loadPlaylistItems(){

if(
!player ||
typeof player.getPlaylist!==
"function"
)
return;


/*
IMPORTANT:
Shuffle OFF করে current YouTube playlist order নেওয়া হচ্ছে।
*/

try{

if(
typeof player.setShuffle==="function"
){

player.setShuffle(false);

}

}
catch(e){}


const currentPlaylist=
player.getPlaylist();


if(
!currentPlaylist ||
currentPlaylist.length===0
){

setTimeout(
loadPlaylistItems,
600
);

return;

}


/*
একবার order পাওয়া গেলে সেটাই ব্যবহার হবে।
PLAYING event বা popup open হওয়ার কারণে
playlist order আবার overwrite হবে না।
*/

if(playlistLoaded){

return;

}


playlistItems=
currentPlaylist.slice();

playlistLoaded=true;


const list=
document.getElementById(
"songList"
);


list.innerHTML="";


playlistItems.forEach(
(id,index)=>{

const item=
document.createElement(
"div"
);


item.className=
"song-item";


item.id=
`track-${index}`;


item.onclick=()=>{

playSpecificTrack(
index
);

};


item.innerHTML=`

<img
src="https://i.ytimg.com/vi/${id}/hqdefault.jpg"
alt="thumb"
>

<div class="song-item-info">

<div
class="song-item-title"
id="title-${index}"
>
Track #${index+1}
</div>

<div
class="song-item-artist"
id="artist-${index}"
>
YouTube Music
</div>

</div>

`;


list.appendChild(item);


fetchSongDetails(
id,
index
);

});


loadVideoPlaylist();

highlightActiveTrack();

highlightVideoActiveTrack();

updateInfo();

}


/* =========================================================
   FETCH DETAILS
========================================================= */

function fetchSongDetails(
id,
index
){

fetch(
`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`
)

.then(
r=>r.json()
)

.then(
data=>{

if(!data)
return;


const title=
document.getElementById(
`title-${index}`
);


const artist=
document.getElementById(
`artist-${index}`
);


if(
title &&
data.title
){

title.textContent=
data.title;

}


if(
artist &&
data.author_name
){

artist.textContent=
data.author_name;

}


updateVideoSongDetails(
index,
data.title,
data.author_name
);

}
)

.catch(
()=>{}
);

}


/* =========================================================
   VIDEO PLAYLIST
========================================================= */

function loadVideoPlaylist(){

const list=
document.getElementById(
"videoSongList"
);


if(
!playlistItems ||
playlistItems.length===0
){

list.innerHTML=`

<div style="
text-align:center;
color:rgba(255,255,255,.7);
font-size:9px;
padding:10px;
">
Loading...
</div>

`;

return;

}


list.innerHTML="";


playlistItems.forEach(
(id,index)=>{

const item=
document.createElement(
"div"
);


item.className=
"video-song-item";


item.id=
`video-track-${index}`;


item.addEventListener(
"click",
function(e){

e.preventDefault();

e.stopPropagation();

playSpecificTrack(
index
);

},
{
passive:false
}
);


item.innerHTML=`

<img
src="https://i.ytimg.com/vi/${id}/hqdefault.jpg"
alt="thumb"
draggable="false"
>

<div class="video-song-info">

<div
class="video-song-title"
id="video-title-${index}"
>
Track #${index+1}
</div>

<div
class="video-song-artist"
id="video-artist-${index}"
>
YouTube Music
</div>

</div>

`;


list.appendChild(item);


fetchVideoSongDetails(
id,
index
);

});


highlightVideoActiveTrack();

setTimeout(
adjustVideoPlaylistHeight,
50
);

}


/* =========================================================
   VIDEO SONG DETAILS
========================================================= */

function fetchVideoSongDetails(
id,
index
){

fetch(
`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`
)

.then(
r=>r.json()
)

.then(
data=>{

if(!data)
return;


const title=
document.getElementById(
`video-title-${index}`
);


const artist=
document.getElementById(
`video-artist-${index}`
);


if(
title &&
data.title
){

title.textContent=
data.title;

}


if(
artist &&
data.author_name
){

artist.textContent=
data.author_name;

}

}
)

.catch(
()=>{}
);

}


/* =========================================================
   UPDATE VIDEO DETAILS
========================================================= */

function updateVideoSongDetails(
index,
titleText,
artistText
){

const title=
document.getElementById(
`video-title-${index}`
);

const artist=
document.getElementById(
`video-artist-${index}`
);


if(
title &&
titleText
){

title.textContent=
titleText;

}


if(
artist &&
artistText
){

artist.textContent=
artistText;

}

}


/* =========================================================
   VIDEO ACTIVE SONG
========================================================= */

function highlightVideoActiveTrack(){

if(
!player ||
typeof player.getPlaylistIndex!==
"function"
)
return;


const current=
player.getPlaylistIndex();


document
.querySelectorAll(
".video-song-item"
)
.forEach(
(item,index)=>{

item.classList.toggle(
"active",
index===current
);

});

}


/* =========================================================
   PLAY SPECIFIC TRACK
========================================================= */

function playSpecificTrack(
index
){

if(!player)
return;


forceUpdateUI(index);


try{

player.playVideoAt(index);

}
catch(e){

return;

}


/* OLD DRAWER CLOSE */

const drawer=
document.getElementById(
"drawer"
);

const drawerOverlay=
document.getElementById(
"overlay"
);


drawer.classList.remove(
"open"
);

drawerOverlay.classList.remove(
"active"
);


/* VIDEO PLAYLIST STAYS OPEN */

const popup=
document.getElementById(
"videoPopup"
);


if(
popup.classList.contains(
"active"
)
){

document
.getElementById(
"videoPlaylist"
)
.classList.add(
"active"
);

setTimeout(
adjustVideoPlaylistHeight,
80
);

}


highlightActiveTrack();

highlightVideoActiveTrack();

}


/* =========================================================
   OLD DRAWER ACTIVE
========================================================= */

function highlightActiveTrack(){

if(
!player ||
typeof player.getPlaylistIndex!==
"function"
)
return;


const current=
player.getPlaylistIndex();


document
.querySelectorAll(
".song-item"
)
.forEach(
(item,index)=>{

item.classList.toggle(
"active",
index===current
);

});

}


/* =========================================================
   UPDATE MAIN INFO
========================================================= */

function updateInfo(){

if(
!player ||
typeof player.getVideoData!==
"function"
)
return;


try{

const d=
player.getVideoData();


if(
!d ||
!d.video_id
)
return;


document.getElementById(
"cover"
).src=
`https://i.ytimg.com/vi/${d.video_id}/hqdefault.jpg`;


if(d.title){

document.getElementById(
"title"
).textContent=
d.title;

}


if(d.author){

document.getElementById(
"artist"
).textContent=
d.author;

}


highlightActiveTrack();

highlightVideoActiveTrack();

}
catch(e){}

}


/* =========================================================
   OLD DRAWER
========================================================= */

function toggleDrawer(){

const popup=
document.getElementById(
"videoPopup"
);


if(
popup &&
popup.classList.contains(
"active"
)
){

return;

}


const drawer=
document.getElementById(
"drawer"
);

const overlay=
document.getElementById(
"overlay"
);


const opening=
!drawer.classList.contains(
"open"
);


drawer.classList.toggle(
"open",
opening
);

overlay.classList.toggle(
"active",
opening
);


if(
opening &&
!playlistLoaded
){

loadPlaylistItems();

}

}


/* =========================================================
   INITIAL
========================================================= */

setTimeout(
handleDeviceOrientation,
300
);


setTimeout(
adjustVideoPlaylistHeight,
600
);


/* =========================================================
   FINAL TOUCH FIX
========================================================= */

/*
PORTRAIT:

1. video-popup = pointer-events:none
2. #yt = pointer-events:none
3. video-overlay = pointer-events:none
4. video-playlist = pointer-events:auto
5. video-song-list = native vertical scrolling
6. video-song-item = click only

LANDSCAPE:

1. video-popup = pointer-events:auto
2. #yt = pointer-events:auto
3. #yt = touch-action:auto
4. video playlist hidden
5. YouTube iframe gets full touch control

PLAYLIST ORDER:

1. YouTube shuffle OFF
2. getPlaylist() থেকে current order নেওয়া
3. playlist একবার load হওয়ার পর আর overwrite করা হয় না
4. YouTube playlist-এর manual order 그대로 website-এ রাখা হয়
*/

</script>

</body>
</html>
