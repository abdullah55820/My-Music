<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Video Player</title>
    <style>
        /* General Reset & Body Style */
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* Video Container */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 850px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        /* Video Element */
        video {
            width: 100%;
            display: block;
            cursor: pointer;
        }

        /* Controller Bar Layout */
        .video-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(20, 20, 20, 0.9);
            padding: 12px 20px;
            gap: 15px;
        }

        /* Buttons Styling */
        .video-controls button {
            background: #007bff;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s ease;
        }

        .video-controls button:hover {
            background: #0056b3;
        }

        /* Progress Bar Container */
        .progress-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        /* Range Slider Styling */
        #progress-bar {
            width: 100%;
            cursor: pointer;
            accent-color: #007bff;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Video Source (Apni apnar video link ekhane dite paren) -->
        <video id="video-player" src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
        
        <!-- Controls Bar -->
        <div class="video-controls">
            <button id="play-pause-btn">Play</button>
            
            <div class="progress-container">
                <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1">
            </div>

            <button id="fullscreen-btn">Fullscreen</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video-player');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const progressBar = document.getElementById('progress-bar');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const videoContainer = document.querySelector('.video-container');

        // Play / Pause Toggle
        playPauseBtn.addEventListener('click', togglePlayPause);
        video.addEventListener('click', togglePlayPause);

        function togglePlayPause() {
            if (video.paused) {
                video.play();
                playPauseBtn.textContent = 'Pause';
            } else {
                video.pause();
                playPauseBtn.textContent = 'Play';
            }
        }

        // Update Progress Bar based on Video Time
        video.addEventListener('timeupdate', () => {
            const progress = (video.currentTime / video.duration) * 100;
            progressBar.value = progress;
        });

        // Seek Video using Progress Bar
        progressBar.addEventListener('input', () => {
            const time = (progressBar.value / 100) * video.duration;
            video.currentTime = time;
        });

        // Fullscreen Toggle
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });
    </script>

</body>
</html>
