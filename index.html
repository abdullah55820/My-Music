<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shanti Music</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      width: 100vw;
      background: url('https://lh3.googleusercontent.com/d/14047763818058880798') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 30px;
      font-family: sans-serif;
    }
    .player-card {
      width: 90%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }
    iframe {
      width: 100%;
      height: 180px;
      border: none;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <iframe src="https://www.youtube.com/embed/videoseries?list=PLbvY05KVYwoo" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>

</body>
</html>
