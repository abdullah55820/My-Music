name: Build SoundFlow APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Android SDK Setup
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          SDK_DIR="$HOME/android-sdk"

          mkdir -p "$SDK_DIR/cmdline-tools"

          curl -fSL \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o cmdline-tools.zip

          unzip -q cmdline-tools.zip -d "$SDK_DIR/cmdline-tools"

          mv "$SDK_DIR/cmdline-tools/cmdline-tools" \
             "$SDK_DIR/cmdline-tools/latest"

          rm cmdline-tools.zip

          # Android SDK paths
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          # Bubblewrap requires SDK/bin/sdkmanager
          ln -s "$SDK_DIR/cmdline-tools/latest/bin" "$SDK_DIR/bin"

          # Accept licenses
          yes | "$SDK_DIR/bin/sdkmanager" \
            --sdk_root="$SDK_DIR" --licenses \
            >/dev/null 2>&1 || true

          # Install Android packages
          "$SDK_DIR/bin/sdkmanager" \
            --sdk_root="$SDK_DIR" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;36.1.0"

          echo "Android SDK setup completed."

      # Install Bubblewrap
      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli

      # Create Signing Keystore
      - name: Create Signing Keystore
        shell: bash
        run: |
          if [ ! -f android.keystore ]; then
            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass 123456 \
              -keypass 123456 \
              -dname "CN=SoundFlow, OU=App, O=SoundFlow, L=Riyadh, S=Riyadh, C=SA"
          fi

      # Configure Bubblewrap
      - name: Configure Bubblewrap & TWA Manifest
        shell: bash
        run: |
          set -e

          SDK_DIR="$HOME/android-sdk"
          JDK_DIR="$JAVA_HOME"

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JDK_DIR",
            "androidSdkPath": "$SDK_DIR"
          }
          EOF

          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

          # Create TWA Manifest
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.soundflow.app",
            "host": "abdullah55.vercel.app",
            "name": "SoundFlow",
            "launcherName": "SoundFlow",
            "display": "standalone",
            "themeColor": "#000000",
            "navigationColor": "#000000",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#000000",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#000000",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://abdullah55.vercel.app/icon-512.png",
            "maskableIconUrl": "https://abdullah55.vercel.app/maskable-512.png",
            "shortcuts": [],
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://abdullah55.vercel.app/manifest.webmanifest",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://abdullah55.vercel.app/",
            "minSdkVersion": 21,
            "orientation": "default",
            "fingerprints": []
          }
          EOF

      # Build APK
      - name: Build SoundFlow Signed APK
        shell: bash
        run: |
          set -o pipefail

          printf "123456\n123456\n" | bubblewrap build --skipPwaValidation

      # Upload APK
      - name: Upload SoundFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundFlow-APK
          path: app-release-signed.apk
          if-no-files-found: error
