      - name: Setup Android SDK
        run: |
          set -e

          SDK_DIR="$HOME/android-sdk"
          CMDLINE="$SDK_DIR/cmdline-tools/latest/bin"

          mkdir -p "$SDK_DIR/cmdline-tools"

          curl -fLsS \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o tools.zip

          unzip -q tools.zip -d "$SDK_DIR/cmdline-tools"

          mv "$SDK_DIR/cmdline-tools/cmdline-tools" \
             "$SDK_DIR/cmdline-tools/latest"

          rm tools.zip

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          echo "$CMDLINE" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          # Verify sdkmanager
          test -x "$CMDLINE/sdkmanager"

          # Accept licenses
          set +o pipefail
          yes | "$CMDLINE/sdkmanager" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          # Install Android SDK
          "$CMDLINE/sdkmanager" \
            --sdk_root="$SDK_DIR" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          # Verify installation
          test -f "$SDK_DIR/platforms/android-34/android.jar"
          test -f "$SDK_DIR/build-tools/34.0.0/zipalign"

          echo "Android SDK successfully installed!"
