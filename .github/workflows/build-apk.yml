name: Build SoundFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. Install Android SDK
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDK_DIR="$HOME/android-sdk"

          mkdir -p "$SDK_DIR/cmdline-tools"

          cd "$HOME"

          curl -fL \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o android-tools.zip

          unzip -q android-tools.zip

          mkdir -p "$SDK_DIR/cmdline-tools/latest"

          mv cmdline-tools/* "$SDK_DIR/cmdline-tools/latest/"

          rm -rf cmdline-tools android-tools.zip

          # Bubblewrap SDK manager path
          mkdir -p "$SDK_DIR/bin"

          cat > "$SDK_DIR/bin/sdkmanager" <<EOF
          #!/bin/bash
          exec "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" "\$@"
          EOF

          chmod +x "$SDK_DIR/bin/sdkmanager"

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | "$SDK_DIR/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

          "$SDK_DIR/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;36.1.0"

      # 5. Install Bubblewrap
      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap --version

      # 6. Configure Bubblewrap
      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -e

          SDK_DIR="$HOME/android-sdk"

          echo "Checking Java..."
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

          echo "Checking Android SDK..."
          test -x "$SDK_DIR/bin/sdkmanager"

          # Create Bubblewrap config BEFORE running other commands
          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$SDK_DIR"
          }
          EOF

          echo "Bubblewrap config:"
          cat "$HOME/.bubblewrap/config.json"

          # Verify both configured paths
          test -d "$JAVA_HOME/bin"
          test -d "$SDK_DIR/bin"

          echo "Configuration completed."

      # 7. Check environment
      - name: Check Environment
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo "SDK Manager:"
          "$HOME/android-sdk/bin/sdkmanager" --version

          echo "Bubblewrap:"
          bubblewrap --version

          echo "Checking Bubblewrap configuration..."
          bubblewrap doctor

      # 8. Prepare Signing Key
      - name: Prepare Signing Key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then

            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android.keystore

            echo "Existing signing key restored."

          else

            keytool -genkeypair \
              -v \
              -keystore android.keystore \
              -alias android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass 123456 \
              -keypass 123456 \
              -dname "CN=SoundFlow, OU=App, O=SoundFlow, L=Riyadh, S=Riyadh, C=SA"

            echo "Temporary signing key generated."

          fi

      # 9. Update Android Project
      - name: Update Android Project
        shell: bash
        run: |
          set -e

          test -f twa-manifest.json

          bubblewrap update --skipVersionUpgrade

      # 10. Build APK
      - name: Build Signed APK
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: "123456"
          BUBBLEWRAP_KEY_PASSWORD: "123456"
        run: |
          set -e

          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath="./android.keystore" \
            --signingKeyAlias="android"

      # 11. Upload APK
      - name: Upload SoundFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundFlow-APK
          path: |
            app-release-signed.apk
            app-release-bundle.aab
          if-no-files-found: warn
