name: Build SoundFlow APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4


      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      # 3. Java
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # 4. Android SDK
      - name: Setup Android SDK
        run: |
          set -e

          SDK="$ANDROID_HOME"

          echo "Android SDK: $SDK"

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          # Locate SDK Manager
          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -name sdkmanager -type f 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Downloading Android Command Line Tools..."

            mkdir -p "$SDK/cmdline-tools"

            curl -fLsS \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -o /tmp/android-tools.zip

            unzip -q /tmp/android-tools.zip \
              -d "$SDK/cmdline-tools"

            mkdir -p "$SDK/cmdline-tools/latest"

            mv "$SDK/cmdline-tools/cmdline-tools/"* \
              "$SDK/cmdline-tools/latest/"

            rm -rf "$SDK/cmdline-tools/cmdline-tools"

            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          chmod +x "$SDKMANAGER"

          echo "SDK Manager: $SDKMANAGER"

          # Accept licenses
          set +o pipefail
          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          # Install required packages
          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          # Verify
          test -f "$SDK/platforms/android-34/android.jar"
          test -f "$SDK/build-tools/34.0.0/zipalign"

          echo "Android SDK READY"


      # 5. Install Bubblewrap
      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap --version


      # 6. Configure Bubblewrap
      - name: Configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          echo "Bubblewrap configured"


      # 7. Restore or Create Keystore
      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          STORE_PASS="${STORE_PASSWORD:-123456}"
          KEY_PASS="${KEY_PASSWORD:-123456}"

          if [ -n "$KEYSTORE_BASE64" ]; then

            echo "$KEYSTORE_BASE64" | base64 --decode > android.keystore

            echo "Existing Keystore restored"

          else

            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=SoundFlow, OU=App, O=SoundFlow, L=Riyadh, S=Riyadh, C=SA"

          fi

          echo "STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"


      # 8. TWA Manifest
      - name: Create TWA Manifest
        run: |
          cat > twa-manifest.json <<'EOF'
          {
            "packageId": "com.soundflow.app",
            "host": "abdullah55.vercel.app",
            "name": "SoundFlow",
            "launcherName": "SoundFlow",
            "display": "standalone",
            "themeColor": "#000000",
            "navigationColor": "#000000",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#000000",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#000000",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://abdullah55.vercel.app/icon-512.png",
            "maskableIconUrl": "https://abdullah55.vercel.app/maskable-512.png",
            "shortcuts": [],
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "appVersionName": "1",
            "appVersionCode": 1,
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://abdullah55.vercel.app/manifest.webmanifest",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://abdullah55.vercel.app/",
            "minSdkVersion": 21,
            "orientation": "default",
            "fingerprints": []
          }
          EOF


      # 9. Verify
      - name: Verify Configuration
        run: |
          set -e

          echo "Java:"
          java -version

          echo "Node:"
          node --version

          echo "Android:"
          ls "$ANDROID_HOME/platforms"

          echo "Keystore:"
          test -f android.keystore

          echo "Manifest:"
          test -f twa-manifest.json

          echo "Configuration OK"


      # 10. Build APK
      - name: Build SoundFlow APK
        run: |
          set -e

          printf "%s\n%s\n" "$STORE_PASS" "$KEY_PASS" | \
            bubblewrap build --skipPwaValidation

          echo "BUILD SUCCESSFUL"


      # 11. Locate APK
      - name: Verify APK
        run: |
          set -e

          APK=$(find . -maxdepth 4 \
            -type f -name "*signed.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "Signed APK not found"

            find . -name "*.apk" -type f

            exit 1
          fi

          mkdir -p output

          cp "$APK" output/SoundFlow.apk

          ls -lh output/SoundFlow.apk


      # 12. Upload
      - name: Upload SoundFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundFlow-APK
          path: output/SoundFlow.apk
          if-no-files-found: error
          retention-days: 30
