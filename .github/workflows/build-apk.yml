name: Build SoundFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDK_DIR="$HOME/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"

          cd "$HOME"

          curl -fL \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o android-tools.zip

          unzip -q android-tools.zip

          mkdir -p "$SDK_DIR/cmdline-tools/latest"
          mv cmdline-tools/* "$SDK_DIR/cmdline-tools/latest/"

          rm -rf cmdline-tools android-tools.zip

          # Bubblewrap expects sdkmanager at SDK_DIR/bin/sdkmanager
          mkdir -p "$SDK_DIR/bin"

          cat > "$SDK_DIR/bin/sdkmanager" <<EOF
          #!/bin/bash
          exec "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" "\$@"
          EOF

          chmod +x "$SDK_DIR/bin/sdkmanager"

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | "$SDK_DIR/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

          "$SDK_DIR/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;36.1.0"

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap --version

      - name: Configure Bubblewrap
        shell: bash
        run: |
          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$HOME/android-sdk"
          }
          EOF

          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

      - name: Check Android SDK
        run: |
          test -x "$HOME/android-sdk/bin/sdkmanager"
          test -d "$HOME/android-sdk/platform-tools"
          test -d "$HOME/android-sdk/platforms"
          test -d "$HOME/android-sdk/build-tools/36.1.0"

          bubblewrap doctor

      - name: Prepare Signing Key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android.keystore
            echo "Existing signing key restored."
          else
            keytool -genkeypair \
              -v \
              -keystore android.keystore \
              -alias android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass 123456 \
              -keypass 123456 \
              -dname "CN=SoundFlow, OU=App, O=SoundFlow, L=Riyadh, S=Riyadh, C=SA"

            echo "WARNING: A temporary signing key was generated."
          fi

      - name: Update Android Project
        run: |
          bubblewrap update --skipVersionUpgrade

      - name: Build Signed APK
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: "123456"
          BUBBLEWRAP_KEY_PASSWORD: "123456"
        run: |
          bubblewrap build --skipPwaValidation

      - name: Upload SoundFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundFlow-APK
          path: |
            app-release-signed.apk
            app-release-bundle.aab
          if-no-files-found: warn
