name: Build SoundFlow APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Repository
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      # 3. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # 4. Setup Android SDK
      - name: Setup Android SDK
        run: |
          set -e

          SDK_DIR="$HOME/android-sdk"
          CMDLINE="$SDK_DIR/cmdline-tools/latest/bin"

          mkdir -p "$SDK_DIR/cmdline-tools"

          echo "Downloading Android Command Line Tools..."

          curl -fLsS \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o tools.zip

          echo "Extracting Android Tools..."

          unzip -q tools.zip -d "$SDK_DIR/cmdline-tools"

          mv "$SDK_DIR/cmdline-tools/cmdline-tools" \
             "$SDK_DIR/cmdline-tools/latest"

          rm tools.zip

          # Android SDK Environment
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          echo "$CMDLINE" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          # Verify SDK Manager
          if [ ! -x "$CMDLINE/sdkmanager" ]; then
            echo "ERROR: sdkmanager not found!"
            exit 1
          fi

          echo "SDK Manager found successfully!"

          # Accept Android Licenses
          set +o pipefail
          yes | "$CMDLINE/sdkmanager" \
            --sdk_root="$SDK_DIR" \
            --licenses >/dev/null 2>&1 || true
          set -o pipefail

          # Install Required Packages
          "$CMDLINE/sdkmanager" \
            --sdk_root="$SDK_DIR" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          # Verify Installation
          test -f "$SDK_DIR/platforms/android-34/android.jar"

          test -f "$SDK_DIR/build-tools/34.0.0/zipalign"

          test -f "$SDK_DIR/platform-tools/adb"

          echo "Android SDK installed successfully!"


      # 5. Install Bubblewrap
      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli

          bubblewrap --version


      # 6. Configure Bubblewrap
      - name: Configure Bubblewrap
        run: |
          set -e

          SDK_DIR="$ANDROID_HOME"
          JDK_DIR="$JAVA_HOME"

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JDK_DIR",
            "androidSdkPath": "$SDK_DIR"
          }
          EOF

          echo "Bubblewrap configuration created!"

          echo "Android SDK: $SDK_DIR"
          echo "Java: $JDK_DIR"


      # 7. Setup Signing Keystore
      - name: Setup Signing Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          STORE_PASS="${KEYSTORE_PASSWORD:-123456}"
          KEY_PASS="${KEY_PASSWORD:-123456}"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then

            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android.keystore

            echo "Existing signing keystore restored!"

          else

            echo "Creating new signing keystore..."

            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=SoundFlow, OU=App, O=SoundFlow, L=Riyadh, S=Riyadh, C=SA"

          fi

          echo "STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"


      # 8. Configure TWA Manifest
      - name: Configure TWA Manifest
        run: |
          cat > twa-manifest.json <<'EOF'
          {
            "packageId": "com.soundflow.app",
            "host": "abdullah55.vercel.app",
            "name": "SoundFlow",
            "launcherName": "SoundFlow",

            "display": "standalone",

            "themeColor": "#000000",
            "navigationColor": "#000000",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#000000",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#000000",

            "enableNotifications": true,

            "startUrl": "/",

            "iconUrl": "https://abdullah55.vercel.app/icon-512.png",
            "maskableIconUrl": "https://abdullah55.vercel.app/maskable-512.png",

            "shortcuts": [],

            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },

            "appVersionName": "1",
            "appVersionCode": 1,

            "generatorApp": "bubblewrap-cli",

            "webManifestUrl": "https://abdullah55.vercel.app/manifest.webmanifest",

            "fallbackType": "customtabs",

            "features": {},

            "alphaDependencies": {
              "enabled": false
            },

            "enableSiteSettingsShortcut": true,

            "isChromeOSOnly": false,
            "isMetaQuest": false,

            "fullScopeUrl": "https://abdullah55.vercel.app/",

            "minSdkVersion": 21,

            "orientation": "default",

            "fingerprints": []
          }
          EOF

          echo "TWA Manifest created!"


      # 9. Verify Configuration
      - name: Verify Build Configuration
        run: |
          set -e

          echo "Checking Android SDK..."

          test -f "$ANDROID_HOME/platforms/android-34/android.jar"

          echo "Checking Java..."

          java -version

          echo "Checking Keystore..."

          test -f android.keystore

          keytool -list \
            -keystore android.keystore \
            -alias android \
            -storepass "$STORE_PASS"

          echo "All configurations verified!"


      # 10. Build Signed APK
      - name: Build SoundFlow APK
        run: |
          set -e

          printf "%s\n%s\n" "$STORE_PASS" "$KEY_PASS" | \
            bubblewrap build --skipPwaValidation

          echo "APK Build completed!"


      # 11. Verify APK
      - name: Verify APK
        run: |
          set -e

          if [ ! -f app-release-signed.apk ]; then
            echo "ERROR: Signed APK not found!"

            find . -name "*.apk" -type f

            exit 1
          fi

          echo "APK successfully generated!"

          ls -lh app-release-signed.apk


      # 12. Upload APK
      - name: Upload SoundFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundFlow-APK
          path: app-release-signed.apk
          if-no-files-found: error
          retention-days: 30
